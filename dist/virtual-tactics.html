<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Tactics — TTRPG Play Space</title>
<style>
/* Virtual Tactics - dark tactical UI, Ivalice-adjacent */
:root{
  --bg:#0e0d13; --bg2:#16141d; --panel:#1c1a25; --panel2:#252231;
  --ink:#e8e3d5; --ink-dim:#a49c86; --ink-faint:#6f6857;
  --gold:#d8b25c; --gold-dim:#8f7534; --blue:#5f9ecf; --green:#78b06a;
  --red:#c9605a; --purple:#9a76c4; --line:#332f42;
  --party:#5f9ecf; --foe:#c9605a; --neutral:#c8a44c;
  --shadow:0 6px 24px rgba(0,0,0,.55);
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden; user-select:none;
}
.hidden{display:none !important}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit}

#app{display:flex;flex-direction:column;height:100vh}

/* Top bar */
#topbar{
  display:flex;align-items:center;gap:14px;padding:0 12px;height:46px;
  background:linear-gradient(180deg,#221f2c,#16141d);
  border-bottom:1px solid var(--line);flex:none;z-index:20;
}
.brand{font-family:var(--serif);letter-spacing:.16em;font-size:14px;color:var(--gold)}
.brand .rune{color:var(--gold-dim)}
.spacer{flex:1}
#modes{display:flex;gap:2px;background:#12111a;border:1px solid var(--line);border-radius:6px;padding:2px}
.mode-btn{padding:5px 16px;border-radius:4px;color:var(--ink-dim);letter-spacing:.05em}
.mode-btn:hover{color:var(--ink);background:#221f2c}
.mode-btn.active{background:var(--gold-dim);color:#141019;font-weight:600}
#topActions{display:flex;align-items:center;gap:4px}
.tb{padding:5px 10px;border:1px solid transparent;border-radius:4px;color:var(--ink-dim)}
.tb:hover{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.divider{width:1px;height:20px;background:var(--line);margin:0 4px}

/* Initiative strip */
#initStrip{
  display:flex;gap:6px;align-items:flex-end;padding:8px 12px;flex:none;
  background:#12111a;border-bottom:1px solid var(--line);overflow-x:auto;
}
.init-card{
  position:relative;width:58px;flex:none;border:1px solid var(--line);border-radius:5px;
  background:var(--panel);padding:3px;cursor:pointer;transition:transform .12s,border-color .12s;
}
.init-card:hover{transform:translateY(-3px)}
.init-card.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 4px 14px rgba(216,178,92,.25);transform:translateY(-4px)}
.init-card.dead{opacity:.35;filter:grayscale(1)}
.init-card canvas,.init-card img{display:block;width:100%;height:42px;object-fit:contain;image-rendering:pixelated}
.init-card .nm{font-size:9px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-dim)}
.init-card .hpbar{height:3px;background:#3a1f22;border-radius:2px;overflow:hidden;margin-top:2px}
.init-card .hpbar i{display:block;height:100%;background:var(--green)}
.init-card .tag{position:absolute;top:-1px;left:-1px;width:6px;height:6px;border-radius:50%}
.init-card .ini{position:absolute;top:1px;right:3px;font:10px/1 var(--mono);color:var(--gold)}

/* Main */
#main{flex:1;display:flex;min-height:0}
#stageWrap{position:relative;flex:1;min-width:0;background:
  radial-gradient(ellipse at 50% 38%,#1d1b28 0%,#0b0a10 78%)}
#stage{display:block;width:100%;height:100%;cursor:crosshair}
#stageHint{
  position:absolute;left:12px;bottom:10px;font:11px var(--mono);color:var(--ink-faint);
  pointer-events:none;text-shadow:0 1px 3px #000
}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floater{
  position:absolute;font:700 15px/1 var(--serif);text-shadow:0 2px 4px #000,0 0 8px #000;
  animation:floatUp 1.15s ease-out forwards;white-space:nowrap
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  15%{opacity:1;transform:translate(-50%,-8px) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1)}
}

/* Side panel */
#side{
  width:308px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden
}
#side::-webkit-scrollbar,#logBody::-webkit-scrollbar,#initStrip::-webkit-scrollbar{width:9px;height:9px}
#side::-webkit-scrollbar-thumb,#logBody::-webkit-scrollbar-thumb,#initStrip::-webkit-scrollbar-thumb{
  background:#38344a;border-radius:5px}
.sec{border-bottom:1px solid var(--line)}
.sec-h{
  padding:8px 12px;font-family:var(--serif);letter-spacing:.13em;font-size:11px;
  text-transform:uppercase;color:var(--gold);background:#191722;
  display:flex;align-items:center;gap:8px
}
.sec-h .sh-right{margin-left:auto;color:var(--ink-faint);letter-spacing:0;font-size:10px}
.sec-b{padding:10px 12px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row>label{width:78px;flex:none;color:var(--ink-dim);font-size:11px}
/* A .row is a flex row, so making the label full-width squeezed the control
   next to it down to a sliver — which read as a stray scrollbar beside a
   missing field. Stack them instead, which is what 'wide' always meant. */
.row.wide{flex-direction:column;align-items:stretch}
.row.wide>label{width:100%;margin-bottom:3px}
.row.wide>textarea{min-height:52px;resize:vertical}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],select,textarea{
  background:#100f16;border:1px solid var(--line);color:var(--ink);
  padding:4px 7px;border-radius:4px;width:100%;font-size:12px
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-dim)}
input[type=range]{width:100%;accent-color:var(--gold)}
.btn{
  padding:6px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);
  color:var(--ink);text-align:center;transition:.12s
}
.btn:hover{background:#302b40;border-color:var(--gold-dim)}
.btn.primary{background:var(--gold-dim);color:#151019;border-color:var(--gold);font-weight:600}
.btn.primary:hover{background:var(--gold)}
.btn.danger:hover{background:#5e2a2a;border-color:var(--red);color:#ffd9d6}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.full{width:100%}
.btn.on{background:var(--gold-dim);color:#151019;border-color:var(--gold)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

/* palettes */
.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.swatch{
  position:relative;height:46px;border:1px solid var(--line);border-radius:4px;overflow:hidden;
  cursor:pointer;display:flex;align-items:flex-end;justify-content:center
}
.swatch:hover{border-color:var(--gold-dim)}
.swatch.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.swatch canvas{position:absolute;inset:0;width:100%;height:100%}
.swatch span{
  position:relative;font-size:9px;background:rgba(8,7,12,.82);width:100%;text-align:center;
  padding:1px 0;color:var(--ink-dim)
}
.swatch.sel span{color:var(--gold)}

/* stat block */
.statline{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px dotted #2c2839}
.statline b{color:var(--ink);font-weight:600}
.abils{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;margin:8px 0}
.abil{background:#131119;border:1px solid var(--line);border-radius:4px;padding:4px 0}
.abil .k{font-size:9px;color:var(--ink-faint);letter-spacing:.08em}
.abil .v{font-family:var(--serif);font-size:15px;color:var(--ink)}
.abil .m{font-size:10px;color:var(--gold)}
.hpwrap{margin:8px 0}
.hpbar-lg{height:14px;background:#2a1518;border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.hpbar-lg i{display:block;height:100%;background:linear-gradient(180deg,#8ec97f,#5d8f52);transition:width .3s}
.hpbar-lg span{position:absolute;inset:0;text-align:center;font:11px/13px var(--mono);text-shadow:0 1px 2px #000}
.chip{
  display:inline-block;padding:1px 7px;border-radius:9px;font-size:10px;
  background:#2b2739;border:1px solid var(--line);color:var(--ink-dim);margin:0 3px 3px 0
}
.chip.bad{background:#3a1f24;border-color:#6d3339;color:#e2a6a2}
.chip.good{background:#1f3324;border-color:#3c6b42;color:#a6d8a8}
.list{display:flex;flex-direction:column;gap:4px}
.listitem{
  display:flex;align-items:center;gap:8px;padding:6px 8px;background:#161520;
  border:1px solid var(--line);border-radius:4px;cursor:pointer
}
.listitem:hover{border-color:var(--gold-dim);background:#1d1b28}
.listitem.sel{border-color:var(--gold);background:#241f2c}
.listitem img,.listitem canvas{width:26px;height:32px;object-fit:contain;image-rendering:pixelated;flex:none}
.listitem .t{flex:1;min-width:0}
.listitem .t .n{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listitem .t .s{font-size:10px;color:var(--ink-faint)}
.muted{color:var(--ink-faint);font-size:11px}
.hint{color:var(--ink-faint);font-size:11px;line-height:1.5;margin:6px 0 0}

/* Bottom / action menu / log */
#bottom{display:flex;align-items:flex-end;gap:10px;padding:8px 12px;flex:none;
  background:#12111a;border-top:1px solid var(--line);height:132px}
#actionMenu{
  width:186px;flex:none;background:linear-gradient(180deg,#2a2438,#191527);
  border:1px solid var(--gold-dim);border-radius:5px;padding:4px;box-shadow:var(--shadow);
  max-height:116px;overflow-y:auto
}
.act{
  display:flex;align-items:center;gap:8px;padding:4px 9px;border-radius:3px;
  font-family:var(--serif);letter-spacing:.06em;font-size:13px;color:var(--ink);width:100%
}
.act:hover:not(:disabled){background:var(--gold-dim);color:#151019}
.act:disabled{color:var(--ink-faint);cursor:not-allowed}
.act .k{margin-left:auto;font:10px var(--mono);color:var(--ink-faint)}
.act:hover:not(:disabled) .k{color:#151019}
#logPanel{flex:1;min-width:0;display:flex;flex-direction:column;height:116px}
#logHead{font-family:var(--serif);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold-dim);padding-bottom:3px}
#logBody{flex:1;overflow-y:auto;font-size:12px;padding-right:6px}
.le{padding:2px 0;border-bottom:1px solid #1c1a26;color:var(--ink-dim)}
.le b{color:var(--ink)}
.le .hit{color:var(--green)}
.le .miss{color:var(--ink-faint)}
.le .crit{color:var(--gold);font-weight:700}
.le .dmg{color:var(--red);font-weight:600}
.le .roll{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.le.turn{color:var(--gold);font-family:var(--serif);letter-spacing:.06em;margin-top:4px}

/* Tooltip and modal */
#tooltip{
  position:fixed;z-index:60;pointer-events:none;background:#12111a;border:1px solid var(--gold-dim);
  border-radius:4px;padding:6px 9px;font-size:11px;max-width:250px;box-shadow:var(--shadow)
}
#tooltip b{color:var(--gold)}
#modalRoot:empty{display:none}
.modal-bg{position:fixed;inset:0;background:rgba(6,5,10,.72);z-index:80;display:flex;
  align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border:1px solid var(--gold-dim);border-radius:7px;
  width:min(560px,92vw);max-height:86vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h3{margin:0;padding:12px 16px;font-family:var(--serif);letter-spacing:.1em;font-size:14px;
  color:var(--gold);border-bottom:1px solid var(--line)}
.modal .body{padding:14px 16px}
.modal .foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand"><span class="rune">&#9670;</span> VIRTUAL TACTICS</div>
    <nav id="modes">
      <button class="mode-btn" data-mode="play">Play</button>
      <button class="mode-btn" data-mode="map">Map</button>
      <button class="mode-btn" data-mode="roster">Roster</button>
    </nav>
    <div class="spacer"></div>
    <div id="topActions">
      <button class="tb" id="btnRotL" title="Rotate camera left (Q)">&#8630;</button>
      <button class="tb" id="btnRotR" title="Rotate camera right (E)">&#8631;</button>
      <button class="tb" id="btnCenter" title="Center camera (Home)">&#9678;</button>
      <span class="divider"></span>
      <button class="tb" id="btnSave" title="Save campaign to this browser">Save</button>
      <button class="tb" id="btnExport" title="Download campaign file">Export</button>
      <button class="tb" id="btnImport" title="Load campaign file">Import</button>
      <button class="tb" id="btnSettings" title="Settings">&#9881;</button>
    </div>
  </header>

  <div id="initStrip" class="hidden"></div>

  <main id="main">
    <div id="stageWrap">
      <canvas id="stage"></canvas>
      <div id="stageHint"></div>
      <div id="floaters"></div>
    </div>
    <aside id="side"></aside>
  </main>

  <div id="bottom">
    <div id="actionMenu" class="hidden"></div>
    <div id="logPanel">
      <div id="logHead">Chronicle</div>
      <div id="logBody"></div>
    </div>
  </div>

  <div id="tooltip" class="hidden"></div>
  <div id="modalRoot"></div>
</div>

<input type="file" id="filePicker" class="hidden" accept="application/json">
<input type="file" id="imgPicker" class="hidden" accept="image/*" multiple>

<script>
/* ===== src/core/util.js ===== */
/* Virtual Tactics :: core/util.js
   Global namespace + small helpers. Everything hangs off window.VT so the whole
   app runs from plain <script> tags (no bundler, no server, no CORS). */
(function () {
  'use strict';
  var VT = window.VT = window.VT || {};

  /* ---- DOM ------------------------------------------------------------- */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') n.value = v;
      else if (k === 'checked') n.checked = !!v;
      else n.setAttribute(k, v === true ? '' : v);
    }
    if (kids != null) {
      if (!Array.isArray(kids)) kids = [kids];
      kids.forEach(function (c) {
        if (c == null || c === false) return;
        n.appendChild(typeof c === 'string' || typeof c === 'number'
          ? document.createTextNode(String(c)) : c);
      });
    }
    return n;
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); return node; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---- math ------------------------------------------------------------ */
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInOut(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  /* D&D grid distance: Chebyshev, 5 ft per square (PHB basic rule). */
  function gridDist(ax, ay, bx, by) { return Math.max(Math.abs(ax - bx), Math.abs(ay - by)); }

  /* Deterministic hash -> 0..1, used for stable procedural texture noise. */
  function hash01(x, y, seed) {
    var h = (x * 374761393 + y * 668265263 + (seed || 0) * 1274126177) | 0;
    h = (h ^ (h >>> 13)) * 1274126177 | 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }

  /* ---- colour ---------------------------------------------------------- */
  function hexToRgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function rgbStr(c, a) {
    return 'rgba(' + (c.r | 0) + ',' + (c.g | 0) + ',' + (c.b | 0) + ',' + (a == null ? 1 : a) + ')';
  }
  /* amt > 0 lightens, < 0 darkens */
  function shade(hex, amt) {
    var c = hexToRgb(hex), t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    return '#' + [c.r, c.g, c.b].map(function (v) {
      return Math.round(v + (t - v) * p).toString(16).padStart(2, '0');
    }).join('');
  }

  /* ---- misc ------------------------------------------------------------ */
  var _id = 0;
  function uid(prefix) { return (prefix || 'id') + '_' + (Date.now().toString(36)) + '_' + (++_id).toString(36); }
  function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
  function cap(s) { return String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1); }
  function sign(n) { return (n >= 0 ? '+' : '') + n; }
  function pick(arr, rnd) { return arr[Math.floor((rnd || Math.random)() * arr.length)]; }
  function ord(n) {
    var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function debounce(fn, ms) {
    var t; return function () {
      var a = arguments, self = this;
      clearTimeout(t); t = setTimeout(function () { fn.apply(self, a); }, ms || 120);
    };
  }

  /* ---- tiny event bus --------------------------------------------------- */
  function Bus() { this._h = {}; }
  Bus.prototype.on = function (ev, fn) { (this._h[ev] = this._h[ev] || []).push(fn); return this; };
  Bus.prototype.off = function (ev, fn) {
    var a = this._h[ev]; if (!a) return this;
    var i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); return this;
  };
  Bus.prototype.emit = function (ev) {
    var args = Array.prototype.slice.call(arguments, 1), a = this._h[ev];
    if (a) a.slice().forEach(function (f) { f.apply(null, args); });
    var any = this._h['*'];
    if (any) any.slice().forEach(function (f) { f(ev, args); });
    return this;
  };

  VT.util = {
    el: el, $: $, $$: $$, clear: clear, esc: esc,
    clamp: clamp, lerp: lerp, easeOut: easeOut, easeInOut: easeInOut,
    dist2: dist2, gridDist: gridDist, hash01: hash01,
    hexToRgb: hexToRgb, rgbStr: rgbStr, shade: shade,
    uid: uid, clone: clone, cap: cap, sign: sign, pick: pick, ord: ord, debounce: debounce,
    Bus: Bus
  };
  VT.bus = new Bus();
})();

/* ===== src/core/dice.js ===== */
/* Virtual Tactics :: core/dice.js
   Dice notation parser + roller. Understands things like:
     "1d8+3"  "2d6"  "d20"  "2d6+1d4+2"  "1d10-1"  "4"
   Every roll returns the individual die faces so the log can show its work. */
(function () {
  'use strict';
  var VT = window.VT;

  /* Optional seeded RNG so a table can replay a session deterministically. */
  var _seed = null;
  function rnd() {
    if (_seed == null) return Math.random();
    /* mulberry32 */
    _seed |= 0; _seed = (_seed + 0x6D2B79F5) | 0;
    var t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function setSeed(s) { _seed = (s == null || s === '') ? null : (parseInt(s, 10) | 0); }

  function die(sides) { return 1 + Math.floor(rnd() * sides); }

  /* Parse "2d6+1d4+2" into terms. Returns null on garbage. */
  function parse(expr) {
    if (typeof expr === 'number') return [{ n: 0, s: 0, flat: expr, sign: 1 }];
    var s = String(expr || '').replace(/\s+/g, '').toLowerCase();
    if (!s) return null;
    if (!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s)) return null;
    var terms = [], re = /([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g, m;
    while ((m = re.exec(s))) {
      if (m[3]) {
        terms.push({ sign: m[1] === '-' ? -1 : 1, n: m[2] === '' ? 1 : parseInt(m[2], 10), s: parseInt(m[3], 10) });
      } else {
        terms.push({ sign: m[4] === '-' ? -1 : 1, n: 0, s: 0, flat: parseInt(m[5], 10) });
      }
    }
    return terms.length ? terms : null;
  }

  /* roll("2d6+3") -> {total, faces:[...], text:"2d6+3", detail:"[4,5]+3"} */
  function roll(expr, opts) {
    opts = opts || {};
    var terms = parse(expr);
    if (!terms) return { total: 0, faces: [], text: String(expr), detail: '?', invalid: true };
    var total = 0, faces = [], parts = [];
    terms.forEach(function (t) {
      if (t.n) {
        var sub = [];
        for (var i = 0; i < t.n; i++) {
          var v = die(t.s);
          if (opts.maximize) v = t.s;
          sub.push(v); faces.push({ sides: t.s, v: v });
          total += t.sign * v;
        }
        parts.push((t.sign < 0 ? '-' : parts.length ? '+' : '') + '[' + sub.join(',') + ']');
      } else {
        total += t.sign * t.flat;
        parts.push((t.sign < 0 ? '-' : parts.length ? '+' : '') + t.flat);
      }
    });
    if (opts.bonus) { total += opts.bonus; parts.push(VT.util.sign(opts.bonus)); }
    if (opts.min != null) total = Math.max(opts.min, total);
    return { total: total, faces: faces, text: String(expr), detail: parts.join('') };
  }

  /* Doubles the dice, not the modifiers - 5e critical hit rule. */
  function critDice(expr) {
    var terms = parse(expr); if (!terms) return expr;
    return terms.map(function (t, i) {
      var pre = t.sign < 0 ? '-' : (i ? '+' : '');
      return pre + (t.n ? (t.n * 2) + 'd' + t.s : t.flat);
    }).join('');
  }

  /* d20 test with advantage / disadvantage.
     adv: 1 = advantage, -1 = disadvantage, 0 = flat. */
  function d20(mod, adv) {
    mod = mod || 0; adv = adv || 0;
    var a = die(20), b = adv ? die(20) : a;
    var nat = adv > 0 ? Math.max(a, b) : adv < 0 ? Math.min(a, b) : a;
    return {
      nat: nat, both: adv ? [a, b] : [a], mod: mod, total: nat + mod,
      crit: nat === 20, fumble: nat === 1, adv: adv,
      detail: (adv ? '(' + a + '/' + b + ')' : '(' + a + ')') + VT.util.sign(mod)
    };
  }

  /* Average of an expression - used for AI target scoring and previews. */
  function avg(expr) {
    var terms = parse(expr); if (!terms) return 0;
    return terms.reduce(function (sum, t) {
      return sum + t.sign * (t.n ? t.n * (t.s + 1) / 2 : t.flat);
    }, 0);
  }

  VT.dice = { roll: roll, d20: d20, avg: avg, parse: parse, critDice: critDice, die: die, rnd: rnd, setSeed: setSeed };
})();

/* ===== src/core/store.js ===== */
/* Virtual Tactics :: core/store.js
   The single source of truth. One campaign object holds every map, every actor
   template and every custom sprite, so "save" is one JSON blob you can email to
   your table. Autosaves to localStorage; Export writes a .vtcampaign file. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util;
  var KEY = 'vtactics.campaign.v1';

  var DEFAULT_SETTINGS = {
    /* Rules toggles - all of these change how combat resolves. */
    highGround: true,      // house rule: attacking from >=5ft above grants advantage
    diagonals: 'uniform',  // 'uniform' (PHB basic, 5ft) | 'alternating' (DMG 5-10-5)
    fallDamage: true,      // 1d6 per 10ft dropped
    opportunity: true,     // opportunity attacks when leaving reach
    cover: true,           // +2 / +5 AC from partial cover
    climbCost: true,       // climbing a 5ft step costs an extra 5ft of movement
    aiForFoes: true,       // foes take their own turns
    gridLines: true,
    animate: true,
    seed: ''
  };

  var store = {
    campaign: null,
    dirty: false,

    /* ---- lifecycle ----------------------------------------------------- */
    blank: function (name) {
      return {
        version: 1,
        name: name || 'New Campaign',
        created: Date.now(),
        maps: [],
        activeMapId: null,
        roster: [],
        sprites: {},
        settings: U.clone(DEFAULT_SETTINGS)
      };
    },

    init: function () {
      var loaded = null;
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) loaded = JSON.parse(raw);
      } catch (e) { console.warn('[store] could not read saved campaign:', e); }
      this.campaign = loaded && loaded.maps ? this.migrate(loaded) : null;
      return this.campaign;
    },

    migrate: function (c) {
      c.settings = Object.assign(U.clone(DEFAULT_SETTINGS), c.settings || {});
      c.sprites = c.sprites || {};
      c.roster = c.roster || [];
      c.maps = c.maps || [];
      return c;
    },

    /* ---- persistence --------------------------------------------------- */
    save: function () {
      try {
        localStorage.setItem(KEY, JSON.stringify(this.campaign));
        this.dirty = false;
        return { ok: true };
      } catch (e) {
        /* Custom sprites are data URLs and localStorage caps around 5MB. */
        var quota = /quota|exceeded/i.test(String(e && e.name) + String(e && e.message));
        return {
          ok: false,
          error: quota
            ? 'Browser storage is full (custom sprites are stored inline). Use Export to save the campaign to a file instead.'
            : String(e && e.message || e)
        };
      }
    },

    autosave: U.debounce(function () { store.save(); }, 1200),

    touch: function () { this.dirty = true; this.autosave(); },

    exportFile: function () {
      var blob = new Blob([JSON.stringify(this.campaign, null, 1)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (this.campaign.name || 'campaign').replace(/[^\w-]+/g, '_') + '.vtcampaign.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    },

    importJSON: function (text) {
      var data = JSON.parse(text);
      if (!data || !Array.isArray(data.maps)) throw new Error('Not a Virtual Tactics campaign file.');
      this.campaign = this.migrate(data);
      this.save();
      return this.campaign;
    },

    /* ---- accessors ----------------------------------------------------- */
    settings: function () { return this.campaign.settings; },

    activeMap: function () {
      var c = this.campaign;
      if (!c) return null;
      var m = c.maps.find(function (x) { return x.id === c.activeMapId; });
      return m || c.maps[0] || null;
    },

    setActiveMap: function (id) { this.campaign.activeMapId = id; this.touch(); },

    addMap: function (map) {
      this.campaign.maps.push(map);
      this.campaign.activeMapId = map.id;
      this.touch();
      return map;
    },

    removeMap: function (id) {
      var c = this.campaign;
      c.maps = c.maps.filter(function (m) { return m.id !== id; });
      if (c.activeMapId === id) c.activeMapId = c.maps.length ? c.maps[0].id : null;
      this.touch();
    },

    /* ---- sprite library ------------------------------------------------ */
    addSprite: function (sp) {
      sp.id = sp.id || U.uid('spr');
      this.campaign.sprites[sp.id] = sp;
      this.touch();
      return sp;
    },
    getSprite: function (id) { return id ? this.campaign.sprites[id] : null; },
    removeSprite: function (id) { delete this.campaign.sprites[id]; this.touch(); },

    /* ---- roster -------------------------------------------------------- */
    addToRoster: function (actor) {
      actor.id = actor.id || U.uid('tpl');
      this.campaign.roster.push(actor);
      this.touch();
      return actor;
    },
    removeFromRoster: function (id) {
      this.campaign.roster = this.campaign.roster.filter(function (a) { return a.id !== id; });
      this.touch();
    },

    DEFAULT_SETTINGS: DEFAULT_SETTINGS
  };

  VT.store = store;
})();

/* ===== src/map/iso.js ===== */
/* Virtual Tactics :: map/iso.js
   Isometric projection + the four camera rotations.

   All game logic (pathfinding, range, line of sight) happens in plain map
   coordinates. Rotation is a *view* concern only: we rotate (x,y) into screen
   space right before drawing, and unrotate on click. That keeps the rules code
   free of camera state. */
(function () {
  'use strict';
  var VT = window.VT;

  var TILE_W = 64;   // full width of a tile diamond, px
  var TILE_H = 32;   // full height of a tile diamond, px
  var STEP = 16;     // px of vertical rise per 5 ft of elevation
  var FT = 5;        // feet per tile / per height step

  /* map (x,y) -> rotated (rx,ry) for camera rotation r (0..3) */
  function rot(x, y, r, w, h) {
    switch (r & 3) {
      case 1: return { x: h - 1 - y, y: x };
      case 2: return { x: w - 1 - x, y: h - 1 - y };
      case 3: return { x: y, y: w - 1 - x };
      default: return { x: x, y: y };
    }
  }
  /* rotated (rx,ry) -> map (x,y) */
  function unrot(rx, ry, r, w, h) {
    switch (r & 3) {
      case 1: return { x: ry, y: h - 1 - rx };
      case 2: return { x: w - 1 - rx, y: h - 1 - ry };
      case 3: return { x: w - 1 - ry, y: rx };
      default: return { x: rx, y: ry };
    }
  }
  /* dimensions of the rotated grid */
  function rdims(r, w, h) { return (r & 1) ? { w: h, h: w } : { w: w, h: h }; }

  /* Rotated tile + elevation -> world-space centre of its top face. */
  function project(rx, ry, elev) {
    return {
      x: (rx - ry) * (TILE_W / 2),
      y: (rx + ry) * (TILE_H / 2) - (elev || 0) * STEP
    };
  }

  /* The four corners of a tile's top face, in world space. */
  function topFace(rx, ry, elev) {
    var p = project(rx, ry, elev);
    return [
      { x: p.x, y: p.y - TILE_H / 2 },  // north (back)
      { x: p.x + TILE_W / 2, y: p.y },  // east  (right)
      { x: p.x, y: p.y + TILE_H / 2 },  // south (front)
      { x: p.x - TILE_W / 2, y: p.y }   // west  (left)
    ];
  }

  function pointInPoly(px, py, poly) {
    var inside = false;
    for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      var xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
      if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  /* Walk every tile back-to-front (painter's order) in rotated space.
     cb(mapX, mapY, rx, ry) */
  function forEachDrawOrder(r, w, h, cb) {
    var d = rdims(r, w, h);
    for (var ry = 0; ry < d.h; ry++) {
      for (var rx = 0; rx < d.w; rx++) {
        var m = unrot(rx, ry, r, w, h);
        cb(m.x, m.y, rx, ry);
      }
    }
  }
  /* Front-to-back, for hit testing. */
  function forEachPickOrder(r, w, h, cb) {
    var d = rdims(r, w, h);
    for (var ry = d.h - 1; ry >= 0; ry--) {
      for (var rx = d.w - 1; rx >= 0; rx--) {
        var m = unrot(rx, ry, r, w, h);
        if (cb(m.x, m.y, rx, ry) === true) return true;
      }
    }
    return false;
  }

  VT.iso = {
    TILE_W: TILE_W, TILE_H: TILE_H, STEP: STEP, FT: FT,
    rot: rot, unrot: unrot, rdims: rdims,
    project: project, topFace: topFace, pointInPoly: pointInPoly,
    forEachDrawOrder: forEachDrawOrder, forEachPickOrder: forEachPickOrder
  };
})();

/* ===== src/map/gridmap.js ===== */
/* Virtual Tactics :: map/gridmap.js

   campaign serialises with one JSON.stringify.

(function () {
  'use strict';

  var TERRAIN = {
    grass:   { name: 'Grass',   top: '#5f8b46', side: '#4a3b2a', cost: 1, grain: 'noise' },
    dirt:    { name: 'Dirt',    top: '#7a6244', side: '#4c3d2a', cost: 1, grain: 'noise' },
    stone:   { name: 'Stone',   top: '#7d7c86', side: '#4e4d57', cost: 1, grain: 'crack' },
    cobble:  { name: 'Cobble',  top: '#8a8590', side: '#514d59', cost: 1, grain: 'brick' },
    sand:    { name: 'Sand',    top: '#c8b184', side: '#8c7551', cost: 1, grain: 'noise' },
    snow:    { name: 'Snow',    top: '#dfe6ee', side: '#8e9aa8', cost: 2, grain: 'noise' },
    wood:    { name: 'Wood',    top: '#8b6239', side: '#5a3f24', cost: 1, grain: 'plank' },
    marble:  { name: 'Marble',  top: '#cfc7bd', side: '#8d857b', cost: 1, grain: 'crack' },
    moss:    { name: 'Moss',    top: '#4d6b3c', side: '#3a3125', cost: 2, grain: 'noise' },
    water:   { name: 'Water',   top: '#3f6f9e', side: '#2b4c6d', cost: 2, liquid: true, grain: 'wave' },
    deep:    { name: 'Deep W.', top: '#27496b', side: '#1b3550', cost: 3, liquid: true, deep: true, grain: 'wave' },
    lava:    { name: 'Lava',    top: '#d1552a', side: '#6d2412', cost: 2, hazard: '2d6', hazardType: 'fire', glow: '#ff8a3d', grain: 'wave' },
    ice:     { name: 'Ice',     top: '#a9d3e0', side: '#6d94a4', cost: 1, slick: true, grain: 'crack' },
    road:    { name: 'Road',    top: '#9c9080', side: '#5f574c', cost: 1, grain: 'brick' },
    ash:     { name: 'Ash',     top: '#4a464b', side: '#312e33', cost: 1, grain: 'noise' },
    void:    { name: 'Chasm',   top: '#0a0910', side: '#0a0910', cost: 99, pit: true, grain: 'flat' }
  };

  var TERRAIN_ORDER = ['grass', 'dirt', 'stone', 'cobble', 'sand', 'snow', 'wood', 'marble',
                       'moss', 'road', 'ash', 'ice', 'water', 'deep', 'lava', 'void'];

  /* ---- props ---------------------------------------------------------- */
  /* blocks: cannot be entered. cover: 'half' (+2 AC) | 'three' (+5 AC).
     tall: blocks line of sight entirely. */
  var PROPS = {
    tree:    { name: 'Tree',    blocks: true,  cover: 'three', tall: true,  h: 2.4, color: '#3d6b34' },
    pine:    { name: 'Pine',    blocks: true,  cover: 'three', tall: true,  h: 2.8, color: '#2f5730' },
    bush:    { name: 'Bush',    blocks: false, cover: 'half',  tall: false, h: .55, color: '#4b7340', diff: true },
    rock:    { name: 'Boulder', blocks: true,  cover: 'three', tall: true,  h: 1.1, color: '#77747d' },
    stump:   { name: 'Stump',   blocks: false, cover: 'half',  tall: false, h: .5,  color: '#6b4b2c', diff: true },
    crate:   { name: 'Crate',   blocks: true,  cover: 'half',  tall: false, h: .9,  color: '#8a6336' },
    barrel:  { name: 'Barrel',  blocks: true,  cover: 'half',  tall: false, h: .95, color: '#7a5730' },
    wall:    { name: 'Wall',    blocks: true,  cover: 'three', tall: true,  h: 2.2, color: '#6f6b74' },
    pillar:  { name: 'Pillar',  blocks: true,  cover: 'three', tall: true,  h: 2.6, color: '#b3aa9e' },
    statue:  { name: 'Statue',  blocks: true,  cover: 'three', tall: true,  h: 1.9, color: '#9a938a' },
    brazier: { name: 'Brazier', blocks: true,  cover: 'half',  tall: false, h: 1.0, color: '#7c6a45', light: '#ff9b45' },
    torch:   { name: 'Torch',   blocks: false, cover: null,    tall: false, h: 1.4, color: '#6b5334', light: '#ffb04d' },
    chest:   { name: 'Chest',   blocks: true,  cover: 'half',  tall: false, h: .7,  color: '#8a6a33' },
    banner:  { name: 'Banner',  blocks: false, cover: null,    tall: false, h: 2.2, color: '#8d3b46' },
    fence:   { name: 'Fence',   blocks: true,  cover: 'half',  tall: false, h: 1.0, color: '#6d5436' },
    grave:   { name: 'Grave',   blocks: false, cover: 'half',  tall: false, h: .9,  color: '#8d8a92', diff: true }
  };
  var PROP_ORDER = Object.keys(PROPS);

  var AMBIENCE = {
    day:   { name: 'Daylight',  light: '#fff6e2', amb: 0.00, sky: '#1d1b28', shadow: .28 },
    dusk:  { name: 'Dusk',      light: '#ffbb7a', amb: 0.14, sky: '#241a26', shadow: .34, tint: 'rgba(255,140,70,.10)' },
    night: { name: 'Night',     light: '#8fa8d8', amb: 0.34, sky: '#0d0e18', shadow: .18, tint: 'rgba(50,70,140,.20)' },
    cave:  { name: 'Underdark', light: '#7fd0c0', amb: 0.42, sky: '#0a0c10', shadow: .12, tint: 'rgba(20,60,60,.22)' },
    hell:  { name: 'Infernal',  light: '#ff7a45', amb: 0.26, sky: '#170a0c', shadow: .30, tint: 'rgba(180,50,20,.18)' }
  };

  /* ---- construction ---------------------------------------------------- */
  function create(w, h, opts) {
    opts = opts || {};
    w = U.clamp(w | 0 || 16, 4, 64); h = U.clamp(h | 0 || 16, 4, 64);
    var tiles = new Array(w * h);
    for (var i = 0; i < w * h; i++) tiles[i] = { e: opts.e || 0, t: opts.t || 'grass', p: null };
    return {
      id: U.uid('map'),
      name: opts.name || 'Untitled Field',
      w: w, h: h,
      tiles: tiles,
      tokens: [],
      ambience: opts.ambience || 'day',

    };

  function inB(m, x, y) { return x >= 0 && y >= 0 && x < m.w && y < m.h; }
  function at(m, x, y) { return inB(m, x, y) ? m.tiles[y * m.w + x] : null; }
  function elev(m, x, y) { var t = at(m, x, y); return t ? t.e : 0; }
  function terrain(m, x, y) { var t = at(m, x, y); return t ? TERRAIN[t.t] || TERRAIN.grass : null; }
  function prop(m, x, y) { var t = at(m, x, y); return t && t.p ? PROPS[t.p] : null; }

  /* Is the tile physically standable? (ignores occupancy) */
  function standable(m, x, y) {
    var t = at(m, x, y); if (!t) return false;
    var ter = TERRAIN[t.t] || TERRAIN.grass;
    if (ter.pit) return false;
    if (ter.deep) return false;
    var p = t.p ? PROPS[t.p] : null;
    if (p && p.blocks) return false;
    return true;
  }

  function tokenAt(m, x, y) {
    for (var i = 0; i < m.tokens.length; i++) {
      var a = m.tokens[i];
      if (a.x === x && a.y === y && a.hp > 0) return a;
    }
    return null;
  }
  function anyTokenAt(m, x, y) {
    return m.tokens.find(function (a) { return a.x === x && a.y === y; }) || null;
  }

  /* Cost in feet to *enter* this tile (before elevation), or null if blocked. */
  function enterCost(m, x, y) {
    if (!standable(m, x, y)) return null;
    var ter = TERRAIN[at(m, x, y).t] || TERRAIN.grass;
    var p = prop(m, x, y);
    var mult = ter.cost;
    if (p && p.diff) mult = Math.max(mult, 2);
    return VT.iso.FT * mult;
  }

  function resize(m, nw, nh) {
    nw = U.clamp(nw | 0, 4, 64); nh = U.clamp(nh | 0, 4, 64);
    var tiles = new Array(nw * nh);
    for (var y = 0; y < nh; y++) for (var x = 0; x < nw; x++) {
      var old = at(m, x, y);
      tiles[y * nw + x] = old ? { e: old.e, t: old.t, p: old.p } : { e: 0, t: 'grass', p: null };
    }
    m.w = nw; m.h = nh; m.tiles = tiles;
    m.tokens = m.tokens.filter(function (a) { return a.x < nw && a.y < nh; });
    return m;
  }

  function maxElev(m) {
    var mx = 0; for (var i = 0; i < m.tiles.length; i++) if (m.tiles[i].e > mx) mx = m.tiles[i].e;
    return mx;
  }

  /* ---- generators ------------------------------------------------------ */
  /* Small hand-tuned procedural fields so there's something to fight on the
     moment the app opens. Each returns a finished map object. */
  var GENERATORS = {
    plain: function (w, h) {
      var m = create(w, h, { name: 'Open Field', t: 'grass' });
      scatter(m, 'bush', .04); scatter(m, 'tree', .03);
      softHills(m, 3, 2);
      return m;
    },
    arena: function (w, h) {
      var m = create(w, h, { name: 'Colosseum', t: 'sand' });
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
        var edge = Math.min(x, y, w - 1 - x, h - 1 - y);
        var t = at(m, x, y);

        else if (edge === 1) { t.e = 1; t.t = 'cobble'; }
      }
      /* four raised platforms + pillars, the classic tactics arena */
      [[3, 3], [w - 4, 3], [3, h - 4], [w - 4, h - 4]].forEach(function (p) {
        stamp(m, p[0], p[1], 2, 2, { e: 2, t: 'marble' });
      });
      [[Math.floor(w / 2), 2], [Math.floor(w / 2), h - 3]].forEach(function (p) {
        var t = at(m, p[0], p[1]); if (t) t.p = 'pillar';
      });
      return m;
    },
    canyon: function (w, h) {
      var m = create(w, h, { name: 'Red Canyon', t: 'sand', ambience: 'dusk' });
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
        var t = at(m, x, y);
        var band = Math.abs(y - h / 2) / (h / 2);
        var n = U.hash01(x, y, 7);
        var e = Math.round(band * 5 + n * 1.4 - .6);
        t.e = U.clamp(e, 0, 6);
        t.t = t.e >= 4 ? 'stone' : t.e >= 2 ? 'dirt' : 'sand';
      }
      /* a river of nothing down the middle - jumping puzzle */
      for (var x2 = 0; x2 < w; x2++) {
        if (x2 % 5 === 2) continue;
        var t2 = at(m, x2, Math.floor(h / 2));
        if (t2) { t2.t = 'void'; }
      }
      scatter(m, 'rock', .05);
      return m;
    },
    ruins: function (w, h) {
      var m = create(w, h, { name: 'Sunken Ruins', t: 'moss', ambience: 'dusk' });
      softHills(m, 2, 2);
      /* broken walls in rough rectangles */
      for (var k = 0; k < 4; k++) {
        var rx = 1 + Math.floor(Math.random() * (w - 6)), ry = 1 + Math.floor(Math.random() * (h - 6));
        var rw = 3 + Math.floor(Math.random() * 4), rh = 3 + Math.floor(Math.random() * 4);
        outline(m, rx, ry, rw, rh, 'wall', .55);
        stamp(m, rx, ry, rw, rh, { t: 'marble' });

/* ===== src/map/path.js ===== */
/* Virtual Tactics :: map/path.js
   Movement range, pathfinding, line of sight and cover.

   Elevation is the whole point of a tactics grid, so movement is a Dijkstra
   over (x, y, diagonal-parity) states with these rules:
     - stepping UP one 5ft step costs an extra 5ft (a scramble)
     - stepping UP two or more steps is a wall; you need to go around
     - stepping DOWN up to 10ft is free
     - stepping DOWN more than 10ft is allowed but you land hard and stop
     - you may move THROUGH an ally, never through an enemy, and never end
       your move sharing a square */

  'use strict';
  var VT = window.VT, U = VT.util, G = VT.gmap, FT = VT.iso.FT;

  var DIRS = [
    { dx: 1, dy: 0, d: 0 }, { dx: -1, dy: 0, d: 0 }, { dx: 0, dy: 1, d: 0 }, { dx: 0, dy: -1, d: 0 },
    { dx: 1, dy: 1, d: 1 }, { dx: 1, dy: -1, d: 1 }, { dx: -1, dy: 1, d: 1 }, { dx: -1, dy: -1, d: 1 }
  ];

  var MAX_CLIMB = 1;     // steps you can scramble up (5 ft)
  var FREE_DROP = 2;     // steps you can drop without consequence (10 ft)
  var MAX_DROP = 8;      // steps the pathfinder will ever drop (40 ft)

  function key(x, y, p) { return (y * 1000 + x) * 2 + p; }

  /* Minimal binary heap keyed on .cost */
  function Heap() { this.a = []; }
  Heap.prototype.push = function (n) {
    var a = this.a; a.push(n);
    var i = a.length - 1;
    while (i > 0) {
      var p = (i - 1) >> 1;
      if (a[p].cost <= a[i].cost) break;
      var t = a[p]; a[p] = a[i]; a[i] = t; i = p;
    }
  };
  Heap.prototype.pop = function () {
    var a = this.a, top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last;
      var i = 0;
      for (;;) {
        var l = 2 * i + 1, r = l + 1, s = i;
        if (l < a.length && a[l].cost < a[s].cost) s = l;
        if (r < a.length && a[r].cost < a[s].cost) s = r;

  function reachable(map, actor, budgetFt, settings) {
    settings = settings || VT.store.settings();
    var alternating = settings.diagonals === 'alternating';
    var climbCost = settings.climbCost !== false;

    var startK = key(actor.x, actor.y, 0);
    var startNode = { x: actor.x, y: actor.y, p: 0, cost: 0, prev: null, fall: 0 };
    best[startK] = 0;

    while (heap.size()) {
      var cur = heap.pop();

          out.set(cur.x + ',' + cur.y, {

  function pathTo(rangeMap, x, y) {

  function tilesBetween(x0, y0, x1, y1) {
    var pts = [], dx = x1 - x0, dy = y1 - y0;

      var tile = G.at(map, p.x, p.y);

      } else if (topE >= lineE - 0.35) {
        cover = Math.max(cover, 2);   // firing over a lip
      }

      /* props */

          cover = Math.max(cover, 5);

      blocked: blocked,

    var r = Math.floor(radiusFt / FT), out = [];

    tilesBetween: tilesBetween, feet: feet, DIRS: DIRS,
    MAX_CLIMB: MAX_CLIMB, FREE_DROP: FREE_DROP

})();

/* ===== src/render/tileart.js ===== */
/* Virtual Tactics :: render/tileart.js
   Every tile texture is generated in-browser, so the app ships with zero image
   assets and still reads as a hand-placed tactics field. Four variants per
   terrain are baked once and picked per-tile by a stable position hash, which
   kills the "tiled wallpaper" look without any randomness that could shimmer
   between frames. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, ISO = VT.iso;
  var W = ISO.TILE_W, H = ISO.TILE_H, VARIANTS = 4;
  var cache = {};

  function newCanvas(w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }

  function diamondPath(ctx, w, h) {
    ctx.beginPath();
    ctx.moveTo(w / 2, 0);
    ctx.lineTo(w, h / 2);
    ctx.lineTo(w / 2, h);
    ctx.lineTo(0, h / 2);
    ctx.closePath();
  }

  function bakeTop(terrainKey, variant) {
    var def = VT.gmap.TERRAIN[terrainKey] || VT.gmap.TERRAIN.grass;
    var c = newCanvas(W, H), ctx = c.getContext('2d');
    ctx.save();
    diamondPath(ctx, W, H);
    ctx.clip();
    ctx.fillStyle = def.top;
    ctx.fillRect(0, 0, W, H);

    var seed = variant * 97 + terrainKey.length * 13;
    var grain = def.grain || 'noise';

    if (grain === 'noise') {
      /* speckle - two passes, light then dark, low alpha */
      for (var i = 0; i < 130; i++) {
        var x = U.hash01(i, variant, seed) * W;
        var y = U.hash01(i, variant + 50, seed) * H;
        var v = U.hash01(i, variant + 90, seed);
        ctx.fillStyle = v > .5 ? 'rgba(255,255,255,.075)' : 'rgba(0,0,0,.085)';
        var s = 1 + (v > .93 ? 1 : 0);
        ctx.fillRect(x | 0, y | 0, s, s);

      ctx.strokeStyle = 'rgba(0,0,0,.20)';
      ctx.lineWidth = 1;
      for (var b = 0; b < 3; b++) {
        var off = (b + 1) / 4;
        ctx.beginPath();
        ctx.moveTo(W * off, H * off - H / 2 + H / 2 * 0);
        ctx.lineTo(W * off + W / 2, H * off + H / 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(W * off, H - H * off);
        ctx.lineTo(W * off - W / 2, H - H * off - H / 2);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255,255,255,.07)';
      ctx.strokeRect(1, 1, W - 2, H - 2);

      ctx.strokeStyle = 'rgba(0,0,0,.24)';

        ctx.beginPath();

        ctx.lineTo(W * (p / 4) + W / 2, H * (p / 4) - H / 2 + H);
        ctx.stroke();
      }
    } else if (grain === 'crack') {
      ctx.strokeStyle = 'rgba(0,0,0,.26)';
      ctx.lineWidth = 1;
      for (var k = 0; k < 2; k++) {
        var sx = U.hash01(k, variant, seed) * W, sy = U.hash01(k + 9, variant, seed) * H;
        ctx.beginPath(); ctx.moveTo(sx, sy);
        for (var s2 = 0; s2 < 3; s2++) {
          sx += (U.hash01(k * 7 + s2, variant, seed) - .5) * 18;
          sy += (U.hash01(k * 11 + s2, variant, seed) - .5) * 10;
          ctx.lineTo(sx, sy);

        ctx.stroke();
      }
      for (var n = 0; n < 40; n++) {

        ctx.moveTo(2, yy);

          ctx.lineTo(xx, yy + Math.sin((xx + variant * 9) * 0.28) * 1.6);

    /* light from the north-west: brighten the two back edges */

    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.strokeStyle = 'rgba(255,255,255,.13)';
    ctx.lineWidth = 1;
    ctx.beginPath();

    ctx.restore();

  }

  function top(terrainKey, x, y) {
    var v = Math.floor(U.hash01(x, y, 11) * VARIANTS) % VARIANTS;

  function sideColors(terrainKey) {

    cache[k] = {
      left: U.shade(def.side, -0.22),
      right: U.shade(def.side, 0.04),
      leftDark: U.shade(def.side, -0.44),
      rightDark: U.shade(def.side, -0.26),

    var c = newCanvas(size || 56, size || 56), ctx = c.getContext('2d');
    var sc = (size || 56) / W;
    ctx.save();
    ctx.translate((size || 56) / 2, (size || 56) * .62);
    ctx.scale(sc, sc);
    var sd = sideColors(terrainKey);
    /* two side faces */
    ctx.fillStyle = sd.left;
    ctx.beginPath();
    ctx.moveTo(-W / 2, 0); ctx.lineTo(0, H / 2); ctx.lineTo(0, H / 2 + 14); ctx.lineTo(-W / 2, 14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = sd.right;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0); ctx.lineTo(0, H / 2); ctx.lineTo(0, H / 2 + 14); ctx.lineTo(W / 2, 14); ctx.closePath(); ctx.fill();
    ctx.drawImage(top(terrainKey, 0, 0), -W / 2, -H / 2);
    ctx.restore();
    return c;
  }

  function clearCache() { cache = {}; }

  VT.tileart = { top: top, sideColors: sideColors, preview: preview, clearCache: clearCache, newCanvas: newCanvas };
})();

/* ===== src/render/spriteart.js ===== */
/* Virtual Tactics :: render/spriteart.js
   Procedural pixel-art tokens. Any actor without a custom sprite gets one of
   these, generated from a small spec (kind + palette + kit) and cached. It
   means a fresh campaign already has a visually distinct cast, and it gives
   players a fallback while they draw their own. Custom PNGs always win. */
(function () {
  'use strict';

  var cache = {};

    var ctx = c.getContext('2d');
