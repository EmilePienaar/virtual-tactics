      out.armor = listOf(mc.armor);
      out.weapons = listOf(mc.weapons);
      /* Conditional grants the matcher cannot evaluate, kept so the sheet can
         say what they are rather than pretending they do not exist. */
      out.notes = prose(mc.weapons).concat(prose(mc.armor));
    }

    /* Skills from race and background. The class side is a CHOICE and is made
       on the choice tree, so it is not gathered here - but a race that simply
       grants Perception, and a background that simply grants two skills, were
       being dropped entirely. They are written as a map, {"survival": true,
       "nature": true}, which is the same shape as the rest of this file's
       input, so it costs one more line to read them. */
    [c.race, c.subrace, c.background].forEach(function (rec) {
      if (!rec) return;
      merge(out.armor, listOf(rec.armorProficiencies));
      merge(out.weapons, listOf(rec.weaponProficiencies));
      merge(out.languages, listOf(rec.languageProficiencies));
      merge(out.skills, skillsIn(rec.skillProficiencies));
      out.languageChoices += choicesIn(rec.languageProficiencies);
      out.skillChoices += choicesIn(rec.skillProficiencies);
    });

    /* Everyone speaks the local tongue. The books assume it rather than
       granting it, and a sheet that lists no languages at all reads as a bug. */
    if (out.languages.indexOf('common') < 0) out.languages.unshift('common');
    return out;
  }

  function merge(target, list) {
    list.forEach(function (v) { if (target.indexOf(v) < 0) target.push(v); });
  }

  /* Skill names have to survive normalisation intact. `clean` strips a trailing
     " weapons"/" armour", which no skill name ends in, but it also lowercases -
     and lowercase is exactly the form skillProf is stored in, so that is right.
     What must NOT happen is a skill the sheet cannot match: anything not in the
     18 is dropped rather than added as a row nothing can roll. */
  function skillsIn(raw) {
    var known = (VT.tags && VT.tags.SKILL_ABILITY) || (VT.srd && VT.srd.SKILL_ABILITY) || null;
    return listOf(raw).filter(function (sk) {
      return !known || Object.prototype.hasOwnProperty.call(known, sk);
    });
  }

  /* ---- am I proficient with this? -------------------------------------- */
  /* A missing list means "we were never told", and an unknown is not a
     penalty. An empty list means "told, and the answer is nothing". */
  function known(list) { return Array.isArray(list); }

  /* item may be a 5etools item record, an inventory gear entry, or just a
     name. Category is the "simple"/"martial" side; the name catches a class
     that grants specific weapons, like a rogue's rapier or a monk's
     shortsword. */
  function weaponOk(actor, item, category) {
    var list = actor && actor.weaponProf;
    if (!known(list)) return true;
    var name = clean(typeof item === 'string' ? item : (item && item.name));
    var cat = clean(category != null ? category
      : (item && (item.weaponCategory || item.category)));
    if (cat && list.indexOf(cat) >= 0) return true;
    if (name && list.indexOf(name) >= 0) return true;
    /* An unarmed strike is not a weapon and needs no training; neither do the
       natural attacks a wild-shaped druid or a summon brings with it. Those
       arrive with no category at all, so treat a nameless, categoryless attack
       as fine rather than docking it a bonus it never had. */
    if (!cat && !name) return true;
    return false;
  }

  /* `worn` is an inventory entry with a gear record, or an item record. */
  function armourWeight(worn) {
    if (!worn) return null;
    if (worn.gear) return worn.gear.slot === 'shield' ? 'shields' : worn.gear.weight || null;
    var t = String(worn.type || '').split('|')[0];
    return { HA: 'heavy', MA: 'medium', LA: 'light', S: 'shields' }[t] || null;
  }

  function armourOk(actor, worn) {
    var list = actor && actor.armorProf;
    if (!known(list)) return true;
    var weight = armourWeight(worn);
    if (!weight) return true;
    if (list.indexOf(weight) >= 0) return true;
    /* Heavy armour training implies the lighter kinds in every class list the
       books print, but nothing in the data says so, so do not infer it. The
       one thing worth honouring is a specific grant by name - a race that
       trains you in a single piece of armour. */
    var name = clean(worn && worn.name);
    return !!(name && list.indexOf(name) >= 0);
  }

  /* What you are wearing that you should not be, or null. Read by the sheet,
     the roll helpers and the battle map's advantage calculation. */
  function armourPenalty(actor) {
    if (!actor || !known(actor.armorProf) || !VT.gear) return null;
    var bad = [];
    var arm = VT.gear.armour(actor);
    if (arm && !armourOk(actor, arm)) bad.push(arm.name);
    var shd = VT.gear.shield(actor);
    if (shd && !armourOk(actor, shd)) bad.push(shd.name);
    if (!bad.length) return null;
    return {
      items: bad,
      why: 'not proficient with ' + bad.join(' or '),
      /* spelled out because the penalty is three separate rules and a player
         who sees only "disadvantage" will not know spells are off too */
      note: 'Disadvantage on Strength and Dexterity checks, saves and attacks, ' +
            'and you cannot cast spells, while wearing ' + bad.join(' and ') + '.'
    };
  }

  /* Does an unfamiliar-armour penalty touch this roll? */
  var STR_DEX = { str: 1, dex: 1 };
  function hindersAbility(actor, ability) {
    return !!(actor && actor.armorUnskilled && STR_DEX[ability]);
  }
  function hindersSkill(actor, skill) {
    var abil = VT.tags && VT.tags.SKILL_ABILITY && VT.tags.SKILL_ABILITY[skill];
    return hindersAbility(actor, abil);
  }
  /* Weapon attacks use Strength or Dexterity; a spell attack uses the casting
     ability and is instead forbidden outright. */
  function hindersAttack(actor, act) {
    if (!actor || !actor.armorUnskilled || !act) return false;
    return act.kind === 'melee' || act.kind === 'ranged';
  }
  function blocksSpells(actor) { return !!(actor && actor.armorUnskilled); }

  /* ---- keeping attack bonuses honest ------------------------------------ */
  /* convert.weapon records how much of an attack's `toHit` is the proficiency
     bonus, on `profBonus`. That makes the share removable and re-addable
     without rebuilding the character, which is what changing your training on
     the Edit tab has to do.

     Recomputed from the recorded share every time rather than adjusted, so
     running this twice is the same as running it once. Actions saved before
     this existed carry no `profBonus` and are left exactly alone. */
  function retune(actor) {
    if (!actor || !Array.isArray(actor.actions)) return actor;
    var full = VT.actor ? VT.actor.prof(actor) : 2;
    actor.actions.forEach(function (act) {
      if (!act || act.profBonus == null) return;
      var ok = weaponOk(actor, act.itemName || act.name, act.weaponCategory);
      var want = ok ? full : 0;
      if (want !== act.profBonus) {
        act.toHit = (act.toHit || 0) + (want - act.profBonus);
        act.profBonus = want;
      }
      if (ok) delete act.notProficient;
      else act.notProficient = true;
    });
    return actor;
  }

  /* ---- characters saved before any of this existed ---------------------- */
  /* They have no lists at all, which reads as "nothing is known" and so costs
     them nothing - but it also means their Proficiencies card is empty, and a
     fighter with a blank armour row looks broken rather than untold.

     If the build references are still there and the compendium can resolve
     them, work the lists out now. If it cannot - no data connected, or a
     character imported as a flat statblock - leave them absent, because a
     guess here becomes a penalty on the sheet. Runs once: it only fills what
     is missing, so it is safe to call on every load. */
  function backfill(actor) {
    if (!actor || known(actor.armorProf)) return actor;
    var refs = actor.build;
    if (!refs || !VT.charbuild || !VT.charbuild.fromRefs) return actor;
    var r = VT.charbuild.fromRefs(refs);
    if (!r || !r.choices || !r.choices.classes.length) return actor;
    /* fromRefs hands back the record shape, [{cls, subclass, level}]; what
       multiclass.proficiencies looks up is the flat one the actor carries,
       [{name, source, level}]. Different shapes, same list, and passing the
       wrong one fails silently by finding no class at all. */
    var out = gather({
      classes: r.choices.classes.map(function (e) {
        return { name: e.cls.name, source: e.cls.source || null, level: e.level || 1 };
      }),
      race: r.choices.race, subrace: r.choices.subrace, background: r.choices.background
    });
    actor.armorProf = out.armor;
    actor.weaponProf = out.weapons;
    actor.langProf = merged(out.languages, actor.langProf);
    actor.langChoices = out.languageChoices;
    /* Skills already exist on every character, so this MERGES rather than
       replaces - a hand-toggled proficiency must not be thrown away by a
       backfill that only meant to add the race's. */
    actor.skillProf = merged(out.skills, actor.skillProf);
    return actor;
  }

  function merged(a, b) {
    var out = a.slice();
    (b || []).forEach(function (v) {
      var c = clean(v);
      if (c && out.indexOf(c) < 0) out.push(c);
    });
    return out;
  }

  /* Repair a character saved with prose in its proficiency lists.

     Before the reader expanded every tag, a conditional grant was stored as the
     half-eaten string "martial weapons that have the {@filter light" and shown
     as a chip. It can never match an item, so it is moved out of the list and
     into the notes where it belongs. Runs on load and only changes a character
     that actually has one. */
  function tidy(actor) {
    if (!actor) return actor;
    var moved = [];
    ['weaponProf', 'armorProf'].forEach(function (key) {
      if (!Array.isArray(actor[key])) return;
      var kept = [];
      actor[key].forEach(function (v) {
        var c = clean(v);
        if (!c) return;
        if (isProse(c)) { if (moved.indexOf(c) < 0) moved.push(c); return; }
        if (kept.indexOf(c) < 0) kept.push(c);
      });
      actor[key] = kept;
    });
    if (moved.length) {
      actor.profNotes = (actor.profNotes || []).slice();
      moved.forEach(function (m) {
        if (actor.profNotes.indexOf(m) < 0) actor.profNotes.push(m);
      });
    }
    return actor;
  }

  VT.proficiency = {
    ARMOUR_KINDS: ARMOUR_KINDS, WEAPON_KINDS: WEAPON_KINDS,
    backfill: backfill, tidy: tidy,
    clean: clean, listOf: listOf, choicesIn: choicesIn, gather: gather,
    skillsIn: skillsIn, prose: prose, isProse: isProse,
    weaponOk: weaponOk, armourOk: armourOk, armourWeight: armourWeight,
    armourPenalty: armourPenalty,
    hindersAbility: hindersAbility, hindersSkill: hindersSkill,
    hindersAttack: hindersAttack, blocksSpells: blocksSpells,
    retune: retune
  };
})();

/* ===== src/rules/itemfx.js ===== */
/* Virtual Tactics :: rules/itemfx.js
   What a magic item actually does to you.

   Until now an attuned Belt of Hill Giant Strength was a line in a list. It did
   not touch Strength, which is the entire item. Same for a Ring of Protection
   and its +1, a Ring of Fire Resistance and its resistance, Boots of Speed and
   their doubled movement.

   The data carries all of it in structured fields, so this reads rather than
   guesses:

     ability:      { static: { str: 21 } }      74 items
     bonusAc:      "+1"                        267 items
     resist:       ["fire"]                    361 items
     modifySpeed:  { multiply: { walk: 2 } }   121 items
     bonusSavingThrow, conditionImmune, bonusSpellAttack, bonusSpellSaveDc

   When an item counts is the other half of the question. An item that requires
   attunement does nothing until attuned - that is what attunement is for.
   Anything else has to be worn. Carrying a ring in your pack has never made
   anyone tougher. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, SRD = VT.srd;

  function num(v) {
    if (v == null) return 0;
    var n = parseInt(String(v).replace(/[^-\d]/g, ''), 10);
    return isNaN(n) ? 0 : n;
  }

  /* The compact record kept on an inventory entry, or null for a mundane item.
     A copy rather than the whole record: this is saved with the character. */
  function effectsOf(item) {
    if (!item) return null;
    var fx = {};
    if (item.ability && item.ability.static) fx.set = U.clone(item.ability.static);
    if (item.bonusAc) fx.ac = num(item.bonusAc);
    if (item.bonusSavingThrow) fx.save = num(item.bonusSavingThrow);
    if (item.bonusSpellAttack) fx.spellAttack = num(item.bonusSpellAttack);
    if (item.bonusSpellSaveDc) fx.spellDc = num(item.bonusSpellSaveDc);
    if (item.resist) fx.resist = [].concat(item.resist).filter(function (x) { return typeof x === 'string'; });
    if (item.conditionImmune) {
      fx.conditionImmune = [].concat(item.conditionImmune)
        .filter(function (x) { return typeof x === 'string'; });
    }
    if (item.modifySpeed && item.modifySpeed.multiply) fx.speedMul = U.clone(item.modifySpeed.multiply);
    if (item.modifySpeed && item.modifySpeed.bonus) fx.speedAdd = U.clone(item.modifySpeed.bonus);
    if (item.reqAttune) fx.needsAttune = true;
    /* A wand is not just a bonus - it casts. 524 items carry the spells they
       cast in a structured field, keyed by what it costs to cast them:
         attachedSpells: { charges: { "1": ["magic missile"] } }
       and 1,157 carry charges. Both are kept so the sheet can offer the spell
       as a real action rather than leaving it buried in the description. */
    if (item.attachedSpells) fx.spells = U.clone(item.attachedSpells);
    if (item.charges) fx.charges = item.charges;
    if (item.recharge) fx.recharge = item.recharge;
    if (item.rechargeAmount) {
      fx.rechargeAmount = String(item.rechargeAmount).replace(/\{@dice\s*([^}]*)\}/i, '$1').trim();
    }
    /* Armour states its total AC already, so its own +1 must not be added on
       top - "+1 Plate Armor" carries ac 19 AND bonusAc "+1", and counting both
       gives 20. */
    if (item.armor && item.ac) fx.acInArmour = true;
    return Object.keys(fx).length ? fx : null;
  }

  /* Is this entry doing anything right now? */
  function live(actor, entry) {
    if (!entry || !entry.fx) return false;
    if (entry.fx.needsAttune) {
      return (actor.attuned || []).some(function (x) {
        return String(x.name).toLowerCase() === String(entry.name).toLowerCase();
      });
    }
    return !!entry.equipped;
  }

  function active(actor) {
    return (actor.inventory || []).filter(function (e) { return live(actor, e); });
  }

  /* ---- applying ---------------------------------------------------------- */

  /* Ability scores an item sets. The books say "your Strength score changes to
     21", and every one of them adds "unless your Strength is already equal to
     or greater" - so it is a floor, not an assignment. */
  function applyAbilities(actor) {
    if (!actor.baseAbilities) actor.baseAbilities = U.clone(actor.abilities || {});
    var out = U.clone(actor.baseAbilities);
    var from = {};
    active(actor).forEach(function (e) {
      var set = e.fx.set;
      if (!set) return;
      Object.keys(set).forEach(function (k) {
        if ((out[k] || 0) < set[k]) { out[k] = set[k]; from[k] = e.name; }
      });
    });
    actor.abilities = out;
    actor.abilityFrom = from;
    return actor;
  }

  /* Everything that is not an ability score. Called after AC has been worked
     out from armour, because these stack on top of it. */
  function applyRest(actor) {
    var acBonus = 0, saveBonus = 0, spellAtk = 0, spellDc = 0;
    var resist = [], condImm = [], notes = [];
    var speedMul = 1, speedAdd = 0;

    active(actor).forEach(function (e) {
      var fx = e.fx;
      /* worn armour already includes its own bonus in its AC */
      if (fx.ac && !(fx.acInArmour && e.gear && e.gear.slot === 'armor')) acBonus += fx.ac;
      if (fx.save) saveBonus += fx.save;
      if (fx.spellAttack) spellAtk += fx.spellAttack;
      if (fx.spellDc) spellDc += fx.spellDc;
      (fx.resist || []).forEach(function (r) { if (resist.indexOf(r) < 0) resist.push(r); });
      (fx.conditionImmune || []).forEach(function (r) { if (condImm.indexOf(r) < 0) condImm.push(r); });
      if (fx.speedMul && fx.speedMul.walk) speedMul *= fx.speedMul.walk;
      if (fx.speedAdd && fx.speedAdd.walk) speedAdd += fx.speedAdd.walk;
      if (fx.ac || fx.save || fx.resist || fx.set || fx.speedMul) notes.push(e.name);
    });

    if (acBonus) {
      actor.ac = (actor.ac || 10) + acBonus;
      actor.acWhy = (actor.acWhy || '') + U.sign(acBonus) + ' from items';
    }
    actor.itemSaveBonus = saveBonus;
    actor.itemSpellAttack = spellAtk;
    actor.itemSpellDc = spellDc;
    /* Kept apart from actor.resist, which resist.js owns - it merges these
        with what the race and the class features grant. Writing straight to
        actor.resist here would erase a tiefling's fire resistance the moment
        they picked up any magic item. */
     actor.itemResist = resist;
     actor.itemConditionImmune = condImm;
     actor.itemNotes = notes;

    if (speedMul !== 1 || speedAdd) {
      actor.speed = Math.round((actor.speed || 30) * speedMul) + speedAdd;
    }
    if (spellAtk && actor.spellAttack != null) actor.spellAttack += spellAtk;
    if (spellDc && actor.spellDC != null) actor.spellDC += spellDc;
    return actor;
  }

  /* The spells an item can cast, as rollable actions.

     Gated the same way every other effect is: an item that requires attunement
     grants nothing until attuned, and anything else has to be held or worn.
     A wand in your pack is not a wand in your hand. */
  function actionsFrom(actor, entry) {
    if (!entry || !entry.fx || !entry.fx.spells) return [];
    if (!live(actor, entry)) return [];
    var FT = VT.fivetools;
    if (!FT || !FT.get) return [];

    var out = [];
    var seen = {};
    Object.keys(entry.fx.spells).forEach(function (how) {
      var byCost = entry.fx.spells[how];
      /* "charges" is an object of cost -> names; the rest are plain arrays. */
      var pairs = Array.isArray(byCost)
        ? [[null, byCost]]
        : Object.keys(byCost).map(function (k) { return [k, byCost[k]]; });

      pairs.forEach(function (pair) {
        var cost = pair[0], names = pair[1] || [];
        names.forEach(function (raw) {
          var name = String(raw).split('|')[0].trim();
          var key = name.toLowerCase();
          if (seen[key]) return;
          seen[key] = 1;
          var rec = (FT.get('spell') || []).find(function (sp) {
            return String(sp.name).toLowerCase() === key;
          });
          if (!rec) return;

          var prof = VT.actor.prof(actor);
          var act = VT.convert.spell(rec, {
            dc: actor.spellDC || (8 + prof + 2),
            atk: actor.spellAttack || (prof + 2),
            mod: 0, prof: prof, level: actor.level || 1
          });
          if (!act) return;
          act = U.clone(act);
          act.fromItem = entry.name;
          act.name = act.name + '  (' + entry.name + ')';
          /* An item's spell is cast from the item, not from your own slots. */
          delete act.spellLevel;
          if (cost) {
            act.chargeCost = parseInt(cost, 10) || 1;
            act.desc = (act.desc ? act.desc + '  ' : '') +
                       act.chargeCost + ' charge' + (act.chargeCost === 1 ? '' : 's') + '.';
          }
          out.push(act);
        });
      });
    });
    return out;
  }

  /* Every action every live item grants. */
  function allActions(actor) {
    var out = [];
    (actor.inventory || []).forEach(function (e) {
      actionsFrom(actor, e).forEach(function (a) { out.push(a); });
    });
    return out;
  }

  /* Tag an inventory entry with its effects, if it has any. */
  function tag(entry, item) {
    var fx = effectsOf(item);
    if (fx) entry.fx = fx;
    return entry;
  }

  /* A plain-English summary, for the sheet to show under the item. */
  function describe(fx) {
    if (!fx) return '';
    var bits = [];
    if (fx.set) {
      Object.keys(fx.set).forEach(function (k) {
        bits.push((SRD.ABILITY_NAME[k] || k.toUpperCase()) + ' becomes ' + fx.set[k]);
      });
    }
    if (fx.ac && !fx.acInArmour) bits.push(U.sign(fx.ac) + ' AC');
    if (fx.save) bits.push(U.sign(fx.save) + ' to saves');
    if (fx.spellAttack) bits.push(U.sign(fx.spellAttack) + ' spell attack');
    if (fx.spellDc) bits.push(U.sign(fx.spellDc) + ' spell DC');
    if (fx.resist && fx.resist.length) bits.push('resist ' + fx.resist.join(', '));
    if (fx.conditionImmune && fx.conditionImmune.length) {
      bits.push('immune to ' + fx.conditionImmune.join(', '));
    }
    if (fx.speedMul && fx.speedMul.walk) bits.push('speed x' + fx.speedMul.walk);
    if (fx.speedAdd && fx.speedAdd.walk) bits.push(U.sign(fx.speedAdd.walk) + ' ft speed');
    if (fx.needsAttune) bits.push('needs attunement');
    return bits.join(' · ');
  }

  VT.itemfx = {
    effectsOf: effectsOf, tag: tag, live: live, active: active,
    actionsFrom: actionsFrom, allActions: allActions,
    applyAbilities: applyAbilities, applyRest: applyRest, describe: describe
  };
})();

/* ===== src/rules/resist.js ===== */
/* Virtual Tactics :: rules/resist.js
   Damage resistances, immunities and vulnerabilities, from every source.

   Three places grant them and they behave differently, which is why this is one
   file rather than three scattered checks:

     race       structured data - tiefling fire, aasimar necrotic and radiant.
                43 races and 8 subraces carry it, and a few say "choose one",
                which the character's ancestry pick answers.
     features   English in the feature text. 50 features mention resistance and
                only 21 are permanent - the rest are Rage, Bear Totem, and other
                things you turn on. Applying those passively would make a
                barbarian permanently resistant to everything.
     items      handled in itemfx.js, merged here.

   The honest line is drawn at qualified resistances. "Resistance to fire
   damage" is a fact about the character. "Resistance to bludgeoning, piercing
   and slashing from nonmagical attacks" is narrower than the sheet can show in
   one word, so it is listed as a note rather than claimed as blanket
   resistance - a sheet that overstates a defence gets someone killed. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, SRD = VT.srd;

  var TYPES = SRD.DAMAGE_TYPES;

  /* Anything that narrows a resistance to less than "all of this type". */
  var QUALIFIER = /\bfrom\b|nonmagical|magical weapons|silvered|adamantine|while|unless/i;

  /* Turns on and off, so it is a reminder rather than a state. */
  var CONDITIONAL =
    /while (you are )?raging|while this|when you|as an action|bonus action|for 1 minute|until the (end|start)|while transformed|while in/i;

  function typesIn(text) {
    var found = [];
    TYPES.forEach(function (t) {
      if (new RegExp('\\b' + t + '\\b', 'i').test(text) && found.indexOf(t) < 0) found.push(t);
    });
    return found;
  }

  /* ---- race --------------------------------------------------------------- */

  /* "choose": the race offers a list and something else picks from it - a
     dragonborn's draconic ancestry, most often. Look for the answer among the
     character's own choices before giving up. */
  function resolveChoose(entry, build) {
    var from = entry && entry.choose && entry.choose.from;
    if (!Array.isArray(from)) return [];
    var picked = JSON.stringify((build && build.picks) || {}).toLowerCase();
    var hit = from.filter(function (t) {
      return picked.indexOf(String(t).toLowerCase()) >= 0;
    });
    return hit.length ? [hit[0]] : [];
  }

  function fromRace(build) {
    var out = { resist: [], immune: [], vulnerable: [], conditionImmune: [], pending: [] };
    if (!build) return out;
    [build.race, build.subrace].forEach(function (rec) {
      if (!rec) return;
      ['resist', 'immune', 'vulnerable', 'conditionImmune'].forEach(function (key) {
        [].concat(rec[key] || []).forEach(function (v) {
          if (typeof v === 'string') {
            if (out[key].indexOf(v) < 0) out[key].push(v);
          } else if (v && v.choose) {
            var got = resolveChoose(v, build);
            if (got.length) {
              got.forEach(function (t) { if (out[key].indexOf(t) < 0) out[key].push(t); });
            } else {
              out.pending.push('choose one: ' + (v.choose.from || []).join(', '));
            }
          }
        });
      });
    });
    return out;
  }

  /* ---- class and subclass features ---------------------------------------- */

  /* Reads a feature's own text. Applies only what is unambiguous; anything
     narrowed or switchable comes back as a note. */
  function fromFeature(feature) {
    if (!VT.featureText) return null;
    var text = VT.featureText.textOf(feature);
    if (!/resistance to/i.test(text)) return null;

    var m = text.match(/resistance to ([^.]{0,90})/i);
    if (!m) return null;
    var clause = m[1];
    var types = typesIn(clause);

    /* "resistance to all damage except psychic" names psychic as the one type
       it does NOT cover, so listing the types found would say the opposite of
       what the feature does. When the clause excludes rather than enumerates,
       quote it instead. */
    var inverted = /except|other than|all damage/i.test(clause);
    if (CONDITIONAL.test(text)) {
      return { note: feature.name + ': ' + (inverted
        ? 'resistance while active to ' + clause.trim().replace(/\s+/g, ' ')
        : 'resistance while active' + (types.length ? ' (' + types.join(', ') + ')' : '')) };
    }
    if (!types.length || inverted || QUALIFIER.test(clause)) {
      return { note: feature.name + ': ' + U.cap(clause.trim().replace(/\s+/g, ' ')) };
    }
    return { types: types, from: feature.name };
  }

  function fromFeatures(actor, records) {
    var out = { resist: [], notes: [] };
    (records || []).forEach(function (rec) {
      var got = fromFeature(rec);
      if (!got) return;
      if (got.note) { out.notes.push(got.note); return; }
      got.types.forEach(function (t) { if (out.resist.indexOf(t) < 0) out.resist.push(t); });
    });
    return out;
  }

  /* ---- putting it together ------------------------------------------------ */

  /* Merge every source onto the actor. Items are already on actor.itemResist,
     put there by itemfx, so this owns the final arrays. */
  function gather(actor) {
    if (!actor) return actor;
    var resist = [], immune = [], vuln = [], condImm = [], notes = [];

    function addAll(target, list) {
      (list || []).forEach(function (t) {
        var v = String(t).toLowerCase();
        if (target.indexOf(v) < 0) target.push(v);
      });
    }

    var race = actor.raceDefences || {};
    addAll(resist, race.resist); addAll(immune, race.immune);
    addAll(vuln, race.vulnerable); addAll(condImm, race.conditionImmune);
    (race.pending || []).forEach(function (p) { notes.push('From your race, ' + p); });

    addAll(resist, actor.featureResist);
    (actor.featureResistNotes || []).forEach(function (n) { notes.push(n); });

    addAll(resist, actor.itemResist);
    addAll(condImm, actor.itemConditionImmune);

    /* Immunity beats resistance - listing both is noise. */
    resist = resist.filter(function (t) { return immune.indexOf(t) < 0; });

    actor.resist = resist;
    actor.immune = immune;
    actor.vulnerable = vuln;
    actor.conditionImmune = condImm;
    actor.resistNotes = notes;
    return actor;
  }

  VT.resist = {
    fromRace: fromRace, fromFeature: fromFeature, fromFeatures: fromFeatures,
    gather: gather, typesIn: typesIn
  };
})();

/* ===== src/rules/combat.js ===== */
/* Virtual Tactics :: rules/combat.js
   The encounter engine: initiative, turns, movement (with opportunity attacks
   and falls), attacks, saves, healing and conditions.

   Everything that changes the board goes through here and emits an event, so
   the UI never has to guess when to repaint or what to write in the log. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, SRD = VT.srd, A = VT.actor, G = VT.gmap, P = VT.path;

  var combat = {
    active: false,
    map: null,
    order: [],      // actor ids, initiative order
    idx: 0,
    round: 0,
    anim: null,     // in-flight movement
    fx: [],         // transient visual effects
    busy: false
  };

  function log(html, cls) { VT.bus.emit('log', html, cls); }
  function changed() { VT.bus.emit('update'); }
  function floater(actor, text, color) { VT.bus.emit('floater', actor, text, color); }

  function live(map) { return map.tokens.filter(function (a) { return a.hp > 0; }); }
  function byId(id) {
    return combat.map ? combat.map.tokens.find(function (a) { return a.id === id; }) : null;
  }

  /* ---- initiative ------------------------------------------------------ */
  function rollInitiative(map) {
    combat.map = map;
    map.tokens.forEach(function (a) {
      if (a.hp <= 0) { a.initiative = -99; return; }
      var r = VT.dice.d20(A.abilityMod(a, 'dex'));
      a.initiative = r.total;
      a.initRoll = r;
    });
    combat.order = map.tokens.slice().sort(function (a, b) {
      if (b.initiative !== a.initiative) return b.initiative - a.initiative;
      var d = A.abilityMod(b, 'dex') - A.abilityMod(a, 'dex');
      if (d) return d;
      return a.name < b.name ? -1 : 1;
    }).map(function (a) { return a.id; });
    combat.idx = 0;
    combat.round = 1;
    combat.active = true;
    log('<b>Roll for initiative.</b>', 'turn');
    map.tokens.slice()
      .sort(function (a, b) { return b.initiative - a.initiative; })
      .forEach(function (a) {
        if (a.hp <= 0) return;
        log(U.esc(a.name) + ' <span class="roll">' + (a.initRoll ? a.initRoll.detail : '') + '</span> = <b>' + a.initiative + '</b>');
      });
    beginTurn();
    return combat.order;
  }

  function end() {
    combat.active = false;
    combat.order = [];
    combat.idx = 0;
    combat.round = 0;
    changed();
    VT.bus.emit('turn', null);
  }

  function current() {
    if (!combat.active) return null;
    return byId(combat.order[combat.idx]);
  }

  function beginTurn() {
    var a = current();
    if (!a) return;
    if (a.hp <= 0) return nextTurn();

    A.resetTurn(a);
    a.reactionUsed = false;

    log('&#9656; <b>' + U.esc(a.name) + '</b> &mdash; round ' + combat.round, 'turn');

    /* standing in something nasty */
    var ter = G.terrain(combat.map, a.x, a.y);
    if (ter && ter.hazard) {
      var d = VT.dice.roll(ter.hazard);
      var res = A.applyDamage(a, d.total, ter.hazardType);
      log(U.esc(a.name) + ' burns in the ' + ter.name.toLowerCase() +
        ' <span class="roll">' + d.detail + '</span> <span class="dmg">' + res.taken + '</span>');
      floater(a, '-' + res.taken, '#ff8a5c');
      if (res.downed) announceDown(a);
    }
    if (a.regen && a.hp > 0 && a.hp < a.hpMax) {
      var got = A.healBy(a, a.regen);
      if (got) { log(U.esc(a.name) + ' regenerates <span class="hit">' + got + '</span>'); floater(a, '+' + got, '#78b06a'); }
    }

    changed();
    VT.bus.emit('turn', a);
  }

  function nextTurn() {
    if (!combat.active) return;
    var guard = 0;
    do {
      combat.idx++;
      if (combat.idx >= combat.order.length) {
        combat.idx = 0;
        combat.round++;
        log('&mdash; round ' + combat.round + ' &mdash;', 'turn');
      }
      guard++;
    } while (guard < 200 && (function () { var a = current(); return !a || a.hp <= 0; })());

    if (checkVictory()) return;
    beginTurn();
  }

  function checkVictory() {
    var map = combat.map;
    if (!map) return false;
    var foes = map.tokens.filter(function (a) { return a.team === 'foe' && a.hp > 0; });
    var party = map.tokens.filter(function (a) { return a.team === 'party' && a.hp > 0; });
    if (!foes.length && map.tokens.some(function (a) { return a.team === 'foe'; })) {
      log('<b>The field is won.</b> No enemies remain standing.', 'turn');
      end(); return true;
    }
    if (!party.length && map.tokens.some(function (a) { return a.team === 'party'; })) {
      log('<b>The party has fallen.</b>', 'turn');
      end(); return true;
    }
    return false;
  }

  function announceDown(a) {
    if (a.team === 'party') log('<b>' + U.esc(a.name) + '</b> falls unconscious!', 'turn');
    else log('<b>' + U.esc(a.name) + '</b> is slain.', 'turn');
    floater(a, a.team === 'party' ? 'DOWN' : 'SLAIN', '#c9605a');
  }

  /* ---- advantage ------------------------------------------------------- */
  /* 5e stacking: any number of sources of advantage and disadvantage cancel to
     a flat roll. We collect both sides and report the reasons for the log. */
  function advantage(attacker, target, action) {
    var map = combat.map, adv = false, dis = false, why = [];
    var ranged = action.kind === 'ranged';

    /* Armour the attacker was never trained in: disadvantage on anything using
       Strength or Dexterity, which is every weapon attack. A spell attack uses
       the casting ability instead, and unfamiliar armour stops the casting
       outright - which the sheet enforces, not the map. */
    if (attacker.armorUnskilled && action.spellLevel == null &&
        (action.kind === 'melee' || action.kind === 'ranged')) {
      dis = true; why.push('unfamiliar armour');
    }

    (attacker.conditions || []).forEach(function (c) {
      var d = SRD.CONDITIONS[c]; if (!d) return;
      if (d.atkFrom > 0) { adv = true; why.push(d.name); }
      if (d.atkFrom < 0) { dis = true; why.push(d.name); }
    });
    (target.conditions || []).forEach(function (c) {
      var d = SRD.CONDITIONS[c]; if (!d) return;
      var v = d.atkAgainst;
      if (ranged && d.atkAgainstRanged != null) v = d.atkAgainstRanged;
      if (!ranged && d.atkAgainstMelee != null) v = d.atkAgainstMelee;
      if (v > 0) { adv = true; why.push('target ' + d.name.toLowerCase()); }
      if (v < 0) { dis = true; why.push('target ' + d.name.toLowerCase()); }
    });

    if (VT.store.settings().highGround) {
      var dz = G.elev(map, attacker.x, attacker.y) - G.elev(map, target.x, target.y);
      if (dz >= 1) { adv = true; why.push('high ground'); }
      else if (dz <= -1 && ranged) { dis = true; why.push('shooting uphill'); }
    }

    if (ranged) {
      /* shooting while something is breathing down your neck */
      var pressed = map.tokens.some(function (o) {
        return o.hp > 0 && o.team !== attacker.team && o.id !== target.id &&
          U.gridDist(o.x, o.y, attacker.x, attacker.y) <= 1;
      });
      if (pressed) { dis = true; why.push('enemy adjacent'); }
      var ft = P.feet(map, attacker, target);
      if (action.range && ft > action.range[0]) { dis = true; why.push('long range'); }
    }

    return { adv: adv && dis ? 0 : adv ? 1 : dis ? -1 : 0, why: why, cancelled: adv && dis };
  }

  function coverAgainst(attacker, target) {
    var l = P.los(combat.map, attacker, target);
    return l;
  }

  /* ---- range / legality ------------------------------------------------ */
  function actionReachFt(action) {
    if (action.kind === 'melee') return action.reach || 5;
    if (action.range) return action.range[1] || action.range[0] || 5;
    return 5;
  }

  function inRangeOf(attacker, action, tx, ty) {
    var ft = P.feet(combat.map, attacker, { x: tx, y: ty });
    return ft <= actionReachFt(action);
  }

  /* Every legal target square for an action. */
  function targetsFor(actor, action) {
    var map = combat.map, out = [];
    var reach = actionReachFt(action);
    if (action.self || (action.range && action.range[1] === 0)) return [{ x: actor.x, y: actor.y }];
    map.tokens.forEach(function (t) {
      if (t.hp <= 0 && action.kind !== 'heal') return;
      if (t.id === actor.id && action.kind !== 'heal' && action.kind !== 'buff') return;
      if (!inRangeOf(actor, action, t.x, t.y)) return;
      if (action.kind !== 'melee' && P.los(map, actor, t).blocked) return;
      out.push({ x: t.x, y: t.y, actor: t });
    });
    /* area spells can be aimed at empty ground */
    if (action.aoe) {
      P.inRadius(map, actor.x, actor.y, reach, true).forEach(function (p) {
        if (!out.some(function (o) { return o.x === p.x && o.y === p.y; })) out.push(p);
      });
    }
    return out;
  }

  function aoeTiles(action, cx, cy) {
    if (!action.aoe) return [{ x: cx, y: cy }];
    return P.inRadius(combat.map, cx, cy, action.aoe.radius, true);
  }

  /* ---- movement -------------------------------------------------------- */
  function faceToward(a, tx, ty) {
    var dx = tx - a.x, dy = ty - a.y;
    if (dx || dy) { a.fx = Math.sign(dx) || a.fx; a.fy = Math.sign(dy) || a.fy; }
  }

  /* Enemies who threaten `from` but not `to` get a swing as you leave. */
  function opportunityAttacks(mover, from, to) {
    if (!VT.store.settings().opportunity || mover.disengaged) return;
    combat.map.tokens.forEach(function (o) {
      if (o.hp <= 0 || o.team === mover.team || o.reactionUsed || !A.canAct(o)) return;
      var atk = (o.actions || []).find(function (ac) { return ac.kind === 'melee'; });
      if (!atk) return;
      var reach = Math.floor((atk.reach || 5) / 5);
      var was = U.gridDist(o.x, o.y, from.x, from.y) <= reach;
      var now = U.gridDist(o.x, o.y, to.x, to.y) <= reach;
      if (was && !now) {
        o.reactionUsed = true;
        log('<b>' + U.esc(o.name) + '</b> takes an opportunity attack.');
        resolveAttack(o, mover, atk, { free: true });
      }
    });
  }

  /* Kick off an animated move along a path produced by path.pathTo(). */
  function moveAlong(actor, path, onDone) {
    if (!path || path.length < 2) { if (onDone) onDone(); return; }
    var costTotal = path[path.length - 1].cost || 0;
    actor.moveLeft = Math.max(0, actor.moveLeft - costTotal);
    actor.movedThisTurn = (actor.movedThisTurn || 0) + costTotal;
    combat.anim = { actor: actor, path: path, i: 0, t: 0, onDone: onDone };
    combat.busy = true;
    if (VT.store.settings().animate === false) {
      while (combat.anim) stepMove(1);
    }
  }

  function stepMove(dt) {
    var an = combat.anim;
    if (!an) return;
    var stepDur = 0.13;
    an.t += dt / stepDur;
    while (an.t >= 1 && combat.anim) {
      an.t -= 1;
      var from = an.path[an.i], to = an.path[an.i + 1];
      an.i++;
      var a = an.actor;
      faceToward(a, to.x, to.y);
      var prev = { x: a.x, y: a.y };
      a.x = to.x; a.y = to.y;
      opportunityAttacks(a, prev, to);

      if (to.fall) {
        var feet = to.fall * VT.iso.FT;
        if (VT.store.settings().fallDamage) {
          var dmg = VT.dice.roll(Math.max(1, Math.floor(feet / 10)) + 'd6');
          var res = A.applyDamage(a, dmg.total, 'bludgeoning');
          A.addCond(a, 'prone');
          log('<b>' + U.esc(a.name) + '</b> drops ' + feet + ' ft <span class="roll">' + dmg.detail +
            '</span> <span class="dmg">' + res.taken + '</span> and lands prone');
          floater(a, '-' + res.taken, '#ff8a5c');
          if (res.downed) announceDown(a);
        }
      }
      var ter = G.terrain(combat.map, a.x, a.y);
      if (ter && ter.hazard && a.hp > 0) {
        var hd = VT.dice.roll(ter.hazard);
        var hr = A.applyDamage(a, hd.total, ter.hazardType);
        log('<b>' + U.esc(a.name) + '</b> steps into ' + ter.name.toLowerCase() +
          ' <span class="dmg">' + hr.taken + '</span>');
        floater(a, '-' + hr.taken, '#ff8a5c');
        if (hr.downed) announceDown(a);
      }

      if (an.i >= an.path.length - 1 || a.hp <= 0 || to.fall) {
        var done = an.onDone;
        combat.anim = null;
        combat.busy = false;
        a._anim = null;
        changed();
        if (done) done();
        return;
      }
    }
    if (combat.anim) {
      var cur = combat.anim.path[combat.anim.i];
      var nxt = combat.anim.path[combat.anim.i + 1];
      combat.anim.actor._anim = { from: cur, to: nxt, t: U.clamp(combat.anim.t, 0, 1) };
    }
  }

  /* ---- attacks --------------------------------------------------------- */
  function resolveAttack(attacker, target, action, opts) {
    opts = opts || {};
    var map = combat.map;
    faceToward(attacker, target.x, target.y);

    var advInfo = advantage(attacker, target, action);
    var coverInfo = action.kind === 'melee' ? { cover: 0, coverName: null } : coverAgainst(attacker, target);
    if (coverInfo.cover === 99) {
      log('<b>' + U.esc(attacker.name) + '</b> has no line to <b>' + U.esc(target.name) + '</b>.');
      return { blocked: true };
    }
    var ac = A.effectiveAC(target) + (coverInfo.cover || 0);

    var bonusDice = 0, bonusNote = '';
    (attacker.conditions || []).forEach(function (c) {
      var d = SRD.CONDITIONS[c];
      if (d && d.bonusToHit) { var b = VT.dice.roll(d.bonusToHit); bonusDice += b.total; bonusNote += ' +' + b.total + '(' + d.name.toLowerCase() + ')'; }
    });

    var roll = VT.dice.d20(action.toHit + bonusDice, advInfo.adv);
    var hit = roll.crit || (!roll.fumble && roll.total >= ac);

    var head = '<b>' + U.esc(attacker.name) + '</b> ' + U.esc(action.name) + ' &rarr; <b>' + U.esc(target.name) + '</b>';
    var detail = ' <span class="roll">' + roll.detail + bonusNote +
      (advInfo.adv > 0 ? ' adv' : advInfo.adv < 0 ? ' dis' : '') + ' = ' + (roll.total) + ' vs AC ' + ac +
      (coverInfo.coverName ? ' (' + coverInfo.coverName + ')' : '') + '</span>';

    VT.bus.emit('fx', {
      kind: action.kind === 'melee' ? 'slash' : 'arrow',
      from: { x: attacker.x, y: attacker.y }, to: { x: target.x, y: target.y },
      color: action.spell ? '#c69cff' : '#ffe9b0', dur: 0.3
    });

    if (!hit) {
      log(head + ' &mdash; <span class="miss">' + (roll.fumble ? 'fumble' : 'miss') + '</span>' + detail);
      floater(target, 'MISS', '#a49c86');
      changed();
      return { hit: false, roll: roll };
    }

    /* damage */
    var dmgExpr = action.dmg || '0';
    if (action.sneak && (advInfo.adv > 0 || allyAdjacent(attacker, target))) {
      dmgExpr += '+' + action.sneak;
    }
    var expr = roll.crit ? VT.dice.critDice(dmgExpr) : dmgExpr;
    var dmg = VT.dice.roll(expr);
    var res = A.applyDamage(target, Math.max(0, dmg.total), action.dmgType);

    log(head + ' &mdash; <span class="' + (roll.crit ? 'crit' : 'hit') + '">' +
      (roll.crit ? 'CRITICAL' : 'hit') + '</span>' + detail +
      ' <span class="roll">' + dmg.detail + '</span> <span class="dmg">' + res.taken + ' ' +
      U.esc(action.dmgType || '') + '</span>' +
      (res.resisted ? ' <span class="miss">(resisted)</span>' : '') +
      (res.vulnerable ? ' <span class="crit">(vulnerable)</span>' : '') +
      (res.immune ? ' <span class="miss">(immune)</span>' : ''));
    floater(target, '-' + res.taken, roll.crit ? '#ffd76a' : '#ff8a5c');

    if (action.applies && res.taken >= 0) {
      A.addCond(target, action.applies);
      log('<b>' + U.esc(target.name) + '</b> is ' + (SRD.CONDITIONS[action.applies] || {}).name.toLowerCase() + '.');
    }
    if (res.downed) announceDown(target);
    changed();
    checkVictory();
    return { hit: true, crit: roll.crit, damage: res.taken, roll: roll };
  }

  function allyAdjacent(attacker, target) {
    return combat.map.tokens.some(function (o) {
      return o.hp > 0 && o.id !== attacker.id && o.team === attacker.team &&
        U.gridDist(o.x, o.y, target.x, target.y) <= 1;
    });
  }

  /* Area / saving-throw actions. */
  function resolveSave(attacker, action, cx, cy) {
    var tiles = aoeTiles(action, cx, cy);
    var map = combat.map;
    faceToward(attacker, cx, cy);
    VT.bus.emit('fx', {
      kind: 'burst', from: { x: attacker.x, y: attacker.y }, to: { x: cx, y: cy },
      color: '#ffb04d', dur: 0.45
    });
    /* Magic Missile and its kind name no saving throw and no attack roll -
       they simply hit. convert.js models them as a save because the engine has
       no "just hits" kind, and marks them autoHit; honouring that mark is this
       side of the bargain. Without it a target rolled a Dexterity save against
       Magic Missile and took half, or none, which is not a thing that can
       happen. */
    var auto = !!action.autoHit;
    log('<b>' + U.esc(attacker.name) + '</b> casts ' + U.esc(action.name) +
      (auto ? ' <span class="roll">hits automatically</span>'
            : ' <span class="roll">DC ' + action.dc + ' ' +
              String(action.save).toUpperCase() + '</span>'));

    var caught = map.tokens.filter(function (t) {
      return t.hp > 0 && tiles.some(function (p) { return p.x === t.x && p.y === t.y; });
    });
    if (!caught.length) log('&nbsp;&nbsp;<span class="miss">nothing in the area</span>');

    caught.forEach(function (t) {
      var dmg = VT.dice.roll(action.dmg || '0');
      /* Some of these throw several darts at once. */
      var count = Math.max(1, action.count || 1);
      var total = dmg.total;
      for (var extra = 1; extra < count; extra++) total += VT.dice.roll(action.dmg || '0').total;

      var r = null, ok = false, amount = total;
      if (!auto) {
        r = VT.dice.d20(A.saveMod(t, action.save));
        ok = r.total >= action.dc;
        amount = ok ? (action.half ? Math.floor(total / 2) : 0) : total;
      }

      var res = A.applyDamage(t, amount, action.dmgType);
      log('&nbsp;&nbsp;' + U.esc(t.name) + ' ' +
        (auto ? '<span class="hit">hit</span>'
              : '<span class="roll">' + r.detail + ' = ' + r.total + '</span> ' +
                (ok ? '<span class="hit">saves</span>' : '<span class="miss">fails</span>')) +
        ' <span class="dmg">' + res.taken + '</span>');
      floater(t, '-' + res.taken, (!auto && ok) ? '#e0b96a' : '#ff8a5c');
      if (!ok && action.applies) A.addCond(t, action.applies);
      if (res.downed) announceDown(t);
    });
    changed();
    checkVictory();
    return { targets: caught.length };
  }

  function resolveHeal(actor, action, target) {
    var r = VT.dice.roll(action.dmg || '1d8');
    var got = A.healBy(target, r.total);
    log('<b>' + U.esc(actor.name) + '</b> ' + U.esc(action.name) + ' &rarr; <b>' + U.esc(target.name) +
      '</b> <span class="roll">' + r.detail + '</span> <span class="hit">+' + got + '</span>');
    floater(target, '+' + got, '#78b06a');
    VT.bus.emit('fx', { kind: 'burst', from: { x: actor.x, y: actor.y }, to: { x: target.x, y: target.y }, color: '#9ee08a', dur: 0.4 });
    changed();
    return { healed: got };
  }

  function resolveBuff(actor, action, target) {
    A.addCond(target, action.condition);
    log('<b>' + U.esc(actor.name) + '</b> ' + U.esc(action.name) + ' &rarr; <b>' + U.esc(target.name) +
      '</b> is ' + (SRD.CONDITIONS[action.condition] || { name: action.condition }).name.toLowerCase() + '.');
    VT.bus.emit('fx', { kind: 'burst', from: { x: actor.x, y: actor.y }, to: { x: target.x, y: target.y }, color: '#d8b25c', dur: 0.4 });
    changed();
    return { ok: true };
  }

  /* Single entry point the UI calls once a target square is chosen. */
  function performAction(actor, action, tx, ty) {
    if (action.cost === 'action' && actor.actionUsed) return { error: 'Action already used.' };
    if (action.cost === 'bonus' && actor.bonusUsed) return { error: 'Bonus action already used.' };
    if (A.usesLeft(actor, action) <= 0) return { error: 'No uses left.' };

    var target = G.tokenAt(combat.map, tx, ty) || G.anyTokenAt(combat.map, tx, ty);
    var out;
    switch (action.kind) {
      case 'melee':
      case 'ranged':
        if (!target) return { error: 'No target there.' };
        out = resolveAttack(actor, target, action);
        break;
      case 'save':
        out = resolveSave(actor, action, tx, ty);
        break;
      case 'heal':
        if (!target) return { error: 'No target there.' };
        out = resolveHeal(actor, action, target);
        break;
      case 'buff':
        if (!target) return { error: 'No target there.' };
        out = resolveBuff(actor, action, target);
        break;
      default:
        return { error: 'Unknown action type.' };
    }
    if (out && out.blocked) return out;
    A.spendUse(actor, action);
    if (action.cost === 'action') actor.actionUsed = true;
    if (action.cost === 'bonus') actor.bonusUsed = true;
    changed();
    return out;
  }

  /* ---- simple actions -------------------------------------------------- */
  function dash(actor) {
    if (actor.actionUsed) return false;
    actor.actionUsed = true;
    actor.moveLeft += A.speedOf(actor);
    actor.dashed = true;
    log('<b>' + U.esc(actor.name) + '</b> dashes.');
    changed();
    return true;
  }
  function dodge(actor) {
    if (actor.actionUsed) return false;
    actor.actionUsed = true;
    A.addCond(actor, 'dodging');
    log('<b>' + U.esc(actor.name) + '</b> takes the Dodge action.');
    changed();
    return true;
  }
  function disengage(actor) {
    if (actor.actionUsed) return false;
    actor.actionUsed = true;
    actor.disengaged = true;
    log('<b>' + U.esc(actor.name) + '</b> disengages.');
    changed();
    return true;
  }
  function standUp(actor) {
    if (!A.hasCond(actor, 'prone')) return false;
    var cost = Math.ceil(A.speedOf(actor) / 2);
    if (actor.moveLeft < cost) { log('<span class="miss">Not enough movement to stand.</span>'); return false; }
    actor.moveLeft -= cost;
    A.removeCond(actor, 'prone');
    log('<b>' + U.esc(actor.name) + '</b> stands up.');
    changed();
    return true;
  }

  function endTurn() {
    var a = current();
    if (a) {
      A.removeCond(a, 'dodging');
      a.disengaged = false;
    }
    nextTurn();
  }

  /* ---- preview for the UI --------------------------------------------- */
  function preview(attacker, target, action) {
    if (!attacker || !target) return null;
    var advInfo = advantage(attacker, target, action);
    var cover = action.kind === 'melee' ? { cover: 0 } : coverAgainst(attacker, target);
    if (cover.cover === 99) return { blocked: true };
    var ac = A.effectiveAC(target) + (cover.cover || 0);
    var need = U.clamp(ac - action.toHit, 2, 20);
    var p1 = (21 - need) / 20;
    var chance = advInfo.adv > 0 ? 1 - Math.pow(1 - p1, 2)
      : advInfo.adv < 0 ? Math.pow(p1, 2) : p1;
    return {
      chance: Math.round(chance * 100),
      avg: Math.round(VT.dice.avg(action.dmg || '0')),
      adv: advInfo.adv, why: advInfo.why, cover: cover.coverName, ac: ac
    };
  }

  /* ---- frame ----------------------------------------------------------- */
  function update(dt) {
    if (combat.anim) stepMove(dt);
    for (var i = combat.fx.length - 1; i >= 0; i--) {
      combat.fx[i].t += dt;
      if (combat.fx[i].t >= combat.fx[i].dur) combat.fx.splice(i, 1);
    }
  }
  VT.bus.on('fx', function (f) { f.t = 0; combat.fx.push(f); });

  VT.combat = Object.assign(combat, {
    rollInitiative: rollInitiative, end: end, current: current, nextTurn: nextTurn,
    endTurn: endTurn, beginTurn: beginTurn, byId: byId, live: live,
    moveAlong: moveAlong, performAction: performAction, targetsFor: targetsFor,
    aoeTiles: aoeTiles, advantage: advantage, preview: preview, actionReachFt: actionReachFt,
    dash: dash, dodge: dodge, disengage: disengage, standUp: standUp,
    update: update, checkVictory: checkVictory, faceToward: faceToward,
    resolveAttack: resolveAttack
  });
})();

/* ===== src/rules/ai.js ===== */
/* Virtual Tactics :: rules/ai.js
   Monster turns. Deliberately simple and readable so a DM can predict it -
   it plays like a competent but unsubtle opponent: find the best shot it can
   actually reach this turn, prefer the high ground, and finish wounded targets.
   Turn off "Foes act on their own" in Settings to drive them by hand instead. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, A = VT.actor, C = VT.combat, G = VT.gmap, P = VT.path;

  function enemiesOf(actor) {
    return C.map.tokens.filter(function (t) { return t.hp > 0 && t.team !== actor.team; });
  }
  function alliesOf(actor) {
    return C.map.tokens.filter(function (t) { return t.hp > 0 && t.team === actor.team && t.id !== actor.id; });
  }

  function usable(actor, action) {
    if (action.cost === 'action' && actor.actionUsed) return false;
    if (action.cost === 'bonus' && actor.bonusUsed) return false;
    if (action.cost === 'reaction') return false;
    return A.usesLeft(actor, action) > 0;
  }

  /* How good is firing `action` at `target` from tile (x,y)? */
  function scoreShot(actor, action, target, x, y, elevBonus) {
    var map = C.map;
    var ghost = { x: x, y: y, id: actor.id, team: actor.team, conditions: actor.conditions, ac: actor.ac };
    var ft = Math.max(U.gridDist(x, y, target.x, target.y),
      Math.abs(G.elev(map, x, y) - G.elev(map, target.x, target.y))) * VT.iso.FT;
    var reach = C.actionReachFt(action);
    if (ft > reach) return null;
    if (action.kind !== 'melee') {
      var l = P.los(map, { x: x, y: y }, target);
      if (l.blocked) return null;
    }
    var avg = VT.dice.avg(action.dmg || '0');
    var est = avg;
    if (action.kind === 'melee' || action.kind === 'ranged') {
      var acEff = A.effectiveAC(target) + (action.kind === 'melee' ? 0 : (P.los(map, { x: x, y: y }, target).cover || 0));
      var need = U.clamp(acEff - action.toHit, 2, 20);
      var chance = (21 - need) / 20;
      if (VT.store.settings().highGround && G.elev(map, x, y) > G.elev(map, target.x, target.y)) {
        chance = 1 - Math.pow(1 - chance, 2);
      }
      est = avg * chance;
    } else if (action.kind === 'save') {
      est = avg * 0.75;
      /* count everyone the blast would catch, friendly fire included */
      var tiles = P.inRadius(map, target.x, target.y, (action.aoe && action.aoe.radius) || 5, true);
      var hits = 0, friends = 0;
      map.tokens.forEach(function (t) {
        if (t.hp <= 0) return;
        if (!tiles.some(function (p) { return p.x === t.x && p.y === t.y; })) return;
        if (t.team === actor.team) friends++; else hits++;
      });
      est = est * hits - est * friends * 1.4;
      if (hits === 0) return null;
    }
    /* finishing blow is worth more than overkill */
    if (est >= target.hp) est += 6;
    est += (elevBonus || 0);
    return est;
  }

  /* Decide the whole turn: where to stand, what to do there. */
  function plan(actor) {
    var map = C.map;
    var foes = enemiesOf(actor);
    if (!foes.length) return null;

    var budget = A.canAct(actor) ? actor.moveLeft : 0;
    var range = P.reachable(map, actor, budget);
    var actions = (actor.actions || []).filter(function (a) { return usable(actor, a); });

    /* 1. heal a badly hurt ally if we can */
    var healAct = actions.find(function (a) { return a.kind === 'heal'; });
    if (healAct) {
      var hurt = alliesOf(actor).concat([actor]).filter(function (t) { return t.hp < t.hpMax * 0.45; })
        .sort(function (a, b) { return (a.hp / a.hpMax) - (b.hp / b.hpMax); })[0];
      if (hurt) {
        var reachFt = C.actionReachFt(healAct);
        var spot = bestTileWhere(range, function (x, y) {
          return Math.max(U.gridDist(x, y, hurt.x, hurt.y)) * VT.iso.FT <= reachFt;
        }, actor, map);
        if (spot) return { move: spot, action: healAct, tx: hurt.x, ty: hurt.y };
      }
    }

    /* 2. best attack from any tile we can reach */
    var best = null;
    range.forEach(function (node) {
      var elevBonus = G.elev(map, node.x, node.y) * 0.6 - node.cost * 0.012;
      if (node.danger) elevBonus -= 8;      // don't stand in the lava
      if (node.fall) elevBonus -= 4;
      actions.forEach(function (action) {
        var pool = action.kind === 'save' ? foes.concat(foes) : foes;
        pool.forEach(function (target) {
          var s = scoreShot(actor, action, target, node.x, node.y, elevBonus);
          if (s == null) return;
          if (!best || s > best.score) {
            best = { score: s, move: node, action: action, tx: target.x, ty: target.y };
          }
        });
      });
    });
    if (best) return best;

    /* 3. nothing in reach - close the distance */
    var nearest = foes.slice().sort(function (a, b) {
      return U.gridDist(actor.x, actor.y, a.x, a.y) - U.gridDist(actor.x, actor.y, b.x, b.y);
    })[0];
    var approach = null, approachScore = Infinity;
    range.forEach(function (node) {
      if (node.danger) return;
      var d = U.gridDist(node.x, node.y, nearest.x, nearest.y);
      var s = d * 10 - G.elev(map, node.x, node.y) * 0.8 + node.cost * 0.001;
      if (s < approachScore) { approachScore = s; approach = node; }
    });
    return approach ? { move: approach, action: null, approach: true } : null;
  }

  function bestTileWhere(range, pred, actor, map) {
    var best = null, bestScore = -Infinity;
    range.forEach(function (node) {
      if (!pred(node.x, node.y)) return;
      var s = G.elev(map, node.x, node.y) * 0.6 - node.cost * 0.01 - (node.danger ? 20 : 0);
      if (s > bestScore) { bestScore = s; best = node; }
    });
    return best;
  }

  /* ---- execution ------------------------------------------------------- */
  function takeTurn(actor, done) {
    if (!actor || actor.hp <= 0) return done();

    if (!A.canAct(actor)) {
      VT.bus.emit('log', '<b>' + U.esc(actor.name) + '</b> cannot act.');
      return setTimeout(done, 300);
    }
    if (A.hasCond(actor, 'prone')) C.standUp(actor);

    var p = plan(actor);
    if (!p) return setTimeout(done, 250);

    var range = P.reachable(C.map, actor, actor.moveLeft);
    var path = (p.move && (p.move.x !== actor.x || p.move.y !== actor.y))
      ? P.pathTo(range, p.move.x, p.move.y) : null;

    var afterMove = function () {
      if (p.action) {
        C.faceToward(actor, p.tx, p.ty);
        var res = C.performAction(actor, p.action, p.tx, p.ty);
        if (res && res.error) VT.bus.emit('log', '<span class="miss">' + U.esc(res.error) + '</span>');
        /* a second swing if it still has a bonus action attack */
        var bonus = (actor.actions || []).find(function (a) { return a.cost === 'bonus' && usable(actor, a) && a.kind === 'melee'; });
        if (bonus) {
          var t = C.map.tokens.find(function (t2) { return t2.x === p.tx && t2.y === p.ty && t2.hp > 0; });
          if (t) setTimeout(function () { C.performAction(actor, bonus, p.tx, p.ty); setTimeout(done, 450); }, 420);
          else setTimeout(done, 450);
          return;
        }
      }
      setTimeout(done, 480);
    };

    if (path && path.length > 1) C.moveAlong(actor, path, afterMove);
    else setTimeout(afterMove, 220);
  }

  VT.ai = { takeTurn: takeTurn, plan: plan };
})();

/* ===== src/ui/ui.js ===== */
/* Virtual Tactics :: ui/ui.js
   Shared DOM widgets: sections, modals, the combat log, the initiative strip
   and the FFT-style action menu. Panels (editor / sheet / sprites) build on
   these so every tab looks like it belongs to the same program. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, el = U.el;

  var logBody = null, initStrip = null, actionMenu = null, tooltipEl = null, floaters = null;

  function boot() {
    logBody = U.$('#logBody');
    initStrip = U.$('#initStrip');
    actionMenu = U.$('#actionMenu');
    tooltipEl = U.$('#tooltip');
    floaters = U.$('#floaters');
  }

  /* ---- building blocks ------------------------------------------------- */
  function section(title, right, children) {
    var head = el('div', { class: 'sec-h' }, [title]);
    if (right) head.appendChild(el('span', { class: 'sh-right' }, [right]));
    return el('div', { class: 'sec' }, [head, el('div', { class: 'sec-b' }, children)]);
  }

  function row(label, control, wide) {
    return el('div', { class: 'row' + (wide ? ' wide' : '') }, [
      label ? el('label', {}, [label]) : null,
      control
    ]);
  }

  function num(value, min, max, onChange, step) {
    return el('input', {
      type: 'number', value: value, min: min, max: max, step: step || 1,
      onInput: function (e) { onChange(parseFloat(e.target.value)); }
    });
  }
  function text(value, onChange, placeholder) {
    return el('input', {
      type: 'text', value: value == null ? '' : value, placeholder: placeholder || '',
      onInput: function (e) { onChange(e.target.value); }
    });
  }
  function select(options, value, onChange) {
    var s = el('select', {
      onChange: function (e) { onChange(e.target.value); }
    }, options.map(function (o) {
      var v = typeof o === 'string' ? o : o.value;
      var l = typeof o === 'string' ? U.cap(o) : o.label;
      return el('option', { value: v, selected: v === value }, [l]);
    }));
    s.value = value;
    return s;
  }
  function btn(label, onClick, cls, title) {
    return el('button', { class: 'btn ' + (cls || ''), onClick: onClick, title: title || '' }, [label]);
  }
  function toggle(label, value, onChange) {
    var b = el('button', { class: 'btn sm ' + (value ? 'on' : ''), onClick: function () {
      value = !value; b.className = 'btn sm ' + (value ? 'on' : ''); onChange(value);
    } }, [label]);
    return b;
  }

  /* ---- modal ----------------------------------------------------------- */
  function modal(opts) {
    var root = U.$('#modalRoot');
    U.clear(root);
    var box = el('div', { class: 'modal' }, [
      el('h3', {}, [opts.title || '']),
      el('div', { class: 'body' }, opts.body ? [opts.body] : []),
      el('div', { class: 'foot' }, (opts.buttons || [{ label: 'Close' }]).map(function (b) {
        return btn(b.label, function () {
          if (!b.onClick || b.onClick() !== false) close();
        }, b.cls);
      }))
    ]);
    var bg = el('div', { class: 'modal-bg', onClick: function (e) { if (e.target === bg && opts.dismissable !== false) close(); } }, [box]);
    root.appendChild(bg);
    function close() { U.clear(root); }
    return { close: close, box: box };
  }

  function confirm(message, onYes, yesLabel) {
    modal({
      title: 'Confirm',
      body: el('div', {}, [message]),
      buttons: [
        { label: 'Cancel' },
        { label: yesLabel || 'Confirm', cls: 'primary danger', onClick: onYes }
      ]
    });
  }

  /* ---- log ------------------------------------------------------------- */
  function logLine(html, cls) {
    if (!logBody) return;
    var line = el('div', { class: 'le ' + (cls || ''), html: html });
    logBody.appendChild(line);
    while (logBody.children.length > 400) logBody.removeChild(logBody.firstChild);
    logBody.scrollTop = logBody.scrollHeight;
  }
  function clearLog() { if (logBody) U.clear(logBody); }

  /* ---- floating combat text ------------------------------------------- */
  function floater(screenPos, textStr, color) {
    if (!floaters) return;
    var f = el('div', { class: 'floater', style: { left: screenPos.x + 'px', top: screenPos.y + 'px', color: color || '#fff' } }, [textStr]);
    floaters.appendChild(f);
    setTimeout(function () { f.remove(); }, 1200);
  }

  /* ---- tooltip --------------------------------------------------------- */
  function showTip(html, x, y) {
    if (!tooltipEl) return;
    tooltipEl.innerHTML = html;
    tooltipEl.classList.remove('hidden');
    var r = tooltipEl.getBoundingClientRect();
    var left = Math.min(x + 14, window.innerWidth - r.width - 8);
    var top = Math.min(y + 16, window.innerHeight - r.height - 8);
    tooltipEl.style.left = left + 'px';
    tooltipEl.style.top = top + 'px';
  }
  function hideTip() { if (tooltipEl) tooltipEl.classList.add('hidden'); }

  /* ---- initiative strip ------------------------------------------------ */
  function renderInitiative(map, onPick) {
    if (!initStrip) return;
    var C = VT.combat;
    if (!C.active) { initStrip.classList.add('hidden'); return; }
    initStrip.classList.remove('hidden');
    U.clear(initStrip);
    var cur = C.current();
    C.order.forEach(function (id) {
      var a = C.byId(id);
      if (!a) return;
      var card = el('div', {
        class: 'init-card' + (cur && cur.id === id ? ' current' : '') + (a.hp <= 0 ? ' dead' : ''),
        onClick: function () { onPick(a); },
        onMouseenter: function (e) {
          showTip('<b>' + U.esc(a.name) + '</b><br>AC ' + a.ac + ' &middot; HP ' + a.hp + '/' + a.hpMax +
            (a.conditions && a.conditions.length ? '<br>' + a.conditions.join(', ') : ''), e.clientX, e.clientY);
        },
        onMouseleave: hideTip
      });
      card.appendChild(el('span', { class: 'tag', style: { background: VT.sprites.TEAM_COLOR[a.team] } }));
      card.appendChild(el('span', { class: 'ini' }, [String(a.initiative)]));
      card.appendChild(VT.actor.portrait(a, 52, 42));
      card.appendChild(el('div', { class: 'nm', title: a.name }, [a.name]));
      var bar = el('div', { class: 'hpbar' });
      var frac = U.clamp(a.hp / Math.max(1, a.hpMax), 0, 1);
      bar.appendChild(el('i', { style: { width: (frac * 100) + '%', background: frac > .5 ? '#78b06a' : frac > .25 ? '#d8b25c' : '#c9605a' } }));
      card.appendChild(bar);
      initStrip.appendChild(card);
    });
  }

  /* ---- action menu ----------------------------------------------------- */
  function actionItem(label, key, onClick, disabled, tip) {
    var b = el('button', {
      class: 'act', disabled: disabled ? true : null,
      onClick: onClick,
      onMouseenter: tip ? function (e) { showTip(tip, e.clientX, e.clientY); } : null,
      onMouseleave: tip ? hideTip : null
    }, [label]);
    if (key) b.appendChild(el('span', { class: 'k' }, [key]));
    return b;
  }

  function renderActionMenu(actor, ctx) {
    if (!actionMenu) return;
    if (!actor || !VT.combat.active || actor.hp <= 0) { actionMenu.classList.add('hidden'); return; }
    actionMenu.classList.remove('hidden');
    U.clear(actionMenu);

    var A = VT.actor;
    var canAct = A.canAct(actor);

    actionMenu.appendChild(actionItem(
      'Move  ' + Math.round(actor.moveLeft) + 'ft', 'M',
      function () { ctx.onMove(); }, actor.moveLeft <= 0 || !canAct,
      'Click a highlighted tile. Blue = safe, orange = you will drop and land prone, red = hazard.'
    ));

    (actor.actions || []).forEach(function (act, i) {
      var used = (act.cost === 'action' && actor.actionUsed) || (act.cost === 'bonus' && actor.bonusUsed);
      var left = A.usesLeft(actor, act);
      var label = act.name + (act.uses ? '  (' + left + ')' : '');
      var tipParts = [
        '<b>' + U.esc(act.name) + '</b>',
        act.kind === 'melee' ? 'Melee, reach ' + (act.reach || 5) + ' ft'
          : act.kind === 'ranged' ? 'Ranged ' + act.range[0] + '/' + act.range[1] + ' ft'
          : act.kind === 'save' ? 'DC ' + act.dc + ' ' + String(act.save).toUpperCase() +
            (act.aoe ? ', ' + act.aoe.radius + ' ft radius' : '')
          : act.kind === 'heal' ? 'Healing' : 'Effect',
        act.dmg && act.dmg !== '0' ? (act.kind === 'heal' ? 'Restores ' : 'Damage ') + act.dmg +
          (act.dmgType ? ' ' + act.dmgType : '') : null,
        act.cost === 'bonus' ? '<i>Bonus action</i>' : null
      ].filter(Boolean);
      actionMenu.appendChild(actionItem(label, String(i + 1),
        function () { ctx.onAction(act); },
        used || left <= 0 || act.cost === 'reaction' || !canAct,
        tipParts.join('<br>')));
    });

    if (A.hasCond(actor, 'prone')) {
      actionMenu.appendChild(actionItem('Stand Up', 'S', function () { ctx.onStand(); },
        actor.moveLeft < Math.ceil(A.speedOf(actor) / 2)));
    }
    actionMenu.appendChild(actionItem('Dash', 'D', function () { ctx.onDash(); }, actor.actionUsed || !canAct,
      'Action: gain your speed again in movement.'));
    actionMenu.appendChild(actionItem('Dodge', 'V', function () { ctx.onDodge(); }, actor.actionUsed || !canAct,
      'Action: attacks against you have disadvantage until your next turn.'));
    actionMenu.appendChild(actionItem('Disengage', 'X', function () { ctx.onDisengage(); }, actor.actionUsed || !canAct,
      'Action: moving out of reach provokes no opportunity attacks.'));
    actionMenu.appendChild(actionItem('End Turn', 'Space', function () { ctx.onEnd(); }, false));
  }

  function hideActionMenu() { if (actionMenu) actionMenu.classList.add('hidden'); }

  VT.ui = {
    boot: boot, section: section, row: row, num: num, text: text, select: select,
    btn: btn, toggle: toggle, modal: modal, confirm: confirm,
    logLine: logLine, clearLog: clearLog, floater: floater,
    showTip: showTip, hideTip: hideTip,
    renderInitiative: renderInitiative, renderActionMenu: renderActionMenu,
    hideActionMenu: hideActionMenu
  };
})();

/* ===== src/ui/editor.js ===== */
/* Virtual Tactics :: ui/editor.js
   The Map tab. Paint terrain, sculpt elevation, drop props, place tokens.
   Strokes are snapshotted for undo, so sculpting a hillside is safe to
   experiment with. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, el = U.el, ui = VT.ui, G = VT.gmap;

  var editor = {
    tool: 'paint',
    terrain: 'grass',
    prop: 'tree',
    brush: 1,
    level: 0,
    team: 'foe',
    templateId: null,
    undo: [],
    _stroke: null
  };

  /* ---- undo ------------------------------------------------------------ */
  function snapshot(map) {
    return { id: map.id, tiles: JSON.stringify(map.tiles), tokens: JSON.stringify(map.tokens), w: map.w, h: map.h };
  }
  function beginStroke(map) { editor._stroke = snapshot(map); }
  function endStroke(map) {
    if (!editor._stroke) return;
    if (editor._stroke.tiles !== JSON.stringify(map.tiles) ||
        editor._stroke.tokens !== JSON.stringify(map.tokens)) {
      editor.undo.push(editor._stroke);
      if (editor.undo.length > 40) editor.undo.shift();
      VT.store.touch();
    }
    editor._stroke = null;
  }
  function undoLast(map) {
    var s = editor.undo.pop();
    if (!s || s.id !== map.id) return false;
    map.tiles = JSON.parse(s.tiles);
    map.tokens = JSON.parse(s.tokens);
    map.w = s.w; map.h = s.h;
    VT.store.touch();
    return true;
  }

  /* ---- painting -------------------------------------------------------- */
  function brushTiles(map, cx, cy) {
    var out = [], r = editor.brush - 1;
    for (var y = cy - r; y <= cy + r; y++) {
      for (var x = cx - r; x <= cx + r; x++) {
        if (!G.inB(map, x, y)) continue;
        if (editor.brush > 2 && U.gridDist(x, y, cx, cy) > r) continue;
        out.push({ x: x, y: y });
      }
    }
    return out;
  }

  /* alt = right mouse button / shift: the tool's inverse */
  function applyAt(map, cx, cy, alt) {
    var touched = false;
    brushTiles(map, cx, cy).forEach(function (p) {
      var t = G.at(map, p.x, p.y);
      if (!t) return;
      switch (editor.tool) {
        case 'paint':
          if (t.t !== editor.terrain) { t.t = editor.terrain; touched = true; }
          break;
        case 'raise': {
          var d = alt ? -1 : 1;
          var ne = U.clamp(t.e + d, 0, 12);
          if (ne !== t.e) { t.e = ne; touched = true; }
          break;
        }
        case 'level':
          if (t.e !== editor.level) { t.e = editor.level; touched = true; }
          break;
        case 'prop':
          if (alt) { if (t.p) { t.p = null; touched = true; } }
          else if (t.p !== editor.prop) { t.p = editor.prop; touched = true; }
          break;
        case 'erase':
          if (t.p) { t.p = null; touched = true; }
          var tok = G.anyTokenAt(map, p.x, p.y);
          if (tok) { map.tokens = map.tokens.filter(function (a) { return a.id !== tok.id; }); touched = true; }
          break;
      }
    });
    if (editor.tool === 'token') touched = placeToken(map, cx, cy, alt) || touched;
    return touched;
  }

  function placeToken(map, x, y, alt) {
    var existing = G.anyTokenAt(map, x, y);
    if (alt) {
      if (!existing) return false;
      map.tokens = map.tokens.filter(function (a) { return a.id !== existing.id; });
      return true;
    }
    if (existing) return false;
    if (!G.standable(map, x, y)) return false;
    var tpl = VT.store.campaign.roster.find(function (r) { return r.id === editor.templateId; });
    if (!tpl) { ui.logLine('<span class="miss">Pick a roster entry first (Roster tab).</span>'); return false; }
    var tok = VT.actor.instance(tpl, { x: x, y: y, team: editor.team });
    /* unique name for repeats: Goblin, Goblin 2, Goblin 3 ... */
    var same = map.tokens.filter(function (a) { return a.templateId === tpl.id; }).length;
    if (same) tok.name = tpl.name + ' ' + (same + 1);
    map.tokens.push(tok);
    return true;
  }

        el('div', { class: 'list' }, VT.store.campaign.roster.length

  function describeAction(act) {
    if (act.kind === 'melee') return 'Melee ' + (act.reach || 5) + 'ft · ' + U.sign(act.toHit) + ' · ' + act.dmg + ' ' + (act.dmgType || '');
    if (act.kind === 'ranged') return 'Ranged ' + act.range[0] + '/' + act.range[1] + 'ft · ' + U.sign(act.toHit) + ' · ' + act.dmg + ' ' + (act.dmgType || '');
    if (act.kind === 'save') return 'DC ' + act.dc + ' ' + String(act.save).toUpperCase() +

    if (act.kind === 'heal') return 'Restores ' + act.dmg + ' · range ' + act.range[1] + 'ft';
