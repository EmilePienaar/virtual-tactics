<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Tactics Character Sheet</title>
<link rel="stylesheet" href="choiceui.css">
<link rel="stylesheet" href="sheet.css">
</head>
<body>

<div id="app">
  <header id="bar">
    <select id="charPick" title="Active character"></select>
    <div id="rollMode" title="Applies to d20 rolls">
      <button data-adv="-1" title="Disadvantage">Dis</button>
      <button data-adv="0" class="on" title="Normal">Norm</button>
      <button data-adv="1" title="Advantage">Adv</button>
    </div>
    <button id="critToggle" title="Double the damage dice on the next damage roll">Crit</button>
  </header>

  <nav id="tabs">
    <button class="tab on" data-tab="sheet">Sheet</button>
    <button class="tab" data-tab="edit">Edit</button>
    <button class="tab" data-tab="party">Party</button>
    <button class="tab" data-tab="build">Build</button>
    <button class="tab" data-tab="setup">Setup</button>
  </nav>

  <main id="view"></main>
  <div id="toast"></div>
</div>

<input type="file" id="dirPicker" class="hidden" webkitdirectory directory multiple>
<input type="file" id="jsonPicker" class="hidden" accept="application/json" multiple>

<!-- Shared engine. build-symbiote.js concatenates these into vendor.js for the
     installable folder; kept separate here so development edits are live. -->
<script src="vendor.js"></script>
<script src="ts-shim.js"></script>
<script src="sheet.js"></script>
</body>
</html>
