  function isMagicItem(i) {
    if (isArmour(i) || i.weapon) return false;
    return (i.rarity && i.rarity !== 'none') || !!i.reqAttune || !!i.wondrous;
  }

  /* A search box over a list too long for a dropdown — the same pattern the
     shop uses for its 2,600 items. */
  function picker(label, records, onPick, fmt) {
    fmt = fmt || function (r) { return r.name; };
    var wrap = el('div', { style: { marginBottom: '10px' } });
    var list = el('div', { class: 'picklist hidden' });
    var input = el('input', { type: 'text', placeholder: label + ' — type to search' });
    input.addEventListener('input', function () {
      var q = input.value.trim().toLowerCase();
      U.clear(list);
      if (q.length < 2) { list.classList.add('hidden'); return; }
      var hits = records.filter(function (r) {
        return String(r.name || '').toLowerCase().indexOf(q) >= 0;
      }).slice(0, 40);
      if (!hits.length) {
        list.appendChild(el('div', { class: 'tiny', style: { padding: '6px' } }, ['Nothing matches.']));
      }
      hits.forEach(function (r) {
        list.appendChild(el('div', { class: 'pickhit', onClick: function () {
          input.value = ''; list.classList.add('hidden');
          onPick(r);
        } }, [
          el('span', { class: 'grow' }, [fmt(r)]),
          el('span', { class: 'tiny' }, [r.source || ''])
        ]));
      });
      list.classList.remove('hidden');
    });
    wrap.appendChild(el('div', { class: 'searchbar' }, [input]));
    wrap.appendChild(list);
    return wrap;
  }

  /* --- magic items and attunement --- */
  function attunePanel(a) {
    a.attuned = a.attuned || [];
    var max = VT.actor.attuneMax(a);
    var used = VT.actor.attuneCount(a);
    var p = el('div', { class: 'panel' }, [
      el('h3', {}, ['Magic items & attunement — ' + used + ' of ' + max])
    ]);

    /* the three slots, as slots */
    var slots = el('div', { class: 'attune-slots' });
    for (var i = 0; i < max; i++) {
      var it = a.attuned[i];
      slots.appendChild(el('div', { class: 'attune-slot' + (it ? ' filled' : '') }, it ? [
        el('div', { class: 'attune-nm' }, [it.name]),
        it.note ? el('div', { class: 'tiny' }, [it.note]) : null,
        el('button', { class: 'btn sm danger', onClick: (function (name) {
          return function () { VT.actor.unattune(a, name); flash('No longer attuned to ' + U.esc(name) + '.'); saveDraw(); };
        })(it.name) }, ['Break attunement'])
      ] : [el('div', { class: 'tiny' }, ['empty slot'])]));
    }
    p.appendChild(slots);

    if (FT.loaded) {
      p.appendChild(picker('Attune to an item', FT.get('item').filter(function (i) { return i.reqAttune; }),
        function (rec) {
          var r = VT.actor.attune(a, rec);
          if (!r.ok) { flash(U.esc(r.reason), 'err'); redraw(); return; }
          if (!a.inventory.some(function (x) { return x.name === rec.name; })) {
            a.inventory.push({ name: rec.name, qty: 1, note: 'attuned' });
          }
          flash('Attuned to ' + U.esc(rec.name) + '.');
          saveDraw();
        },
        function (i) {
          return i.name + ' · ' + (i.rarity || 'magic') +
            (typeof i.reqAttune === 'string' ? ' · ' + i.reqAttune : '');
        }));

      /* everything else magical - rings, wondrous items, potions, wands */
      p.appendChild(picker('Add a magic item', FT.get('item').filter(isMagicItem),
        function (rec) {
          a.inventory.push({ name: rec.name, qty: 1, note: (rec.rarity || 'magic') });
          flash(U.esc(rec.name) + ' added to the inventory.' +
                (rec.reqAttune ? ' It needs attuning — do that above.' : ''));
          saveDraw();
        },
        function (i) {
          return i.name + ' · ' + (i.rarity || 'magic') + (i.reqAttune ? ' · attunement' : '');
        }));
    } else {
      p.appendChild(el('p', { class: 'tiny' }, ['Connect a data source to browse magic items.']));
    }
    p.appendChild(el('p', { class: 'tiny' }, [
      'Three items at once is the standard limit; change it in Core numbers if your table plays it differently. ' +
      'Attuning also drops the item into the inventory so it is not held in two places.'
    ]));
    work.appendChild(p);
  }

  /* --- notes --- */
  function notesPanel(a) {
    work.appendChild(el('div', { class: 'panel' }, [
      el('h3', {}, ['Notes']),
      el('textarea', { rows: 6, value: a.notes || '',
        placeholder: 'Feats taken, fighting style, invocations, anything the sheet does not model.',
        onInput: function (e) { a.notes = e.target.value; a.notesCustom = true; save(); } }),
      el('p', { class: 'tiny' }, ['Marked as yours once edited, so a level-up never overwrites it.'])
    ]));
  }

  /* --- housekeeping --- */
  function managePanel(a) {
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['This entry'])]);
    p.appendChild(el('div', { class: 'btnrow' }, [
      P.btn('Duplicate', function () {
        var copy = U.clone(a);
        copy.id = U.uid('tpl');
        copy.name = a.name + ' (copy)';
        roster().push(copy);
        R.id = copy.id;
        flash('Duplicated.');
        saveDraw();
      }, 'sm'),
      P.btn('Download JSON', function () {
        var clean = U.clone(a);
        delete clean.__src;
        var blob = new Blob([JSON.stringify(clean, null, 1)], { type: 'application/json' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = String(a.name || 'sheet').replace(/[^\w-]+/g, '_') + '.json';
        document.body.appendChild(link); link.click();
        setTimeout(function () { URL.revokeObjectURL(link.href); link.remove(); }, 400);
      }, 'sm'),
      P.btn('Remove from roster', function () {
        if (!confirm('Remove ' + a.name + ' from the campaign roster? Anything already placed on a map stays there.')) return;
        VT.store.removeFromRoster(a.id);
        R.id = null;
        flash('Removed.');
        saveDraw();
      }, 'sm danger')
    ]));
    p.appendChild(el('p', { class: 'tiny', style: { marginTop: '8px' } }, [
      'Exported JSON imports into Tale Sheet, so a character built and levelled here can be ' +
      'handed to a player for use in TaleSpire.'
    ]));
    work.appendChild(p);
  }

  /* ==== level and re-derive ============================================== */
  function addToBuild(a, key, rec) {
    a.build[key] = a.build[key] || [];
    a.build[key].push({ name: rec.name, source: rec.source || null });
    rederive(a, 'Added ' + U.esc(rec.name) + '.');
  }

  function replace(oldA, newA) {
    var i = roster().findIndex(function (c) { return c.id === oldA.id; });
    if (i >= 0) roster()[i] = ensureFields(newA);
    R.id = newA.id;
  }

  function rederive(a, msg) {
    var res = VT.charbuild.relevel(a, a.level);
    if (!res.ok) { flash(U.esc(res.reason), 'err'); redraw(); return; }
    replace(a, res.actor);
    flash(msg || 'Updated.' + missingNote(res));
    saveDraw();
  }

  function missingNote(res) {
    return res.missing && res.missing.length
      ? ' Not found in your data: ' + U.esc(res.missing.join(', ')) + '.' : '';
  }

  function changeLevel(a, newLevel) {
    newLevel = U.clamp(newLevel, 1, 20);
    if (newLevel === a.level) return;

    if (FT.loaded && a.build && a.build.cls) {
      var res = VT.charbuild.relevel(a, newLevel);
      if (res.ok) {
        replace(a, res.actor);
        flash('Now level ' + newLevel + ' — <b>' + res.actor.hpMax + '</b> max HP, proficiency ' +
              sign(VT.actor.prof(res.actor)) +
              ((res.actor.asiStatus && res.actor.asiStatus.left)
                ? '. <b>' + res.actor.asiStatus.left + ' ability score improvement' +
                  (res.actor.asiStatus.left > 1 ? 's' : '') + '</b> to assign below.' : '.') +
              missingNote(res));
        saveDraw();
        return;
      }
      flash(U.esc(res.reason) + ' Falling back to arithmetic.', 'warn');
    }

    /* No build data, or the class is not in the loaded set. Hit points gain the
       die's average plus Constitution, and any change in proficiency flows
       through to derived attack bonuses and the spell numbers. Exactly what the
       symbiote does in the same situation. */
    var oldProf = SRD.profBonus(a.level || 1), newProf = SRD.profBonus(newLevel);
    var faces = a.hitDie || 8;
    var conMod = SRD.mod(a.abilities.con);
    var per = Math.max(1, Math.floor(faces / 2) + 1 + conMod);
    var delta = newLevel - (a.level || 1);
    a.hpMax = Math.max(1, a.hpMax + delta * per);
    a.hp = U.clamp(a.hp + (delta > 0 ? delta * per : 0), 1, a.hpMax);
    a.level = newLevel;
    a.hitDiceMax = newLevel;
    a.hitDiceUsed = Math.min(a.hitDiceUsed || 0, newLevel);
    if (newProf !== oldProf) {
      var d = newProf - oldProf;
      (a.actions || []).forEach(function (act) {
        if (act.toHit != null && !act.custom) act.toHit += d;
      });
      if (a.spellDC != null) a.spellDC += d;
      if (a.spellAttack != null) a.spellAttack += d;
    }
    flash('Now level ' + newLevel + ' — <b>' + a.hpMax + '</b> max HP, proficiency ' + sign(newProf) +
          (newProf !== oldProf ? ' (attack bonuses adjusted).' : '.'));
    saveDraw();
  }

  VT.rosterUI = { render: render, select: function (id) { R.id = id; } };
})();

/* ===== ../src/dev/ts-shim.js ===== */
/* Virtual Tactics :: TaleSpire API shim — DEVELOPMENT ONLY.

   Inside TaleSpire this file installs nothing: the real TS object is injected
   after DOMContentLoaded and `hasInitialized` fires, so sheet.js boots against
   the real API and never calls installTSShim().

   Opened in a plain browser, `hasInitialized` never arrives, sheet.js times out
   and installs this instead. It is a genuine emulation rather than a stub -
   dice actually roll, results come back through onRollResults in the real
   payload shape, and evaluateDiceResultsGroup does the real arithmetic - so the
   advantage/disadvantage handling is exercised for real during development. */
(function () {
  'use strict';

  function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 10); }

  /* The shim reads the real manifest so it can fail the way TaleSpire fails.
     Without an api.interop.id, TS.sync.send rejects every call with
     symbioteManifestMissingInteropId - and a symbiote missing one works
     perfectly on one machine and not at all between two, which is precisely
     the bug you do not want to find at the table. */
  var interopId = null, manifestRead = false;
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'manifest.json', false);      /* sync: settled before boot */
    xhr.send(null);
    if (xhr.status >= 200 && xhr.status < 400) {
      var m = JSON.parse(xhr.responseText);
      interopId = m && m.api && m.api.interop && m.api.interop.id || null;
      manifestRead = true;
    }
  } catch (e) { /* served from somewhere without it; do not block development */ }

  /* Build the nested result tree TaleSpire returns for a roll string. */
  function resultTreeFor(rollStr) {
    var terms = window.VT.dice.parse(rollStr);
    if (!terms) return { value: 0 };
    var operands = [];
    terms.forEach(function (t) {
      if (t.n) {
        var results = [];
        for (var i = 0; i < t.n; i++) results.push(1 + Math.floor(Math.random() * t.s));
        operands.push({ kind: 'd' + t.s, results: results, __sign: t.sign });
      } else {
        operands.push({ value: t.flat, __sign: t.sign });
      }
    });
    if (operands.length === 1 && operands[0].__sign > 0) return operands[0];
    /* TaleSpire nests as operations; mirror that with a single +/- chain. */
    return { operator: '+', operands: operands };
  }

  function evaluateNode(node) {
    if (node == null) return 0;
    if (node.operator) {
      return (node.operands || []).reduce(function (sum, o) {
        var v = evaluateNode(o);
        return sum + ((o.__sign != null ? o.__sign : 1) < 0 ? -v : v);
      }, 0);
    }
    if (node.results) return node.results.reduce(function (a, b) { return a + b; }, 0);
    if (node.value != null) return node.value;
    return 0;
  }

  function installTSShim() {
    if (window.TS && window.TS.__real !== false) { /* fall through and replace */ }
    var store = {
      campaign: 'vtactics.ts-shim.campaign',
      global: 'vtactics.ts-shim.global'
    };
    function blobApi(key) {
      return {
        getBlob: function () { return Promise.resolve(localStorage.getItem(key) || ''); },
        setBlob: function (s) { localStorage.setItem(key, s); return Promise.resolve(); },
        deleteBlob: function () { localStorage.removeItem(key); return Promise.resolve(); }
      };
    }

    var TS = {
      __shim: true,
      debug: { log: function (m) { console.log('[TS.debug]', m); return Promise.resolve(); } },

      localStorage: { campaign: blobApi(store.campaign), global: blobApi(store.global) },

      dice: {
        isValidRollString: function (s) {
          return Promise.resolve(!window.VT.dice.roll(s).invalid);
        },
        makeRollDescriptors: function (s) {
          return Promise.resolve([{ name: 'Roll', roll: s }]);
        },
        evaluateDiceResultsGroup: function (group) {
          return Promise.resolve(evaluateNode(group && group.result));
        },
        sendDiceResult: function (groups, rollId) {
          console.log('[TS.dice.sendDiceResult]', rollId, groups.map(function (g) {
            return g.name + ' = ' + evaluateNode(g.result);
          }));
          return Promise.resolve(rollId);
        },
        putDiceInTray: function (descriptors, quiet) {
          var rollId = uid('roll');
          var groups = descriptors.map(function (d) {
            return { name: d.name, result: resultTreeFor(d.roll) };
          });
          /* Real TaleSpire waits for the player to throw the dice; emulate the
             asynchronous return so timing bugs surface in development too. */
          setTimeout(function () {
            if (typeof window.onRollResults === 'function') {
              window.onRollResults({
                kind: 'rollResults',
                payload: {
                  rollId: rollId, clientId: 'shim-client',
                  resultsGroups: groups, gmOnly: false, quiet: !!quiet
                }
              });
            }
          }, 260);
          return Promise.resolve(rollId);
        }
      },

      chat: {
        send: function (msg) { console.log('[TS.chat.send]', msg); return Promise.resolve(); },
        multiSend: function (msg) { console.log('[TS.chat.multiSend]', msg); return Promise.resolve(); },
        sendAsCreature: function (msg) { console.log('[TS.chat.sendAsCreature]', msg); return Promise.resolve(); }
      },

      players: {
        whoAmI: function () { return Promise.resolve({ id: 'shim-player', name: 'Dev Player' }); },
        isMe: function (id) { return Promise.resolve(id === 'shim-player'); },
        getPlayersInThisBoard: function () {
          return Promise.resolve([{ id: 'shim-player', name: 'Dev Player' }]);
        },
        getMoreInfo: function (ids) {
          return Promise.resolve((ids || []).map(function (i) {
            return { id: i.id || i, name: 'Dev Player' };
          }));
        }
      },

      /* Cross-client sync. Real broadcasts come back to the sender too, so the
         echo here is faithful - it is exactly the case that needs filtering. */
      sync: {
        /* TaleSpire refuses anything over 500 characters and drops the whole
           message. The shim used to accept any length, which is exactly why a
           real 3,853-character shop broadcast reached the table before anyone
           noticed it could not fit. Fail here the way the real thing does. */
        send: function (str, target) {
          if (manifestRead && !interopId) {
            var noId = new Error('symbioteManifestMissingInteropId');
            console.warn('[TS.sync.send REJECTED] no api.interop.id in manifest.json');
            return Promise.reject(noId);
          }
          if (typeof str === 'string' && str.length > 500) {
            var err = new Error('string too long: max length is 500, length was ' + str.length);
            console.warn('[TS.sync.send REJECTED]', err.message);
            return Promise.reject(err);
          }
          setTimeout(function () {
            if (typeof window.onSyncMessage === 'function') {
              window.onSyncMessage({
                kind: 'syncMessageReceived',
                payload: { str: str, fromClient: { id: 'shim-client' } }
              });
            }
          }, 10);
          console.log('[TS.sync.send ->' + target + ']', str.slice(0, 160));
          return Promise.resolve();
        },
        multiSend: function (str, ids) { return TS.sync.send(str, ids.join(',')); },
        getClientsConnected: function () { return Promise.resolve([{ id: 'shim-client' }]); }
      },

      clients: {
        whoAmI: function () { return Promise.resolve({ id: 'shim-client' }); },
        isMe: function (id) { return Promise.resolve(id === 'shim-client'); },
        getClientsInThisBoard: function () {
          return Promise.resolve([{ id: 'shim-client' }, { id: 'shim-other' }]);
        },
        getMoreInfo: function (ids) {
          return Promise.resolve((ids || []).map(function (i) {
            var id = i.id || i;
            return {
              id: id,
              /* ?mode=gm on the URL runs the dev harness as the GM. Outside
                 TaleSpire there is no real role to read, and testing the GM
                 half otherwise means editing this file. */
              clientMode: id === 'shim-client'
                ? (window.__shimMode ||
                   (/[?&]mode=gm/.test(location.search) ? 'gm' : 'player'))
                : 'player',
              player: { id: 'p_' + id, name: id === 'shim-client' ? 'Dev Player' : 'Other Player' }
            };
          }));
        }
      },

      creatures: {
        getSelectedCreatures: function () { return Promise.resolve([{ id: 'shim-creature' }]); },
        getMoreInfo: function (ids) {
          return Promise.resolve((ids || []).map(function (i) {
            return {
              id: i.id || i, name: 'Selected Mini',
              hp: { name: 'HP', value: 24, max: 32 }, stats: []
            };
          }));
        }
      },

      symbiote: {
        getIfThisSymbioteIsVisible: function () { return Promise.resolve(true); },
        sendNotification: function (t, b) { console.log('[TS.notify]', t, b); return Promise.resolve(); }
      }
    };

    window.TS = TS;

    /* Development handles: flip client role, and inject a message as if it came
       from another player's client so the GM view can be exercised solo. */
    window.__shimSetMode = function (mode) { window.__shimMode = mode; };
    window.__shimInject = function (fromId, obj) {
      if (typeof window.onSyncMessage === 'function') {
        window.onSyncMessage({
          kind: 'syncMessageReceived',
          payload: { str: JSON.stringify(obj), fromClient: { id: fromId } }
        });
      }
    };
    return TS;
  }

  window.installTSShim = installTSShim;
})();

/* ===== sheetview.js ===== */
/* The Forge :: sheetview.js
   Hosting the symbiote's character sheet inside the Forge.

   The sheet in tale-sheet/sheet.js is around two thousand lines of rolling,
   resting, levelling, spell slots, death saves, attunement and wild shape.
   Rebuilding that here would mean two implementations of the same rules
   drifting apart, and the second one always being the stale one - so this runs
   the real thing rather than a copy of it.

   Three things have to be arranged for it to work outside TaleSpire:

     1. The DOM it binds to. sheet.js looks up #view and #toast at boot, so the
        skeleton lives in the page from the start, hidden, rather than being
        built when the tab is opened - it boots on a timer and must not find an
        empty document.

     2. Storage. In the symbiote a character lives in TaleSpire's campaign
        storage. Here it should be the Forge's own roster, so the adapter below
        maps the sheet's blob onto VT.store.campaign.roster. Pick a character in
        the Roster tab, open the Sheet tab, and it is the same object.

     3. Dice. The development shim already rolls for real and returns results
        through onRollResults - it just has nowhere to show them. The roll log
        here listens in on that and prints what was thrown, which is what makes
        the sheet usable away from a dice tray. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, el = U.el;

  var log = [];          /* most recent first */

  /* ---- storage: the sheet's blob <-> the Forge's roster ------------------ */

  function roster() {
    if (!VT.store.campaign) {
      VT.store.init();
      if (!VT.store.campaign) VT.store.campaign = VT.store.blank('Sword Coast Skirmish');
    }
    VT.store.campaign.roster = VT.store.campaign.roster || [];
    return VT.store.campaign.roster;
  }

  var activeId = null;

  function campaignAdapter() {
    return {
      getBlob: function () {
        var list = roster();
        /* The remembered selection can point at somebody who has since been
           deleted on the Roster tab. Fall back rather than handing the sheet an
           id it cannot find. */
        var stillThere = activeId && list.some(function (c) { return c.id === activeId; });
        return Promise.resolve(JSON.stringify({
          v: 1,
          chars: list,
          activeId: stillThere ? activeId : ((list[0] && list[0].id) || null),
          postToChat: false,
          shareSheet: false
        }));
      },
      setBlob: function (raw) {
        var d;
        try { d = JSON.parse(raw || '{}'); } catch (e) { return Promise.resolve(); }
        if (Array.isArray(d.chars)) {
          /* Replace the roster contents in place. The array identity matters:
             the Roster tab holds a reference to it, and swapping the array
             would leave that tab editing a list nothing else can see. */
          var list = roster();
          list.length = 0;
          d.chars.forEach(function (c) { list.push(c); });
        }
        if (d.activeId) activeId = d.activeId;
        VT.store.autosave();
        return Promise.resolve();
      },
      deleteBlob: function () { return Promise.resolve(); }
    };
  }

  /* ---- the roll log ------------------------------------------------------ */

  /* The individual die faces, for showing what was actually thrown. The total
     comes from the shim's own evaluator rather than being re-added here, so a
     roll reads the same way it would in TaleSpire. */
  function faces(node, out) {
    out = out || [];
    if (!node) return out;
    if (node.results) out.push(node.results.slice());
    (node.operands || []).forEach(function (o) { faces(o, out); });
    return out;
  }

  function noteRoll(group, total) {
    log.unshift({
      name: group.name || 'Roll',
      total: total,
      dice: faces(group.result).reduce(function (a, b) { return a.concat(b); }, []),
      at: Date.now()
    });
    if (log.length > 40) log.length = 40;
    drawLog();
  }

  /* The log is a tray that shows up when dice are thrown and gets out of the
     way otherwise. Reading your own sheet is most of what you do on this tab,
     and a permanent panel for something that is empty most of the time was
     taking rail space to say nothing. */
  var tray = null, trayBody = null, minimised = false;

  function buildTray() {
    if (tray) return tray;
    trayBody = el('div', { class: 'tray-body' });
    var title = el('span', { class: 'tray-title' }, ['Dice']);
    var min = el('button', { class: 'tray-btn', title: 'Minimise' }, ['\u2013']);
    var close = el('button', { class: 'tray-btn', title: 'Clear and close' }, ['\u00d7']);

    min.addEventListener('click', function () {
      minimised = !minimised;
      tray.classList.toggle('min', minimised);
      min.textContent = minimised ? '\u25b2' : '\u2013';
      min.title = minimised ? 'Show the last rolls' : 'Minimise';
    });
    close.addEventListener('click', function () {
      log.length = 0;
      tray.classList.add('gone');
    });

    tray = el('div', { class: 'dicetray gone' }, [
      el('div', { class: 'tray-head' }, [title, min, close]),
      trayBody
    ]);
    document.body.appendChild(tray);
    return tray;
  }

  function drawLog() {
    buildTray();
    if (!log.length) { tray.classList.add('gone'); return; }
    tray.classList.remove('gone');
    /* A new roll while minimised is still worth a glance, so the newest line
       shows in the header strip rather than forcing the tray back open. */
    tray.querySelector('.tray-title').textContent = minimised
      ? log[0].name + ' \u2192 ' + (log[0].total == null ? '?' : log[0].total)
      : 'Dice';

    U.clear(trayBody);
    log.slice(0, 12).forEach(function (r, i) {
      trayBody.appendChild(el('div', { class: 'rolline' + (i ? '' : ' fresh') }, [
        el('span', { class: 'rn' }, [r.name]),
        el('span', { class: 'rd' }, [r.dice.length ? '[' + r.dice.join(', ') + ']' : '']),
        el('span', { class: 'rt' }, [r.total == null ? '?' : String(r.total)])
      ]));
    });
  }

  /* Chain the sheet's own results handler rather than replacing it: it uses
     those results for death saves and hit dice, and losing them would break
     the sheet in ways that only show up mid-fight. */
  function watchRolls() {
    var mine = window.onRollResults;
    if (!mine || mine.__forgeWatched) return;
    var wrapped = function (evt) {
      try { mine.apply(window, arguments); } catch (e) { /* the sheet's problem */ }
      var p = evt && evt.payload;
      if (!p || !p.resultsGroups) return;
      p.resultsGroups.forEach(function (g) {
        window.TS.dice.evaluateDiceResultsGroup(g)
          .then(function (total) { noteRoll(g, total); })
          .catch(function () { noteRoll(g, null); });
      });
    };
    wrapped.__forgeWatched = true;
    window.onRollResults = wrapped;
  }

  /* ---- keeping the sheet's stylesheet to itself -------------------------- */

  /* sheet.css was written for a page it owns: it sets :root variables, sizes
     html and body, styles #app to fill the viewport, and claims plain names
     like .card, .btn and .row. The Forge uses all of those too, so loading it
     as-is rearranges the host page - the first attempt at this put the Forge's
     own toolbar through a hedge.

     The fix has to keep ONE copy of that stylesheet. tale-sheet is what the
     table actually runs, so it cannot be edited to suit an embedder, and a
     hand-scoped duplicate would drift the first time either changed. So the
     rules are rewritten in place at load: every selector is prefixed with
     #sheetHost, and the three that mean "the whole page" are re-pointed at the
     host element instead. Same file, scoped automatically, nothing to keep in
     step by hand. */
  var HOST = '#sheetHost';
  var WHOLE_PAGE = { ':root': 1, 'html': 1, 'body': 1, '#app': 1 };

  function scopeSelector(sel) {
    return sel.split(',').map(function (part) {
      var t = part.trim();
      if (!t) return t;
      if (WHOLE_PAGE[t]) return HOST;
      /* "*" means everything in the sheet, host included - not the host alone,
         which would drop box-sizing from every element inside it. */
      if (t === '*') return HOST + ', ' + HOST + ' *';
      /* already ours, or targeting the host itself */
      if (t.indexOf(HOST) === 0) return t;
      return HOST + ' ' + t;
    }).join(', ');
  }

  /* sheet.css is sized for a phone-width panel in TaleSpire: 11px labels, 9px
     stat captions, buttons a thumb can just about hit. On a monitor that reads
     as a postage stamp in the middle of an empty page.

     Scaling happens here, in the same pass that scopes the selectors, rather
     than as a parallel set of overrides in sheet-embed.css. An override list
     would have to name every size in the file and would silently fall out of
     step the first time one changed; multiplying the values as they go past
     cannot. Only lengths that control apparent size are touched - borders and
     radii keep their pixel values, because a 1px rule scaled to 1.3px is just
     a blurry 1px rule. */
  var SCALE = 1.3;
  /* "font" is in the list because the browser re-serialises font-size,
     font-family and line-height back into the shorthand, so a rule that was
     written as font-size comes back out as "font: 13px/1.45 ..." and would
     escape a font-size-only match. The only px in that shorthand is the size. */
  var SCALED = /^(font|font-size|padding|padding-top|padding-right|padding-bottom|padding-left|gap|row-gap|column-gap|min-width|min-height|width|height)$/;

  /* Scale the rule's own text. Walking style[i] instead looks tidier and is
     wrong: iterating a declaration block yields the LONGHANDS of any shorthand,
     and a shorthand written with a var() - "background: var(--panel)",
     "border: 1px solid var(--line)" - cannot be decomposed before it is
     computed, so every longhand comes back as the empty string. Doing that
     silently stripped the background and border off every card. */
  function scaleDecls(style) {
    return style.cssText.replace(/(^|;)\s*([-a-zA-Z]+)\s*:\s*([^;]+)/g,
      function (whole, lead, prop, val) {
        if (!SCALED.test(prop.toLowerCase()) || val.indexOf('px') < 0) return whole;
        return lead + prop + ': ' + val.replace(/(-?[\d.]+)px/g, function (_, n) {
          return (Math.round(parseFloat(n) * SCALE * 100) / 100) + 'px';
        });
      });
  }

  function scopeRules(rules, out) {
    Array.prototype.forEach.call(rules, function (r) {
      if (r.type === 1) {                      /* style rule */
        out.push(scopeSelector(r.selectorText) + '{' + scaleDecls(r.style) + '}');
      } else if (r.type === 4) {               /* @media */
        var inner = [];
        scopeRules(r.cssRules, inner);
        out.push('@media ' + r.conditionText + '{' + inner.join('') + '}');
      } else if (r.type === 7 || r.type === 5) {
        out.push(r.cssText);                   /* @keyframes / @font-face */
      }
    });
    return out;
  }

  function scopeSheetCss() {
    var link = Array.prototype.slice.call(document.querySelectorAll('link[rel=stylesheet]'))
      .find(function (l) { return /tale-sheet\/sheet\.css$/.test(l.getAttribute('href') || ''); });
    if (!link || !link.sheet) return false;
    var rules;
    try { rules = link.sheet.cssRules; } catch (e) { return false; }
    if (!rules) return false;

    var css = scopeRules(rules, []).join('\n');
    var style = document.createElement('style');
    style.id = 'sheetScoped';
    style.textContent = css;
    document.head.appendChild(style);
    link.disabled = true;                      /* the unscoped original is done */
    return true;
  }

  /* The stylesheet may not have parsed yet when this file runs. Try now, and
     fall back to load/next-tick rather than leaving the host page restyled. */
  function ensureScoped() {
    if (document.getElementById('sheetScoped')) return;
    if (scopeSheetCss()) return;
    var tries = 0;
    var iv = setInterval(function () {
      if (scopeSheetCss() || ++tries > 40) clearInterval(iv);
    }, 25);
  }
  ensureScoped();

  /* ---- boot -------------------------------------------------------------- */

  /* sheet.js installs the shim itself during boot. Wrap that call so the
     storage adapter is in place before the sheet reads a single character, and
     the roll watcher goes on immediately after the sheet has registered its
     own handler. */
  var realInstall = window.installTSShim;
  window.installTSShim = function () {
    if (typeof realInstall === 'function') realInstall();
    if (window.TS && window.TS.localStorage) {
      window.TS.localStorage.campaign = campaignAdapter();
    }
    setTimeout(watchRolls, 0);
  };

  /* ---- grouping the sheet into sections ---------------------------------- */

  /* The sheet is one long strip, which is right in a phone-width panel and
     tiring on a monitor. The first attempt at fixing that set `columns: 2`,
     which was worse: multi-column flow runs down the first column and back up
     to the top of the second, so reading it means scrolling down, up, and down
     again for one character.

     Sections instead. The cards keep their order and their single column - only
     some of them are on screen at a time, which is the part that was actually
     tiring. Nothing here restructures the sheet's DOM: each card is tagged with
     an attribute and CSS hides the rest, so sheet.js can re-render whenever it
     likes and this just runs again. */
  var GROUPS = [
    { key: 'play',  label: 'Play',
      match: /^(abilities|skills|tools|actions|custom roll|conditions|defences|wild shape|companion|resources)$|^$/i },
    /* Spells are their own section rather than a general "magic" one: the
       slots now sit inside the spell list, so there is nothing else left for a
       magic section to hold. */
    { key: 'spells', label: 'Spells',
      match: /^(spells|spell slots|pact magic|summons)/i },
    { key: 'gear',  label: 'Gear',
      match: /^(coin|inventory|equipment|attunement|collect from)/i },
    { key: 'about', label: 'Character',
      match: /^(features|choices|details|rest|notes|ability score|proficiencies)/i }
  ];

  var activeGroup = 'play';
  var groupBar = null;
  var applying = false;

  /* Cards title themselves with an h3; the collapsible ones - Skills,
     Features, Choices - use a summary instead. Read whichever is there, and
     drop any trailing count so "Features - 13" still matches "features". */
  function headingOf(card) {
    var h = card.querySelector('h3') || card.querySelector('summary');
    if (!h) return '';
    return h.textContent.trim().split(/\s+[-—·]\s+/)[0].trim();
  }

  function groupFor(card, index) {
    /* The first card is the character themself - name, AC, HP, the hit point
       bar - and has no heading. It belongs with Play whatever else happens. */
    if (index === 0) return 'play';
    /* An assumed form or a companion is titled with the creature's name, which
       no heading rule can match - "Brown Bear" and "Beast of the Land" are not
       words this file can know. They carry a class instead, which is stable. */
    if (card.classList && card.classList.contains('summoned')) return 'spells';
    if (card.classList && card.classList.contains('wildshape')) return 'play';
    var h = headingOf(card);
    for (var i = 0; i < GROUPS.length; i++) {
      if (GROUPS[i].match.test(h)) return GROUPS[i].key;
    }
    return 'about';                 /* anything unrecognised is reference material */
  }

  function onSheetTab() {
    var on = document.querySelector('#sheetHost .tab.on');
    return !on || on.dataset.tab === 'sheet';
  }

  function applyGroups() {
    var view = document.getElementById('view');
    if (!view || applying) return;
    applying = true;

    var cards = Array.prototype.slice.call(view.children);
    var counts = {};
    cards.forEach(function (c, i) {
      var g = groupFor(c, i);
      c.setAttribute('data-group', g);
      counts[g] = (counts[g] || 0) + 1;
    });

    /* Edit and Build are sheet.js's own tabs and are not carved up. */
    var show = onSheetTab() && cards.length > 3;
    view.setAttribute('data-grp', show ? activeGroup : 'all');
    if (groupBar) {
      groupBar.classList.toggle('hidden', !show);
      U.clear(groupBar);
      if (show) {
        GROUPS.forEach(function (g) {
          if (!counts[g.key]) return;
          groupBar.appendChild(el('button', {
            class: 'sub-tab' + (g.key === activeGroup ? ' on' : ''),
            onClick: function () {
              activeGroup = g.key;
              applyGroups();
            }
          }, [g.label]));
        });
        /* If the section we were on has nothing in it for this character, fall
           back rather than showing an empty page. */
        if (!counts[activeGroup]) {
          var first = GROUPS.filter(function (g) { return counts[g.key]; })[0];
          if (first) { activeGroup = first.key; view.setAttribute('data-grp', activeGroup); }
        }
      }
    }
    applying = false;
  }

  /* sheet.js rebuilds #view on every change, so re-tag whenever it does. */
  function watchSheet() {
    var view = document.getElementById('view');
    if (!view || view.__grouped) return;
    view.__grouped = true;
    new MutationObserver(function () {
      if (!applying) applyGroups();
    }).observe(view, { childList: true });
  }

  /* ---- the Forge's Sheet tab --------------------------------------------- */

  function render(work, side) {
    var host = document.getElementById('sheetHost');
    if (!host) {
      work.appendChild(el('div', { class: 'warn-box' }, ['The sheet failed to load.']));
      return;
    }

    /* The skeleton lives in the page permanently so sheet.js can find it on
       boot; showing the tab is a matter of moving it into view. */
    host.classList.remove('hidden');
    work.appendChild(host);

    /* the section bar, inserted once, just under the sheet's own tabs */
    if (!groupBar) {
      groupBar = el('nav', { id: 'sheetGroups' });
      var tabs = host.querySelector('#tabs');
      if (tabs && tabs.parentNode) tabs.parentNode.insertBefore(groupBar, tabs.nextSibling);
    }
    watchSheet();

    /* The sheet's own tabs change what is in #view without replacing it, so
       re-evaluate the sections when one is clicked. */
    Array.prototype.slice.call(host.querySelectorAll('#tabs .tab')).forEach(function (t) {
      if (t.__grouped) return;
      t.__grouped = true;
      t.addEventListener('click', function () { setTimeout(applyGroups, 0); });
    });

    /* Re-read the roster every time the tab opens. The sheet loads its state
       once at boot, which is right in a symbiote that owns its storage and
       wrong here - a character built on the Character tab a moment ago has to
       show up without a page reload. */
    if (VT.sheetApp) VT.sheetApp.reload();
    setTimeout(applyGroups, 60);

    var list = roster();
    if (!list.length) {
      side.appendChild(el('div', { class: 'sec' }, [
        el('div', { class: 'sec-h' }, ['Nobody yet']),
        el('div', { class: 'sec-b' }, [
          el('p', { class: 'tiny' }, [
            'Build a character on the Character tab, or import one, and it ' +
            'appears here with a full sheet.'
          ])
        ])
      ]));
      return;
    }

    /* Nothing goes in the rail, and the dice tray floats, so give the sheet the
       whole width rather than leaving an empty panel beside it. */
    document.getElementById('bmain').classList.add('no-rail');
    buildTray();
    drawLog();
  }

  /* Called when the Forge leaves the Sheet tab: park the skeleton back out of
     the way so the next render does not inherit it. */
  function hide() {
    var host = document.getElementById('sheetHost');
    if (!host) return;
    host.classList.add('hidden');
    document.body.appendChild(host);
    document.getElementById('bmain').classList.remove('no-rail');
    if (tray) tray.classList.add('gone');
  }

  VT.sheetView = { render: render, hide: hide, roster: roster };
})();

/* ===== ../tale-sheet/sheet.js ===== */
/* Virtual Tactics :: TaleSpire symbiote.

   A 5e character sheet that lives inside TaleSpire. It builds characters from
   your own 5etools data, keeps them in the campaign's symbiote storage, and
   rolls everything through the real dice tray so the whole table sees the dice
   land - rather than reporting numbers the sheet made up on its own.

   Boot order matters: TaleSpire injects the TS object after DOMContentLoaded
   and then fires `hasInitialized`. Nothing may touch TS before that. If the
   event never arrives we are in a normal browser, so we install the dev shim
   and carry on. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, el = U.el, SRD = VT.srd, CV = VT.convert, FT = VT.fivetools;
  var SHOPS = VT.shops;                 // shared loot-code format with Tale Shop

  var SKILLS = VT.tags.SKILL_ABILITY;   // 18 skills -> governing ability
  var STANDARD_ARRAY = [15, 14, 13, 12, 10, 8];
  var POINT_COST = { 8: 0, 9: 1, 10: 2, 11: 3, 12: 4, 13: 5, 14: 7, 15: 9 };

  /* Which slot each spell is currently set to be cast at, by spell name. */
  var S = {
    castAt: {}, castPact: {},
    tab: 'sheet',
    chars: [], activeId: null,
    adv: 0, crit: false,
    hpAmount: 5,          // survives re-render: you often heal what you just took
    coinEntry: '10 gp',
    lootPaste: '',        // ditto: a pasted code must outlive an interrupting render
    tracked: {},
    linked: null,          // { id, name, hp:{value,max} }
    postToChat: false,
    live: false,           // true when the real TaleSpire API is present
    build: null,
    isGM: false, myClientId: null,
    table: {},             // clientId -> { sheet, name, at }  (GM view)
    shareSheet: true       // players mirror their sheet to the table
  };

  var view, toastHost;

  /* ==== boot ============================================================= */
  var booted = false;

  window.onStateChangeEvent = function (msg) {
    if (msg && msg.kind === 'hasInitialized' && !booted) boot(true);
  };

  window.onCreatureStateChange = function (evt) {
    if (!evt || !S.linked) return;
    var p = evt.payload || {};
    if (evt.kind === 'creatureHpChanged' && p.id === S.linked.id) {
      S.linked.hp = p.hp;
      if (S.tab === 'sheet') render();
    } else if (evt.kind === 'creatureRemoved' && p.id === S.linked.id) {
      S.linked = null;
      /* Only the Sheet tab shows the linked mini, so only it needs redrawing.
         Redrawing the Edit tab for this would interrupt whatever is being
         typed there to change nothing on screen. */
      if (S.tab === 'sheet') render();
    }
  };

  function boot(live) {
    if (booted) return;
    booted = true;
    S.live = !!live;
    view = document.getElementById('view');
    toastHost = document.getElementById('toast');

    if (!live && typeof window.installTSShim === 'function') window.installTSShim();

    wireChrome();
    /* Homebrew imported into this symbiote lives in its own storage and has to
       be put back into the compendium before anything reads it. Loading it
       first means the cache restore below merges it in one pass. */
    try { VT.homebrew.load(); VT.homebrew.apply(); } catch (e) {}
    Promise.all([
      loadState(),
      FT.loadCache().catch(function () { return null; }),
      initClientRole()
    ]).then(function () {
      reconcileAll();
      render();
      autoConnectData();
      if (!live) toast('Running outside TaleSpire — dice are simulated locally.', 'err');
    });
  }

  /* Reconnect to the data with no dialog, in order of least friction:
       1. the cache is already warm       -> nothing to do
       2. a remembered folder handle      -> reopen it silently
       3. a data/ folder shipped alongside -> read it in place
     Only if all three miss does the Setup tab ask for anything. */
  function autoConnectData() {
    /* Homebrew shipped beside this symbiote loads whatever happens - it does
       not depend on a data source being connected, and needs no picker, so it
       is the one route that works identically on every OS and browser. */
    FT.loadBundledHomebrew().then(function (r) {
      if (r && r.records) {
        TS.debug.log('bundled homebrew: ' + r.records + ' records from ' + r.files + ' file(s)');
        render();
      }
    }).catch(function () {});

    if (FT.loaded) return;
    FT.reconnectDirectory().then(function (r) {
      if (r && r.ok) return quietLoad('remembered folder “' + r.name + '”');
      var base = new URL('.', window.location.href).href.replace(/\/$/, '');
      FT.useUrl(base);
      return FT.loadAll(function () {}).then(function (stats) {
        if (stats.records) {
          FT.saveCache();
          reconcileAll();
          toast('Loaded ' + stats.records + ' records from the bundled data folder', 'ok');
          render();
        }
      }).catch(function () { /* nothing bundled; Setup will offer the options */ });
    }).catch(function () {});
  }

  function quietLoad(what) {
    return FT.loadAll(function () {}).then(function (stats) {
      if (!stats.records) return;
      FT.saveCache();
      reconcileAll();
      toast('Loaded ' + stats.records + ' records from your ' + what, 'ok');
      render();
    }).catch(function () {});
  }

  /* Anything bought before there was data to resolve it against is a bare name
     in a bag. Now that there is data, turn those back into items. */
  function reconcileAll() {
    if (!VT.gear || !VT.gear.reconcile) return 0;
    var n = 0;
    S.chars.forEach(function (c) { n += VT.gear.reconcile(c); });
    if (n) save();
    return n;
  }

  /* In a browser `hasInitialized` never comes; give TaleSpire a moment first. */
  setTimeout(function () { if (!booted) boot(false); }, 1800);

  /* ==== persistence ====================================================== */
  function loadState() {
    return TS.localStorage.campaign.getBlob().then(function (raw) {
      var d = {};
      try { d = JSON.parse(raw || '{}'); } catch (e) { d = {}; }
      S.chars = Array.isArray(d.chars) ? d.chars : [];
      S.activeId = d.activeId || (S.chars[0] && S.chars[0].id) || null;
      S.postToChat = !!d.postToChat;
      /* Persist the repair, otherwise the bad expression comes back next load. */
      if (S.chars.map(repairActions).some(Boolean)) save();
      S.chars.forEach(ensurePlayFields);
      S.linked = d.linked || null;
      if (d.shareSheet != null) S.shareSheet = !!d.shareSheet;
    }).catch(function (e) {
      TS.debug.log('load failed: ' + (e && e.cause));
    });
  }

  /* Repair dice expressions on load. "1d6+-1" is arithmetically obvious but
     not valid notation, and older saves (or a slip in the Edit tab) can carry
     one; left alone it would silently roll nothing. */
  /* Characters imported as flat statblocks, or saved before a field existed,
     need the play-side values filled in before the sheet touches them. */
  function ensurePlayFields(a) {
    if (!a.coins) a.coins = VT.coin.emptyPurse();
    if (!Array.isArray(a.inventory)) a.inventory = [];
    if (!a.hitDie) a.hitDie = 8;
    if (a.hitDiceMax == null) a.hitDiceMax = a.level || 1;
    if (a.hitDiceUsed == null) a.hitDiceUsed = 0;
    if (a.acBonus == null) a.acBonus = 0;
    if (!Array.isArray(a.features)) a.features = [];
    if (!Array.isArray(a.expertise)) a.expertise = [];
    if (!Array.isArray(a.resources)) a.resources = [];
    if (!a.slotsUsed) a.slotsUsed = {};
    if (a.expertiseSlots == null) a.expertiseSlots = 0;
    if (!a.skillBonus) a.skillBonus = {};
    /* Characters saved before proficiencies existed have no lists. Work them
       out from the build if the compendium can still resolve it; leave them
       absent if it cannot, since an absent list costs nothing and a guessed
       one costs the player their attack bonus. */
    if (VT.proficiency) { VT.proficiency.backfill(a); VT.proficiency.tidy(a); }
  }

  function repairActions(a) {
    var changed = false;
    (a.actions || []).forEach(function (act) {
      if (!act.dmg) return;
      var fixed = String(act.dmg).replace(/\+\s*-/g, '-').replace(/-\s*\+/g, '-').trim();
      if (fixed !== act.dmg) { act.dmg = fixed; changed = true; }
    });
    return changed;
  }

  var saveSoon = U.debounce(function () {
    var payload = JSON.stringify({
      v: 1, chars: S.chars, activeId: S.activeId,
      postToChat: S.postToChat, linked: S.linked, shareSheet: S.shareSheet
    });
    TS.localStorage.campaign.setBlob(payload).catch(function (e) {
      toast('Could not save: ' + (e && e.cause || e), 'err');
    });
  }, 400);

  function save() { saveSoon(); }

  /* ==== helpers ========================================================== */
  function active() {
    return S.chars.find(function (c) { return c.id === S.activeId; }) || null;
  }
  function toast(msg, cls) {
    if (!toastHost) return;
    var n = el('div', { class: 'toast-msg ' + (cls || ''), text: msg });
    toastHost.appendChild(n);
    setTimeout(function () { n.remove(); }, 4200);
  }
  function sign(n) { return (n >= 0 ? '+' : '') + n; }

  /* ==== rolling ========================================================== */
  /* Normal rolls go straight to the tray and TaleSpire publishes them.
     Advantage and disadvantage put two groups in quietly, then we evaluate both
     and publish only the winning one - the pattern the official dice roller
     example uses. */
  /* `disadvantage` is for a source the roll itself knows about - armour
     against Stealth, say - as opposed to the Adv/Dis buttons, which are the
     player's call. They combine the way the rules say: any advantage and any
     disadvantage cancel to a straight roll, however many of each there are. */
  function rollD20(label, mod, disadvantage) {
    var expr = '1d20' + (mod ? sign(mod) : '');
    var mode = S.adv;
    if (disadvantage) mode = mode > 0 ? 0 : -1;
    var name = label + (mode > 0 ? ' (Adv)' : mode < 0 ? ' (Dis)' : '');
    var descs = mode ? [{ name: name, roll: expr }, { name: name, roll: expr }]
                     : [{ name: name, roll: expr }];
    TS.dice.putDiceInTray(descs, !!mode).then(function (rollId) {
      S.tracked[rollId] = { mode: mode, label: name };
    }).catch(function (e) {
      toast('Roll failed: ' + (e && e.cause || e), 'err');
    });
  }

  /* Rolled in the tray like anything else; the result comes back through
     onRollResults and is recorded against the character. */
  function rollDeathSave() {
    var a = active();
    if (!a) return;
    TS.dice.putDiceInTray([{ name: 'Death save', roll: '1d20' }], true).then(function (rollId) {
      S.tracked[rollId] = { mode: 0, label: 'Death save', death: true };
    }).catch(function (e) { toast('Roll failed: ' + (e && e.cause || e), 'err'); });
  }

  function rollDamage(label, expr) {
    if (!expr || expr === '0') { toast('No damage on ' + label); return; }
    if (VT.dice.roll(expr).invalid) {
      toast('"' + expr + '" is not a valid roll — fix it in the Edit tab', 'err');
      return;
    }
    var use = S.crit ? VT.dice.critDice(expr) : expr;
    var name = label + (S.crit ? ' (Crit)' : '') + ' damage';
    TS.dice.putDiceInTray([{ name: name, roll: use }], false).then(function (rollId) {
      S.tracked[rollId] = { mode: 0, label: name };
      if (S.crit) { S.crit = false; syncChrome(); }
    }).catch(function (e) { toast('Roll failed: ' + (e && e.cause || e), 'err'); });
  }

  /* A hit die is rolled in the tray like anything else; the healing is applied
     when the result comes back, so the table sees the die land. */
  function spendHitDie(a) {
    var left = Math.max(0, (a.hitDiceMax || a.level) - (a.hitDiceUsed || 0));
    if (left <= 0) { toast('No hit dice left', 'err'); return; }
    var conMod = VT.actor.abilityMod(a, 'con');
    var expr = '1d' + (a.hitDie || 8) + (conMod ? sign(conMod) : '');
    TS.dice.putDiceInTray([{ name: a.name + ' hit die', roll: expr }], false).then(function (rollId) {
      S.tracked[rollId] = { mode: 0, label: 'Hit die', heal: true };
      a.hitDiceUsed = (a.hitDiceUsed || 0) + 1;
      save(); render();
    }).catch(function (e) { toast('Roll failed: ' + (e && e.cause || e), 'err'); });
  }

  function rollRaw(label, expr) {
    if (VT.dice.roll(expr).invalid) {
      toast('"' + expr + '" is not a valid roll', 'err');
      return;
    }
    TS.dice.putDiceInTray([{ name: label, roll: expr }], false).then(function (rollId) {
      S.tracked[rollId] = { mode: 0, label: label };
    }).catch(function (e) { toast('Roll failed: ' + (e && e.cause || e), 'err'); });
  }

  window.onRollResults = function (evt) {
    if (!evt) return;
    if (evt.kind === 'rollRemoved') { delete S.tracked[evt.payload.rollId]; return; }
    if (evt.kind !== 'rollResults') return;

    var roll = evt.payload;
    var meta = S.tracked[roll.rollId];
    if (!meta) return;                       // someone else's roll
    delete S.tracked[roll.rollId];

    var groups = roll.resultsGroups || [];
    if (!groups.length) return;

    Promise.all(groups.map(function (g) {
      return TS.dice.evaluateDiceResultsGroup(g).catch(function () { return null; });
    })).then(function (sums) {
      var valid = sums.map(function (s) { return typeof s === 'number' ? s : null; });
      var idx = 0;
      if (meta.mode) {
        for (var i = 1; i < valid.length; i++) {
          if (valid[i] == null) continue;
          if (valid[idx] == null ||
              (meta.mode > 0 ? valid[i] > valid[idx] : valid[i] < valid[idx])) idx = i;
        }
        TS.dice.sendDiceResult([groups[idx]], roll.rollId)
          .catch(function (e) { TS.debug.log('sendDiceResult failed: ' + (e && e.cause)); });
      }
      var total = valid[idx];
      /* A death save is judged on the FACE of the die, not the total - a
         natural 20 stands you up and a natural 1 costs two failures - so the
         raw result matters, not the sum. */
      if (total != null && meta.death) {
        var dying = active();
        if (dying) {
          var nat = natOf(groups[idx], total);
          var r = VT.actor.deathSave(dying, nat);
          var say = r.result === 'revived' ? dying.name + ' is up with 1 hit point!'
            : r.result === 'fumble' ? 'natural 1 — two failures'
            : r.result === 'success' ? 'success (' + dying.deathSaves.s + '/3)'
            : 'failure (' + dying.deathSaves.f + '/3)';
          if (r.outcome === 'dead') say += ' — three failures. Dead.';
          if (r.outcome === 'stable') say += ' — three successes. Stable.';
          toast('Death save ' + nat + ': ' + say,
                r.result === 'success' || r.result === 'revived' ? 'ok' : 'err');
          if (S.postToChat) postChat('death save ' + nat + ' — ' + say);
          save(); render();
        }
        return;
      }

      if (total != null && meta.heal) {
        var who = active();
        if (who) {
          var got = VT.actor.healBy(who, Math.max(0, total));
          toast('Hit die -> ' + total + ' - healed ' + got, 'ok');
          if (S.postToChat) postChat('spends a hit die and heals ' + got);
          save(); render();
        }
        return;
      }
      if (total != null) {
        var extra = meta.mode && valid.length > 1
          ? '  [' + valid.filter(function (v) { return v != null; }).join(' / ') + ']' : '';
        toast(meta.label + ' → ' + total + extra, 'ok');
        if (S.postToChat) postChat(meta.label + ': ' + total + extra);
      }
    });
  };

  /* The natural face of the d20 in a group. evaluateDiceResultsGroup gives the
     total including modifiers, but a death save cares about the die itself. */
  function natOf(group, fallback) {
    var found = null;
    (function walk(node) {
      if (!node || found != null) return;
      if (Array.isArray(node)) { node.forEach(walk); return; }
      if (typeof node !== 'object') return;
      if (node.value != null && (node.size === 20 || node.dieType === 'd20')) {
        found = node.value; return;
      }
      Object.keys(node).forEach(function (k) { walk(node[k]); });
    })(group);
    return found == null ? fallback : found;
  }

  function postChat(text) {
    var a = active();
    var msg = (a ? a.name + ' — ' : '') + text;
    TS.players.getPlayersInThisBoard().then(function (players) {
      var ids = (players || []).map(function (p) { return p.id; });
      if (!ids.length) return;
      TS.chat.multiSend(msg, ids).catch(function (e) {
        TS.debug.log('chat failed: ' + (e && e.cause));
      });
    }).catch(function () {});
  }

  /* ==== chrome (top bar + tabs) ========================================== */
  function wireChrome() {
    U.$$('#rollMode button').forEach(function (b) {
      b.onclick = function () { S.adv = parseInt(b.dataset.adv, 10); syncChrome(); };
    });
    document.getElementById('critToggle').onclick = function () {
      S.crit = !S.crit; syncChrome();
    };
    U.$$('.tab').forEach(function (t) {
      t.onclick = function () {
        S.tab = t.dataset.tab;
        U.$$('.tab').forEach(function (x) { x.classList.toggle('on', x === t); });
        render();
      };
    });
    document.getElementById('charPick').onchange = function (e) {
      S.activeId = e.target.value; VT.choiceUI.reset(); save(); render();
    };
  }

  function syncChrome() {
    U.$$('#rollMode button').forEach(function (b) {
      b.classList.toggle('on', parseInt(b.dataset.adv, 10) === S.adv);
    });
    document.getElementById('critToggle').classList.toggle('on', S.crit);
  }

  function syncCharPick() {
    var sel = document.getElementById('charPick');
    U.clear(sel);
    if (!S.chars.length) {
      sel.appendChild(el('option', { value: '' }, ['No characters yet']));
      return;
    }
    S.chars.forEach(function (c) {
      sel.appendChild(el('option', { value: c.id }, [c.name +
        (c.className ? ' — ' + c.className.replace(/\s*\(.*\)/, '') + ' ' + c.level : '')]));
    });
    sel.value = S.activeId || '';
  }

  /* ==== render ===========================================================
     render() throws the whole view away and builds it again, which is fine for
     a panel of buttons and fatal for a text field: anything that renders while
     someone is typing takes the focus and the caret with it, and the next
     keystroke lands nowhere. Inside TaleSpire the sheet is not the only thing
     that can cause a render - a mini's hit points changing, a client joining,
     the GM polling the table - so the Edit tab could lose focus after every
     single character, with nothing in the sheet's own code to blame.

     Rather than hunt every trigger in an environment we cannot step through,
     make the rebuild survivable: note which field had focus and where the
     caret was, and put both back afterwards. Fields opt in with `data-k`, a
     key stable across renders. Anything without one behaves as before. */
  /* Where the panel was scrolled to. `#view` is the scrolling element - the
     body is overflow:hidden - so a rebuild resets it to the top unless it is
     put back.

     This is the other half of the focus bug, and the more visible half. Click a
     skill pip 1800px down the Edit tab and the view is destroyed, rebuilt and
     returned to the top: the click worked, the state changed, and the row you
     were aiming at is now off screen. It reads as "only one click registers,
     and you have to leave the tab and come back", which is exactly what it
     feels like and not at all what is happening. */
  function scrollTop() { return view ? view.scrollTop : 0; }

  function restoreScroll(y) {
    if (!view || !y) return;
    view.scrollTop = y;
  }

  function focusedField() {
    var n = document.activeElement;
    if (!n || !view.contains(n) || !n.getAttribute) return null;
    var key = n.getAttribute('data-k');
    if (!key) return null;
    var keep = { key: key, start: null, end: null };
    /* selectionStart throws on inputs that do not carry a selection (number,
       range); the field still deserves its focus back. */
    try { keep.start = n.selectionStart; keep.end = n.selectionEnd; } catch (e) {}
    return keep;
  }

  function restoreField(keep) {
    if (!keep) return;
    var n = view.querySelector('[data-k="' + keep.key + '"]');
    if (!n) return;
    /* preventScroll matters: focusing a field near the bottom would otherwise
       drag the panel to it, undoing the scroll we just restored. */
    try { n.focus({ preventScroll: true }); } catch (e) { n.focus(); }
    if (keep.start == null) return;
    try { n.setSelectionRange(keep.start, keep.end); } catch (e) {}
  }

  function render() {
    var keep = focusedField();
    var y = scrollTop();
    syncChrome();
    syncCharPick();
    U.clear(view);
    ({ sheet: renderSheet, edit: renderEdit, party: renderParty,
       build: renderBuild, setup: renderSetup }[S.tab] || renderSheet)();
    restoreScroll(y);
    restoreField(keep);
    if (S.tab === 'sheet' || S.tab === 'edit') shareSoon();
  }

  /* ---- sheet ---- */
  function renderSheet() {
    var a = active();
    if (!a) {
      view.appendChild(el('div', { class: 'warn' }, [
        'No character yet. Use the Build tab to make one from your 5etools data, ' +
        'or Setup to import a JSON character exported from the Forge.'
      ]));
      return;
    }
    var prof = VT.actor.prof(a);

    /* identity + core stats */
    var who = el('div', { class: 'card' });
    var head = el('div', { class: 'who' }, [
      el('div', {}, [
        el('div', { class: 'nm' }, [a.name]),
        el('div', { class: 'sub' }, [
          [a.raceName, a.className, 'level ' + a.level].filter(Boolean).join(' · ')
        ])
      ])
    ]);
    try { head.insertBefore(VT.actor.portrait(a, 40, 50), head.firstChild); } catch (e) {}
    who.appendChild(head);
    var acWhy = VT.actor.acSources(a);
    who.appendChild(el('div', { class: 'bigstats' }, [
      stat('AC', VT.actor.effectiveAC(a)), stat('HP', a.hp + '/' + a.hpMax),
      stat('SPD', VT.actor.speedOf(a)), stat('PROF', sign(prof))
    ]));

    if (acWhy.length) {
      who.appendChild(el('div', { class: 'muted', style: { textAlign: 'center' } }, ['AC ' + acWhy.join(', ')]));
    }

    /* Where the numbers came from. A character built with ability points left
       unspent looks exactly like a correct one, only worse, so the arithmetic
       is worth showing rather than making someone reverse it by hand. */
    if (a.acWhy || a.hpWhy) {
      who.appendChild(el('div', { class: 'muted', style: { textAlign: 'center', fontSize: '10px' } }, [
        [a.acWhy ? 'AC = ' + a.acWhy : null,
         a.hpWhy ? 'HP = ' + a.hpWhy : null].filter(Boolean).join('   \u00b7   ')
      ]));
    }
    if (a.acWhyAlt) {
      who.appendChild(el('div', { class: 'muted', style: { textAlign: 'center', fontSize: '10px' } }, [
        a.acWhyAlt
      ]));
    }

    /* hp */
    var frac = U.clamp(a.hp / Math.max(1, a.hpMax), 0, 1);
    who.appendChild(el('div', { class: 'hpbar' }, [
      el('i', { style: { width: (frac * 100) + '%',
        background: frac > .5 ? 'linear-gradient(180deg,#8ec97f,#5d8f52)'
                  : frac > .25 ? 'linear-gradient(180deg,#e0c46a,#a8873c)'
                  : 'linear-gradient(180deg,#d97b74,#8f4640)' } }),
      el('span', {}, [a.hp + ' / ' + a.hpMax + (a.tempHp ? '  (+' + a.tempHp + ' temp)' : '')])
    ]));
    var amt = el('input', {
      type: 'text', inputmode: 'numeric', class: 'num', value: S.hpAmount,
      onInput: function (e) { S.hpAmount = Math.max(0, parseInt(e.target.value, 10) || 0); }
    });
    who.appendChild(el('div', { class: 'hpctl' }, [
      el('button', { class: 'btn sm danger', onClick: function () {
        var n = S.hpAmount;
        var r = VT.actor.applyDamage(a, n, null);
        toast(a.name + ' takes ' + r.taken + (r.downed ? ' and drops!' : ''), r.downed ? 'err' : '');
        if (S.postToChat) postChat('takes ' + r.taken + ' damage (' + a.hp + '/' + a.hpMax + ')');
        save(); render();
      } }, ['− Damage']),
      amt,
      el('button', { class: 'btn sm', onClick: function () {
        var n = S.hpAmount;
        var g = VT.actor.healBy(a, n);
        toast(a.name + ' recovers ' + g);
        if (S.postToChat) postChat('heals ' + g + ' (' + a.hp + '/' + a.hpMax + ')');
        save(); render();
      } }, ['+ Heal']),
      el('button', { class: 'btn sm', title: 'Temporary hit points', onClick: function () {
        a.tempHp = Math.max(a.tempHp || 0, S.hpAmount);
        save(); render();
      } }, ['Temp'])
    ]));
    if (S.linked) {
      who.appendChild(el('div', { class: 'muted', style: { marginTop: '6px' } }, [
        'Linked mini: ' + S.linked.name +
        (S.linked.hp ? ' — ' + S.linked.hp.value + '/' + S.linked.hp.max + ' on the board' : '')
      ]));
    }
    view.appendChild(who);

    /* abilities */
    var abils = el('div', { class: 'card' }, [el('h3', {}, ['Abilities'])]);
    var grid = el('div', { class: 'abil-grid' });
    SRD.ABILITIES.forEach(function (k) {
      var mod = VT.actor.abilityMod(a, k);
      var sv = VT.features.saveMod(a, k);
      /* Armour you were never trained in makes every Strength and Dexterity
         roll disadvantaged, checks and saves alike. */
      var hindered = VT.proficiency && VT.proficiency.hindersAbility(a, k);
      var hinderWhy = hindered ? ' · disadvantage, ' + a.armorUnskilled.why : '';
      grid.appendChild(el('div', { class: 'abil-cell' }, [
        el('span', { class: 'k' }, [SRD.ABILITY_NAME[k]]),
        el('span', { class: 'v' }, [String(a.abilities[k])]),
        el('span', { class: 'acts' }, [
          el('button', { title: 'Ability check' + hinderWhy, onClick: function () {
            rollD20(SRD.ABILITY_NAME[k] + ' check', mod, hindered); } }, [sign(mod)]),
          el('button', { title: 'Saving throw' + ((a.saveProf || []).indexOf(k) >= 0 ? ' (proficient)' : '') +
              (a.saveBonusAll ? ' +' + a.saveBonusAll + ' from your aura' : '') + hinderWhy,
            style: { color: (a.saveProf || []).indexOf(k) >= 0 ? 'var(--green)' : '' },
            onClick: function () { rollD20(SRD.ABILITY_NAME[k] + ' save', sv, hindered); } }, ['sv ' + sign(sv)])
        ])
      ]));
    });
    abils.appendChild(grid);
    abils.appendChild(el('div', { class: 'btnrow', style: { marginTop: '8px' } }, [
      el('button', { class: 'btn sm', onClick: function () {
        rollD20('Initiative', VT.actor.abilityMod(a, 'dex')); } }, ['Initiative']),
      el('button', { class: 'btn sm', onClick: function () {
        rollDeathSave(); } }, ['Death save'])
    ]));
    view.appendChild(abils);

    /* skills */
    a.skillProf = a.skillProf || [];
    var skillBox = el('div', {});
    a.expertise = a.expertise || [];
    Object.keys(SKILLS).sort().forEach(function (name) {
      var abil = SKILLS[name];
      var isProf = a.skillProf.indexOf(name) >= 0;
      var isExp = a.expertise.indexOf(name) >= 0;
      /* Expertise doubles proficiency, Jack of All Trades adds half to
         everything else — the feature engine owns that sum. */
      var mod = VT.features.skillMod(a, name);
      var src = VT.features.skillSource(a, name);
      var pip = el('span', {
        class: 'pip' + (isExp ? ' exp' : isProf ? ' on' : ''),
        title: isExp ? 'Expertise' : isProf ? 'Proficient' : 'Not proficient'
      });
      pip.onclick = function (e) {
        e.stopPropagation();
        if (isProf) a.skillProf = a.skillProf.filter(function (s) { return s !== name; });
        else a.skillProf.push(name);
        save(); render();
      };
      /* Heavy and medium armour give disadvantage on Stealth. Rolling that
         straight while wearing plate is quietly wrong, so the row says so and
         the roll takes it. */
      var stealthDis = name === 'stealth' && VT.gear && VT.gear.stealthDisadvantage(a);
      /* And every Strength or Dexterity skill suffers if the armour itself is
         beyond your training - a different penalty from the Stealth one, and
         they stack into the same single disadvantage. */
      var untrainedDis = VT.proficiency && VT.proficiency.hindersSkill(a, name);
      var dis = stealthDis || untrainedDis;
      skillBox.appendChild(el('div', { class: 'rollrow', onClick: function () {
        rollD20(U.cap(name), mod, dis); } }, [
        pip,
        el('span', { class: 'lbl' }, [U.cap(name),
          el('span', { class: 'sub' }, ['  ' + SRD.ABILITY_NAME[abil] +
            (stealthDis ? ' · disadvantage from ' + a.armorName : '') +
            (untrainedDis && !stealthDis ? ' · disadvantage, ' + a.armorUnskilled.why : '') +
            (src && src !== 'proficient' ? ' · ' + src : '')])]),
        el('span', { class: 'mod' }, [sign(mod)])
      ]));
    });
    view.appendChild(el('details', {}, [
      el('summary', {}, ['Skills']), el('div', {}, [skillBox])
    ]));

    /* Damage resistances, from whatever granted them. */
    var defCard = defencesPanel(a);
    if (defCard) view.appendChild(defCard);

    /* What you are carrying, and what of it you are wearing. */
    var gearCard = gearPanel(a);
    if (gearCard) view.appendChild(gearCard);

    /* Languages, armour and weapons. Tools have their own card below because
       they are the only one of the four you actually roll. */
    var profCard = proficiencyCard(a);
    if (profCard) view.appendChild(profCard);

    /* tool proficiencies - a thieves' tools check is a real thing to roll */
    if ((a.toolProf || []).length) {
      var toolCard = el('div', { class: 'card' }, [el('h3', {}, ['Tools'])]);
      var prof = VT.actor.prof(a);
      a.toolProf.forEach(function (t) {
        /* Which ability a tool check uses is the DM's call and changes with the
           task - picking a lock is Dexterity, spotting a forgery Intelligence -
           so offer the sensible default and let it be changed. */
        var abil = TOOL_ABILITY[String(t).toLowerCase()] || 'dex';
        var mod = VT.actor.abilityMod(a, abil) + prof;
        var sel = selectOf(SRD.ABILITIES.map(function (k) {
          return { value: k, label: SRD.ABILITY_NAME[k] };
        }), abil, function (v) { abil = v; });
        toolCard.appendChild(el('div', { class: 'rollrow' }, [
          el('span', { class: 'lbl' }, [U.cap(t), el('span', { class: 'sub' }, ['  proficient'])]),
          sel,
          el('button', { class: 'btn sm', onClick: function () {
            rollD20(U.cap(t) + ' (' + SRD.ABILITY_NAME[abil] + ')',
                    VT.actor.abilityMod(a, abil) + prof);
          } }, [sign(mod)])
        ]));
      });
      view.appendChild(toolCard);
    }

    /* Attacks and abilities. Spells used to be mixed in here, which meant a
       caster's attacks were buried under forty spells and the slots that pay
       for them were in a different card again. */
    var spells = (a.actions || []).filter(function (x) { return x.spellLevel != null; });
    var plain = (a.actions || []).filter(function (x) { return x.spellLevel == null; });

    var acts = el('div', { class: 'card' }, [el('h3', {}, ['Actions'])]);
    if (plain.length) {
      plain.forEach(function (act) { acts.appendChild(actionRow(a, act)); });
    } else {
      acts.appendChild(el('div', { class: 'muted' }, ['Nothing but spells.']));
    }

    /* What your gear lets you do. Kept in its own group because it comes and
       goes with what is worn and attuned, and because the charges belong to
       the item rather than to you. */
    var fromItems = a.itemActions || [];
    if (fromItems.length) {
      acts.appendChild(el('div', { class: 'spell-head' }, [
        el('span', { class: 'lbl' }, ['From your items'])
      ]));
      fromItems.forEach(function (act) {
        acts.appendChild(actionRow(a, act));
        var entry = (a.inventory || []).filter(function (e) { return e.name === act.fromItem; })[0];
        if (entry && entry.fx && entry.fx.charges) {
          acts.appendChild(chargeRow(a, entry, act));
        }
      });
    }
    view.appendChild(acts);

    var book = spellbookCard(a, spells);
    if (book) view.appendChild(book);

    /* Anything a spell has put on the board goes with the spells, not among
       the class features - a summon is something you cast, and looking for it
       anywhere else is looking in the wrong place. */
    (summonCards(a) || []).forEach(function (cd) { view.appendChild(cd); });

    /* the ranger's animal - one card, whether picking or playing */
    var compCard = companionCard(a);
    if (compCard) view.appendChild(compCard);

    /* wild shape: the picker, then the active form's own stat block */
    var wsCard = wildShapeCard(a);
    if (wsCard) view.appendChild(wsCard);
    var wsPanel = wildShapePanel(a);
    if (wsPanel) view.appendChild(wsPanel);

    /* coin */
    a.coins = a.coins || VT.coin.emptyPurse();
    var coinAmt = el('input', { type: 'text', value: S.coinEntry || '10 gp' ,
      onInput: function (e) { S.coinEntry = e.target.value; } });
    var purse = el('div', { class: 'card' }, [
      el('h3', {}, ['Coin']),
      el('div', { class: 'bigstats', style: { gridTemplateColumns: 'repeat(4,1fr)' } },
        VT.coin.denoms().filter(function (d) { return d.key !== 'ep' || a.coins.ep; })
          .map(function (d) { return stat(d.key.toUpperCase(), a.coins[d.key] || 0); })),
      el('div', { class: 'muted', style: { margin: '6px 0' } }, ['Total ' + VT.coin.format(a.coins)]),
      el('div', { class: 'hpctl' }, [
        el('button', { class: 'btn sm danger', onClick: function () {
          var n = VT.coin.parse(coinAmt.value);
          if (!n) { toast('Could not read "' + coinAmt.value + '"', 'err'); return; }
          var next = VT.coin.spend(a.coins, n);
          if (!next) { toast('Not enough coin — you have ' + VT.coin.format(a.coins), 'err'); return; }
          a.coins = next;
          toast('Spent ' + VT.coin.format(n), 'ok');
          if (S.postToChat) postChat('spends ' + VT.coin.format(n));
          save(); render();
        } }, ['− Spend']),
        coinAmt,
        el('button', { class: 'btn sm', onClick: function () {
          var n = VT.coin.parse(coinAmt.value);
          if (!n) { toast('Could not read "' + coinAmt.value + '"', 'err'); return; }
          a.coins = VT.coin.add(a.coins, n);
          toast('Gained ' + VT.coin.format(n), 'ok');
          save(); render();
        } }, ['+ Earn'])
      ]),
      el('p', { class: 'muted' }, ['Type amounts like "12 gp", "5sp 3cp", or a bare number of copper.'])
    ]);
    view.appendChild(purse);

    /* resources — ki, rage, bardic inspiration, superiority dice... */
    if ((a.resources || []).length) {
      var resCard = el('div', { class: 'card' }, [el('h3', {}, ['Resources'])]);
      a.resources.forEach(function (r) {
        var left = r.max - r.used;
        resCard.appendChild(el('div', { class: 'rollrow' }, [
          el('span', { class: 'lbl' }, [r.name,
            el('span', { class: 'sub' }, ['  per ' + r.per + ' rest'])]),
          el('button', { class: 'btn sm', disabled: r.used <= 0 ? true : null,
            title: 'Give one back', onClick: function () {
              VT.features.restore(a, r.key); save(); render();
            } }, ['+']),
          el('span', { class: 'mod', style: { color: left ? 'var(--green)' : 'var(--red)' } },
            [left + '/' + r.max]),
          el('button', { class: 'btn sm', disabled: left <= 0 ? true : null,
            title: 'Spend one', onClick: function () {
              if (VT.features.spend(a, r.key)) {
                toast(r.name + ' spent — ' + (r.max - r.used) + ' left');
                save(); render();
              }
            } }, ['−'])
        ]));
      });
      view.appendChild(resCard);
    }

    /* Spell slots live with the spells they pay for (see spellbookCard). This
       card is only for a character who has slots and no spells on the sheet -
       a multiclass who prepares from a book, or someone still being built. */
    if ((a.spellSlots || a.pactSlots) && !spells.length) {
      var slotCard = el('div', { class: 'card' }, [el('h3', {}, ['Spell slots'])]);
      if (a.casterLevel && (a.classes || []).length > 1) {
        slotCard.appendChild(el('div', { class: 'muted', style: { marginTop: 0 } }, [
          'Combined caster level ' + a.casterLevel + '. Pact slots are counted separately.'
        ]));
      }
      /* A warlock multiclass has BOTH pools: ordinary slots from the combined
         caster level, and pact slots that come back on a short rest. */
      if (a.pactSlots && !(a.spellSlots && a.spellSlots.pact)) {
        var pLeft = VT.features.pactLeft(a);
        slotCard.appendChild(el('div', { class: 'rollrow' }, [
          el('span', { class: 'lbl' }, ['Pact slots',
            el('span', { class: 'sub' }, ['  level ' + a.pactSlots.slotLevel + ' · short rest'])]),
          el('button', { class: 'btn sm', disabled: (a.slotsUsed.pact || 0) <= 0 ? true : null,
            onClick: function () {
              a.slotsUsed.pact = Math.max(0, (a.slotsUsed.pact || 0) - 1); save(); render();
            } }, ['+']),
          el('span', { class: 'mod', style: { color: pLeft ? 'var(--green)' : 'var(--red)' } },
            [pLeft + '/' + a.pactSlots.count]),
          el('button', { class: 'btn sm', disabled: pLeft <= 0 ? true : null,
            onClick: function () {
              a.slotsUsed.pact = (a.slotsUsed.pact || 0) + 1; save(); render();
            } }, ['−'])
        ]));
      }
      if (a.spellSlots && a.spellSlots.pact) {
        var pactLeft = VT.features.slotsLeft(a);
        slotCard.appendChild(el('div', { class: 'rollrow' }, [
          el('span', { class: 'lbl' }, ['Pact slots',
            el('span', { class: 'sub' }, ['  level ' + a.spellSlots.slotLevel + ' · short rest'])]),
          el('button', { class: 'btn sm', disabled: (a.slotsUsed.pact || 0) <= 0 ? true : null,
            onClick: function () {
              a.slotsUsed.pact = Math.max(0, (a.slotsUsed.pact || 0) - 1); save(); render();
            } }, ['+']),
          el('span', { class: 'mod', style: { color: pactLeft ? 'var(--green)' : 'var(--red)' } },
            [pactLeft + '/' + a.spellSlots.count]),
          el('button', { class: 'btn sm', disabled: pactLeft <= 0 ? true : null,
            onClick: function () {
              a.slotsUsed.pact = (a.slotsUsed.pact || 0) + 1; save(); render();
            } }, ['−'])
        ]));
      } else if (a.spellSlots && a.spellSlots.slots) {
        a.spellSlots.slots.forEach(function (max, i) {
          var lv = i + 1;
          var left = VT.features.slotsLeft(a, lv);
          slotCard.appendChild(el('div', { class: 'rollrow' }, [
            el('span', { class: 'lbl' }, [U.ord(lv) + ' level']),
            el('button', { class: 'btn sm', disabled: (a.slotsUsed[lv] || 0) <= 0 ? true : null,
              onClick: function () {
                a.slotsUsed[lv] = Math.max(0, (a.slotsUsed[lv] || 0) - 1); save(); render();
              } }, ['+']),
            el('span', { class: 'mod', style: { color: left ? 'var(--green)' : 'var(--red)' } },
              [left + '/' + max]),
            el('button', { class: 'btn sm', disabled: left <= 0 ? true : null,
              onClick: function () {
                a.slotsUsed[lv] = (a.slotsUsed[lv] || 0) + 1; save(); render();
              } }, ['−'])
          ]));
        });
      }
      view.appendChild(slotCard);
    }

    /* death saves - only once they matter */
    if (a.hp <= 0 || (a.deathSaves && (a.deathSaves.s || a.deathSaves.f))) {
      var ds = VT.actor.deathSaveState(a);
      var dsCard = el('div', { class: 'card' }, [el('h3', {}, ['Death saves'])]);
      ['s', 'f'].forEach(function (which) {
        var row = el('div', { class: 'rollrow' }, [
          el('span', { class: 'lbl' }, [which === 's' ? 'Successes' : 'Failures'])
        ]);
        var pips = el('span', { class: 'dspips' });
        for (var i = 0; i < 3; i++) {
          pips.appendChild(el('span', {
            class: 'dspip ' + (which === 's' ? 'ok' : 'bad') + (i < ds[which] ? ' on' : ''),
            title: 'Click to set',
            onClick: (function (n) {
              return function () { ds[which] = (ds[which] === n ? n - 1 : n); save(); render(); };
            })(i + 1)
          }));
        }
        row.appendChild(pips);
        dsCard.appendChild(row);
