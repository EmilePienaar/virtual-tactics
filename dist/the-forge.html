  /* Change ONE class's level, leaving the others alone. This is what levelling
     up actually is for a multiclass character: you pick a class and take a
     level in it. `index` is a position in build.classes. */
  function relevelClass(actor, index, newLevel) {
    var refs = actor.build;
    if (!refs) return { ok: false, reason: 'This character has no build data - it was imported as a flat statblock.' };
    var r = fromRefs(refs);
    if (!r.choices.classes.length) {
      return { ok: false, reason: "None of this character's classes are in the loaded data.", missing: r.missing };
    }
    var entry = r.choices.classes[index];
    if (!entry) return { ok: false, reason: 'No such class on this character.' };

    newLevel = U.clamp(newLevel, 0, 20);
    if (newLevel === 0) {
      if (r.choices.classes.length === 1) {
        return { ok: false, reason: 'A character needs at least one class level.' };
      }
      r.choices.classes.splice(index, 1);
    } else {
      entry.level = newLevel;
    }
    if (totalLevelOf(r.choices) > 20) {
      return { ok: false, reason: 'That would take the character past 20th level.' };
    }
    return finishRelevel(actor, r);
  }

  /* Add a class, or take another level in one already held. */
  function addClassLevel(actor, clsRec, subclassRec) {
    var refs = actor.build;
    if (!refs) return { ok: false, reason: 'This character has no build data.' };
    var r = fromRefs(refs);
    var existing = r.choices.classes.filter(function (e) {
      return String(e.cls.name).toLowerCase() === String(clsRec.name).toLowerCase() &&
             String(e.cls.source || '').toLowerCase() === String(clsRec.source || '').toLowerCase();
    })[0];
    if (totalLevelOf(r.choices) >= 20) {
      return { ok: false, reason: 'Already at 20th level.' };
    }
    if (existing) existing.level += 1;
    else r.choices.classes.push({ cls: clsRec, subclass: subclassRec || null, level: 1 });
    return finishRelevel(actor, r);
  }

  function relevel(actor, newLevel) {
    var refs = actor.build;
    if (!refs) return { ok: false, reason: 'This character has no build data — it was imported as a flat statblock.' };
    var r = fromRefs(refs);
    if (!r.choices.cls) {
      return { ok: false, reason: 'Class "' + (refs.cls && refs.cls.name) + '" is not in the loaded data.', missing: r.missing };
    }
    newLevel = U.clamp(newLevel, 1, 20);
    /* A single overall level only has one meaning when there is one class. For
       a multiclass character, put the difference into the class they most
       recently took - the others keep the levels they earned. */
    if (r.choices.classes.length > 1) {
      var delta = newLevel - totalLevelOf(r.choices);
      var last = r.choices.classes[r.choices.classes.length - 1];
      var want = (last.level || 1) + delta;
      if (want < 1) {
        return { ok: false, reason: 'Reduce a specific class instead — that would take ' +
                 last.cls.name + ' below 1st level.' };
      }
      last.level = want;
      return finishRelevel(actor, r);
    }
    r.choices.classes[0].level = newLevel;
    r.choices.level = newLevel;
    return finishRelevel(actor, r);
  }

  /* Everything a re-derive has to carry across, in one place, so that changing
     a level, adding a class and adding a weapon all preserve exactly the same
     things. Play state survives; the build is recomputed. */
  function finishRelevel(actor, r) {
    var refs = actor.build || {};
    r.choices.name = actor.name;
    r.choices.level = totalLevelOf(r.choices);
    r.choices.skillProf = (actor.skillProf || refs.skillProf || []).slice();
    r.choices.skillBonus = U.clone(actor.skillBonus || refs.skillBonus || {});
    r.choices.toolProf = (actor.toolProf || refs.toolProf || []).slice();
    /* Carried the same way tools are: the merged list goes back in as the
       hand-added set, so a proficiency granted on the Edit tab survives, and
       one the class grants is re-derived anyway. */
    r.choices.armorProf = (actor.armorProf || refs.armorProf || []).slice();
    r.choices.weaponProf = (actor.weaponProf || refs.weaponProf || []).slice();
    r.choices.langProf = (actor.langProf || refs.langProf || []).slice();

    var damage = Math.max(0, actor.hpMax - actor.hp);
    r.choices.coins = actor.coins;
    r.choices.inventory = actor.inventory;
    r.choices.expertise = actor.expertise || (refs.expertise || []);

    var next = derive(r.choices);
    next.id = actor.id;
    next.hp = Math.max(1, next.hpMax - damage);

    /* Everything below belongs to PLAY, not to the build, and must survive a
       level-up untouched. Losing a party's gold to a level-up is the kind of
       bug that costs a session. */
    next.tempHp = actor.tempHp || 0;
    next.conditions = (actor.conditions || []).slice();
    next.used = U.clone(actor.used || {});
    next.coins = U.clone(actor.coins || VT.coin.emptyPurse());
    next.inventory = U.clone(actor.inventory || []);
    next.spriteId = actor.spriteId || null;
    next.acBonus = actor.acBonus || 0;
    next.deathSaves = U.clone(actor.deathSaves || { s: 0, f: 0 });
    next.hitDiceUsed = Math.min(actor.hitDiceUsed || 0, next.hitDiceMax);
    /* What you are attuned to is a fact about the character, not the build. */
    next.attuned = U.clone(actor.attuned || []);
    if (actor.attuneMax) next.attuneMax = actor.attuneMax;

    /* Spent resources and spell slots are play state: keep what is used, but
       clamp to the new maximums in case a level-up shrank something. */
    var priorUse = {};
    (actor.resources || []).forEach(function (r2) { priorUse[r2.key] = r2.used; });
    (next.resources || []).forEach(function (r2) {
      r2.used = Math.min(priorUse[r2.key] || 0, r2.max);
    });
    if (next.spellSlots && actor.slotsUsed) {
      next.slotsUsed = {};
      if (next.spellSlots.pact) {
        next.slotsUsed.pact = Math.min(actor.slotsUsed.pact || 0, next.spellSlots.count);
      } else {
        next.spellSlots.slots.forEach(function (n2, i2) {
          next.slotsUsed[i2 + 1] = Math.min(actor.slotsUsed[i2 + 1] || 0, n2);
        });
      }
    }
    if (actor.notesCustom) { next.notes = actor.notes; next.notesCustom = true; }
    next.hitDiceMax = next.level;

    /* Which side they fight on, and a sprite the GM chose by hand, are theirs
       and not the class table's. The build re-derives the default look from
       equipped gear, so only an explicit override is worth protecting. */
    if (actor.team) next.team = actor.team;
    if (actor.specCustom) { next.spec = U.clone(actor.spec); next.specCustom = true; }

    /* keep any actions the player added by hand in the Edit tab */
    (actor.actions || []).filter(function (x) { return x.custom; })
      .forEach(function (x) { next.actions.push(U.clone(x)); });
    return { ok: true, actor: next, missing: r.missing };
  }

  VT.charbuild = {
    derive: derive, racialBonuses: racialBonuses,
    armourClass: armourClass, hitPoints: hitPoints, weaponLook: weaponLook,
    toRefs: toRefs, fromRefs: fromRefs, relevel: relevel, baseSubrace: baseSubrace,
    relevelClass: relevelClass, addClassLevel: addClassLevel,
    classesOf: classesOf, totalLevelOf: totalLevelOf,
    subclassFor: subclassFor,
    featuresFor: featuresFor, featureText: featureText, featureRecord: featureRecord, asiStatus: asiStatus, isASI: isASI
  };
})();

/* ===== ../src/data/homebrew.js ===== */
/* Virtual Tactics :: data/homebrew.js
   Local storage for user-authored content.

   Homebrew is written in the SAME 5etools schema as everything else, which is
   the whole trick: once saved it is merged into the compendium and every part
   of the app - the character builder's pickers, the Forge, search, conversion
   to statblocks - treats it identically to book content. No special cases.

   Stored in localStorage under its own key, so it survives reloading or
   switching your 5etools data source, and exports as a plain JSON file you can
   share with your table. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util;
  var KEY = 'vtactics.homebrew.v1';

  /* Everything the compendium buckets content into. The last six matter for
     the choice tree: a class is not really a class without its subclasses, its
     feature records and the optional features it may pick from, and a book
     converted from a PDF brings all of them at once. Our internal bucket names
     are lower-case with no camel hump; 5etools files use their own spelling,
     which FILE_KEYS maps. */
  var TYPES = ['race', 'subrace', 'class', 'subclass', 'classfeature',
               'subclassfeature', 'background', 'spell', 'item', 'feat',
               'optionalfeature', 'spelllistchange'];

  var FILE_KEYS = {
    race: ['race'], subrace: ['subrace'], 'class': ['class'],
    subclass: ['subclass'], classfeature: ['classFeature', 'classfeature'],
    subclassfeature: ['subclassFeature', 'subclassfeature'],
    background: ['background'], spell: ['spell'],
    item: ['item', 'baseitem'], feat: ['feat'],
    optionalfeature: ['optionalfeature', 'optionalFeature'],
    spelllistchange: ['spelllistchange', 'spellListChange']
  };

  var hb = {
    data: null,

    blank: function () {
      var d = {};
      TYPES.forEach(function (t) { d[t] = []; });
      return d;
    },

    load: function () {
      try {
        var raw = localStorage.getItem(KEY);
        this.data = raw ? JSON.parse(raw) : this.blank();
      } catch (e) {
        this.data = this.blank();
      }
      TYPES.forEach(function (t) { if (!Array.isArray(hb.data[t])) hb.data[t] = []; }.bind(this));
      return this.data;
    },

    save: function () {
      try {
        localStorage.setItem(KEY, JSON.stringify(this.data));
        return { ok: true };
      } catch (e) {
        return { ok: false, error: String(e && e.message || e) };
      }
    },

    list: function (type) { return (this.data && this.data[type]) || []; },

    count: function () {
      var n = 0;
      TYPES.forEach(function (t) { n += hb.list(t).length; });
      return n;
    },

    /* Insert or replace by __hbId. */
    upsert: function (type, rec) {
      if (!this.data[type]) this.data[type] = [];
      rec.__hbId = rec.__hbId || U.uid('hb');
      rec.__hb = true;
      var arr = this.data[type];
      var i = arr.findIndex(function (r) { return r.__hbId === rec.__hbId; });
      if (i >= 0) arr[i] = rec; else arr.push(rec);
      var res = this.save();
      this.apply();
      return res.ok ? rec : null;
    },

    remove: function (type, id) {
      this.data[type] = this.list(type).filter(function (r) { return r.__hbId !== id; });
      this.save();
      this.apply();
    },

    get: function (type, id) {
      return this.list(type).find(function (r) { return r.__hbId === id; }) || null;
    },

    /* Push everything into the loaded compendium so the rest of the app sees it. */
    apply: function () {
      if (VT.fivetools && VT.fivetools.setHomebrew) {
        VT.fivetools.setHomebrew(this.data);
      }
    },

    exportFile: function () {
      var payload = { _format: 'vtactics-homebrew', version: 1, created: Date.now(), data: this.data };
      var blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'homebrew.vthb.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    },

    /* Accepts our own export, or a raw 5etools-shaped file ({race:[...]} etc). */
    importJSON: function (text, merge) {
      var parsed = JSON.parse(text);
      var incoming = parsed && parsed.data ? parsed.data : parsed;
      if (!incoming || typeof incoming !== 'object') throw new Error('Not a homebrew file.');

      var added = 0;
      if (!merge) this.data = this.blank();
      TYPES.forEach(function (t) {
        var src = null;
        (FILE_KEYS[t] || [t]).forEach(function (k) {
          if (!src && Array.isArray(incoming[k])) src = incoming[k];
        });
        if (!Array.isArray(src)) return;
        src.forEach(function (r) {
          if (!r) return;
          /* A race's default subrace has no name at all - see baseSubrace in
             charbuild.js - so a nameless record is only junk outside that one
             bucket. */
          if (!r.name && !(t === 'subrace' && r.raceName)) return;
          var copy = U.clone(r);
          copy.__hbId = copy.__hbId || U.uid('hb');
          copy.__hb = true;
          copy.source = copy.source || 'HB';
          hb.data[t] = hb.data[t] || [];
          hb.data[t].push(copy);
          added++;
        });
      });
      if (!added) throw new Error('No recognised entries found in that file.');
      this.save();
      this.apply();
      return added;
    },

    clearAll: function () {
      this.data = this.blank();
      this.save();
      this.apply();
    },

    TYPES: TYPES,
    /* The five you can author by hand in the Homebrew tab. The rest of TYPES
       arrives only by importing a converted book - there is no sensible form
       for "subclass feature #94", but it still has to be stored and merged. */
    AUTHORED: ['race', 'class', 'background', 'spell', 'item'],
    FILE_KEYS: FILE_KEYS,
    KEY: KEY
  };

  VT.homebrew = hb;
})();

/* ===== ../src/ui/choiceui.js ===== */
/* Virtual Tactics :: ui/choiceui.js
   The choice tree and the class list, as UI, once.

   The Forge and the Tale Sheet symbiote both need to show "you have three
   maneuvers to pick and here are the 23 you may pick from", and a second
   implementation of that would drift inside a week. So this renders neutral
   markup with its own `ch-` class names, and each app skins it.

   Everything it knows about rules it asks VT.choices and VT.multiclass. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, el = U.el, SRD = VT.srd;

  /* Which groups are open, and what has been typed into each search box. Held
     outside the render so a redraw does not collapse what you were reading. */
  var S = { open: {}, q: {}, allSources: false, adding: false, addQ: '' };

  function low(v) { return String(v == null ? '' : v).toLowerCase(); }
  function FT() { return VT.fivetools; }

  /* ==== the class list, with multiclassing =============================== */
  /* opts: { actor, onLevel(index, level), onAdd(clsRec), onSubclass(index, rec),
             readOnly } */
  function renderClasses(host, opts) {
    var a = opts.actor;
    var classes = (a.classes && a.classes.length)
      ? a.classes
      : [{ name: a.className || 'Class', source: null, level: a.level || 1, subclass: null }];

    var wrap = el('div', { class: 'ch-classes' });
    classes.forEach(function (entry, i) {
      var rec = VT.choices.classRecord(entry);
      var scLv = rec ? VT.choices.subclassLevel(rec) : 3;
      var row = el('div', { class: 'ch-class' });
      row.appendChild(el('div', { class: 'ch-class-main' }, [
        el('span', { class: 'ch-class-nm' }, [entry.name]),
        el('span', { class: 'ch-sub' }, [
          entry.subclass ? entry.subclass.name
            : (entry.level >= scLv ? 'no subclass chosen' : 'subclass at ' + U.ord(scLv)),
          rec ? '  ·  d' + ((rec.hd && rec.hd.faces) || 8) : '',
          rec && rec.casterProgression ? '  ·  ' + casterWord(rec.casterProgression) : ''
        ].filter(Boolean).join(''))
      ]));
      if (!opts.readOnly) {
        row.appendChild(el('div', { class: 'ch-steps' }, [
          el('button', { class: 'btn sm', title: 'One level fewer',
            onClick: function () { opts.onLevel(i, entry.level - 1); } }, ['−']),
          el('span', { class: 'ch-lv' }, [String(entry.level)]),
          el('button', { class: 'btn sm', title: 'One level more',
            onClick: function () { opts.onLevel(i, entry.level + 1); } }, ['+'])
        ]));
      } else {
        row.appendChild(el('span', { class: 'ch-lv' }, [String(entry.level)]));
      }
      wrap.appendChild(row);
    });

    var total = classes.reduce(function (n, c) { return n + (c.level || 0); }, 0);
    wrap.appendChild(el('div', { class: 'ch-total' }, [
      'Character level ' + total + '  ·  proficiency ' + U.sign(SRD.profBonus(U.clamp(total, 1, 20))) +
      (classes.length > 1 ? '  ·  ' + castingLine(a) : '')
    ]));

    if (!opts.readOnly) wrap.appendChild(addClassBlock(a, classes, total, opts));
    host.appendChild(wrap);
  }

  function casterWord(p) {
    return p === 'full' ? 'full caster' : p === 'pact' ? 'pact magic'
      : p === 'artificer' ? 'half caster (rounds up)'
      : p === '1/2' ? 'half caster' : p === '1/3' ? 'third caster' : p;
  }

  function castingLine(a) {
    var bits = [];
    if (a.casterLevel) bits.push('caster level ' + a.casterLevel);
    if (a.pactSlots) bits.push('pact ' + a.pactSlots.count + '×' + U.ord(a.pactSlots.slotLevel));
    return bits.join(', ') || 'no spellcasting';
  }

  function addClassBlock(a, classes, total, opts) {
    var box = el('div', { class: 'ch-add' });
    if (total >= 20) {
      box.appendChild(el('div', { class: 'ch-note' }, ['At 20th level — no more class levels to take.']));
      return box;
    }
    if (!FT().loaded) {
      box.appendChild(el('div', { class: 'ch-note' }, ['Connect a data source to add a class.']));
      return box;
    }
    if (!S.adding) {
      box.appendChild(el('button', { class: 'btn sm', onClick: function () {
        S.adding = true; opts.onChange && opts.onChange();
      } }, ['+ Multiclass…']));
      return box;
    }

    box.appendChild(el('div', { class: 'ch-note' }, [
      'Taking a level in a new class. You keep the hit points, proficiencies and ' +
      'features you already have; the new class adds its own. Saving-throw ' +
      'proficiencies are not granted by a multiclass.' +
      (opts.enforce === false
        ? ' Your ability scores are not set yet, so the requirements below are ' +
          'shown but not enforced — check them once you have rolled.'
        : '')
    ]));

    /* Only offer classes from the same printing as the one they started in -
       mixing a 2014 and a 2024 class gives a character two incompatible
       feature trees for the same twenty levels. */
    var first = classes[0];
    var firstRec = VT.choices.classRecord(first);
    var wantSource = firstRec ? low(firstRec.source) : '';

    var list = el('div', { class: 'ch-list' });
    FT().get('class').filter(function (c) {
      if (wantSource && low(c.source) !== wantSource) return false;
      return true;
    }).sort(function (x, y) { return x.name < y.name ? -1 : 1; }).forEach(function (rec) {
      /* 5e checks BOTH ends: you must qualify for the class you are leaving as
         well as the one you are joining. */
      var reason = VT.multiclass.requirementReason(rec, a.abilities);
      if (!reason) {
        for (var ci = 0; ci < classes.length && !reason; ci++) {
          var haveRec = VT.choices.classRecord(classes[ci]);
          if (!haveRec || low(haveRec.name) === low(rec.name)) continue;
          var r2 = VT.multiclass.requirementReason(haveRec, a.abilities);
          if (r2) reason = classes[ci].name + ' ' + r2 + ' to multiclass out';
        }
      }
      var already = classes.filter(function (e) { return low(e.name) === low(rec.name); })[0];
      /* During character CREATION the abilities have not been assigned yet -
         the wizard asks for a class before it asks for scores - so every class
         would fail its requirement and the whole list would be dead. There,
         the requirement is shown but not enforced, and the Review step says if
         one is still unmet. Where the scores are known, it blocks. */
      var blocked = !!reason && opts.enforce !== false;
      var row = el('div', {
        class: 'ch-opt' + (blocked ? ' ch-no' : (reason ? ' ch-caution' : '')),
        onClick: function () {
          if (blocked) return;
          S.adding = false;
          opts.onAdd(rec);
        } }, [
        el('span', { class: 'ch-opt-nm' }, [rec.name,
          already ? el('span', { class: 'ch-sub' }, ['  already ' + already.level]) : null]),
        el('span', { class: 'ch-sub' }, [
          reason ? reason : 'd' + ((rec.hd && rec.hd.faces) || 8) +
            (rec.casterProgression ? ' · ' + casterWord(rec.casterProgression) : '')
        ])
      ]);
      list.appendChild(row);
    });
    box.appendChild(list);
    box.appendChild(el('button', { class: 'btn sm', onClick: function () {
      S.adding = false; opts.onChange && opts.onChange();
    } }, ['Cancel']));
    return box;
  }

  /* ==== the choice tree ================================================== */
  /* opts: { actor, build, onChange, max } - build must be the actor's own
     build object so picks are written where a re-derive will read them. */
  function render(host, opts) {
    var a = opts.actor, build = opts.build;
    if (!build) {
      host.appendChild(el('div', { class: 'ch-note' }, [
        'This character has no build data, so there is nothing to choose from. ' +
        'Characters made in the Character tab carry their choices with them.'
      ]));
      return;
    }
    if (!FT().loaded) {
      host.appendChild(el('div', { class: 'ch-note' }, [
        'Connect your 5etools data to see fighting styles, invocations, metamagic, ' +
        'maneuvers, feats and spell lists.'
      ]));
      return;
    }

    var list = VT.choices.pending(build);
    if (!list.length) {
      host.appendChild(el('div', { class: 'ch-note' }, [
        'Nothing to choose yet — this class makes its first choice at a higher level.'
      ]));
      return;
    }

    var sum = VT.choices.summary(build);
    host.appendChild(el('div', { class: 'ch-head' }, [
      el('span', {}, [sum.unspent
        ? sum.unspent + ' still to choose'
        : 'Everything chosen.']),
      el('label', { class: 'ch-srcs' }, [
        el('input', { type: 'checkbox', checked: S.allSources,
          onChange: function (e) { S.allSources = e.target.checked; opts.onChange(); } }),
        ' every book'
      ])
    ]));

    list.forEach(function (ch) {
      host.appendChild(choiceCard(ch, a, build, opts));
    });
  }

  function choiceCard(ch, a, build, opts) {
    var done = (ch.picked || []).length;
    var short = done < ch.count;
    var card = el('div', { class: 'ch-group' + (short ? ' ch-short' : '') });

    var open = !!S.open[ch.key];
    card.appendChild(el('div', { class: 'ch-group-h', onClick: function () {
      S.open[ch.key] = !open; opts.onChange();
    } }, [
      el('span', { class: 'ch-group-nm' }, [
        ch.label,
        el('span', { class: 'ch-sub' }, ['  ' + (ch.entry ? ch.entry.name : '') +
          (ch.level > 1 ? ' · ' + U.ord(ch.level) + ' level' : '')])
      ]),
      el('span', { class: 'ch-count' + (short ? ' ch-warn' : '') }, [done + ' / ' + ch.count]),
      el('span', { class: 'ch-caret' }, [open ? '▾' : '▸'])
    ]));

    /* what has been picked */
    if (done) {
      var chosen = el('div', { class: 'ch-chosen' });
      (ch.picked || []).forEach(function (p) {
        var name = typeof p === 'string' ? U.cap(p) : p.name;
        chosen.appendChild(el('span', { class: 'ch-pill' }, [
          name,
          abilTag(p),
          el('button', { class: 'ch-x', title: 'Remove', onClick: function (e) {
            e.stopPropagation();
            VT.choices.unpick(build, ch, typeof p === 'string' ? { __skill: p } : p);
            opts.onChange();
          } }, ['×'])
        ]));
      });
      card.appendChild(chosen);
    }

    if (!open) return card;

    /* the options */
    var opts2 = VT.choices.optionsFor(ch, { allSources: S.allSources });
    /* Say so when a setting has taken spells off this class's list, rather
       than leaving the player to wonder where Flame Strike went. */
    if ((ch.kind === 'spell' || ch.kind === 'cantrip') && ch.listFrom && FT().spellListChanges) {
      var changes = FT().spellListChanges(ch.listFrom.name);
      var lost = changes.reduce(function (n, c) { return n + (c.removed || []).length; }, 0);
      if (lost) {
        card.appendChild(el('div', { class: 'ch-note' }, [
          lost + ' spell' + (lost === 1 ? '' : 's') + ' removed from the ' +
          ch.listFrom.name + ' list by ' + changes[0].source + '.'
        ]));
      }
    }
    var q = low(S.q[ch.key] || '');
    if (opts2.length > 12) {
      card.appendChild(el('div', { class: 'ch-search' }, [
        el('input', { type: 'text', placeholder: 'Search ' + opts2.length + ' options',
          value: S.q[ch.key] || '',
          onInput: function (e) { S.q[ch.key] = e.target.value; opts.onChange(); } })
      ]));
    }
    var shown = opts2.filter(function (o) { return !q || low(o.name).indexOf(q) >= 0; });
    var full = done >= ch.count;

    var box = el('div', { class: 'ch-list' });
    shown.slice(0, 300).forEach(function (o) {
      var already = isPicked(ch, o);
      var reason = ch.kind === 'skill' ? '' : VT.choices.prereqReason(o, a, build, ch);
      var blocked = (full && !already) || (!!reason && !already);
      var row = el('div', { class: 'ch-opt' + (already ? ' ch-on' : '') + (blocked ? ' ch-no' : ''),
        onClick: function () {
          if (already) { VT.choices.unpick(build, ch, o); opts.onChange(); return; }
          if (blocked) return;
          VT.choices.pick(build, ch, o);
          opts.onChange();
        } }, [
        el('span', { class: 'ch-opt-nm' }, [o.name]),
        el('span', { class: 'ch-sub' }, [subtitleFor(ch, o, reason)])
      ]);
      box.appendChild(row);
    });
    if (!shown.length) box.appendChild(el('div', { class: 'ch-note' }, ['Nothing matches.']));
    if (shown.length > 300) {
      box.appendChild(el('div', { class: 'ch-note' }, [
        shown.length - 300 + ' more — narrow the search to see them.']));
    }
    card.appendChild(box);

    /* a feat that raises a score has to be told which one */
    (ch.picked || []).forEach(function (p) {
      if (ch.kind !== 'feat' || typeof p === 'string') return;
      var rec = VT.choiceFx.findFeat(p);
      var need = rec && VT.choiceFx.abilityNeed(rec);
      if (!need) return;
      card.appendChild(abilityPicker(p, need, opts));
    });

    /* the printed text of whatever is highlighted */
    if (full && ch.picked.length) {
      var txt = VT.choiceFx.textFor({
        name: ch.picked[ch.picked.length - 1].name,
        source: ch.picked[ch.picked.length - 1].source, kind: ch.kind
      });
      if (txt) card.appendChild(el('div', { class: 'ch-text' }, [txt.slice(0, 900)]));
    }
    return card;
  }

  function abilTag(p) {
    if (!p || !p.abil) return null;
    var bits = Object.keys(p.abil).map(function (k) {
      return SRD.ABILITY_NAME[k] + ' ' + U.sign(p.abil[k]);
    });
    return bits.length ? el('span', { class: 'ch-sub' }, ['  ' + bits.join(', ')]) : null;
  }

  function abilityPicker(pick, need, opts) {
    var box = el('div', { class: 'ch-abil' });
    box.appendChild(el('div', { class: 'ch-note' }, [
      pick.name + ': raise ' + (need.count > 1 ? need.count + ' abilities' : 'one ability') +
      ' by ' + need.amount + (need.max > 20 ? ' (up to ' + need.max + ')' : '')
    ]));
    need.from.forEach(function (k) {
      var on = !!(pick.abil && pick.abil[k]);
      box.appendChild(el('button', {
        class: 'btn sm' + (on ? ' on' : ''),
        onClick: function () {
          pick.abil = pick.abil || {};
          if (on) delete pick.abil[k];
          else {
            var used = Object.keys(pick.abil).length;
            if (used >= need.count) return;
            pick.abil[k] = need.amount;
          }
          opts.onChange();
        }
      }, [SRD.ABILITY_NAME[k]]));
    });
    return box;
  }

  }
  function num(v, min, max, cb, step) {
    return el('input', { type: 'number', value: v, min: min, max: max, step: step || 1,
      onInput: function (e) { cb(parseFloat(e.target.value) || 0); } });
  }
  function select(opts, v, cb) {
    var s = el('select', { onChange: function (e) { cb(e.target.value); } },
      opts.map(function (o) { return el('option', { value: o.value }, [o.label]); }));
    s.value = v == null ? '' : String(v);
    return s;
  }
  function toggleBtn(v, cb) {
    var b = el('button', { class: 'btn sm' + (v ? ' on' : ''), onClick: function () {
      v = !v; b.className = 'btn sm' + (v ? ' on' : ''); cb(v);
    } }, ['Yes']);
    return b;
  }
  function sizeOpts() {
    return [['T', 'Tiny'], ['S', 'Small'], ['M', 'Medium'], ['L', 'Large'], ['H', 'Huge'], ['G', 'Gargantuan']]
      .map(function (p) { return { value: p[0], label: p[1] }; });
  }

  function traitsEditor(traits, redraw) {
    var wrap = el('div', {});
    traits.forEach(function (t, i) {
      wrap.appendChild(el('div', { class: 'hb-trait' }, [
        el('div', { class: 'row' }, [
          text(t.name, function (x) { t.name = x; }, 'Trait name'),
          el('button', { class: 'btn sm danger', title: 'Remove', onClick: function () {
            traits.splice(i, 1); redraw();
          } }, ['×'])
        ]),
        el('textarea', { rows: 2, value: t.text || '', placeholder: 'What it does…',
          onInput: function (e) { t.text = e.target.value; } })
      ]));
    });
    wrap.appendChild(el('button', { class: 'btn sm', onClick: function () {
      traits.push({ name: '', text: '' }); redraw();
    } }, ['+ Add trait']));
    return wrap;
  }

  /* ---- main render ------------------------------------------------------ */
  function render(host, onChange) {
    U.clear(host);
    var form = FORMS[state.type];

    host.appendChild(el('h2', { class: 'step' }, ['Homebrew']));
    host.appendChild(el('p', { class: 'step-sub' }, [
      'Anything you make here is saved in this browser and merged into the compendium, ' +
      'so it shows up in the builder\'s pickers alongside published content.'
    ]));

    /* type tabs */
    var tabs = el('div', { class: 'kindbar', style: { marginBottom: '14px' } });
    (HB.AUTHORED || HB.TYPES).forEach(function (t) {
      tabs.appendChild(el('button', {
        class: state.type === t ? 'on' : '',
        onClick: function () { state.type = t; state.editing = null; state.model = null; render(host, onChange); }
      }, [FORMS[t].label + ' ' + HB.list(t).length]));
    });
    host.appendChild(tabs);

    /* Imported content that has no authoring form of its own - the subclasses
       and feature records that come with a converted book. There is nothing to
       edit here, but a user who has just imported two hundred records should be
       able to see that they landed. */
    var extra = HB.TYPES.filter(function (t) {
      return (HB.AUTHORED || []).indexOf(t) < 0 && HB.list(t).length;
    });
    if (extra.length) {
      var total = extra.reduce(function (n, t) { return n + HB.list(t).length; }, 0);
      host.appendChild(el('div', { class: 'ok-box' }, [
        'Imported: ' + total + ' further records that have no form of their own — ' +
        extra.map(function (t) { return HB.list(t).length + ' ' + t; }).join(', ') +
        '. They are merged into the compendium and drive the choice tree.'
      ]));
    }

    /* existing entries */
    var list = HB.list(state.type);
    var listPanel = el('div', { class: 'panel' }, [
      el('h3', {}, ['Your ' + form.plural + ' — ' + list.length]),
      list.length ? el('div', { class: 'list' }, list.map(function (r) {
        return el('div', { class: 'listitem' + (state.editing === r.__hbId ? ' sel' : '') }, [
          el('div', { class: 't', onClick: function () { edit(r); render(host, onChange); } }, [
            el('div', { class: 'n' }, [r.name]),
            el('div', { class: 's' }, [summarise(state.type, r)])
          ]),
          el('button', { class: 'btn sm', title: 'Duplicate', onClick: function () {
            var copy = U.clone(r);
            delete copy.__hbId;
            copy.name = r.name + ' (copy)';
            HB.upsert(state.type, copy);
            render(host, onChange); if (onChange) onChange();
          } }, ['⧉']),
          el('button', { class: 'btn sm danger', title: 'Delete', onClick: function () {
            HB.remove(state.type, r.__hbId);
            if (state.editing === r.__hbId) { state.editing = null; state.model = null; }
            render(host, onChange); if (onChange) onChange();
          } }, ['×'])
        ]);
      })) : el('div', { class: 'tiny' }, ['Nothing yet.']),
      el('div', { class: 'btnrow', style: { marginTop: '10px' } }, [
        el('button', { class: 'btn sm primary', onClick: function () {
          state.editing = 'new';
          state.model = form.blank();
          render(host, onChange);
        } }, ['+ New ' + form.label])
      ])
    ]);
    host.appendChild(listPanel);

    /* editor */
    if (state.model) {
      var v = state.model;
      var redraw = function () { render(host, onChange); };
      var body = el('div', { class: 'panel' }, [
        el('h3', {}, [state.editing === 'new' ? 'New ' + form.label : 'Editing “' + (v.name || form.label) + '”'])
      ]);
      form.fields(v, redraw).forEach(function (f) { if (f) body.appendChild(f); });
      body.appendChild(el('div', { class: 'btnrow', style: { marginTop: '14px' } }, [
        el('button', { class: 'btn primary', onClick: function () {
          if (!String(v.name || '').trim()) { flash(body, 'err-box', 'Give it a name first.'); return; }
          var rec = form.toRecord(v);
          if (state.editing && state.editing !== 'new') rec.__hbId = state.editing;
          var saved = HB.upsert(state.type, rec);
          if (!saved) { flash(body, 'err-box', 'Could not save — browser storage may be full.'); return; }
          state.editing = null; state.model = null;
          render(host, onChange);
          if (onChange) onChange();
        } }, ['Save']),
        el('button', { class: 'btn', onClick: function () {
          state.editing = null; state.model = null; render(host, onChange);
        } }, ['Cancel'])
      ]));
      host.appendChild(body);
    }

    /* library management */
    host.appendChild(el('div', { class: 'panel' }, [
      el('h3', {}, ['Library — ' + HB.count() + ' entries']),
      el('div', { class: 'btnrow' }, [
        el('button', { class: 'btn sm', onClick: function () { HB.exportFile(); } }, ['Export JSON']),
        el('button', { class: 'btn sm', onClick: function () {
          var picker = U.$('#jsonPicker');
          picker.value = '';
          picker.onchange = function () {
            var f = picker.files[0]; if (!f) return;
            var fr = new FileReader();
            fr.onload = function () {
              try {
                var n = HB.importJSON(fr.result, true);
                render(host, onChange); if (onChange) onChange();
                flash(host, 'ok-box', 'Imported ' + n + ' entries.');
              } catch (e) {
                flash(host, 'err-box', 'Import failed: ' + U.esc(e.message));
              }
            };
            fr.readAsText(f);
          };
          picker.click();
        } }, ['Import JSON']),
        el('button', { class: 'btn sm danger', onClick: function () {
          if (!HB.count()) return;
          HB.clearAll();
          state.editing = null; state.model = null;
          render(host, onChange); if (onChange) onChange();
        } }, ['Delete all'])
      ]),
      el('p', { class: 'tiny' }, [
        'Exports in the same schema as everything else, so the file also drops straight into a ' +
        '5etools homebrew folder. Import merges rather than replacing.'
      ])
    ]));
  }

  function edit(r) {
    state.editing = r.__hbId;
    state.model = FORMS[state.type].fromRecord(r);
  }

  function summarise(type, r) {
    if (type === 'race') {
      var ab = CV.abilityBonusesFromRace(r);
      var bits = Object.keys(ab).map(function (k) { return SRD.ABILITY_NAME[k] + ' ' + U.sign(ab[k]); });
      return (bits.join(' ') || 'no bonuses') + ' · ' + CV.raceSpeed(r) + 'ft';
    }
    if (type === 'class') {
      return 'd' + ((r.hd && r.hd.faces) || 8) +
        ((r.proficiency || []).length ? ' · saves ' + r.proficiency.join('/').toUpperCase() : '') +
        (r.spellcastingAbility ? ' · caster' : '');
    }
    if (type === 'background') {
      var sp = (r.skillProficiencies && r.skillProficiencies[0]) || {};
      return Object.keys(sp).join(', ') || '—';
    }
    if (type === 'spell') return (r.level ? U.ord(r.level) + ' level' : 'cantrip') + ' · ' + (SCHOOLS[r.school] || '');
    if (type === 'item') return r.armor ? 'AC ' + r.ac : (r.dmg1 || '') + ' ' + (ITEM_DMG[r.dmgType] || '');
    return '';
  }

  function flash(host, cls, msg) {
    var box = el('div', { class: cls, html: msg });
    host.insertBefore(box, host.firstChild);
    setTimeout(function () { box.remove(); }, 4000);
  }

  VT.homebrewUI = { render: render, FORMS: FORMS, state: state };
})();

/* ===== roster.js ===== */
/* The Forge :: Roster — level, edit and adjust anything in the campaign.

   The Character tab builds someone once; this tab is where they live
   afterwards. It is the desk-sized counterpart to Tale Sheet's Sheet and Edit
   tabs, and deliberately shares their rules rather than their markup: every
   number here comes from VT.charbuild, VT.features, VT.actor and VT.coin, the
   same four modules the symbiote calls. The layout differs because a browser
   window is not a 320px in-game panel; the arithmetic does not.

   Everything in the roster is editable, characters and creatures alike. A
   character with build data re-derives properly on a level change; an imported
   statblock falls back to the same arithmetic the symbiote uses. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, el = U.el, SRD = VT.srd, FT = VT.fivetools;
  var SKILLS = SRD.SKILL_ABILITY;

  /* Tab-local state. The roster itself lives in VT.store.campaign. */
  var R = { id: null, hpAmount: 5, msg: null, filter: '', openFeat: {},
            castAt: {}, castPact: {} };
  var work, side, P;

  function sign(n) { return (n >= 0 ? '+' : '') + n; }

  /* ==== entry point ====================================================== */
  function render(w, s, parts) {
    work = w; side = s; P = parts;

    /* init() re-reads and re-parses localStorage, so calling it on every redraw
       would throw away the object every open control is holding a reference to -
       and a campaign with no maps comes back null, which would look exactly like
       an empty roster. Load once, then work with what is in memory. */
    if (!VT.store.campaign) {
      VT.store.init();
      if (!VT.store.campaign) VT.store.campaign = VT.store.blank('Sword Coast Skirmish');
    }
    VT.store.campaign.roster = VT.store.campaign.roster || [];

    renderList();

    work.appendChild(el('h2', { class: 'step' }, ['Roster']));
    work.appendChild(el('p', { class: 'step-sub' }, [
      'Everyone the campaign knows about. Level them, spend their resources, ' +
      'change any number on the sheet — the same rules the Tale Sheet symbiote uses.'
    ]));
    if (R.msg) {
      work.appendChild(el('div', { class: R.msg.cls + '-box', html: R.msg.text }));
      R.msg = null;
    }

    var a = active();
    if (!a) {
      work.appendChild(el('div', { class: 'panel' }, [
        el('h3', {}, [roster().length ? 'Pick someone' : 'Nobody here yet']),
        el('p', { class: 'tiny' }, [roster().length
          ? 'Choose an entry on the right to open their sheet.'
          : 'Build a character in the Character tab, forge a creature in the Creature tab, ' +
            'or import a JSON sheet from the panel on the right. Anything sent to the game ' +
            'roster appears here.'])
      ]));
      return;
    }
    renderEditor(a);
  }

  /* ==== roster plumbing ================================================== */
  function roster() { return VT.store.campaign.roster; }
  function active() {
    return roster().find(function (a) { return a.id === R.id; }) || null;
  }
  function redraw() { P.render(); }
  function flash(text, cls) { R.msg = { text: text, cls: cls || 'ok' }; }

  function save() {
    var r = VT.store.save();
    if (!r.ok) flash('Could not save: ' + U.esc(r.error), 'err');
    return r.ok;
  }
  function saveDraw() { save(); redraw(); }

  /* An actor arriving from the Character tab, an import or an old campaign may
     predate any given field. Fill in what play needs before touching it. */
  function ensureFields(a) {
    a.inventory = a.inventory || [];
    a.actions = a.actions || [];
    a.conditions = a.conditions || [];
    a.skillProf = a.skillProf || [];
    a.expertise = a.expertise || [];
    /* Entries saved before proficiencies existed carry no lists. Derive them
       from the build where the compendium can still resolve it, and otherwise
       leave them absent - absent costs nothing, a guess costs attack bonuses. */
    if (VT.proficiency) { VT.proficiency.backfill(a); VT.proficiency.tidy(a); }
    a.coins = a.coins || VT.coin.emptyPurse();
    a.slotsUsed = a.slotsUsed || {};
    a.used = a.used || {};
    a.abilities = a.abilities || { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 };
    if (a.hitDiceMax == null) a.hitDiceMax = a.level || 1;
    if (a.hitDiceUsed == null) a.hitDiceUsed = 0;
    return a;
  }

  /* ==== the list ========================================================= */
  function renderList() {
    var head = el('div', { class: 'sec-b' });
    head.appendChild(el('div', { class: 'rl-head' }, [
      el('span', {}, ['Campaign roster']),
      el('span', { class: 'tiny' }, [roster().length + ' entr' + (roster().length === 1 ? 'y' : 'ies')])
    ]));
    head.appendChild(el('div', { class: 'searchbar', style: { marginBottom: '8px' } }, [
      el('input', { type: 'text', placeholder: 'Filter by name', value: R.filter,
        onInput: function (e) { R.filter = e.target.value; redraw(); } })
    ]));

    side.appendChild(head);

    var q = R.filter.trim().toLowerCase();
    var shown = roster().filter(function (a) {
      return !q || String(a.name || '').toLowerCase().indexOf(q) >= 0;
    });

    shown.forEach(function (a) {
      ensureFields(a);
      var frac = U.clamp(a.hp / Math.max(1, a.hpMax), 0, 1);
      var card = el('div', { class: 'rl-item' + (a.id === R.id ? ' sel' : ''), onClick: function () {
        R.id = a.id; R.openFeat = {}; VT.choiceUI.reset(); redraw();
      } });
      try { card.appendChild(VT.actor.portrait(a, 34, 42)); } catch (e) {}
      card.appendChild(el('div', { class: 'rl-body' }, [
        el('div', { class: 'rl-nm' }, [a.name || 'Unnamed']),
        el('div', { class: 'tiny' }, [
          [a.raceName, a.className, a.level ? 'level ' + a.level : null, a.cr ? 'CR ' + a.cr : null]
            .filter(Boolean).join(' · ') || 'statblock'
        ]),
        el('div', { class: 'rl-hp' }, [
          el('i', { style: { width: (frac * 100) + '%',
            background: frac > .5 ? '#5d8f52' : frac > .25 ? '#a8873c' : '#8f4640' } })
        ])
      ]));
      card.appendChild(el('span', { class: 'rl-team ' + (a.team || 'party') }));
      side.appendChild(card);
    });

    if (!shown.length) {
      side.appendChild(el('div', { class: 'sec-b tiny' }, [
        roster().length ? 'Nothing matches that filter.' : 'The roster is empty.'
      ]));
    }

    var tools = el('div', { class: 'sec-b', style: { borderTop: '1px solid var(--line)' } });
    tools.appendChild(el('div', { class: 'btnrow' }, [
      P.btn('Import JSON…', importSheets, 'sm'),
      P.btn('New blank', function () {
        var a = ensureFields(VT.actor.base('New Character'));
        a.id = U.uid('tpl');
        a.team = 'party';
        a.spec = VT.spriteart.autoSpec(a.name);
        roster().push(a);
        R.id = a.id;
        flash('Blank sheet added. Every field below is yours to fill in.');
        saveDraw();
      }, 'sm')
    ]));
    tools.appendChild(el('p', { class: 'tiny', style: { marginTop: '8px' } }, [
      'The roster is shared with the game through this browser. Reload a game tab to pick up changes.'
    ]));
    side.appendChild(tools);
  }

  function importSheets() {
    var picker = U.$('#jsonPicker');
    picker.onchange = function () {
      var files = Array.prototype.slice.call(picker.files || []);
      picker.value = '';
      if (!files.length) return;
      var added = 0, failed = [];
      var jobs = files.map(function (f) {
        return f.text().then(function (txt) {
          var data = JSON.parse(txt);
          (Array.isArray(data) ? data : [data]).forEach(function (a) {
            if (!a || !a.name) throw new Error('not a sheet');
            delete a.__src;
            a.id = U.uid('tpl');
            roster().push(ensureFields(a));
            added++;
          });
        }).catch(function () { failed.push(f.name); });
      });
      Promise.all(jobs).then(function () {
        flash(added + ' imported' + (failed.length ? '. Could not read: ' + U.esc(failed.join(', ')) : '.'),
              failed.length ? 'warn' : 'ok');
        saveDraw();
      });
    };
    picker.click();
  }

  /* ==== the editor ======================================================= */
  function renderEditor(a) {
    ensureFields(a);
    var prof = VT.actor.prof(a);

    header(a, prof);
    classPanel(a);
    choicePanel(a);
    levelPanel(a, prof);
    corePanel(a);
    abilityPanel(a, prof);
    asiPanel(a);
    expertisePanel(a);
    skillPanel(a);
    proficiencyPanel(a);
    toolPanel(a);
    deathPanel(a);
    resourcePanel(a);
    slotPanel(a);
    coinPanel(a);
    inventoryPanel(a);
    actionPanel(a);
    featurePanel(a);
    conditionPanel(a);
    gearPanel(a);
    attunePanel(a);
    notesPanel(a);
    managePanel(a);
  }

  /* --- header: who they are and how they are doing --- */
  function header(a, prof) {
    var p = el('div', { class: 'panel' });
    var head = el('div', { class: 'sheet-head' });
    try { head.appendChild(VT.actor.portrait(a, 46, 58)); } catch (e) {}
    head.appendChild(el('div', {}, [
      el('div', { class: 'sheet-name' }, [a.name || 'Unnamed']),
      el('div', { class: 'sheet-sub' }, [
        [a.raceName, a.className + (a.subclassName ? ' (' + a.subclassName + ')' : ''),
         a.level ? 'level ' + a.level : null].filter(Boolean).join(' · ') || 'imported statblock'
      ])
    ]));
    p.appendChild(head);

    var acWhy = VT.actor.acSources(a);
    p.appendChild(el('div', { class: 'rstats' }, [
      bigstat('AC', VT.actor.effectiveAC(a), acWhy.join(', ')),
      bigstat('HP', a.hp + '/' + a.hpMax, a.tempHp ? '+' + a.tempHp + ' temp' : ''),
      bigstat('SPEED', VT.actor.speedOf(a) + ' ft', ''),
      bigstat('PROF', sign(prof), ''),
      bigstat('INIT', sign(VT.actor.abilityMod(a, 'dex')), ''),
      bigstat('PASSIVE', VT.actor.passivePerception(a), 'perception')
    ]));

    /* hit points */
    var frac = U.clamp(a.hp / Math.max(1, a.hpMax), 0, 1);
    p.appendChild(el('div', { class: 'hpbar-lg', style: { margin: '4px 0 8px' } }, [
      el('i', { style: { width: (frac * 100) + '%',
        background: frac > .5 ? 'linear-gradient(180deg,#8ec97f,#5d8f52)'
                  : frac > .25 ? 'linear-gradient(180deg,#e0c46a,#a8873c)'
                  : 'linear-gradient(180deg,#d97b74,#8f4640)' } }),
      el('span', {}, [a.hp + ' / ' + a.hpMax + (a.tempHp ? '  (+' + a.tempHp + ' temp)' : '')])
    ]));

    var amt = el('input', { type: 'number', value: R.hpAmount, min: 0,
      style: { width: '80px' },
      onInput: function (e) { R.hpAmount = Math.max(0, parseInt(e.target.value, 10) || 0); } });
    p.appendChild(el('div', { class: 'btnrow' }, [
      P.btn('− Damage', function () {
        var r = VT.actor.applyDamage(a, R.hpAmount, null);
        flash(U.esc(a.name) + ' takes ' + r.taken + (r.downed ? ' and drops.' : '.'), r.downed ? 'err' : 'ok');
        saveDraw();
      }, 'sm danger'),
      amt,
      P.btn('+ Heal', function () {
        var g = VT.actor.healBy(a, R.hpAmount);
        flash(U.esc(a.name) + ' recovers ' + g + '.');
        saveDraw();
      }, 'sm'),
      P.btn('Temp HP', function () {
        a.tempHp = Math.max(a.tempHp || 0, R.hpAmount);
        saveDraw();
      }, 'sm'),
      P.btn('Full heal', function () {
        a.hp = a.hpMax; saveDraw();
      }, 'sm')
    ]));

    /* rests — hit dice and the resources that come back with them */
    var diceLeft = (a.hitDiceMax || a.level || 0) - (a.hitDiceUsed || 0);
    p.appendChild(el('div', { class: 'btnrow', style: { marginTop: '10px' } }, [
      P.btn('Spend a hit die (d' + (a.hitDie || 8) + ')', function () {
        if (diceLeft <= 0) { flash('No hit dice left — only a long rest brings them back.', 'warn'); redraw(); return; }
        var con = VT.actor.abilityMod(a, 'con');
        var roll = VT.dice.roll('1d' + (a.hitDie || 8));
        var gain = Math.max(1, roll.total + con);
        a.hitDiceUsed = (a.hitDiceUsed || 0) + 1;
        VT.actor.healBy(a, gain);
        flash('Hit die: rolled ' + roll.total + ' + ' + sign(con) + ' CON = <b>' + gain +
              '</b> healed. ' + (diceLeft - 1) + ' dice left.');
        saveDraw();
      }, 'sm'),
      P.btn('Short rest', function () {
        VT.features.rest(a, 'short');
        flash('Short rest — short-rest resources' +
              (a.spellSlots && a.spellSlots.pact ? ' and pact slots' : '') +
              ' restored. Hit dice are yours to spend above.');
        saveDraw();
      }, 'sm'),
      P.btn('Long rest', function () {
        VT.features.rest(a, 'long');
        a.hp = a.hpMax;
        a.tempHp = 0;
        /* A long rest returns half your total hit dice, rounded down, minimum one. */
        var back = Math.max(1, Math.floor((a.hitDiceMax || a.level || 1) / 2));
        a.hitDiceUsed = Math.max(0, (a.hitDiceUsed || 0) - back);
        a.conditions = (a.conditions || []).filter(function (c) { return c === 'exhausted'; });
        (a.actions || []).forEach(function (act) { if (act.uses) delete a.used[act.name]; });
        flash('Long rest — full hit points, every resource and slot back, ' + back + ' hit dice recovered.');
        saveDraw();
      }, 'sm primary')
    ]));
    p.appendChild(el('p', { class: 'tiny', style: { marginTop: '6px' } }, [
      'Hit dice ' + diceLeft + '/' + (a.hitDiceMax || a.level || 0) + ' available.'
    ]));
    work.appendChild(p);
  }

  function bigstat(k, v, sub) {
    return el('div', {}, [
      el('div', { class: 'k' }, [k]),
      el('div', { class: 'v' }, [String(v)]),
      sub ? el('div', { class: 'tiny' }, [sub]) : null
    ]);
  }

  /* --- classes, and multiclassing --- */
  function classPanel(a) {
    if (!a.build) return;
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Classes'])]);
    VT.choiceUI.renderClasses(p, {
      actor: a,
      onChange: redraw,
      onLevel: function (i, lv) {
        var res = VT.charbuild.relevelClass(a, i, lv);
        if (!res.ok) { flash(U.esc(res.reason), 'err'); redraw(); return; }
        replace(a, res.actor);
        flash('Now ' + U.esc(res.actor.className) + ' — level ' + res.actor.level +
              ', ' + res.actor.hpMax + ' max HP.' + missingNote(res));
        saveDraw();
      },
      onAdd: function (rec) {
        var res = VT.charbuild.addClassLevel(a, rec, null);
        if (!res.ok) { flash(U.esc(res.reason), 'err'); redraw(); return; }
        replace(a, res.actor);
        flash('Took a level in ' + U.esc(rec.name) + ' — now ' + U.esc(res.actor.className) +
              '. Choose its subclass and options below when they come due.');

      }
    });
    work.appendChild(p);
  }

  /* --- the choice tree --- */
  function choicePanel(a) {

    ]));
    p.appendChild(el('div', { class: 'grid3' }, [

        a.spellDC = v || null; saveDraw();
      })),

  /* --- abilities and saving throws, side by side --- */

    var grid = el('div', { class: 'abilgrid' });

      /* The feature engine owns the save total, so a paladin's aura shows up
         here without this panel knowing anything about paladins. */
      var plain = VT.actor.saveMod(a, k);

      var isProf = (a.saveProf || []).indexOf(k) >= 0;
      grid.appendChild(el('div', { class: 'abilcell' }, [
        el('div', { class: 'k' }, [SRD.ABILITY_NAME[k]]),
        el('div', { class: 'stepper' }, [
          el('button', { onClick: function () {
            a.abilities[k] = Math.max(1, a.abilities[k] - 1); saveDraw();
          } }, ['−']),
          el('span', { class: 'v' }, [String(a.abilities[k])]),
          el('button', { onClick: function () {
            a.abilities[k] = Math.min(30, a.abilities[k] + 1); saveDraw();
          } }, ['+'])
        ]),
        el('div', { class: 'm' }, [sign(VT.actor.abilityMod(a, k))]),
        el('button', { class: 'savebtn' + (isProf ? ' on' : ''), title: 'Toggle save proficiency',

      'Changing Constitution does not re-roll hit points — adjust Max HP above, or re-derive ' +
      'from the build to recalculate it properly.'
    ]));

  }

  /* --- ability score improvements --- */
  function asiPanel(a) {
    var asi = a.asiStatus;
    if (!asi || !asi.earned) return;
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Ability Score Improvements'])]);
    p.appendChild(el('div', { class: asi.left ? 'warn-box' : 'ok-box' }, [
      asi.spent + ' of ' + asi.earned + ' assigned' + (asi.left ? ' — ' + asi.left + ' still to spend.' : '.')
    ]));
    (a.build && a.build.asi || []).forEach(function (entry, i) {
      p.appendChild(el('div', { class: 'linerow' }, [
        el('span', { class: 'grow' }, [
          Object.keys(entry.picks || {}).map(function (k) {
            return SRD.ABILITY_NAME[k] + ' ' + sign(entry.picks[k]);
          }).join(', ') || 'empty'
        ]),
        P.btn('×', function () {
          a.build.asi.splice(i, 1);
          rederive(a, 'Improvement removed.');
        }, 'sm danger')
      ]));
    });
    if (asi.left > 0) {
      var mode = 'two', pickA = 'str', pickB = 'dex';
      var opts = SRD.ABILITIES.map(function (k) { return { value: k, label: SRD.ABILITY_NAME[k] }; });
      var selB = P.selectEl(opts, pickB, function (v) { pickB = v; });
      var wrapB = el('div', { class: 'grow' }, [selB]);
      p.appendChild(el('div', { class: 'linerow', style: { marginTop: '8px' } }, [
        P.selectEl([{ value: 'two', label: '+1 to two abilities' },
                    { value: 'one', label: '+2 to one ability' }], mode, function (v) {
          mode = v;
          wrapB.classList.toggle('hidden', v !== 'two');
        }),
        P.selectEl(opts, pickA, function (v) { pickA = v; }),
        wrapB,
        P.btn('Assign', function () {
          var picks = {};
          if (mode === 'one') picks[pickA] = 2;
          else { picks[pickA] = (picks[pickA] || 0) + 1; picks[pickB] = (picks[pickB] || 0) + 1; }
          a.build = a.build || {};
          a.build.asi = (a.build.asi || []).concat([{ picks: picks }]);
          rederive(a, 'Ability scores improved.');
        }, 'sm primary')
      ]));
      p.appendChild(el('p', { class: 'tiny' }, [
        'Scores cap at 20. Taking a feat instead of the increase? Record it as a custom action ' +
        'or in Notes — feats are not modelled mechanically.'
      ]));
    }
    work.appendChild(p);
  }

  /* --- expertise --- */
  function expertisePanel(a) {
    if (!a.expertiseSlots) return;
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Expertise'])]);
    p.appendChild(el('div', { class: a.expertise.length < a.expertiseSlots ? 'warn-box' : 'ok-box' }, [
      a.expertise.length + ' of ' + a.expertiseSlots + ' chosen — these skills use double proficiency.'
    ]));
    var box = el('div', { class: 'chiprow' });
    Object.keys(SKILLS).sort().forEach(function (name) {
      var on = a.expertise.indexOf(name) >= 0;
      var canPick = on || a.expertise.length < a.expertiseSlots;
      box.appendChild(el('span', {
        class: 'chip' + (on ? ' good' : ''),
        style: { opacity: canPick ? 1 : .3, cursor: canPick ? 'pointer' : 'default' },
        onClick: function () {
          if (!canPick) return;
          if (on) a.expertise = a.expertise.filter(function (x) { return x !== name; });
          else a.expertise.push(name);
          if (a.build) a.build.expertise = a.expertise.slice();
          saveDraw();
        }
      }, [U.cap(name)]));
    });
    p.appendChild(box);
    p.appendChild(el('p', { class: 'tiny' }, [
      'Rogues and bards normally take expertise in skills they are already proficient in.'
    ]));
    work.appendChild(p);
  }

  /* --- skills --- */
  function skillPanel(a) {
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Skills'])]);
    var grid = el('div', { class: 'skillgrid' });
    Object.keys(SKILLS).sort().forEach(function (name) {
      /* One call, and expertise and Jack of All Trades are already in it. */
      var mod = VT.features.skillMod(a, name);
      var src = VT.features.skillSource(a, name);
      var isProf = a.skillProf.indexOf(name) >= 0;
      var isExp = a.expertise.indexOf(name) >= 0;
      grid.appendChild(el('div', { class: 'skillrow' + (src ? ' lit' : ''), onClick: function () {
        if (isProf) a.skillProf = a.skillProf.filter(function (s) { return s !== name; });
        else a.skillProf.push(name);
        saveDraw();
      }, title: 'Click to toggle proficiency' }, [
        el('span', { class: 'pip' + (isExp ? ' exp' : isProf ? ' on' : '') }),
        el('span', { class: 'grow' }, [U.cap(name),
          el('span', { class: 'tiny' }, ['  ' + SRD.ABILITY_NAME[SKILLS[name]] +
            (src && src !== 'proficient' ? ' · ' + src : '')])]),
        el('span', { class: 'skillmod' }, [sign(mod)])
      ]));
    });
    p.appendChild(grid);
    p.appendChild(el('p', { class: 'tiny' }, [
      'Filled pip: proficient. Gold pip: expertise. Passive Perception ' +
      VT.actor.passivePerception(a) + '.'
    ]));
    work.appendChild(p);
  }

  /* --- languages, armour and weapons ---
     The desk-sized twin of Tale Sheet's Proficiencies card. Armour and weapons
     are shown as every kind with the trained ones lit, because "no heavy" is
     the answer to "why is my wizard rolling badly", and a list of only what you
     have cannot say it.

     Each change goes back through gear.recompute(), which re-reads the armour
     penalty and puts each weapon's proficiency bonus back on or takes it off. */
  function proficiencyPanel(a) {
    var PR = VT.proficiency;
    if (!PR) return;
    /* Held locally and written onto the character only when something is
       actually changed - opening the panel must not turn "we were never told"
       into "trained in nothing". */
    var armourList = (a.armorProf || []).slice();
    var weaponList = (a.weaponProf || []).slice();
    var langList = (a.langProf || []).slice();

    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Proficiencies'])]);
    if (a.armorUnskilled) p.appendChild(el('div', { class: 'warn-box' }, [a.armorUnskilled.note]));
    /* Creatures and hand-imported statblocks have no training recorded, which
       is not the same as being untrained - say which it is rather than letting
       four empty rows imply the wrong one. */
    if (!Array.isArray(a.armorProf) && !Array.isArray(a.weaponProf)) {
      p.appendChild(el('p', { class: 'tiny' }, [
        'Nothing recorded — this entry came in as a statblock rather than a build, ' +
        'so no penalty is applied. Anything you switch on below starts being enforced.'
      ]));
    }

    function commit() {
      a.armorProf = armourList; a.weaponProf = weaponList; a.langProf = langList;
      if (a.build) {
        a.build.armorProf = armourList.slice();
        a.build.weaponProf = weaponList.slice();
        a.build.langProf = langList.slice();
      }
      VT.gear.recompute(a);
      saveDraw();
    }

    function chips(label, list, kinds, hint) {
      p.appendChild(el('div', { class: 'tiny' }, [label]));
      var box = el('div', { class: 'chiprow' });
      kinds.forEach(function (k) {
        var on = list.indexOf(k) >= 0;
        box.appendChild(el('span', { class: 'chip' + (on ? ' good' : ''), title: hint,
          onClick: function () {
            var i = list.indexOf(k);
            if (i >= 0) list.splice(i, 1); else list.push(k);
            commit();
          } }, [U.cap(k)]));
      });
      /* Granted by name rather than by kind - a race's longsword training, or
         something a DM handed out. Click to take it away again. */
      list.filter(function (k) { return kinds.indexOf(k) < 0; }).forEach(function (k) {
        box.appendChild(el('span', { class: 'chip good', title: 'Click to remove',
          onClick: function () {
            list.splice(list.indexOf(k), 1);
            commit();
          } }, [U.cap(k) + ' ×']));
      });
      p.appendChild(box);
    }

    chips('Armour', armourList, PR.ARMOUR_KINDS,
      'Armour you are not trained in: disadvantage on Strength and Dexterity ' +
      'checks, saves and attacks, and no spellcasting.');
    chips('Weapons', weaponList, PR.WEAPON_KINDS,
      'A weapon you are not trained in does not add your proficiency bonus.');

    p.appendChild(el('div', { class: 'tiny' }, ['Languages']));
    var lbox = el('div', { class: 'chiprow' });
    if (!langList.length) lbox.appendChild(el('span', { class: 'tiny' }, ['None recorded.']));
    langList.forEach(function (l) {
      lbox.appendChild(el('span', { class: 'chip good', title: 'Click to remove',
        onClick: function () {
          langList = langList.filter(function (x) { return x !== l; });
          commit();
        } }, [U.cap(l) + ' ×']));
    });
    p.appendChild(lbox);
    if (a.langChoices) {
      p.appendChild(el('div', { class: 'warn-box' }, [
        a.langChoices + ' language' + (a.langChoices > 1 ? 's' : '') +
        ' of your choice still to pick — the race or background grants them ' +
        'without saying which.'
      ]));
    }

    /* Adding by hand. Languages and named weapons are open-ended lists, so
       there is nothing to toggle - you type what the DM gave you. */
    function adder(label, list, placeholder) {
      var typed = '';
      var input = el('input', { type: 'text', class: 'grow', placeholder: placeholder,
        onInput: function (e) { typed = e.target.value; } });
      p.appendChild(el('div', { class: 'linerow' }, [
        el('span', { class: 'tiny' }, [label]), input,
        P.btn('Add', function () {
          var v = PR.clean(typed);
          if (!v) return;
          if (list.indexOf(v) < 0) list.push(v);
          flash('Proficient with ' + U.esc(U.cap(v)) + '.');
          commit();
        }, 'sm primary')
      ]));
    }
    adder('Language', langList, 'Elvish');
    adder('Weapon', weaponList, 'Longsword');

    p.appendChild(el('p', { class: 'tiny' }, [
      'Class, race and background training is worked out on the Character tab and ' +
      'comes back on a level-up. What you add here is kept.'
    ]));
    work.appendChild(p);
  }

  /* --- tools --- */
  var TOOL_ABILITY = {
    "thieves' tools": 'dex', 'thieves tools': 'dex', 'disguise kit': 'cha',
    'forgery kit': 'dex', 'herbalism kit': 'int', "healer's kit": 'wis',
    "navigator's tools": 'int', "poisoner's kit": 'int', "cartographer's tools": 'int',
    "alchemist's supplies": 'int', "brewer's supplies": 'int', "cook's utensils": 'wis',
    "smith's tools": 'str', "mason's tools": 'str', "carpenter's tools": 'str'
  };

  function toolPanel(a) {
    a.toolProf = a.toolProf || [];
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Tools'])]);
    var prof = VT.actor.prof(a);
    if (!a.toolProf.length) {
      p.appendChild(el('p', { class: 'tiny' }, [
        'No tool proficiencies. A rogue gets thieves’ tools, a druid a herbalism kit; ' +
        'the ones a class lets you choose are on the Choices panel above.'
      ]));
    }
    a.toolProf.forEach(function (t, i) {
      /* Which ability a tool check uses is the DM’s call and moves with the
         task - picking a lock is Dexterity, spotting a forgery Intelligence. */
      var abil = TOOL_ABILITY[String(t).toLowerCase()] || 'dex';
      p.appendChild(el('div', { class: 'linerow' }, [
        el('span', { class: 'grow' }, [U.cap(t),
          el('span', { class: 'tiny' }, ['  ' + SRD.ABILITY_NAME[abil] + ' + proficiency'])]),
        el('span', { class: 'skillmod' }, [sign(VT.actor.abilityMod(a, abil) + prof)]),
        P.btn('×', function () { a.toolProf.splice(i, 1); saveDraw(); }, 'sm danger')
      ]));
    });
    var add = '';
    p.appendChild(el('div', { class: 'linerow', style: { marginTop: '8px' } }, [
      el('input', { type: 'text', class: 'grow', placeholder: 'Add a tool proficiency',
        onInput: function (e) { add = e.target.value; } }),
      P.btn('Add', function () {
        if (!add.trim()) return;
        a.toolProf.push(add.trim());
        flash('Proficient with ' + U.esc(add.trim()) + '.');
        saveDraw();
      }, 'sm primary')
    ]));
    work.appendChild(p);
  }

  /* --- death saves --- */
  function deathPanel(a) {
    if (a.hp > 0 && !(a.deathSaves && (a.deathSaves.s || a.deathSaves.f))) return;
    var ds = VT.actor.deathSaveState(a);
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Death saves'])]);
    ['s', 'f'].forEach(function (which) {
      var row = el('div', { class: 'linerow' }, [
        el('span', { class: 'grow' }, [which === 's' ? 'Successes' : 'Failures'])
      ]);
      var pips = el('span', { class: 'dspips' });
      for (var i = 0; i < 3; i++) {
        pips.appendChild(el('span', {
          class: 'dspip ' + (which === 's' ? 'ok' : 'bad') + (i < ds[which] ? ' on' : ''),
          onClick: (function (n) {
            return function () { ds[which] = (ds[which] === n ? n - 1 : n); saveDraw(); };
          })(i + 1)
        }));
      }
      row.appendChild(pips);
      p.appendChild(row);
    });
    var outcome = VT.actor.deathSaveOutcome(a);
    if (outcome === 'dead') p.appendChild(el('div', { class: 'err-box' }, ['Three failures — dead.']));
    else if (a.stable) p.appendChild(el('div', { class: 'ok-box' }, ['Stable.']));
    p.appendChild(el('div', { class: 'btnrow' }, [
      P.btn('Roll a save', function () {
        var r = VT.dice.roll('1d20');
        var res = VT.actor.deathSave(a, r.total);
        flash('Death save ' + r.total + ' — ' + res.result +
              (res.outcome ? ' (' + res.outcome + ')' : '') + '.',
              res.result === 'success' || res.result === 'revived' ? 'ok' : 'err');
        saveDraw();
      }, 'sm primary'),
      P.btn('Clear', function () { VT.actor.clearDeathSaves(a); saveDraw(); }, 'sm')
    ]));
    work.appendChild(p);
  }

  /* --- resources: ki, rage, bardic inspiration, superiority dice --- */
  function resourcePanel(a) {
    if (!(a.resources || []).length) return;
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Resources'])]);
    a.resources.forEach(function (r) {
      var left = r.max - r.used;
      p.appendChild(el('div', { class: 'linerow' }, [
        el('span', { class: 'grow' }, [r.name, el('span', { class: 'tiny' }, ['  per ' + r.per + ' rest'])]),
        P.btn('+', function () { VT.features.restore(a, r.key); saveDraw(); }, 'sm'),
        el('span', { class: 'ctr', style: { color: left ? 'var(--green)' : 'var(--red)' } },
          [left + ' / ' + r.max]),
        P.btn('−', function () {
          if (VT.features.spend(a, r.key)) saveDraw();
        }, 'sm'),
        P.btn('max', function () {
          var v = prompt('New maximum for ' + r.name, String(r.max));
          if (v == null) return;
          r.max = Math.max(0, parseInt(v, 10) || 0);
          r.used = Math.min(r.used, r.max);
          saveDraw();
        }, 'sm')
      ]));
    });
    p.appendChild(el('p', { class: 'tiny' }, [
      'Maximums come from the class table, but override any of them if your table rules differently. ' +
      'Re-deriving from the build resets them.'
    ]));
    work.appendChild(p);
  }

    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Spell slots'])]);
    if (a.spellSlots.pact) {

        el('span', { class: 'ctr', style: { color: left ? 'var(--green)' : 'var(--red)' } },

      ]));

          el('span', { class: 'ctr', style: { color: left ? 'var(--green)' : 'var(--red)' } },
            [left + ' / ' + max]),
          P.btn('−', function () {
            if (left <= 0) return;
            a.slotsUsed[lv] = (a.slotsUsed[lv] || 0) + 1; saveDraw();
          }, 'sm')
        ]));
      });
    }
    p.appendChild(el('div', { class: 'btnrow', style: { marginTop: '8px' } }, [
      P.btn('Restore all slots', function () { a.slotsUsed = {}; saveDraw(); }, 'sm')
    ]));

  /* --- coin --- */
  function coinPanel(a) {
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Coin'])]);
    var cells = VT.coin.denoms().map(function (d) {
      return P.row(d.name + ' (' + d.key + ')', P.numEl(a.coins[d.key] || 0, 0, 999999, function (v) {
        a.coins[d.key] = Math.max(0, v | 0); saveDraw();
      }));
    });
    p.appendChild(el('div', { class: 'grid3' }, cells));
    p.appendChild(el('div', { class: 'ok-box' }, [
      'Carrying ' + VT.coin.format(a.coins) + '  (' + VT.coin.toBase(a.coins) + ' cp)'
    ]));
    var amount = '';
    p.appendChild(el('div', { class: 'linerow' }, [
      el('input', { type: 'text', class: 'grow', placeholder: 'e.g. 12 gp, 5sp 3cp, or a number of copper',
        onInput: function (e) { amount = e.target.value; } }),
      P.btn('Earn', function () {
        var base = VT.coin.parse(amount);
        if (!base) { flash('Could not read "' + U.esc(amount) + '" as an amount.', 'err'); redraw(); return; }
        a.coins = VT.coin.add(a.coins, base);
        flash('Added ' + VT.coin.format(VT.coin.fromBase(base)) + '.');
        saveDraw();
      }, 'sm primary'),
      P.btn('Spend', function () {
        var base = VT.coin.parse(amount);
        if (!base) { flash('Could not read "' + U.esc(amount) + '" as an amount.', 'err'); redraw(); return; }
        var left = VT.coin.spend(a.coins, base);
        if (!left) { flash('Not enough coin — ' + VT.coin.format(a.coins) + ' on hand.', 'err'); redraw(); return; }
        a.coins = left;
        flash('Spent ' + VT.coin.format(VT.coin.fromBase(base)) + '.');
        saveDraw();
      }, 'sm')
    ]));
    work.appendChild(p);
  }

  /* --- inventory --- */
  function inventoryPanel(a) {
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Inventory — ' + a.inventory.length])]);
    a.inventory.forEach(function (it, i) {
      p.appendChild(el('div', { class: 'linerow' }, [
        el('input', { type: 'text', class: 'grow', value: it.name,

          onInput: function (e) { it.note = e.target.value; save(); } }),

      ]));
    });
    var nm = '', qty = 1, note = '';

    ]));

  /* --- actions --- */
  function actionPanel(a) {
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Actions — ' + a.actions.length])]);
    a.actions.forEach(function (act, i) {
      var box = P.actionEditor(a, act, i);
      if (act.spellLevel) box.appendChild(castRow(a, act));
      if (act.custom) box.appendChild(el('div', { class: 'tiny' }, ['added by hand — survives a level-up']));
      p.appendChild(box);
    });
    p.appendChild(el('div', { class: 'btnrow' }, [
      P.btn('+ Melee', function () {
        var sm = VT.actor.abilityMod(a, 'str');
        a.actions.push(Object.assign(SRD.melee('New Attack', VT.actor.prof(a) + sm,
          '1d6' + (sm ? sign(sm) : ''), 'slashing'), { custom: true }));
        saveDraw();
      }, 'sm'),
      P.btn('+ Ranged', function () {
        var dm = VT.actor.abilityMod(a, 'dex');
        a.actions.push(Object.assign(SRD.ranged('New Shot', VT.actor.prof(a) + dm,
          '1d6' + (dm ? sign(dm) : ''), 'piercing', 80, 320), { custom: true }));
        saveDraw();
      }, 'sm'),
      P.btn('+ Area', function () {
        a.actions.push(Object.assign(SRD.saveSpell('New Blast', 'dex', a.spellDC || 13,
          '3d6', 'fire', 15, 60), { custom: true }));
        saveDraw();
      }, 'sm'),
      P.btn('+ Effect', function () {
        a.actions.push({ name: 'New Effect', kind: 'buff', condition: 'blessed',
                         range: [0, 30], cost: 'action', custom: true, desc: '' });
        saveDraw();
      }, 'sm')
    ]));
    work.appendChild(p);
  }

  /* A levelled spell can be cast with a bigger slot. Show what it does at each,
     and spend the slot from here. */
  function castRow(a, act) {
    var slot = R.castAt[act.name] || act.spellLevel;
    var shot = VT.upcast.at(act, slot);
    var opts = VT.upcast.slotOptions(a, act);
    var row = el('div', { class: 'castrow' });
    if (!opts.length) {
      row.appendChild(el('span', { class: 'sub' }, [
        'No slot of ' + U.ord(act.spellLevel) + ' level or higher.']));
      return row;
    }
    row.appendChild(el('span', { class: 'sub' }, ['cast at']));
    opts.forEach(function (o) {
      row.appendChild(el('button', {
        class: 'slotpip' + (o.level === slot ? ' on' : '') + (o.left <= 0 ? ' out' : ''),
        title: (o.pact ? 'Pact slot' : U.ord(o.level) + ' level') + ' — ' + o.left + ' of ' + o.max + ' left',
        onClick: function () { R.castAt[act.name] = o.level; R.castPact[act.name] = !!o.pact; redraw(); }
      }, [(o.pact ? 'P' : String(o.level)) + '·' + o.left]));
    });
    row.appendChild(el('span', { class: 'sub' }, [
      '  ' + (shot.count > 1 ? shot.count + '×' : '') + shot.dmg +
      (shot.note ? '  ' + shot.note : '')
    ]));
    var chosen = opts.filter(function (o) {
      return o.level === slot && (!!o.pact === !!R.castPact[act.name]);
    })[0] || opts.filter(function (o) { return o.level === slot; })[0];
    row.appendChild(P.btn('Spend slot', function () {
      if (!chosen || !VT.upcast.spendSlot(a, chosen)) { flash('No slot left at that level.', 'err'); redraw(); return; }
      flash(U.esc(act.name) + ' cast at ' + U.ord(chosen.level) + (chosen.pact ? ' (pact)' : '') +
            ' — ' + (shot.count > 1 ? shot.count + '×' : '') + shot.dmg + '.');
      saveDraw();
    }, 'sm' + (!chosen || chosen.left <= 0 ? ' danger' : '')));
    return row;
  }

  /* --- features --- */
  function featurePanel(a) {
    if (!(a.features || []).length) return;
    var notes = a.featureNotes || {};
    var applied = Object.keys(notes).length;
    var p = el('div', { class: 'panel' }, [
      el('h3', {}, ['Features — ' + a.features.length]),
      el('p', { class: 'tiny', style: { marginTop: '-6px', marginBottom: '10px' } }, [
        applied + ' of these are wired into the numbers above; the rest are printed text. ' +
        'Click any feature to read it.'
      ])
    ]);
    var byLevel = {};
    a.features.forEach(function (f) { (byLevel[f.level] = byLevel[f.level] || []).push(f); });
    Object.keys(byLevel).map(Number).sort(function (x, y) { return x - y; }).forEach(function (lv) {
      p.appendChild(el('div', { class: 'featlvl' }, ['Level ' + lv]));
      byLevel[lv].forEach(function (f) {
        var key = lv + ':' + f.name;
        var open = !!R.openFeat[key];
        var body = el('div', { class: 'feattext' + (open ? '' : ' hidden') });
        if (open) {
          var txt = VT.charbuild.featureText(f, (a.build && a.build.cls && a.build.cls.name) || a.className || '');
          body.textContent = (notes[f.name] ? '▸ ' + notes[f.name] + '\n\n' : '') +
            (txt || 'Text unavailable — connect your 5etools data source.');
        }
        p.appendChild(el('div', { class: 'linerow feathead', onClick: function () {
          R.openFeat[key] = !open; redraw();
        } }, [
          el('span', { class: 'grow' }, [f.name,
            f.subclass ? el('span', { class: 'tiny' }, ['  subclass']) : null]),
          notes[f.name] ? el('span', { class: 'chip good' }, ['applied']) : null
        ]));
        p.appendChild(body);
      });
    });
    work.appendChild(p);
  }

  /* --- conditions --- */
  function conditionPanel(a) {
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Conditions'])]);
    var box = el('div', { class: 'chiprow' });
    Object.keys(SRD.CONDITIONS).forEach(function (k) {
      var on = a.conditions.indexOf(k) >= 0;
      box.appendChild(el('span', { class: 'chip' + (on ? ' bad' : ''), onClick: function () {
        if (on) VT.actor.removeCond(a, k); else VT.actor.addCond(a, k);
        saveDraw();
      } }, [SRD.CONDITIONS[k].name]));
    });
    p.appendChild(box);
    p.appendChild(el('p', { class: 'tiny' }, [
      'These apply on the battle map and to the effective AC above — Hasted adds +2, Shielded +5.'
    ]));
    work.appendChild(p);
  }

  /* --- gear from the loaded books --- */
  function gearPanel(a) {
    if (!a.build) return;
    var p = el('div', { class: 'panel' }, [el('h3', {}, ['Gear & spells from your data'])]);
    if (!FT.loaded) {
      p.appendChild(el('div', { class: 'warn-box' }, [
        'Connect a data source to add weapons, armour and spells from the books. ' +
        'You can still add actions by hand above.'
      ]));
      work.appendChild(p);
      return;
    }
    var items = FT.get('item');
    p.appendChild(picker('Add a weapon', items.filter(function (i) { return i.weapon || i.dmg1; }),
      function (rec) { addToBuild(a, 'weapons', rec); }));
    p.appendChild(picker('Add a spell', FT.get('spell'),
      function (rec) { addToBuild(a, 'spells', rec); },
      function (s) { return s.name + (s.level ? ' · level ' + s.level : ' · cantrip'); }));
    /* By type, not by the `armor` flag. Only the 25 plain armours carry that
       flag; every magic one - "+1 Plate Armor", "Adamantine Half Plate",
       "Elven Chain" - is typed LA/MA/HA/S and would otherwise be invisible. */
    p.appendChild(picker('Wear armour', items.filter(isArmour),
      function (rec) {
        a.build.armor = { name: rec.name, source: rec.source || null };
        rederive(a, 'Equipped ' + U.esc(rec.name) + '.');
      },
      function (i) { return i.name + ' · AC ' + i.ac; }));

    var have = [];
    if (a.build.armor) have.push('armour: ' + a.build.armor.name);
    if (a.build.shield) have.push('shield');
    if ((a.build.weapons || []).length) have.push('weapons: ' + a.build.weapons.map(function (w) { return w.name; }).join(', '));
    if ((a.build.spells || []).length) have.push((a.build.spells || []).length + ' spells');

    p.appendChild(el('div', { class: 'btnrow', style: { marginTop: '10px' } }, [
      P.btn(a.build.shield ? 'Shield equipped ✓' : 'Equip shield (+2 AC)', function () {
        a.build.shield = !a.build.shield;
        rederive(a, a.build.shield ? 'Shield equipped.' : 'Shield removed.');
      }, 'sm' + (a.build.shield ? ' on' : '')),
      a.build.armor ? P.btn('Remove armour', function () {
        a.build.armor = null; rederive(a, 'Armour removed.');
      }, 'sm danger') : null,
      (a.build.weapons || []).length ? P.btn('Clear weapons', function () {
        a.build.weapons = []; rederive(a, 'Weapons cleared.');
      }, 'sm danger') : null
    ]));
    if (have.length) p.appendChild(el('p', { class: 'tiny' }, ['Currently — ' + have.join(' · ')]));
    p.appendChild(el('p', { class: 'tiny' }, [
      'Adding gear re-derives the sheet, so attack lines, AC and the spell list all update together.'
    ]));
    work.appendChild(p);
  }

  var ARMOUR_TYPES = ['LA', 'MA', 'HA', 'S'];
  function typeOf(i) { return String(i.type || '').split('|')[0]; }
  function isArmour(i) { return ARMOUR_TYPES.indexOf(typeOf(i)) >= 0 || (i.armor && i.ac); }
  /* Anything you would call a magic item: it has a rarity, or it wants
     attuning. Weapons and armour have their own pickers already. */
