<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Forge — Virtual Tactics</title>
<style>
/* Virtual Tactics - dark tactical UI, Ivalice-adjacent */
:root{
  --bg:#0e0d13; --bg2:#16141d; --panel:#1c1a25; --panel2:#252231;
  --ink:#e8e3d5; --ink-dim:#a49c86; --ink-faint:#6f6857;
  --gold:#d8b25c; --gold-dim:#8f7534; --blue:#5f9ecf; --green:#78b06a;
  --red:#c9605a; --purple:#9a76c4; --line:#332f42;
  --party:#5f9ecf; --foe:#c9605a; --neutral:#c8a44c;
  --shadow:0 6px 24px rgba(0,0,0,.55);
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden; user-select:none;
}
.hidden{display:none !important}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit}

#app{display:flex;flex-direction:column;height:100vh}

/* Top bar */
#topbar{
  display:flex;align-items:center;gap:14px;padding:0 12px;height:46px;
  background:linear-gradient(180deg,#221f2c,#16141d);
  border-bottom:1px solid var(--line);flex:none;z-index:20;
}
.brand{font-family:var(--serif);letter-spacing:.16em;font-size:14px;color:var(--gold)}
.brand .rune{color:var(--gold-dim)}
.spacer{flex:1}
#modes{display:flex;gap:2px;background:#12111a;border:1px solid var(--line);border-radius:6px;padding:2px}
.mode-btn{padding:5px 16px;border-radius:4px;color:var(--ink-dim);letter-spacing:.05em}
.mode-btn:hover{color:var(--ink);background:#221f2c}
.mode-btn.active{background:var(--gold-dim);color:#141019;font-weight:600}
#topActions{display:flex;align-items:center;gap:4px}
.tb{padding:5px 10px;border:1px solid transparent;border-radius:4px;color:var(--ink-dim)}
.tb:hover{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.divider{width:1px;height:20px;background:var(--line);margin:0 4px}

/* Initiative strip */
#initStrip{
  display:flex;gap:6px;align-items:flex-end;padding:8px 12px;flex:none;
  background:#12111a;border-bottom:1px solid var(--line);overflow-x:auto;
}
.init-card{
  position:relative;width:58px;flex:none;border:1px solid var(--line);border-radius:5px;
  background:var(--panel);padding:3px;cursor:pointer;transition:transform .12s,border-color .12s;
}
.init-card:hover{transform:translateY(-3px)}
.init-card.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 4px 14px rgba(216,178,92,.25);transform:translateY(-4px)}
.init-card.dead{opacity:.35;filter:grayscale(1)}
.init-card canvas,.init-card img{display:block;width:100%;height:42px;object-fit:contain;image-rendering:pixelated}
.init-card .nm{font-size:9px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-dim)}
.init-card .hpbar{height:3px;background:#3a1f22;border-radius:2px;overflow:hidden;margin-top:2px}
.init-card .hpbar i{display:block;height:100%;background:var(--green)}
.init-card .tag{position:absolute;top:-1px;left:-1px;width:6px;height:6px;border-radius:50%}
.init-card .ini{position:absolute;top:1px;right:3px;font:10px/1 var(--mono);color:var(--gold)}

/* Main */
#main{flex:1;display:flex;min-height:0}
#stageWrap{position:relative;flex:1;min-width:0;background:
  radial-gradient(ellipse at 50% 38%,#1d1b28 0%,#0b0a10 78%)}
#stage{display:block;width:100%;height:100%;cursor:crosshair}
#stageHint{
  position:absolute;left:12px;bottom:10px;font:11px var(--mono);color:var(--ink-faint);
  pointer-events:none;text-shadow:0 1px 3px #000
}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floater{
  position:absolute;font:700 15px/1 var(--serif);text-shadow:0 2px 4px #000,0 0 8px #000;
  animation:floatUp 1.15s ease-out forwards;white-space:nowrap
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  15%{opacity:1;transform:translate(-50%,-8px) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1)}
}

/* Side panel */
#side{
  width:308px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden
}
#side::-webkit-scrollbar,#logBody::-webkit-scrollbar,#initStrip::-webkit-scrollbar{width:9px;height:9px}
#side::-webkit-scrollbar-thumb,#logBody::-webkit-scrollbar-thumb,#initStrip::-webkit-scrollbar-thumb{
  background:#38344a;border-radius:5px}
.sec{border-bottom:1px solid var(--line)}
.sec-h{
  padding:8px 12px;font-family:var(--serif);letter-spacing:.13em;font-size:11px;
  text-transform:uppercase;color:var(--gold);background:#191722;
  display:flex;align-items:center;gap:8px
}
.sec-h .sh-right{margin-left:auto;color:var(--ink-faint);letter-spacing:0;font-size:10px}
.sec-b{padding:10px 12px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row>label{width:78px;flex:none;color:var(--ink-dim);font-size:11px}
/* A .row is a flex row, so making the label full-width squeezed the control
   next to it down to a sliver — which read as a stray scrollbar beside a
   missing field. Stack them instead, which is what 'wide' always meant. */
.row.wide{flex-direction:column;align-items:stretch}
.row.wide>label{width:100%;margin-bottom:3px}
.row.wide>textarea{min-height:52px;resize:vertical}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],select,textarea{
  background:#100f16;border:1px solid var(--line);color:var(--ink);
  padding:4px 7px;border-radius:4px;width:100%;font-size:12px
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-dim)}
input[type=range]{width:100%;accent-color:var(--gold)}
.btn{
  padding:6px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);
  color:var(--ink);text-align:center;transition:.12s
}
.btn:hover{background:#302b40;border-color:var(--gold-dim)}
.btn.primary{background:var(--gold-dim);color:#151019;border-color:var(--gold);font-weight:600}
.btn.primary:hover{background:var(--gold)}
.btn.danger:hover{background:#5e2a2a;border-color:var(--red);color:#ffd9d6}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.full{width:100%}
.btn.on{background:var(--gold-dim);color:#151019;border-color:var(--gold)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

/* palettes */
.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.swatch{
  position:relative;height:46px;border:1px solid var(--line);border-radius:4px;overflow:hidden;
  cursor:pointer;display:flex;align-items:flex-end;justify-content:center
}
.swatch:hover{border-color:var(--gold-dim)}
.swatch.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.swatch canvas{position:absolute;inset:0;width:100%;height:100%}
.swatch span{
  position:relative;font-size:9px;background:rgba(8,7,12,.82);width:100%;text-align:center;
  padding:1px 0;color:var(--ink-dim)
}
.swatch.sel span{color:var(--gold)}

/* stat block */
.statline{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px dotted #2c2839}
.statline b{color:var(--ink);font-weight:600}
.abils{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;margin:8px 0}
.abil{background:#131119;border:1px solid var(--line);border-radius:4px;padding:4px 0}
.abil .k{font-size:9px;color:var(--ink-faint);letter-spacing:.08em}
.abil .v{font-family:var(--serif);font-size:15px;color:var(--ink)}
.abil .m{font-size:10px;color:var(--gold)}
.hpwrap{margin:8px 0}
.hpbar-lg{height:14px;background:#2a1518;border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.hpbar-lg i{display:block;height:100%;background:linear-gradient(180deg,#8ec97f,#5d8f52);transition:width .3s}
.hpbar-lg span{position:absolute;inset:0;text-align:center;font:11px/13px var(--mono);text-shadow:0 1px 2px #000}
.chip{
  display:inline-block;padding:1px 7px;border-radius:9px;font-size:10px;
  background:#2b2739;border:1px solid var(--line);color:var(--ink-dim);margin:0 3px 3px 0
}
.chip.bad{background:#3a1f24;border-color:#6d3339;color:#e2a6a2}
.chip.good{background:#1f3324;border-color:#3c6b42;color:#a6d8a8}
.list{display:flex;flex-direction:column;gap:4px}
.listitem{
  display:flex;align-items:center;gap:8px;padding:6px 8px;background:#161520;
  border:1px solid var(--line);border-radius:4px;cursor:pointer
}
.listitem:hover{border-color:var(--gold-dim);background:#1d1b28}
.listitem.sel{border-color:var(--gold);background:#241f2c}
.listitem img,.listitem canvas{width:26px;height:32px;object-fit:contain;image-rendering:pixelated;flex:none}
.listitem .t{flex:1;min-width:0}
.listitem .t .n{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listitem .t .s{font-size:10px;color:var(--ink-faint)}
.muted{color:var(--ink-faint);font-size:11px}
.hint{color:var(--ink-faint);font-size:11px;line-height:1.5;margin:6px 0 0}

/* Bottom / action menu / log */
#bottom{display:flex;align-items:flex-end;gap:10px;padding:8px 12px;flex:none;
  background:#12111a;border-top:1px solid var(--line);height:132px}
#actionMenu{
  width:186px;flex:none;background:linear-gradient(180deg,#2a2438,#191527);
  border:1px solid var(--gold-dim);border-radius:5px;padding:4px;box-shadow:var(--shadow);
  max-height:116px;overflow-y:auto
}
.act{
  display:flex;align-items:center;gap:8px;padding:4px 9px;border-radius:3px;
  font-family:var(--serif);letter-spacing:.06em;font-size:13px;color:var(--ink);width:100%
}
.act:hover:not(:disabled){background:var(--gold-dim);color:#151019}
.act:disabled{color:var(--ink-faint);cursor:not-allowed}
.act .k{margin-left:auto;font:10px var(--mono);color:var(--ink-faint)}
.act:hover:not(:disabled) .k{color:#151019}
#logPanel{flex:1;min-width:0;display:flex;flex-direction:column;height:116px}
#logHead{font-family:var(--serif);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold-dim);padding-bottom:3px}
#logBody{flex:1;overflow-y:auto;font-size:12px;padding-right:6px}
.le{padding:2px 0;border-bottom:1px solid #1c1a26;color:var(--ink-dim)}
.le b{color:var(--ink)}
.le .hit{color:var(--green)}
.le .miss{color:var(--ink-faint)}
.le .crit{color:var(--gold);font-weight:700}
.le .dmg{color:var(--red);font-weight:600}
.le .roll{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.le.turn{color:var(--gold);font-family:var(--serif);letter-spacing:.06em;margin-top:4px}

/* Tooltip and modal */
#tooltip{
  position:fixed;z-index:60;pointer-events:none;background:#12111a;border:1px solid var(--gold-dim);
  border-radius:4px;padding:6px 9px;font-size:11px;max-width:250px;box-shadow:var(--shadow)
}
#tooltip b{color:var(--gold)}
#modalRoot:empty{display:none}
.modal-bg{position:fixed;inset:0;background:rgba(6,5,10,.72);z-index:80;display:flex;
  align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border:1px solid var(--gold-dim);border-radius:7px;
  width:min(560px,92vw);max-height:86vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h3{margin:0;padding:12px 16px;font-family:var(--serif);letter-spacing:.1em;font-size:14px;
  color:var(--gold);border-bottom:1px solid var(--line)}
.modal .body{padding:14px 16px}
.modal .foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* Choice tree + class list. Shared by the Forge and the Tale Sheet symbiote;
   both stylesheets pull this in, and both already define the same tokens. */
.ch-classes { margin-bottom: 10px; }
.ch-class {
  display: flex; gap: 8px; align-items: center;
  padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px;
  background: #16151f; margin-bottom: 5px;
}
.ch-class-main { flex: 1; min-width: 0; }
.ch-class-nm { color: var(--ink); font-size: 13px; }
.ch-steps { display: flex; gap: 4px; align-items: center; }
.ch-lv {
  font-family: var(--serif); font-size: 17px; color: var(--gold);
  min-width: 26px; text-align: center;
}
.ch-total {
  font: 11px var(--mono); color: var(--ink-dim);
  padding: 5px 8px; border-top: 1px dotted var(--line);
}
.ch-add { margin-top: 8px; }
.ch-sub { font-size: 10.5px; color: var(--ink-faint); }
.ch-note { font-size: 11px; color: var(--ink-faint); line-height: 1.5; padding: 5px 2px; }

.ch-head {
  display: flex; justify-content: space-between; align-items: center;
  font: 11px var(--mono); color: var(--gold); margin-bottom: 8px;
}
.ch-srcs { color: var(--ink-faint); font-size: 10.5px; cursor: pointer; display: flex; gap: 4px; align-items: center; }
.ch-srcs input { width: auto; }

.ch-group {
  border: 1px solid var(--line); border-radius: 5px; background: #16151f;
  margin-bottom: 7px; overflow: hidden;
}
.ch-group.ch-short { border-color: var(--gold-dim); }
.ch-group-h {
  display: flex; gap: 8px; align-items: center; cursor: pointer;
  padding: 7px 9px; background: #1b1924;
}
.ch-group-h:hover { background: #221f2c; }
.ch-group-nm { flex: 1; min-width: 0; color: var(--ink); font-size: 12.5px; }
.ch-count { font: 11px var(--mono); color: var(--ink-dim); }
.ch-count.ch-warn { color: var(--gold); }
.ch-caret { color: var(--ink-faint); font-size: 10px; }

.ch-chosen { display: flex; flex-wrap: wrap; gap: 4px; padding: 7px 9px; }
.ch-pill {
  display: inline-flex; align-items: center; gap: 4px;
  background: #1f3324; border: 1px solid #3c6b42; color: #a6d8a8;
  border-radius: 10px; padding: 2px 4px 2px 9px; font-size: 11px;
}
.ch-x { color: #a6d8a8; opacity: .65; padding: 0 4px; font-size: 12px; }
.ch-x:hover { opacity: 1; color: #ffd9d6; }

.ch-search { padding: 0 9px 6px; }
.ch-list { max-height: 260px; overflow-y: auto; border-top: 1px solid var(--line); }
.ch-list::-webkit-scrollbar { width: 9px; }
.ch-list::-webkit-scrollbar-thumb { background: #38344a; border-radius: 5px; }
.ch-opt {
  display: flex; gap: 8px; align-items: baseline; justify-content: space-between;
  padding: 5px 9px; cursor: pointer; border-bottom: 1px dotted #262231;
}
.ch-opt:hover { background: #262133; }
.ch-opt-nm { font-size: 12px; color: var(--ink); }
.ch-opt.ch-on { background: #1b2a1e; }
.ch-opt.ch-on .ch-opt-nm { color: #a6d8a8; }
.ch-opt.ch-no { opacity: .38; cursor: not-allowed; }
.ch-opt.ch-no:hover { background: none; }

.ch-abil { padding: 7px 9px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ch-abil .ch-note { width: 100%; padding: 0 0 4px; }
.ch-text {
  white-space: pre-wrap; font-size: 11.5px; color: var(--ink-dim); line-height: 1.55;
  padding: 7px 10px; border-top: 1px solid var(--line); max-height: 220px; overflow-y: auto;
}
.ch-picked-h {
  font: 10px var(--mono); color: var(--gold-dim); letter-spacing: .1em;
  margin: 9px 0 3px; border-bottom: 1px solid var(--line); padding-bottom: 2px;
}

/* A levelled spell's slot picker, under its row in the action list. */
.castrow {
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  padding: 2px 0 7px 10px; margin-top: -3px;
  border-left: 2px solid var(--line); margin-left: 4px;
}
.castrow .sub { font-size: 10px; color: var(--ink-faint); }
.slotpip {
  font: 10px var(--mono); padding: 2px 6px; border-radius: 9px;
  border: 1px solid var(--line); background: #16151f; color: var(--ink-dim); cursor: pointer;
}
.slotpip:hover { border-color: var(--gold-dim); color: var(--ink); }
.slotpip.on { background: var(--gold-dim); border-color: var(--gold); color: #151019; font-weight: 600; }
.slotpip.out { opacity: .35; }

/* A requirement that is shown but not enforced - the builder cannot judge it
   until ability scores exist, so the row stays clickable. */
.ch-opt.ch-caution { opacity: .8; }
.ch-opt.ch-caution .ch-sub { color: var(--gold); }

/* Death save pips: three and three, because that is how the rule reads. */
.dspips { display: inline-flex; gap: 4px; }
.dspip {
  width: 13px; height: 13px; border-radius: 50%;
  border: 1px solid var(--line); background: #14131b; cursor: pointer;
}
.dspip.ok.on { background: var(--green, #78b06a); border-color: var(--green, #78b06a); }
.dspip.bad.on { background: var(--red, #c9605a); border-color: var(--red, #c9605a); }

/* The Forge - character builder & creature editor.
   Inherits every design token from ../styles.css; this file only adds the
   two-column workbench layout and the compendium's rendered-entry styles. */

body.builder { overflow: auto; }
#bmain { flex: 1; display: flex; min-height: 0; }
#bwork { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 22px 60px; }
#bside {
  width: 340px; flex: none; background: var(--panel);
  border-left: 1px solid var(--line); overflow-y: auto;
}
#bwork::-webkit-scrollbar, #bside::-webkit-scrollbar { width: 10px; }
#bwork::-webkit-scrollbar-thumb, #bside::-webkit-scrollbar-thumb { background: #38344a; border-radius: 5px; }

.src-badge {
  font: 11px var(--mono); padding: 3px 9px; border-radius: 10px;
  border: 1px solid var(--line); color: var(--ink-faint); background: #12111a;
}
.src-badge.ok { color: var(--green); border-color: #3c6b42; }
.src-badge.warn { color: var(--gold); border-color: var(--gold-dim); }

h2.step {
  font-family: var(--serif); font-size: 17px; color: var(--gold);
  letter-spacing: .08em; margin: 0 0 4px; font-weight: 400;
}
.step-sub { color: var(--ink-faint); font-size: 12px; margin: 0 0 14px; }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
  padding: 16px 18px; margin-bottom: 16px;
}
.panel > h3 {
  margin: 0 0 12px; font-family: var(--serif); font-size: 12px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--gold); font-weight: 400;
}

/* wizard rail */
#rail { display: flex; gap: 4px; margin-bottom: 18px; flex-wrap: wrap; }
.rail-step {
  flex: 1; min-width: 92px; padding: 7px 10px; border-radius: 5px; text-align: left;
  border: 1px solid var(--line); background: #16151f; color: var(--ink-faint);
  font-size: 11px; letter-spacing: .04em; cursor: pointer;
}
.rail-step .n { font: 10px var(--mono); opacity: .6; display: block; }
.rail-step:hover { border-color: var(--gold-dim); color: var(--ink); }
.rail-step.active { background: var(--gold-dim); color: #151019; border-color: var(--gold); }
.rail-step.done { color: var(--ink); border-color: #3c6b42; }
.rail-step.done .n { color: var(--green); }

/* pick grids */
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }

/* Scrollable browser: the full list is always present, you just scroll it.
   Long lists append in chunks as you near the bottom. */
.pickscroll {
  max-height: 46vh; overflow-y: auto; padding: 2px 6px 2px 2px;
  border: 1px solid var(--line); border-radius: 5px; background: #131219;
}
.pickscroll::-webkit-scrollbar { width: 10px; }
.pickscroll::-webkit-scrollbar-thumb { background: #38344a; border-radius: 5px; }
.pickscroll .pickgrid { padding: 6px; }
.browse-head { display: flex; gap: 7px; align-items: center; margin-bottom: 8px; }
.browse-head .searchbar { flex: 1; min-width: 0; }
.browse-head select { width: auto; min-width: 104px; max-width: 190px; flex: none; }
.browse-count {
  font: 10px var(--mono); color: var(--ink-faint); text-align: right;
  padding: 5px 2px 0; letter-spacing: .02em;
}
.browse-count b { color: var(--gold); font-weight: 400; }
.pick {
  border: 1px solid var(--line); border-radius: 5px; background: #16151f;
  padding: 9px 11px; cursor: pointer; text-align: left;
}
.pick:hover { border-color: var(--gold-dim); background: #1d1b28; }
.pick.sel { border-color: var(--gold); background: #241f2c; box-shadow: 0 0 0 1px var(--gold); }
.pick .pn { font-size: 13px; color: var(--ink); }
.pick .ps { font-size: 10px; color: var(--ink-faint); margin-top: 2px; }
.pick .src { font: 9px var(--mono); color: var(--gold-dim); float: right; }

/* ability score allocator */
.ability-row { display: grid; grid-template-columns: 52px 1fr 46px 40px 46px; gap: 8px; align-items: center; margin-bottom: 6px; }
.ability-row .lab { font: 11px var(--mono); color: var(--ink-dim); letter-spacing: .08em; }
.ability-row .val { font-family: var(--serif); font-size: 19px; text-align: center; color: var(--ink); }
.ability-row .bonus { font-size: 11px; color: var(--green); text-align: center; }
.ability-row .fin { font-family: var(--serif); font-size: 19px; text-align: center; color: var(--gold); }
.stepper { display: flex; gap: 3px; }
.stepper button {
  width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel2); color: var(--ink);
}
.stepper button:hover:not(:disabled) { border-color: var(--gold-dim); background: #302b40; }
.stepper button:disabled { opacity: .3; cursor: not-allowed; }
.pts { font: 12px var(--mono); color: var(--gold); }

/* compendium */
.comp-layout { display: flex; gap: 14px; height: calc(100vh - 130px); }
.comp-list { width: 300px; flex: none; display: flex; flex-direction: column; gap: 8px; }
.comp-results { flex: 1; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: #131219; }
.comp-view { flex: 1; overflow-y: auto; padding: 4px 6px 40px; }
.comp-row {
  padding: 6px 10px; border-bottom: 1px solid #1e1c28; cursor: pointer; font-size: 12px;
  display: flex; align-items: baseline; gap: 8px;
}
.comp-row:hover { background: #1d1b28; }
.comp-row.sel { background: #241f2c; color: var(--gold); }
.comp-row .k { font: 9px var(--mono); color: var(--ink-faint); text-transform: uppercase; width: 62px; flex: none; }
.comp-row .s { margin-left: auto; font: 9px var(--mono); color: var(--gold-dim); }
.kindbar { display: flex; flex-wrap: wrap; gap: 3px; }
.kindbar button {
  font-size: 10px; padding: 2px 7px; border-radius: 9px; border: 1px solid var(--line);
  color: var(--ink-faint); background: #16151f;
}
.kindbar button.on { background: var(--gold-dim); color: #151019; border-color: var(--gold); }

/* rendered 5etools entries */
.entry-body { font-size: 13px; line-height: 1.62; color: var(--ink-dim); }
.entry-body .e-name { font-family: var(--serif); color: var(--gold); margin: 12px 0 3px; font-size: 13px; }
.entry-body .e-body { margin-bottom: 8px; }
.entry-body .e-item { margin: 5px 0; }
.entry-body .e-item b { color: var(--ink); }
.entry-body .e-list { margin: 6px 0 6px 18px; padding: 0; }
.entry-body .e-inset {
  border-left: 2px solid var(--gold-dim); background: #16151f;
  padding: 8px 12px; margin: 10px 0; border-radius: 0 4px 4px 0;
}
.entry-body .e-quote { border-left: 2px solid var(--line); margin: 10px 0; padding-left: 12px; font-style: italic; }
.entry-body .e-quote cite { display: block; font-style: normal; color: var(--ink-faint); font-size: 11px; margin-top: 4px; }
.entry-body .e-tablewrap { overflow-x: auto; margin: 10px 0; }
.entry-body .e-table { border-collapse: collapse; width: 100%; font-size: 12px; }
.entry-body .e-table th, .entry-body .e-table td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.entry-body .e-table th { background: #1c1a25; color: var(--gold); font-weight: 400; }
.entry-body .e-table caption { text-align: left; color: var(--gold); font-family: var(--serif); padding-bottom: 5px; }
.entry-body a.xref { color: var(--blue); cursor: pointer; border-bottom: 1px dotted currentColor; }
.entry-body a.xref:hover { color: var(--gold); }
.entry-body .roll-tag { color: var(--gold); font-family: var(--mono); font-size: 12px; cursor: pointer; }
.entry-body .roll-tag:hover { text-decoration: underline; }
.statgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 10px 0; }

/* homebrew trait rows */
.hb-trait {
  border: 1px solid var(--line); border-radius: 5px; background: #16151f;
  padding: 8px; margin-bottom: 8px;
}
.hb-trait textarea { resize: vertical; }
.hb-trait .row { margin-bottom: 6px; }

/* progress */
.progress { height: 5px; background: #241f2c; border-radius: 3px; overflow: hidden; margin: 8px 0; }
.progress i { display: block; height: 100%; background: var(--gold-dim); transition: width .2s; }

/* summary sheet in the side rail */
.sheet-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.sheet-head canvas { image-rendering: pixelated; }
.sheet-name { font-family: var(--serif); font-size: 16px; color: var(--ink); }
.sheet-sub { font-size: 11px; color: var(--ink-faint); }
.bigstat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; text-align: center; }
.bigstat > div { background: #131119; border: 1px solid var(--line); border-radius: 5px; padding: 6px 0; }
.bigstat .k { font-size: 9px; color: var(--ink-faint); letter-spacing: .1em; }
.bigstat .v { font-family: var(--serif); font-size: 19px; color: var(--gold); }
.warn-box {
  border: 1px solid var(--gold-dim); background: #221d16; color: var(--gold);
  padding: 8px 11px; border-radius: 5px; font-size: 11.5px; line-height: 1.5; margin-bottom: 12px;
}
.err-box {
  border: 1px solid #6d3339; background: #2a1518; color: #e2a6a2;
  padding: 8px 11px; border-radius: 5px; font-size: 11.5px; line-height: 1.5; margin-bottom: 12px;
}
.ok-box {
  border: 1px solid #3c6b42; background: #16241a; color: #a6d8a8;
  padding: 8px 11px; border-radius: 5px; font-size: 11.5px; line-height: 1.5; margin-bottom: 12px;
}
.tiny { font-size: 10px; color: var(--ink-faint); }
.wrapbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.searchbar { position: relative; }
.searchbar input { padding-left: 26px; }
.searchbar::before {
  content: "\1F50D"; position: absolute; left: 7px; top: 4px; font-size: 11px; opacity: .5;
}

/* ==== Roster tab ======================================================== */
/* The side rail is the roster; the work column is one long sheet. */
.rl-head {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--serif); letter-spacing: .13em; font-size: 11px;
  text-transform: uppercase; color: var(--gold); margin-bottom: 8px;
}
.rl-item {
  position: relative; display: flex; gap: 9px; align-items: center; cursor: pointer;
  padding: 7px 12px; border-left: 3px solid transparent; border-bottom: 1px solid #221f2c;
}
.rl-item:hover { background: #201d29; }
.rl-item.sel { background: #262133; border-left-color: var(--gold); }
.rl-item canvas { image-rendering: pixelated; flex: none; }
.rl-body { min-width: 0; flex: 1; }
.rl-nm { color: var(--ink); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rl-hp { height: 3px; background: #2a1518; border-radius: 2px; overflow: hidden; margin-top: 4px; }
.rl-hp i { display: block; height: 100%; }
.rl-team { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.rl-team.party { background: var(--party); }
.rl-team.foe { background: var(--foe); }
.rl-team.neutral { background: var(--neutral); }

.rstats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0; text-align: center; }
.rstats > div { background: #131119; border: 1px solid var(--line); border-radius: 5px; padding: 6px 2px; }
.rstats .k { font-size: 9px; color: var(--ink-faint); letter-spacing: .1em; }
.rstats .v { font-family: var(--serif); font-size: 19px; color: var(--gold); }

.lvlrow { display: flex; gap: 8px; align-items: center; margin: 10px 0 6px; }
.lvlrow .spacer { flex: 1; }
.lvl-lbl { color: var(--ink-dim); font-size: 11px; }
.lvl-v { font-family: var(--serif); font-size: 22px; color: var(--gold); min-width: 34px; text-align: center; }

/* one editable line: label grows, controls sit at the end */
.linerow { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
.linerow .grow { flex: 1; min-width: 0; }
.linerow .ctr { min-width: 62px; text-align: center; font: 12px var(--mono); }

.abilgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.abilcell { background: #131119; border: 1px solid var(--line); border-radius: 5px; padding: 8px 4px; text-align: center; }
.abilcell .k { font-size: 9px; color: var(--ink-faint); letter-spacing: .08em; }
.abilcell .stepper { justify-content: center; margin: 4px 0 2px; }
.abilcell .v { font-family: var(--serif); font-size: 17px; min-width: 26px; display: inline-block; }
.abilcell .m { font-size: 11px; color: var(--gold); }
.savebtn {
  display: block; width: 100%; margin-top: 6px; padding: 3px 0; font-size: 10px;
  border: 1px solid var(--line); border-radius: 4px; background: #1b1924; color: var(--ink-dim);
}
.savebtn:hover { border-color: var(--gold-dim); color: var(--ink); }
.savebtn.on { background: #1f3324; border-color: #3c6b42; color: #a6d8a8; }

.skillgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 14px; }
.skillrow {
  display: flex; gap: 7px; align-items: center; cursor: pointer;
  padding: 3px 5px; border-radius: 4px; border-bottom: 1px dotted #262231;
}
.skillrow:hover { background: #221f2c; }
.skillrow.lit .skillmod { color: var(--gold); }
.skillmod { font: 12px var(--mono); color: var(--ink-dim); min-width: 26px; text-align: right; }
.pip { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--ink-faint); flex: none; }
.pip.on { background: var(--ink-dim); border-color: var(--ink-dim); }
.pip.exp { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 4px rgba(216,178,92,.6); }

.chiprow { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }

.featlvl {
  font: 10px var(--mono); color: var(--gold-dim); letter-spacing: .1em;
  margin: 10px 0 3px; border-bottom: 1px solid var(--line); padding-bottom: 2px;
}
.feathead { cursor: pointer; padding: 3px 4px; border-radius: 4px; }
.feathead:hover { background: #221f2c; }
.feattext {
  white-space: pre-wrap; font-size: 11.5px; color: var(--ink-dim); line-height: 1.55;
  padding: 4px 8px 10px; border-left: 2px solid var(--line); margin: 0 0 6px 6px;
}

/* search-and-pick, for lists far too long for a dropdown */
.picklist {
  max-height: 230px; overflow-y: auto; margin-top: 4px;
  border: 1px solid var(--line); border-radius: 5px; background: #131219;
}
.picklist::-webkit-scrollbar { width: 9px; }
.picklist::-webkit-scrollbar-thumb { background: #38344a; border-radius: 5px; }
.pickhit { display: flex; gap: 8px; align-items: baseline; padding: 5px 9px; cursor: pointer; font-size: 12px; }
.pickhit:hover { background: #262133; color: var(--gold); }

/* Virtual Tactics :: TaleSpire symbiote styles.
   Symbiote panels are narrow and resizable, so everything is a single column
   that reflows. Colours default to our own palette but defer to TaleSpire's
   injected --ts-* variables when the colorStyles extra is present, so the sheet
   sits inside the game's theme rather than fighting it. */
:root {
  --ink: #e8e3d5;
  --ink-dim: #a49c86;
  --ink-faint: #6f6857;
  --gold: #d8b25c;
  --gold-dim: #8f7534;
  --green: #78b06a;
  --red: #c9605a;
  --blue: #5f9ecf;
  --line: #332f42;
  --panel: var(--ts-background-secondary, #1c1a25);
  --panel2: var(--ts-background-tertiary, #252231);
  --bg: var(--ts-background-primary, #12111a);
  --accent: var(--ts-accent-primary, #d8b25c);
  --serif: OptimusPrinceps, "Iowan Old Style", Georgia, serif;
  --mono: ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
  overflow: hidden; user-select: none;
}
.hidden { display: none !important; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea {
  background: #100f16; border: 1px solid var(--line); color: var(--ink);
  padding: 4px 6px; border-radius: 4px; font: inherit; width: 100%;
}
input:focus, select:focus { outline: none; border-color: var(--gold-dim); }

#app { display: flex; flex-direction: column; height: 100vh; }

/* ---- top bar ---- */
#bar {
  display: flex; gap: 6px; align-items: center; padding: 6px 8px; flex: none;
  background: linear-gradient(180deg, #221f2c, #16141d);
  border-bottom: 1px solid var(--line);
}
#charPick { flex: 1; min-width: 0; }
#rollMode { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; flex: none; }
#rollMode button { padding: 4px 7px; font-size: 11px; color: var(--ink-dim); }
#rollMode button:hover { background: #2a2638; color: var(--ink); }
#rollMode button.on { background: var(--gold-dim); color: #151019; font-weight: 600; }
#critToggle {
  padding: 4px 8px; font-size: 11px; border: 1px solid var(--line);
  border-radius: 4px; color: var(--ink-dim); flex: none;
}
#critToggle.on { background: var(--red); color: #fff; border-color: var(--red); }

/* ---- tabs ---- */
#tabs { display: flex; flex: none; border-bottom: 1px solid var(--line); background: #12111a; }
.tab {
  flex: 1; padding: 7px 4px; font-size: 12px; color: var(--ink-faint);
  border-bottom: 2px solid transparent; letter-spacing: .04em;
}
.tab:hover { color: var(--ink); }
.tab.on { color: var(--gold); border-bottom-color: var(--gold); }

/* ---- view ---- */
#view { flex: 1; overflow-y: auto; padding: 10px; }
#view::-webkit-scrollbar { width: 9px; }
#view::-webkit-scrollbar-thumb { background: #38344a; border-radius: 5px; }

.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 10px; margin-bottom: 10px;
}
.card > h3 {
  margin: 0 0 8px; font-family: var(--serif); font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--gold); font-weight: 400;
}
.muted { color: var(--ink-faint); font-size: 11px; }
.row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.row > label { width: 74px; flex: none; color: var(--ink-dim); font-size: 11px; }
.btn {
  padding: 5px 10px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel2); color: var(--ink); font-size: 12px;
}
.btn:hover { background: #302b40; border-color: var(--gold-dim); }
.btn.primary { background: var(--gold-dim); color: #151019; border-color: var(--gold); font-weight: 600; }
.btn.danger:hover { background: #5e2a2a; border-color: var(--red); }
.btn.sm { padding: 3px 7px; font-size: 11px; }
.btn.on { background: var(--gold-dim); color: #151019; border-color: var(--gold); }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---- identity ---- */
.who { display: flex; gap: 9px; align-items: center; margin-bottom: 8px; }
.who canvas { image-rendering: pixelated; flex: none; }
.who .nm { font-family: var(--serif); font-size: 16px; color: var(--ink); line-height: 1.15; }
.who .sub { font-size: 11px; color: var(--ink-faint); }

.bigstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; text-align: center; }
.bigstats > div { background: #131119; border: 1px solid var(--line); border-radius: 5px; padding: 5px 0; }
.bigstats .k { font-size: 9px; color: var(--ink-faint); letter-spacing: .1em; }
.bigstats .v { font-family: var(--serif); font-size: 17px; color: var(--gold); }

/* ---- hp ---- */
.hpbar { height: 15px; background: #2a1518; border: 1px solid var(--line); border-radius: 3px; position: relative; overflow: hidden; margin: 8px 0 6px; }
.hpbar i { display: block; height: 100%; background: linear-gradient(180deg, #8ec97f, #5d8f52); transition: width .25s; }
.hpbar span { position: absolute; inset: 0; text-align: center; font: 11px/14px var(--mono); text-shadow: 0 1px 2px #000; }
.hpctl { display: flex; gap: 5px; align-items: center; }
.hpctl input { width: 54px; text-align: center; }

/* ---- rollable rows ---- */
.rollrow {
  display: flex; align-items: center; gap: 6px; padding: 4px 6px;
  border-bottom: 1px solid #211f2b; cursor: pointer; border-radius: 4px;
}
.rollrow:last-child { border-bottom: none; }
.rollrow:hover { background: #221f2c; }
.rollrow .lbl { flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rollrow .sub { font-size: 10px; color: var(--ink-faint); }
.rollrow .mod {
  font-family: var(--mono); font-size: 13px; color: var(--gold);
  min-width: 30px; text-align: right; flex: none;
}
.rollrow .score { font-family: var(--serif); font-size: 13px; color: var(--ink-dim); width: 22px; text-align: center; flex: none; }
.pip {
  width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--ink-faint);
  flex: none; cursor: pointer;
}
.pip.on { background: var(--gold); border-color: var(--gold); }

.abil-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.abil-cell {
  background: #131119; border: 1px solid var(--line); border-radius: 5px;
  padding: 5px 6px; display: flex; align-items: center; gap: 6px;
}
.abil-cell .k { font: 10px var(--mono); color: var(--ink-faint); letter-spacing: .08em; width: 26px; }
.abil-cell .v { font-family: var(--serif); font-size: 15px; color: var(--ink); width: 20px; text-align: center; }
.abil-cell .acts { display: flex; gap: 3px; margin-left: auto; }
.abil-cell .acts button {
  font: 10px var(--mono); padding: 2px 5px; border: 1px solid var(--line);
  border-radius: 3px; color: var(--gold);
}
.abil-cell .acts button:hover { background: var(--gold-dim); color: #151019; }

.chip {
  display: inline-block; padding: 2px 8px; border-radius: 9px; font-size: 10px;
  background: #2b2739; border: 1px solid var(--line); color: var(--ink-dim);
  margin: 0 3px 3px 0; cursor: pointer;
}
.chip.on { background: #3a1f24; border-color: #6d3339; color: #e2a6a2; }
.chip.good.on { background: #1f3324; border-color: #3c6b42; color: #a6d8a8; }

details { border: 1px solid var(--line); border-radius: 5px; margin-bottom: 8px; background: var(--panel); }
details > summary {
  padding: 7px 10px; cursor: pointer; font-family: var(--serif); font-size: 11px;
  letter-spacing: .13em; text-transform: uppercase; color: var(--gold); list-style: none;
}
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; color: var(--gold-dim); }
details[open] > summary::before { content: "▾ "; }
details > div { padding: 0 8px 8px; }

/* ---- toast ---- */
#toast {
  position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 40;
  pointer-events: none; display: flex; flex-direction: column; gap: 5px;
}
.toast-msg {
  background: #16141d; border: 1px solid var(--gold-dim); border-radius: 5px;
  padding: 6px 10px; font-size: 11.5px; box-shadow: 0 4px 16px rgba(0,0,0,.6);
  animation: fade 4s forwards;
}
.toast-msg.err { border-color: var(--red); color: #e2a6a2; }
.toast-msg.ok { border-color: #3c6b42; color: #a6d8a8; }
@keyframes fade { 0%,80% { opacity: 1; } 100% { opacity: 0; } }

.progress { height: 4px; background: #241f2c; border-radius: 3px; overflow: hidden; margin: 6px 0; }
.progress i { display: block; height: 100%; background: var(--gold-dim); transition: width .2s; }
.warn { border: 1px solid var(--gold-dim); background: #221d16; color: var(--gold);
        padding: 7px 9px; border-radius: 5px; font-size: 11.5px; margin-bottom: 8px; }
.err  { border: 1px solid #6d3339; background: #2a1518; color: #e2a6a2;
        padding: 7px 9px; border-radius: 5px; font-size: 11.5px; margin-bottom: 8px; }
.ok   { border: 1px solid #3c6b42; background: #16241a; color: #a6d8a8;
        padding: 7px 9px; border-radius: 5px; font-size: 11.5px; margin-bottom: 8px; }

.pip.exp { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 0 2px rgba(216,178,92,.35); }

/* ---- loot codes copied over from Tale Shop ---- */
.lootcode {
  width: 100%; font-family: var(--mono, monospace); font-size: 10px;
  line-height: 1.35; resize: vertical; word-break: break-all;
}

/* A number box in a rollable row must not eat the label. Inputs are width:100%
   by default, which inside a flex row resolves to "all of it" and squeezes the
   item name to nothing. */
.rollrow input[type=number],
.rollrow input.num { width: 58px; text-align: center; flex: none; }
/* Number fields are plain text inputs now - no increment arrows to click at in
   a panel this narrow. Belt and braces for anything still declaring itself a
   number, since some skins draw the spinner regardless. */
input.num::-webkit-outer-spin-button,
input.num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input.num { -moz-appearance: textfield; appearance: textfield; }

/* ---- an assumed form, shown beside the character rather than replacing it ---- */
.card.wildshape {
  border-color: var(--green, #5d8f52);
  box-shadow: inset 0 0 0 1px rgba(93, 143, 82, .18);
}
.card.wildshape h3 { color: var(--green, #8ec97f); }

/* ---- the spellbook: each level's slots at the head of its own section ---- */
.spell-head {
  display: flex; align-items: center; gap: 6px;
  margin: 10px 0 2px; padding: 3px 6px;
  background: #1a1824; border-radius: 4px;
  border-left: 2px solid var(--gold-dim);
}
.spell-head .lbl { flex: 1; font-size: 11px; color: var(--gold); letter-spacing: .04em; }
.spell-head .sub { color: var(--ink-faint); letter-spacing: 0; }

/* ---- a spell's own words, folded away until asked for ---- */
.spellwrap { margin: 0 0 4px 6px; }
/* Just a dot to click. The words "what it does" under every spell was more
   text than the spells themselves in a long list. */
.spellwrap > summary {
  cursor: pointer; list-style: none;
  width: 16px; height: 14px; line-height: 14px;
  color: var(--ink-faint); font-size: 11px;
}
.spellwrap > summary::-webkit-details-marker { display: none; }
.spellwrap > summary::before { content: '▸'; }
.spellwrap[open] > summary::before { content: '▾'; }
.spellwrap > summary:hover { color: var(--gold); }
.spelltext {
  font-size: 11px; color: var(--ink-dim); line-height: 1.45;
  padding: 5px 8px; margin-top: 3px;
  background: #17151f; border-radius: 4px;
  border-left: 2px solid var(--line);
  white-space: pre-wrap;
}

/* ---- the pop-out reader ----
   A panel 320px wide has room for one thing at a time, so an item's text takes
   the whole of it and gives it back on Close. Fixed rather than inline so a
   long entry scrolls itself instead of pushing the pack off screen. */
.modal-back {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(8, 7, 12, .72);
  display: flex; align-items: center; justify-content: center;
  padding: 14px;
}
.modal {
  width: 100%; max-width: 460px; max-height: 88%;
  display: flex; flex-direction: column;
  background: var(--panel, #16151f);
  border: 1px solid var(--gold-dim); border-radius: 6px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .7);
}
.modal-head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 11px; border-bottom: 1px solid var(--line);
}
.modal-title {
  flex: 1; min-width: 0; font-family: var(--serif); font-size: 13px;
  color: var(--gold); letter-spacing: .04em;
}
.modal-sub {
  padding: 6px 11px 0; font-size: 10px; color: var(--ink-faint);
  text-transform: lowercase; letter-spacing: .04em;
}
.modal-body {
  padding: 9px 11px 12px; overflow-y: auto;
  font-size: 12px; line-height: 1.55; color: var(--ink-dim);
  white-space: pre-wrap;
}

/* The control that opens it. Gold-edged so it reads as "there is more here"
   rather than sitting in the row like another toggle. */
.btn.sm.read { border-color: var(--gold-dim); color: var(--gold); }
.btn.sm.read:hover { background: var(--gold-dim); color: #151019; }

/* The symbiote sheet, hosted inside the Forge.

   sheet.css is written for a panel that owns its window. Rather than editing
   it - tale-sheet is what the table runs - sheetview.js rewrites its rules at
   load to sit under #sheetHost. What is left here is the embedding itself:
   how the sheet is laid out as one panel among several, and the Forge-side
   furniture that goes with it. */

/* Two ids, because the scoped stylesheet is injected last and #app's
   "height: 100vh" is carried onto the host by the whole-page mapping. Here the
   sheet is one panel in a page, not the page. */
#bwork #sheetHost { display: flex; flex-direction: column; min-height: 0; height: auto; }
#sheetHost { display: flex; flex-direction: column; min-height: 0; }
#sheetHost.hidden { display: none; }

/* the sheet's own chrome, sized for a desk rather than a phone strip */
#sheetHost #bar {
  display: flex; gap: 10px; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
}
#sheetHost #charPick { flex: 0 1 380px; font-size: 15px; padding: 6px 10px; }
/* The sheet's own tabs stretch full width by default, which looks odd across a
   monitor; keep them to their content beside the section bar. */
#sheetHost #tabs { display: flex; gap: 2px; padding: 0 16px; }
#sheetHost #tabs .tab { flex: 0 0 auto; padding: 8px 22px; }

/* One column, scrolling one way. A multi-column flow reads down the first
   column and back up to the top of the second, which is a lot of travel for
   one character; the sections below are what keep it short instead. */
/* Cards across the width, not down a 800px ribbon with the rest of the monitor
   empty beside it.

   A grid, not CSS columns. Multi-column flow runs down the first column and
   back up to the second, so reading one character means travelling the page
   twice; a grid fills left to right, top to bottom, which is the order things
   are actually written in. auto-fill rather than auto-fit on purpose: a section
   holding one card should leave it one column wide, not stretch it across the
   monitor. */
#sheetHost #view {
  padding: 14px 16px;
  overflow-x: hidden;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
  gap: 14px;
  align-content: start;
  align-items: start;
}

/* auto-fit, not auto-fill: a section holding one or two cards should let them
   grow into the space rather than sit in a narrow track with the rest of the
   monitor empty beside them. The cap is what stops a lone card becoming a
   1500px line of text - it grows to a comfortable width and no further. */
#sheetHost #view > * { max-width: 880px; min-width: 0; }
#sheetHost #toast { position: fixed; bottom: 14px; right: 14px; z-index: 60; }

/* ---- sections ---- */
#sheetGroups {
  display: flex; gap: 4px; padding: 8px 16px 0;
  border-bottom: 1px solid var(--line);
}
#sheetGroups.hidden { display: none; }
/* These are the sheet's main navigation on this tab, so they are sized like
   navigation rather than like a footnote. */
.sub-tab {
  padding: 8px 20px; font-size: 15px; border-radius: 6px 6px 0 0;
  font-family: var(--serif); letter-spacing: .04em;
  color: var(--ink-dim); background: none; border: none; cursor: pointer;
  border-bottom: 2px solid transparent;
}
.sub-tab:hover { color: var(--ink); background: #201d2a; }
.sub-tab.on { color: var(--gold); border-bottom-color: var(--gold); }

/* Show one section at a time. "all" is the Edit and Build tabs, which are
   sheet.js's own and are not carved up. */
#sheetHost #view[data-grp="play"]   > *:not([data-group="play"]),
#sheetHost #view[data-grp="spells"] > *:not([data-group="spells"]),
#sheetHost #view[data-grp="gear"]   > *:not([data-group="gear"]),
#sheetHost #view[data-grp="about"]  > *:not([data-group="about"]) { display: none; }

/* ---- the dice tray ----------------------------------------------------
   A floating panel rather than a rail section: reading your sheet is most of
   what this tab is for, and a permanent box for something empty most of the
   time was rail space spent saying nothing. It appears on the first roll and
   can be minimised to a single line or dismissed entirely. */
.dicetray {
  position: fixed; right: 16px; bottom: 16px; z-index: 80;
  width: 232px; border-radius: 7px; overflow: hidden;
  background: #1a1824; border: 1px solid var(--line);
  box-shadow: 0 6px 22px rgba(0,0,0,.45);
  font-size: 11px;
}
.dicetray.gone { display: none; }

.tray-head {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 6px 4px 9px;
  background: #221f2c; border-bottom: 1px solid var(--line);
}
.tray-title {
  flex: 1; font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tray-btn {
  width: 18px; height: 18px; line-height: 1; flex: none;
  color: var(--ink-faint); background: none; border: none; cursor: pointer;
  border-radius: 3px; font-size: 12px;
}
.tray-btn:hover { color: var(--ink); background: #2e2a3c; }

.tray-body { max-height: 190px; overflow-y: auto; padding: 4px; }
.dicetray.min .tray-body { display: none; }

.rolline {
  display: flex; align-items: baseline; gap: 6px;
  padding: 2px 5px; border-radius: 3px;
}
.rolline.fresh { background: #1e2a1c; }
.rolline .rn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rolline .rd { font-family: var(--mono); font-size: 9px; color: var(--ink-faint); }
.rolline .rt { font-family: var(--mono); font-size: 13px; color: var(--gold); min-width: 22px; text-align: right; }

/* The Sheet tab has nothing for the side rail - the dice tray floats instead -
   so the sheet takes the full width. */
#bmain.no-rail > #bside { display: none; }

</style>

<script>
/* ===== ../src/core/util.js ===== */
/* Virtual Tactics :: core/util.js
   Global namespace + small helpers. Everything hangs off window.VT so the whole
   app runs from plain <script> tags (no bundler, no server, no CORS). */
(function () {
  'use strict';
  var VT = window.VT = window.VT || {};

  /* ---- DOM ------------------------------------------------------------- */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') n.value = v;
      else if (k === 'checked') n.checked = !!v;
      else n.setAttribute(k, v === true ? '' : v);
    }
    if (kids != null) {
      if (!Array.isArray(kids)) kids = [kids];
      kids.forEach(function (c) {
        if (c == null || c === false) return;
        n.appendChild(typeof c === 'string' || typeof c === 'number'
          ? document.createTextNode(String(c)) : c);
      });
    }
    return n;
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); return node; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---- math ------------------------------------------------------------ */
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInOut(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  /* D&D grid distance: Chebyshev, 5 ft per square (PHB basic rule). */
  function gridDist(ax, ay, bx, by) { return Math.max(Math.abs(ax - bx), Math.abs(ay - by)); }

  /* Deterministic hash -> 0..1, used for stable procedural texture noise. */
  function hash01(x, y, seed) {
    var h = (x * 374761393 + y * 668265263 + (seed || 0) * 1274126177) | 0;
    h = (h ^ (h >>> 13)) * 1274126177 | 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }

  /* ---- colour ---------------------------------------------------------- */
  function hexToRgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function rgbStr(c, a) {
    return 'rgba(' + (c.r | 0) + ',' + (c.g | 0) + ',' + (c.b | 0) + ',' + (a == null ? 1 : a) + ')';
  }
  /* amt > 0 lightens, < 0 darkens */
  function shade(hex, amt) {
    var c = hexToRgb(hex), t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    return '#' + [c.r, c.g, c.b].map(function (v) {
      return Math.round(v + (t - v) * p).toString(16).padStart(2, '0');
    }).join('');
  }

  /* ---- misc ------------------------------------------------------------ */
  var _id = 0;
  function uid(prefix) { return (prefix || 'id') + '_' + (Date.now().toString(36)) + '_' + (++_id).toString(36); }
  function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
  function cap(s) { return String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1); }
  function sign(n) { return (n >= 0 ? '+' : '') + n; }
  function pick(arr, rnd) { return arr[Math.floor((rnd || Math.random)() * arr.length)]; }
  function ord(n) {
    var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function debounce(fn, ms) {
    var t; return function () {
      var a = arguments, self = this;
      clearTimeout(t); t = setTimeout(function () { fn.apply(self, a); }, ms || 120);
    };
  }

  /* ---- tiny event bus --------------------------------------------------- */
  function Bus() { this._h = {}; }
  Bus.prototype.on = function (ev, fn) { (this._h[ev] = this._h[ev] || []).push(fn); return this; };
  Bus.prototype.off = function (ev, fn) {
    var a = this._h[ev]; if (!a) return this;
    var i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); return this;
  };
  Bus.prototype.emit = function (ev) {
    var args = Array.prototype.slice.call(arguments, 1), a = this._h[ev];
    if (a) a.slice().forEach(function (f) { f.apply(null, args); });
    var any = this._h['*'];
    if (any) any.slice().forEach(function (f) { f(ev, args); });
    return this;
  };

  VT.util = {
    el: el, $: $, $$: $$, clear: clear, esc: esc,
    clamp: clamp, lerp: lerp, easeOut: easeOut, easeInOut: easeInOut,
    dist2: dist2, gridDist: gridDist, hash01: hash01,
    hexToRgb: hexToRgb, rgbStr: rgbStr, shade: shade,
    uid: uid, clone: clone, cap: cap, sign: sign, pick: pick, ord: ord, debounce: debounce,
    Bus: Bus
  };
  VT.bus = new Bus();
})();

/* ===== ../src/core/dice.js ===== */
/* Virtual Tactics :: core/dice.js
   Dice notation parser + roller. Understands things like:
     "1d8+3"  "2d6"  "d20"  "2d6+1d4+2"  "1d10-1"  "4"
   Every roll returns the individual die faces so the log can show its work. */
(function () {
  'use strict';
  var VT = window.VT;

  /* Optional seeded RNG so a table can replay a session deterministically. */
  var _seed = null;
  function rnd() {
    if (_seed == null) return Math.random();
    /* mulberry32 */
    _seed |= 0; _seed = (_seed + 0x6D2B79F5) | 0;
    var t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function setSeed(s) { _seed = (s == null || s === '') ? null : (parseInt(s, 10) | 0); }

  function die(sides) { return 1 + Math.floor(rnd() * sides); }

  /* Parse "2d6+1d4+2" into terms. Returns null on garbage. */
  function parse(expr) {
    if (typeof expr === 'number') return [{ n: 0, s: 0, flat: expr, sign: 1 }];
    var s = String(expr || '').replace(/\s+/g, '').toLowerCase();
    if (!s) return null;
    if (!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s)) return null;
    var terms = [], re = /([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g, m;
    while ((m = re.exec(s))) {
      if (m[3]) {
        terms.push({ sign: m[1] === '-' ? -1 : 1, n: m[2] === '' ? 1 : parseInt(m[2], 10), s: parseInt(m[3], 10) });
      } else {
        terms.push({ sign: m[4] === '-' ? -1 : 1, n: 0, s: 0, flat: parseInt(m[5], 10) });
      }
    }
    return terms.length ? terms : null;
  }

  /* roll("2d6+3") -> {total, faces:[...], text:"2d6+3", detail:"[4,5]+3"} */
  function roll(expr, opts) {
    opts = opts || {};
    var terms = parse(expr);
    if (!terms) return { total: 0, faces: [], text: String(expr), detail: '?', invalid: true };
    var total = 0, faces = [], parts = [];
    terms.forEach(function (t) {
      if (t.n) {
        var sub = [];
        for (var i = 0; i < t.n; i++) {
          var v = die(t.s);
          if (opts.maximize) v = t.s;
          sub.push(v); faces.push({ sides: t.s, v: v });
          total += t.sign * v;
        }
        parts.push((t.sign < 0 ? '-' : parts.length ? '+' : '') + '[' + sub.join(',') + ']');
      } else {
        total += t.sign * t.flat;
        parts.push((t.sign < 0 ? '-' : parts.length ? '+' : '') + t.flat);
      }
    });
    if (opts.bonus) { total += opts.bonus; parts.push(VT.util.sign(opts.bonus)); }
    if (opts.min != null) total = Math.max(opts.min, total);
    return { total: total, faces: faces, text: String(expr), detail: parts.join('') };
  }

  /* Doubles the dice, not the modifiers - 5e critical hit rule. */
  function critDice(expr) {
    var terms = parse(expr); if (!terms) return expr;
    return terms.map(function (t, i) {
      var pre = t.sign < 0 ? '-' : (i ? '+' : '');
      return pre + (t.n ? (t.n * 2) + 'd' + t.s : t.flat);
    }).join('');
  }

  /* d20 test with advantage / disadvantage.
     adv: 1 = advantage, -1 = disadvantage, 0 = flat. */
  function d20(mod, adv) {
    mod = mod || 0; adv = adv || 0;
    var a = die(20), b = adv ? die(20) : a;
    var nat = adv > 0 ? Math.max(a, b) : adv < 0 ? Math.min(a, b) : a;
    return {
      nat: nat, both: adv ? [a, b] : [a], mod: mod, total: nat + mod,
      crit: nat === 20, fumble: nat === 1, adv: adv,
      detail: (adv ? '(' + a + '/' + b + ')' : '(' + a + ')') + VT.util.sign(mod)
    };
  }

  /* Average of an expression - used for AI target scoring and previews. */
  function avg(expr) {
    var terms = parse(expr); if (!terms) return 0;
    return terms.reduce(function (sum, t) {
      return sum + t.sign * (t.n ? t.n * (t.s + 1) / 2 : t.flat);
    }, 0);
  }

  VT.dice = { roll: roll, d20: d20, avg: avg, parse: parse, critDice: critDice, die: die, rnd: rnd, setSeed: setSeed };
})();

/* ===== ../src/core/store.js ===== */
/* Virtual Tactics :: core/store.js
   The single source of truth. One campaign object holds every map, every actor
   template and every custom sprite, so "save" is one JSON blob you can email to
   your table. Autosaves to localStorage; Export writes a .vtcampaign file. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util;
  var KEY = 'vtactics.campaign.v1';

  var DEFAULT_SETTINGS = {
    /* Rules toggles - all of these change how combat resolves. */
    highGround: true,      // house rule: attacking from >=5ft above grants advantage
    diagonals: 'uniform',  // 'uniform' (PHB basic, 5ft) | 'alternating' (DMG 5-10-5)
    fallDamage: true,      // 1d6 per 10ft dropped
    opportunity: true,     // opportunity attacks when leaving reach
    cover: true,           // +2 / +5 AC from partial cover
    climbCost: true,       // climbing a 5ft step costs an extra 5ft of movement
    aiForFoes: true,       // foes take their own turns
    gridLines: true,
    animate: true,
    seed: ''
  };

  var store = {
    campaign: null,
    dirty: false,

    /* ---- lifecycle ----------------------------------------------------- */
    blank: function (name) {
      return {
        version: 1,
        name: name || 'New Campaign',
        created: Date.now(),
        maps: [],
        activeMapId: null,
        roster: [],
        sprites: {},
        settings: U.clone(DEFAULT_SETTINGS)
      };
    },

    init: function () {
      var loaded = null;
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) loaded = JSON.parse(raw);
      } catch (e) { console.warn('[store] could not read saved campaign:', e); }
      this.campaign = loaded && loaded.maps ? this.migrate(loaded) : null;
      return this.campaign;
    },

    migrate: function (c) {
      c.settings = Object.assign(U.clone(DEFAULT_SETTINGS), c.settings || {});
      c.sprites = c.sprites || {};
      c.roster = c.roster || [];
      c.maps = c.maps || [];
      return c;
    },

    /* ---- persistence --------------------------------------------------- */
    save: function () {
      try {
        localStorage.setItem(KEY, JSON.stringify(this.campaign));
        this.dirty = false;
        return { ok: true };
      } catch (e) {
        /* Custom sprites are data URLs and localStorage caps around 5MB. */
        var quota = /quota|exceeded/i.test(String(e && e.name) + String(e && e.message));
        return {
          ok: false,
          error: quota
            ? 'Browser storage is full (custom sprites are stored inline). Use Export to save the campaign to a file instead.'
            : String(e && e.message || e)
        };
      }
    },

    autosave: U.debounce(function () { store.save(); }, 1200),

    touch: function () { this.dirty = true; this.autosave(); },

    exportFile: function () {
      var blob = new Blob([JSON.stringify(this.campaign, null, 1)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (this.campaign.name || 'campaign').replace(/[^\w-]+/g, '_') + '.vtcampaign.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    },

    importJSON: function (text) {
      var data = JSON.parse(text);
      if (!data || !Array.isArray(data.maps)) throw new Error('Not a Virtual Tactics campaign file.');
      this.campaign = this.migrate(data);
      this.save();
      return this.campaign;
    },

    /* ---- accessors ----------------------------------------------------- */
    settings: function () { return this.campaign.settings; },

    activeMap: function () {
      var c = this.campaign;
      if (!c) return null;
      var m = c.maps.find(function (x) { return x.id === c.activeMapId; });
      return m || c.maps[0] || null;
    },

    setActiveMap: function (id) { this.campaign.activeMapId = id; this.touch(); },

    addMap: function (map) {
      this.campaign.maps.push(map);
      this.campaign.activeMapId = map.id;
      this.touch();
      return map;
    },

    removeMap: function (id) {
      var c = this.campaign;
      c.maps = c.maps.filter(function (m) { return m.id !== id; });
      if (c.activeMapId === id) c.activeMapId = c.maps.length ? c.maps[0].id : null;
      this.touch();
    },

    /* ---- sprite library ------------------------------------------------ */
    addSprite: function (sp) {
      sp.id = sp.id || U.uid('spr');
      this.campaign.sprites[sp.id] = sp;
      this.touch();
      return sp;
    },
    getSprite: function (id) { return id ? this.campaign.sprites[id] : null; },
    removeSprite: function (id) { delete this.campaign.sprites[id]; this.touch(); },

    /* ---- roster -------------------------------------------------------- */
    addToRoster: function (actor) {
      actor.id = actor.id || U.uid('tpl');
      this.campaign.roster.push(actor);
      this.touch();
      return actor;
    },
    removeFromRoster: function (id) {
      this.campaign.roster = this.campaign.roster.filter(function (a) { return a.id !== id; });
      this.touch();
    },

    DEFAULT_SETTINGS: DEFAULT_SETTINGS
  };

  VT.store = store;
})();

/* ===== ../src/render/spriteart.js ===== */
/* Virtual Tactics :: render/spriteart.js
   Procedural pixel-art tokens. Any actor without a custom sprite gets one of
   these, generated from a small spec (kind + palette + kit) and cached. It
   means a fresh campaign already has a visually distinct cast, and it gives
   players a fallback while they draw their own. Custom PNGs always win. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util;

  var GW = 16, GH = 22, S = 3;             // 16x22 logical pixels at 3x = 48x66
  var cache = {};

  function blank() {
    var c = document.createElement('canvas');
    c.width = GW * S; c.height = GH * S;
    var ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    return { c: c, ctx: ctx };
  }
  function px(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * S, y * S, (w || 1) * S, (h || 1) * S);
  }

  var DEFAULT = {
    kind: 'humanoid', skin: '#d9a074', hair: '#54331f', cloth: '#4b6fa8',
    trim: '#c8a44c', metal: '#b9bcc4', weapon: 'sword', shield: false,
    helm: false, cape: false, accent: '#c8504a'
  };

  /* ---- builds ---------------------------------------------------------- */
  function humanoid(ctx, s) {
    var dark = U.shade(s.cloth, -0.28), boot = U.shade(s.cloth, -0.46);
    var skinDark = U.shade(s.skin, -0.22);

    if (s.cape) {
      px(ctx, 3, 8, 10, 11, U.shade(s.accent, -0.18));
      px(ctx, 2, 10, 1, 7, U.shade(s.accent, -0.34));
      px(ctx, 13, 10, 1, 7, U.shade(s.accent, -0.34));
    }
    /* legs + boots */
    px(ctx, 5, 15, 2, 5, dark);
    px(ctx, 9, 15, 2, 5, dark);
    px(ctx, 4, 19, 3, 2, boot);
    px(ctx, 9, 19, 3, 2, boot);
    /* torso */
    px(ctx, 4, 8, 8, 8, s.cloth);
    px(ctx, 4, 8, 8, 1, U.shade(s.cloth, 0.16));
    px(ctx, 4, 14, 8, 2, s.trim);
    px(ctx, 7, 15, 2, 1, U.shade(s.trim, -0.3));
    /* arms */
    px(ctx, 2, 9, 2, 5, s.cloth);
    px(ctx, 12, 9, 2, 5, s.cloth);
    px(ctx, 2, 13, 2, 2, s.skin);
    px(ctx, 12, 13, 2, 2, s.skin);
    /* head */
    px(ctx, 7, 7, 2, 1, skinDark);
    px(ctx, 5, 3, 6, 5, s.skin);
    px(ctx, 5, 7, 6, 1, skinDark);
    if (s.helm) {
      px(ctx, 4, 2, 8, 3, s.metal);
      px(ctx, 4, 5, 8, 1, U.shade(s.metal, -0.3));
      px(ctx, 6, 5, 4, 1, '#16121a');
      px(ctx, 7, 1, 2, 1, s.trim);
    } else {
      px(ctx, 4, 2, 8, 2, s.hair);
      px(ctx, 4, 4, 1, 3, s.hair);
      px(ctx, 11, 4, 1, 3, s.hair);
      px(ctx, 6, 5, 1, 1, '#1a1218');
      px(ctx, 9, 5, 1, 1, '#1a1218');
    }
    weapon(ctx, s);
    if (s.shield) {
      px(ctx, 0, 9, 3, 7, s.trim);
      px(ctx, 0, 9, 3, 1, U.shade(s.trim, 0.25));
      px(ctx, 1, 11, 1, 2, s.metal);
    }
  }

  function weapon(ctx, s) {
    var m = s.metal, w = '#6b4a2a';
    switch (s.weapon) {
      case 'sword':
        px(ctx, 14, 3, 1, 10, m);
        px(ctx, 14, 3, 1, 4, U.shade(m, 0.25));
        px(ctx, 13, 13, 3, 1, s.trim);
        px(ctx, 14, 14, 1, 2, w);
        break;
      case 'greatsword':
        px(ctx, 13, 1, 2, 12, m);
        px(ctx, 13, 1, 1, 6, U.shade(m, 0.25));
        px(ctx, 12, 13, 4, 1, s.trim);
        px(ctx, 13, 14, 2, 3, w);
        break;
      case 'axe':
        px(ctx, 14, 4, 1, 13, w);
        px(ctx, 12, 3, 3, 4, m);
        px(ctx, 12, 3, 3, 1, U.shade(m, 0.22));
        break;
      case 'spear':
        px(ctx, 14, 1, 1, 17, w);
        px(ctx, 13, 0, 3, 3, m);
        break;
      case 'bow':
        ctx.strokeStyle = w; ctx.lineWidth = S;
        ctx.beginPath();
        ctx.arc(13 * S, 11 * S, 7 * S, -Math.PI / 2.1, Math.PI / 2.1);
        ctx.stroke();
        ctx.strokeStyle = '#e8e3d5'; ctx.lineWidth = Math.max(1, S / 2);
        ctx.beginPath(); ctx.moveTo(13.6 * S, 4.4 * S); ctx.lineTo(13.6 * S, 17.6 * S); ctx.stroke();
        break;
      case 'staff':
        px(ctx, 14, 2, 1, 17, w);
        px(ctx, 13, 0, 3, 3, s.accent);
        px(ctx, 14, 0, 1, 1, U.shade(s.accent, 0.4));
        break;
      case 'dagger':
        px(ctx, 14, 9, 1, 5, m);
        px(ctx, 13, 14, 3, 1, s.trim);
        break;
      case 'claws':
        px(ctx, 13, 13, 1, 3, m);
        px(ctx, 15, 13, 1, 3, m);
        px(ctx, 14, 14, 1, 3, m);
        break;
    }
  }

  function beast(ctx, s) {
    var fur = s.cloth, dark = U.shade(fur, -0.3), light = U.shade(fur, 0.15);
    px(ctx, 1, 10, 3, 2, dark);                 // tail
    px(ctx, 3, 12, 10, 6, fur);                 // body
    px(ctx, 3, 12, 10, 1, light);
    px(ctx, 10, 8, 5, 6, fur);                  // head
    px(ctx, 10, 8, 5, 1, light);
    px(ctx, 14, 11, 2, 2, dark);                // snout
    px(ctx, 10, 6, 2, 2, dark);                 // ears
    px(ctx, 13, 6, 2, 2, dark);
    px(ctx, 12, 10, 1, 1, s.accent);            // eye
    px(ctx, 14, 10, 1, 1, s.accent);
    px(ctx, 3, 18, 2, 3, dark);                 // legs
    px(ctx, 6, 18, 2, 3, dark);
    px(ctx, 9, 18, 2, 3, dark);
    px(ctx, 11, 18, 2, 3, dark);
    px(ctx, 14, 13, 1, 1, '#ffffff');           // fang
  }

  function undead(ctx, s) {
    var bone = s.skin, dark = U.shade(bone, -0.32);
    px(ctx, 5, 15, 2, 6, bone);
    px(ctx, 9, 15, 2, 6, bone);
    px(ctx, 5, 8, 6, 7, bone);
    for (var r = 9; r < 15; r += 2) px(ctx, 5, r, 6, 1, dark);   // ribs
    px(ctx, 3, 9, 2, 6, bone);
    px(ctx, 11, 9, 2, 6, bone);
    px(ctx, 5, 3, 6, 5, bone);
    px(ctx, 5, 7, 6, 1, dark);
    px(ctx, 6, 5, 1, 2, '#160f14');
    px(ctx, 9, 5, 1, 2, '#160f14');
    px(ctx, 6, 8, 4, 1, '#160f14');
    if (s.cape) { px(ctx, 3, 7, 10, 12, U.shade(s.accent, -0.3)); px(ctx, 5, 3, 6, 5, bone); px(ctx, 6, 5, 1, 2, s.accent); px(ctx, 9, 5, 1, 2, s.accent); }
    weapon(ctx, s);
  }

  function construct(ctx, s) {
    var m = s.metal, d = U.shade(m, -0.3), l = U.shade(m, 0.2);
    px(ctx, 4, 17, 3, 4, d);
    px(ctx, 9, 17, 3, 4, d);
    px(ctx, 3, 7, 10, 10, m);
    px(ctx, 3, 7, 10, 1, l);
    px(ctx, 1, 8, 2, 8, d);
    px(ctx, 13, 8, 2, 8, d);
    px(ctx, 5, 2, 6, 5, m);
    px(ctx, 5, 2, 6, 1, l);
    px(ctx, 6, 4, 1, 2, s.accent);
    px(ctx, 9, 4, 1, 2, s.accent);
    px(ctx, 6, 11, 4, 3, s.accent);
    px(ctx, 7, 12, 2, 1, U.shade(s.accent, 0.45));
  }

  function ooze(ctx, s) {
    var b = s.cloth;
    ctx.fillStyle = b;
    ctx.beginPath();
    ctx.ellipse(8 * S, 16 * S, 6.5 * S, 5.5 * S, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(8 * S, 12 * S, 4.6 * S, 4 * S, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = U.shade(b, 0.28);
    ctx.beginPath();
    ctx.ellipse(6 * S, 11 * S, 1.6 * S, 1.2 * S, 0, 0, Math.PI * 2);
    ctx.fill();
    px(ctx, 6, 14, 1, 2, '#14101a');
    px(ctx, 10, 14, 1, 2, '#14101a');
  }

  function dragon(ctx, s) {
    var b = s.cloth, d = U.shade(b, -0.3), l = U.shade(b, 0.2);
    px(ctx, 0, 4, 5, 9, d);                     // far wing
    px(ctx, 11, 3, 5, 10, U.shade(b, -0.14));   // near wing
    px(ctx, 4, 11, 8, 7, b);                    // body
    px(ctx, 4, 11, 8, 1, l);
    px(ctx, 10, 6, 5, 6, b);                    // head/neck
    px(ctx, 14, 9, 2, 2, d);
    px(ctx, 11, 4, 1, 3, d);                    // horn
    px(ctx, 13, 4, 1, 3, d);
    px(ctx, 12, 8, 1, 1, s.accent);
    px(ctx, 14, 8, 1, 1, s.accent);
    px(ctx, 0, 13, 4, 2, d);                    // tail
    px(ctx, 4, 18, 3, 3, d);
    px(ctx, 9, 18, 3, 3, d);
  }

  var BUILDS = {
    humanoid: humanoid, beast: beast, undead: undead,
    construct: construct, ooze: ooze, dragon: dragon
  };

  /* ---- public ---------------------------------------------------------- */
  function get(spec) {
    var s = Object.assign({}, DEFAULT, spec || {});
    var k = JSON.stringify(s);
    if (cache[k]) return cache[k];
    var b = blank();
    (BUILDS[s.kind] || humanoid)(b.ctx, s);
    cache[k] = b.c;
    return b.c;
  }

  /* Deterministic palette from a name - two goblins never look identical. */
  var SKINS = ['#d9a074', '#b9805a', '#8a5c3c', '#eac39a', '#6f4b34'];
  var HAIRS = ['#2b1b12', '#54331f', '#8a5a2b', '#c9a95f', '#3b3b44', '#7a2f2a'];
  var CLOTHS = ['#4b6fa8', '#7a4a8e', '#3f7a5c', '#a8543f', '#5a5f78', '#8a6a2f', '#3b5f7a'];
  function autoSpec(name, base) {
    var h = 0, str = String(name || 'x');
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    h = Math.abs(h);
    return Object.assign({
      skin: SKINS[h % SKINS.length],
      hair: HAIRS[(h >> 3) % HAIRS.length],
      cloth: CLOTHS[(h >> 6) % CLOTHS.length]
    }, base || {});
  }

  function clearCache() { cache = {}; }

  VT.spriteart = {
    get: get, autoSpec: autoSpec, clearCache: clearCache,
    DEFAULT: DEFAULT, BUILDS: Object.keys(BUILDS),
    WEAPONS: ['sword', 'greatsword', 'axe', 'spear', 'bow', 'staff', 'dagger', 'claws', 'none'],
    GW: GW, GH: GH, S: S
  };
})();

   bestiary / party of archetypes so a table can start playing immediately.

  var SIZES = ['tiny', 'small', 'medium', 'large', 'huge', 'gargantuan'];

/* Virtual Tactics :: rules/actor.js

(function () {
  'use strict';
  var VT = window.VT, U = VT.util, SRD = VT.srd;

      speed: 30,
      abilities: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 },
      saveProf: [],

    a.className = c.name;
    a.classKey = key;
    a.team = 'party';
    a.ac = c.ac;

    a.ac = m.ac;
    a.hpMax = m.hp; a.hp = m.hp;
    a.speed = m.speed;
    a.abilities = U.clone(m.abilities);
    a.actions = U.clone(m.actions);
    a.cr = m.cr;
    a.resist = U.clone(m.resist || []);
    a.vulnerable = U.clone(m.vulnerable || []);
    a.immune = U.clone(m.immune || []);

    a.tempHp = 0;
    a.conditions = [];

  /* ---- derived numbers ------------------------------------------------- */
  function abilityMod(a, k) { return SRD.mod((a.abilities && a.abilities[k]) || 10); }

  function applyDamage(a, amount, type) {

    if (type && (a.immune || []).indexOf(type) >= 0) return { taken: 0, immune: true, hp: a.hp };
    if (type && (a.resist || []).indexOf(type) >= 0) amount = Math.floor(amount / 2);

      ctx.drawImage(src, sx, sy, sw, sh, (c.width - dw) / 2, c.height - dh, dw, dh);

  function deathSaveState(a) {
    a.deathSaves = a.deathSaves || { s: 0, f: 0 };
    return a.deathSaves;

      return { result: 'fumble', note: 'natural 1 — two failures', outcome: deathSaveOutcome(a) };

    if (nat >= 10) {

      var out = deathSaveOutcome(a);

      return { result: 'success', outcome: out };

    var n = String(name || '').toLowerCase();
    a.attuned = attunedTo(a).filter(function (x) { return String(x.name).toLowerCase() !== n; });
    return { ok: true };

/* ===== ../src/rules/gear.js ===== */
/* Virtual Tactics :: rules/gear.js
   What a character is wearing, and what that costs them.

   Armour used to be picked once at build time and then only existed as a name
   and an AC number. That made three things impossible: seeing your armour in
   your inventory, taking it off without deleting it, and applying the penalties
   that come with wearing it. All three are the same missing idea - equipment is
   a thing you own that may or may not be worn right now.

   So an inventory entry can carry a `gear` record and an `equipped` flag, and
   everything else is derived from what is equipped. Taking off plate is
   unsetting a boolean; the plate is still in the bag.

   The penalties are the part that was quietly missing. Heavy armour gives
   disadvantage on Stealth, and wearing armour heavier than your Strength can
   support costs you 10 feet of speed - and a monk's Unarmored Movement and a
   barbarian's Fast Movement both stop applying, which is the whole reason those
   features say "unarmoured" in their names.

   A fourth arrived later and lives in rules/proficiency.js: armour you were
   never trained to wear. recompute() raises the flag and retunes the weapon
   attacks, because both depend on what is equipped and both have to be worked
   out afresh each time rather than adjusted. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, SRD = VT.srd;

  /* 5etools types: HA heavy, MA medium, LA light, S shield. */
  var ARMOUR = { HA: 'heavy', MA: 'medium', LA: 'light' };

  function baseType(item) {
    return String((item && item.type) || '').split('|')[0];
  }

  /* Which slot an item occupies, or null if it is not something you wear. */
  /* Armour and shields are exclusive - one each. Weapons and trinkets are not:
     you can hold two weapons and wear several rings, and pretending otherwise
     would be a rule the books do not have. */
  var EXCLUSIVE = { armor: 1, shield: 1 };

  function slotOf(item) {
    var t = baseType(item);
    if (ARMOUR[t]) return 'armor';
    if (t === 'S') return 'shield';
    if (item && (item.weaponCategory || t === 'M' || t === 'R')) return 'weapon';
    /* anything with a mechanical effect is worth being able to put on */
    if (VT.itemfx && VT.itemfx.effectsOf(item)) return 'trinket';
    return null;
  }

  /* The compact record kept on an inventory entry. Deliberately a copy of the
     few fields that matter rather than the whole item: this is saved with the
     character and rides through the symbiote's 500-byte sync budget. */
  function fromItem(item) {
    var slot = slotOf(item);
    if (!slot) return null;
    var g = { slot: slot };
    var t = baseType(item);
    if (slot === 'armor') {
      g.weight = ARMOUR[t];                       /* heavy | medium | light */
      g.ac = item.ac || 10;
      if (item.stealth) g.stealth = true;         /* disadvantage while worn */
      if (item.strength) g.strength = parseInt(item.strength, 10) || 0;
    } else if (slot === 'shield') {
      g.ac = item.ac || 2;
    } else if (slot === 'weapon') {
      /* "simple" or "martial", kept so the inventory row can say whether you
         are trained with what you are holding. Entries saved before this
         existed have no category and are left unjudged rather than guessed at. */
      if (item.weaponCategory) g.category = String(item.weaponCategory);
    }
    return g;
  }

  function entries(actor) {
    return (actor && actor.inventory) || [];
  }

  function equippedIn(actor, slot) {
    return entries(actor).filter(function (e) {
      return e.equipped && e.gear && e.gear.slot === slot;
    })[0] || null;
  }

  function armour(actor) { return equippedIn(actor, 'armor'); }
  function shield(actor) { return equippedIn(actor, 'shield'); }

  /* Wearing something takes off whatever was in that slot. You cannot wear two
     breastplates, and a sheet that lets you is worse than one that does not. */
  function equip(actor, entry) {
    if (!entry || !entry.gear) return false;
    if (EXCLUSIVE[entry.gear.slot]) {
      entries(actor).forEach(function (e) {
        if (e !== entry && e.equipped && e.gear && e.gear.slot === entry.gear.slot) {
          e.equipped = false;
        }
      });
    }
    entry.equipped = true;
    recompute(actor);
    return true;
  }

  function unequip(actor, entry) {
    if (!entry) return false;
    entry.equipped = false;
    recompute(actor);
    return true;
  }

  function toggle(actor, entry) {
    return entry.equipped ? unequip(actor, entry) : equip(actor, entry);
  }

  /* ---- what being dressed costs ----------------------------------------- */

  /* Disadvantage on Stealth, from the armour itself. */
  function stealthDisadvantage(actor) {
    var a = armour(actor);
    return !!(a && a.gear && a.gear.stealth);
  }

  /* Armour you are not strong enough for costs 10 feet. Dwarves are famously
     exempt, and say so in their own trait text rather than anywhere central, so
     derive() records it when it reads the race. */
  function speedPenalty(actor) {
    var a = armour(actor);
    if (!a || !a.gear || !a.gear.strength) return 0;
    if (actor.heavyArmorSpeedOk) return 0;
    var str = SRD.mod ? (actor.abilities && actor.abilities.str) || 10 : 10;
