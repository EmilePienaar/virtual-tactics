  function wearingArmour(actor) { return !!armour(actor); }
  function wearingHeavy(actor) {
    var a = armour(actor);
    return !!(a && a.gear && a.gear.weight === 'heavy');
  }
  function wearingShield(actor) { return !!shield(actor); }

  /* ---- putting the numbers back together -------------------------------- */

  /* Recalculate everything that depends on what is worn. Called after any
     equip or unequip, and by derive() once the inventory exists. */
  function recompute(actor) {
    if (!actor) return actor;

    /* Ability scores first: an item that sets Dexterity changes the armour
       class that is about to be worked out from it, so the order matters. */
    if (VT.itemfx) VT.itemfx.applyAbilities(actor);

    var arm = armour(actor), shd = shield(actor);
    var dex = SRD.mod((actor.abilities && actor.abilities.dex) || 10);

    var ac, why;
    if (arm) {
      var g = arm.gear;
      var base = g.ac || 10;
      if (g.weight === 'heavy') { ac = base; why = arm.name + ' ' + base; }
      else if (g.weight === 'medium') {
        var capped = Math.min(2, dex);
        ac = base + capped;
        why = arm.name + ' ' + base + U.sign(capped) + ' DEX (capped at +2)';
      } else {
        ac = base + dex;
        why = arm.name + ' ' + base + U.sign(dex) + ' DEX';
      }
    } else {
      ac = 10 + dex;
      why = '10' + U.sign(dex) + ' DEX (no armour)';
    }
    if (shd) { ac += (shd.gear.ac || 2); why += ' +' + (shd.gear.ac || 2) + ' shield'; }

    actor.armorName = arm ? arm.name : '';
    actor.armorType = arm ? arm.gear.weight : null;
    actor.shield = !!shd;
    actor.ac = ac;
    actor.acWhy = why;

    /* Features that replace AC or add speed depend on what is worn, so they
       have to be reconsidered every time it changes. apply() carries spent
       resources forward, so re-running it costs nothing but the recalculation. */
    if (VT.features && VT.features.apply) VT.features.apply(actor);

    /* Everything else items do stacks on top of the armour and the features. */
    if (VT.itemfx) VT.itemfx.applyRest(actor);

    /* Race, features and items all grant resistances; this is where the three
       become one list. */
    if (VT.resist) VT.resist.gather(actor);

    /* Wands and staves offer their spells while they are live. Recomputed here
       so attuning or unattuning one makes its action appear or disappear. */
    if (VT.itemfx && VT.itemfx.allActions) actor.itemActions = VT.itemfx.allActions(actor);

    /* Wearing armour you were never trained in. A flag rather than an edited
       number, because the penalty is disadvantage on three different kinds of
       roll plus a bar on casting, and because this function runs again on
       every equip - see the note in rules/proficiency.js. Recomputed from
       scratch each time, so taking the armour off clears it. */
    if (VT.proficiency) {
      actor.armorUnskilled = VT.proficiency.armourPenalty(actor);
      /* Picking up a weapon you cannot use should change the attack bonus, and
         so should a change of training on the Edit tab. */
      VT.proficiency.retune(actor);
    }
    return actor;
  }

  /* The item's own words, kept on the entry so the sheet can show them.

     Kept rather than looked up because the sheet has to work for a player with
     no data connected: an item bought from the shop and collected on a laptop
     with no 5etools folder should still be readable.

     Still capped - a saved character rides in symbiote storage and a few magic
     items with full text would otherwise be most of the blob - but generously,
     because this is now only the fallback. When the compendium is loaded the
     sheet reads the item's own record and shows the whole thing, so the cap
     only bites for someone with no data at all, and 4000 characters covers
     all but a handful of the longest artifacts. */
  var DESC_CAP = 4000;

  function describeItem(item) {
    if (!item || !VT.tags || !VT.tags.toText) return '';
    var text = '';
    try { text = VT.tags.toText(item.entries || []) || ''; } catch (e) { return ''; }
    text = String(text).trim();
    if (!text) return '';
    return text.length > DESC_CAP ? text.slice(0, DESC_CAP - 1).trim() + '…' : text;
  }

  /* Put an item into the bag, as gear when it is wearable. */
  function add(actor, item, opts) {
    opts = opts || {};
    actor.inventory = actor.inventory || [];
    var g = fromItem(item);
    var entry = {
      name: item.name,
      qty: opts.qty || 1,
      note: opts.note || '',
      gear: g || undefined,
      equipped: g ? !!opts.equipped : undefined

    if (item.rarity && item.rarity !== 'none') entry.rarity = item.rarity;
    var desc = describeItem(item);
    if (desc) entry.desc = desc;

     effects. Anything already sitting in a player's bag from before is in the
     same state, so this runs over the whole inventory whenever a data source
     finishes connecting.

     Deliberately additive. It fills in `gear`, `desc`, `fx` and `rarity` and

      var rec = VT.fivetools.byName('item', e.name, e.source || null) ||

      if (!rec) return;
      var g = fromItem(rec);
      if (g) { e.gear = g; if (e.equipped == null) e.equipped = false; }
      var desc = describeItem(rec);
      if (desc) e.desc = desc;
      if (rec.source && !e.source) e.source = rec.source;
      if (rec.rarity && rec.rarity !== 'none' && !e.rarity) e.rarity = rec.rarity;
      if (VT.itemfx) VT.itemfx.tag(e, rec);

    if (fixed) recompute(actor);
    return fixed;
  }

  VT.gear = {
    slotOf: slotOf, fromItem: fromItem, add: add, reconcile: reconcile,
    armour: armour, shield: shield, describeItem: describeItem,
    equip: equip, unequip: unequip, toggle: toggle,
    recompute: recompute,

    wearingArmour: wearingArmour, wearingHeavy: wearingHeavy, wearingShield: wearingShield

})();

/* ===== ../src/rules/proficiency.js ===== */
/* Virtual Tactics :: rules/proficiency.js
   What you are trained to use, and what it costs you when you are not.

   Four lists hang off a character: languages, tools, weapons and armour. Tools
   were already there because a thieves' tools check is a thing you roll. The
   other three were not, and their absence was quietly generous: a wizard in
   plate got the full armour class with no penalty, and every weapon on the
   sheet added the proficiency bonus whether or not the character had ever been
   taught to hold it.

   The rules for the two that matter are short:

     - A weapon you are not proficient with does NOT add your proficiency
       bonus to the attack roll. Everything else about it is unchanged.
     - Armour you are not proficient with gives disadvantage on any ability
       check, saving throw or attack roll that uses Strength or Dexterity, and
       you cannot cast spells at all. The armour class itself is unaffected -
       the plate still stops swords, you are just bad at wearing it.

   Neither penalty is applied by editing a number in place. `retune` recomputes
   an attack's proficiency share from a recorded base, and the armour penalty is
   a flag other code reads - because `gear.recompute()` runs again every time
   anything is equipped, and anything that accumulates instead of recomputing
   drifts. See the note about `features.apply()` in the design notes.

   What is a list and what is missing:

     null / absent   nothing is known about this character's training, so no
                     penalty is applied. Monsters, and characters imported as
                     flat statblocks, land here on purpose.
     []              known, and empty. A character with no weapon training
                     really does swing a sword without the bonus. */
(function () {
  'use strict';
  var VT = window.VT;

  var ARMOUR_KINDS = ['light', 'medium', 'heavy', 'shields'];
  var WEAPON_KINDS = ['simple', 'martial'];

  /* ---- reading what the books wrote ------------------------------------ */
  /* The same proficiency is written half a dozen ways across 5etools:

       "light"                      a class's startingProficiencies.armor
       "martial weapons"            the 2024 phrasing
       "longsword|phb"              a specific item, with its source
       {"proficiency": "shields"}   an object wrapper
       {"light": true}              a race's armorProficiencies, as a map
       "{@item thieves' tools|PHB}" a tagged item inside prose

     All of them mean one lowercase word or item name, so normalise hard and
     compare on the result rather than teaching every caller the shapes. */
  function clean(v) {
    if (v == null) return '';
    if (typeof v === 'object') v = v.proficiency || v.name || '';
    var s = String(v);
    /* Expand every tag to the thing it names, not just {@item}. The 2024 Monk
       grants "Martial weapons that have the {@filter Light|items|...} property",
       and a reader that only knew {@item} left the raw tag in the string - which
       then became a chip on the sheet reading
       "Martial weapons that have the {@filter light". */
    s = s.replace(/\{@\w+\s+([^|}]+)(?:\|[^}]*)?\}/g, '$1');
    /* And a tag that never closes. A character saved before this reader existed
       stored the string already cut at the first pipe - "... the {@filter light"
       - so there is no closing brace left for the rule above to match. */
    s = s.replace(/\{@\w+\s+/g, '').replace(/[{}]/g, '');
    s = s.split('|')[0].trim().toLowerCase();
    s = s.replace(/\s+weapons?$/, '').replace(/\s+armou?r$/, '');
    if (s === 'shield') s = 'shields';
    return s;
  }

  /* Is this a name we can match against an item, or a sentence?

     Most entries are a kind ("martial") or an item ("hand crossbow"). A few are
     a CONDITION - "martial weapons that have the light property" - which is a
     real grant and not something this can evaluate against an item, because the
     answer depends on the item's properties rather than its name.

     Those are kept and shown, as a note beside the list rather than a chip.
     Turning one into a chip made it look like a weapon called "martial weapons
     that have the light"; dropping it silently would lose a proficiency the
     character really has. Three words is the line: "hand crossbow" and "light
     hammer" are names, anything longer is prose. */
  function isProse(name) {
    if (!name) return false;
    if (name.split(/\s+/).length > 3) return true;
    return /\b(that|with|which|any|other|choice)\b/.test(name);
  }

  /* The prose entries out of a raw list, tidied for reading. */
  function prose(raw) {
    var out = [];
    listAll(raw).forEach(function (v) {
      if (isProse(v) && out.indexOf(v) < 0) out.push(v);
    });
    return out;
  }

  /* A list of proficiencies from any of the shapes above, deduplicated.
     Map-shaped entries ({"light": true}) come from race and background
     records; keys whose value is a number are a count of free choices and are
     reported separately by `choicesIn`, not folded in as if they were names. */
  function listOf(raw) {
    return listAll(raw).filter(function (v) { return !isProse(v); });
  }

  /* Every entry, prose included. listOf() drops the prose; prose() keeps only
     it; between them nothing in the source is silently thrown away. */
  function listAll(raw) {
    var out = [];
    function add(v) {
      var c = clean(v);
      if (c && out.indexOf(c) < 0) out.push(c);
    }
    (Array.isArray(raw) ? raw : raw == null ? [] : [raw]).forEach(function (v) {
      if (v && typeof v === 'object' && !v.proficiency && !v.name) {
        Object.keys(v).forEach(function (k) {
          if (v[k] === true) add(k);
          /* {"choose": {...}} and {"anyStandard": 2} are choices, not grants */
        });
      } else if (typeof v === 'object' && (v.proficiency || v.name)) {
        add(v);
      } else if (typeof v === 'string') {
        add(v);
      }
    });
    return out;
  }

     written as {"anyStandard": 2} and there is nothing to resolve it to, so we
     count them and let the sheet say "2 still to choose". Silently dropping
     them is how a character ends up mysteriously missing Elvish. */
  function choicesIn(raw) {
    var n = 0;
    (Array.isArray(raw) ? raw : raw == null ? [] : [raw]).forEach(function (v) {
      if (!v || typeof v !== 'object') return;
      Object.keys(v).forEach(function (k) {

        else if (k === 'choose' && v[k] && v[k].count) n += v[k].count;
        else if (k === 'choose') n += 1;

  /* ---- gathering a character's training -------------------------------- */
  /* Everything a build grants, from class, race, subrace and background.

     `classes` is the multiclass shape [{cls, subclass, level}]; only the class
     you started as gives its full starting proficiencies, which is what
     multiclass.proficiencies() already works out. Race and background are read
     here because nothing else does.

     Returns {armor, weapons, skills, languages, languageChoices, skillChoices}.
     Tools stay where they are - choices.js already reads them out of prose,
     which is a harder job than this one and not worth duplicating. */
  function gather(c) {
    var out = { armor: [], weapons: [], skills: [], languages: [],
                languageChoices: 0, skillChoices: 0, notes: [] };
    if (!c) return out;

    if (VT.multiclass && c.classes && c.classes.length) {
      var mc = VT.multiclass.proficiencies(c.classes);
      out.armor = listOf(mc.armor);
      out.weapons = listOf(mc.weapons);
      /* Conditional grants the matcher cannot evaluate, kept so the sheet can
         say what they are rather than pretending they do not exist. */
      out.notes = prose(mc.weapons).concat(prose(mc.armor));
    }

    /* Skills from race and background. The class side is a CHOICE and is made
       on the choice tree, so it is not gathered here - but a race that simply
       grants Perception, and a background that simply grants two skills, were
       being dropped entirely. They are written as a map, {"survival": true,
       "nature": true}, which is the same shape as the rest of this file's
       input, so it costs one more line to read them. */
    [c.race, c.subrace, c.background].forEach(function (rec) {
      if (!rec) return;
      merge(out.armor, listOf(rec.armorProficiencies));
      merge(out.weapons, listOf(rec.weaponProficiencies));
      merge(out.languages, listOf(rec.languageProficiencies));
      merge(out.skills, skillsIn(rec.skillProficiencies));
      out.languageChoices += choicesIn(rec.languageProficiencies);
      out.skillChoices += choicesIn(rec.skillProficiencies);
    });

    /* Everyone speaks the local tongue. The books assume it rather than
       granting it, and a sheet that lists no languages at all reads as a bug. */
    if (out.languages.indexOf('common') < 0) out.languages.unshift('common');
    return out;
  }

  function merge(target, list) {
    list.forEach(function (v) { if (target.indexOf(v) < 0) target.push(v); });
  }

  /* Skill names have to survive normalisation intact. `clean` strips a trailing
     " weapons"/" armour", which no skill name ends in, but it also lowercases -
     and lowercase is exactly the form skillProf is stored in, so that is right.
     What must NOT happen is a skill the sheet cannot match: anything not in the
     18 is dropped rather than added as a row nothing can roll. */
  function skillsIn(raw) {
    var known = (VT.tags && VT.tags.SKILL_ABILITY) || (VT.srd && VT.srd.SKILL_ABILITY) || null;
    return listOf(raw).filter(function (sk) {
      return !known || Object.prototype.hasOwnProperty.call(known, sk);
    });
  }

  /* ---- am I proficient with this? -------------------------------------- */
  /* A missing list means "we were never told", and an unknown is not a
     penalty. An empty list means "told, and the answer is nothing". */
  function known(list) { return Array.isArray(list); }

  /* item may be a 5etools item record, an inventory gear entry, or just a
     name. Category is the "simple"/"martial" side; the name catches a class
     that grants specific weapons, like a rogue's rapier or a monk's
     shortsword. */
  function weaponOk(actor, item, category) {
    var list = actor && actor.weaponProf;
    if (!known(list)) return true;
    var name = clean(typeof item === 'string' ? item : (item && item.name));
    var cat = clean(category != null ? category
      : (item && (item.weaponCategory || item.category)));
    if (cat && list.indexOf(cat) >= 0) return true;
    if (name && list.indexOf(name) >= 0) return true;
    /* An unarmed strike is not a weapon and needs no training; neither do the
       natural attacks a wild-shaped druid or a summon brings with it. Those
       arrive with no category at all, so treat a nameless, categoryless attack
       as fine rather than docking it a bonus it never had. */
    if (!cat && !name) return true;
    return false;
  }

  /* `worn` is an inventory entry with a gear record, or an item record. */
  function armourWeight(worn) {
    if (!worn) return null;
    if (worn.gear) return worn.gear.slot === 'shield' ? 'shields' : worn.gear.weight || null;
    var t = String(worn.type || '').split('|')[0];
    return { HA: 'heavy', MA: 'medium', LA: 'light', S: 'shields' }[t] || null;
  }

  function armourOk(actor, worn) {
    var list = actor && actor.armorProf;
    if (!known(list)) return true;
    var weight = armourWeight(worn);
    if (!weight) return true;
    if (list.indexOf(weight) >= 0) return true;
    /* Heavy armour training implies the lighter kinds in every class list the
       books print, but nothing in the data says so, so do not infer it. The
       one thing worth honouring is a specific grant by name - a race that
       trains you in a single piece of armour. */
    var name = clean(worn && worn.name);
    return !!(name && list.indexOf(name) >= 0);
  }

  /* What you are wearing that you should not be, or null. Read by the sheet,
     the roll helpers and the battle map's advantage calculation. */
  function armourPenalty(actor) {
    if (!actor || !known(actor.armorProf) || !VT.gear) return null;
    var bad = [];
    var arm = VT.gear.armour(actor);
    if (arm && !armourOk(actor, arm)) bad.push(arm.name);
    var shd = VT.gear.shield(actor);
    if (shd && !armourOk(actor, shd)) bad.push(shd.name);
    if (!bad.length) return null;
    return {
      items: bad,
      why: 'not proficient with ' + bad.join(' or '),
      /* spelled out because the penalty is three separate rules and a player
         who sees only "disadvantage" will not know spells are off too */
      note: 'Disadvantage on Strength and Dexterity checks, saves and attacks, ' +
            'and you cannot cast spells, while wearing ' + bad.join(' and ') + '.'
    };
  }

  /* Does an unfamiliar-armour penalty touch this roll? */
  var STR_DEX = { str: 1, dex: 1 };
  function hindersAbility(actor, ability) {
    return !!(actor && actor.armorUnskilled && STR_DEX[ability]);
  }
  function hindersSkill(actor, skill) {
    var abil = VT.tags && VT.tags.SKILL_ABILITY && VT.tags.SKILL_ABILITY[skill];
    return hindersAbility(actor, abil);
  }
  /* Weapon attacks use Strength or Dexterity; a spell attack uses the casting
     ability and is instead forbidden outright. */
  function hindersAttack(actor, act) {
    if (!actor || !actor.armorUnskilled || !act) return false;
    return act.kind === 'melee' || act.kind === 'ranged';
  }
  function blocksSpells(actor) { return !!(actor && actor.armorUnskilled); }

  /* ---- keeping attack bonuses honest ------------------------------------ */
  /* convert.weapon records how much of an attack's `toHit` is the proficiency
     bonus, on `profBonus`. That makes the share removable and re-addable
     without rebuilding the character, which is what changing your training on
     the Edit tab has to do.

     Recomputed from the recorded share every time rather than adjusted, so
     running this twice is the same as running it once. Actions saved before
     this existed carry no `profBonus` and are left exactly alone. */
  function retune(actor) {
    if (!actor || !Array.isArray(actor.actions)) return actor;
    var full = VT.actor ? VT.actor.prof(actor) : 2;
    actor.actions.forEach(function (act) {
      if (!act || act.profBonus == null) return;
      var ok = weaponOk(actor, act.itemName || act.name, act.weaponCategory);
      var want = ok ? full : 0;
      if (want !== act.profBonus) {
        act.toHit = (act.toHit || 0) + (want - act.profBonus);
        act.profBonus = want;
      }
      if (ok) delete act.notProficient;
      else act.notProficient = true;
    });
    return actor;
  }

  /* ---- characters saved before any of this existed ---------------------- */
  /* They have no lists at all, which reads as "nothing is known" and so costs
     them nothing - but it also means their Proficiencies card is empty, and a
     fighter with a blank armour row looks broken rather than untold.

     If the build references are still there and the compendium can resolve
     them, work the lists out now. If it cannot - no data connected, or a
     character imported as a flat statblock - leave them absent, because a
     guess here becomes a penalty on the sheet. Runs once: it only fills what
     is missing, so it is safe to call on every load. */
  function backfill(actor) {
    if (!actor || known(actor.armorProf)) return actor;
    var refs = actor.build;
    if (!refs || !VT.charbuild || !VT.charbuild.fromRefs) return actor;
    var r = VT.charbuild.fromRefs(refs);
    if (!r || !r.choices || !r.choices.classes.length) return actor;
    /* fromRefs hands back the record shape, [{cls, subclass, level}]; what
       multiclass.proficiencies looks up is the flat one the actor carries,
       [{name, source, level}]. Different shapes, same list, and passing the
       wrong one fails silently by finding no class at all. */
    var out = gather({
      classes: r.choices.classes.map(function (e) {
        return { name: e.cls.name, source: e.cls.source || null, level: e.level || 1 };
      }),
      race: r.choices.race, subrace: r.choices.subrace, background: r.choices.background
    });
    actor.armorProf = out.armor;
    actor.weaponProf = out.weapons;
    actor.langProf = merged(out.languages, actor.langProf);
    actor.langChoices = out.languageChoices;
    /* Skills already exist on every character, so this MERGES rather than
       replaces - a hand-toggled proficiency must not be thrown away by a
       backfill that only meant to add the race's. */
    actor.skillProf = merged(out.skills, actor.skillProf);
    return actor;
  }

  function merged(a, b) {
    var out = a.slice();
    (b || []).forEach(function (v) {
      var c = clean(v);
      if (c && out.indexOf(c) < 0) out.push(c);
    });
    return out;
  }

  /* Repair a character saved with prose in its proficiency lists.

     Before the reader expanded every tag, a conditional grant was stored as the
     half-eaten string "martial weapons that have the {@filter light" and shown
     as a chip. It can never match an item, so it is moved out of the list and
     into the notes where it belongs. Runs on load and only changes a character
     that actually has one. */
  function tidy(actor) {
    if (!actor) return actor;
    var moved = [];
    ['weaponProf', 'armorProf'].forEach(function (key) {
      if (!Array.isArray(actor[key])) return;
      var kept = [];
      actor[key].forEach(function (v) {
        var c = clean(v);
        if (!c) return;
        if (isProse(c)) { if (moved.indexOf(c) < 0) moved.push(c); return; }
        if (kept.indexOf(c) < 0) kept.push(c);
      });
      actor[key] = kept;
    });
    if (moved.length) {
      actor.profNotes = (actor.profNotes || []).slice();
      moved.forEach(function (m) {
        if (actor.profNotes.indexOf(m) < 0) actor.profNotes.push(m);
      });
    }
    return actor;
  }

  VT.proficiency = {
    ARMOUR_KINDS: ARMOUR_KINDS, WEAPON_KINDS: WEAPON_KINDS,
    backfill: backfill, tidy: tidy,
    clean: clean, listOf: listOf, choicesIn: choicesIn, gather: gather,
    skillsIn: skillsIn, prose: prose, isProse: isProse,
    weaponOk: weaponOk, armourOk: armourOk, armourWeight: armourWeight,
    armourPenalty: armourPenalty,
    hindersAbility: hindersAbility, hindersSkill: hindersSkill,
    hindersAttack: hindersAttack, blocksSpells: blocksSpells,
    retune: retune
  };
})();

/* ===== ../src/rules/itemfx.js ===== */
/* Virtual Tactics :: rules/itemfx.js
   What a magic item actually does to you.

   Until now an attuned Belt of Hill Giant Strength was a line in a list. It did
   not touch Strength, which is the entire item. Same for a Ring of Protection
   and its +1, a Ring of Fire Resistance and its resistance, Boots of Speed and
   their doubled movement.

   The data carries all of it in structured fields, so this reads rather than
   guesses:

     ability:      { static: { str: 21 } }      74 items
     bonusAc:      "+1"                        267 items
     resist:       ["fire"]                    361 items
     modifySpeed:  { multiply: { walk: 2 } }   121 items
     bonusSavingThrow, conditionImmune, bonusSpellAttack, bonusSpellSaveDc

   When an item counts is the other half of the question. An item that requires
   attunement does nothing until attuned - that is what attunement is for.
   Anything else has to be worn. Carrying a ring in your pack has never made
   anyone tougher. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, SRD = VT.srd;

  function num(v) {
    if (v == null) return 0;
    var n = parseInt(String(v).replace(/[^-\d]/g, ''), 10);
    return isNaN(n) ? 0 : n;
  }

  /* The compact record kept on an inventory entry, or null for a mundane item.
     A copy rather than the whole record: this is saved with the character. */
  function effectsOf(item) {
    if (!item) return null;
    var fx = {};
    if (item.ability && item.ability.static) fx.set = U.clone(item.ability.static);
    if (item.bonusAc) fx.ac = num(item.bonusAc);
    if (item.bonusSavingThrow) fx.save = num(item.bonusSavingThrow);
    if (item.bonusSpellAttack) fx.spellAttack = num(item.bonusSpellAttack);
    if (item.bonusSpellSaveDc) fx.spellDc = num(item.bonusSpellSaveDc);
    if (item.resist) fx.resist = [].concat(item.resist).filter(function (x) { return typeof x === 'string'; });
    if (item.conditionImmune) {
      fx.conditionImmune = [].concat(item.conditionImmune)
        .filter(function (x) { return typeof x === 'string'; });
    }
    if (item.modifySpeed && item.modifySpeed.multiply) fx.speedMul = U.clone(item.modifySpeed.multiply);
    if (item.modifySpeed && item.modifySpeed.bonus) fx.speedAdd = U.clone(item.modifySpeed.bonus);
    if (item.reqAttune) fx.needsAttune = true;
    /* A wand is not just a bonus - it casts. 524 items carry the spells they
       cast in a structured field, keyed by what it costs to cast them:
         attachedSpells: { charges: { "1": ["magic missile"] } }
       and 1,157 carry charges. Both are kept so the sheet can offer the spell
       as a real action rather than leaving it buried in the description. */
    if (item.attachedSpells) fx.spells = U.clone(item.attachedSpells);
    if (item.charges) fx.charges = item.charges;
    if (item.recharge) fx.recharge = item.recharge;
    if (item.rechargeAmount) {
      fx.rechargeAmount = String(item.rechargeAmount).replace(/\{@dice\s*([^}]*)\}/i, '$1').trim();
    }
    /* Armour states its total AC already, so its own +1 must not be added on
       top - "+1 Plate Armor" carries ac 19 AND bonusAc "+1", and counting both
       gives 20. */
    if (item.armor && item.ac) fx.acInArmour = true;
    return Object.keys(fx).length ? fx : null;
  }

  /* Is this entry doing anything right now? */
  function live(actor, entry) {
    if (!entry || !entry.fx) return false;
    if (entry.fx.needsAttune) {
      return (actor.attuned || []).some(function (x) {
        return String(x.name).toLowerCase() === String(entry.name).toLowerCase();
      });
    }
    return !!entry.equipped;
  }

  function active(actor) {
    return (actor.inventory || []).filter(function (e) { return live(actor, e); });
  }

  /* ---- applying ---------------------------------------------------------- */

  /* Ability scores an item sets. The books say "your Strength score changes to
     21", and every one of them adds "unless your Strength is already equal to
     or greater" - so it is a floor, not an assignment. */
  function applyAbilities(actor) {
    if (!actor.baseAbilities) actor.baseAbilities = U.clone(actor.abilities || {});
    var out = U.clone(actor.baseAbilities);
    var from = {};
    active(actor).forEach(function (e) {
      var set = e.fx.set;
      if (!set) return;
      Object.keys(set).forEach(function (k) {
        if ((out[k] || 0) < set[k]) { out[k] = set[k]; from[k] = e.name; }
      });
    });
    actor.abilities = out;
    actor.abilityFrom = from;
    return actor;
  }

  /* Everything that is not an ability score. Called after AC has been worked
     out from armour, because these stack on top of it. */
  function applyRest(actor) {
    var acBonus = 0, saveBonus = 0, spellAtk = 0, spellDc = 0;
    var resist = [], condImm = [], notes = [];
    var speedMul = 1, speedAdd = 0;

    active(actor).forEach(function (e) {
      var fx = e.fx;
      /* worn armour already includes its own bonus in its AC */
      if (fx.ac && !(fx.acInArmour && e.gear && e.gear.slot === 'armor')) acBonus += fx.ac;
      if (fx.save) saveBonus += fx.save;
      if (fx.spellAttack) spellAtk += fx.spellAttack;
      if (fx.spellDc) spellDc += fx.spellDc;
      (fx.resist || []).forEach(function (r) { if (resist.indexOf(r) < 0) resist.push(r); });
      (fx.conditionImmune || []).forEach(function (r) { if (condImm.indexOf(r) < 0) condImm.push(r); });
      if (fx.speedMul && fx.speedMul.walk) speedMul *= fx.speedMul.walk;
      if (fx.speedAdd && fx.speedAdd.walk) speedAdd += fx.speedAdd.walk;
      if (fx.ac || fx.save || fx.resist || fx.set || fx.speedMul) notes.push(e.name);
    });

    if (acBonus) {
      actor.ac = (actor.ac || 10) + acBonus;
      actor.acWhy = (actor.acWhy || '') + U.sign(acBonus) + ' from items';
    }
    actor.itemSaveBonus = saveBonus;
    actor.itemSpellAttack = spellAtk;
    actor.itemSpellDc = spellDc;
    /* Kept apart from actor.resist, which resist.js owns - it merges these
        with what the race and the class features grant. Writing straight to
        actor.resist here would erase a tiefling's fire resistance the moment
        they picked up any magic item. */
     actor.itemResist = resist;
     actor.itemConditionImmune = condImm;
     actor.itemNotes = notes;

    if (speedMul !== 1 || speedAdd) {
      actor.speed = Math.round((actor.speed || 30) * speedMul) + speedAdd;
    }
    if (spellAtk && actor.spellAttack != null) actor.spellAttack += spellAtk;
    if (spellDc && actor.spellDC != null) actor.spellDC += spellDc;
    return actor;
  }

  /* The spells an item can cast, as rollable actions.

     Gated the same way every other effect is: an item that requires attunement
     grants nothing until attuned, and anything else has to be held or worn.
     A wand in your pack is not a wand in your hand. */
  function actionsFrom(actor, entry) {
    if (!entry || !entry.fx || !entry.fx.spells) return [];
    if (!live(actor, entry)) return [];
    var FT = VT.fivetools;
    if (!FT || !FT.get) return [];

    var out = [];
    var seen = {};
    Object.keys(entry.fx.spells).forEach(function (how) {
      var byCost = entry.fx.spells[how];
      /* "charges" is an object of cost -> names; the rest are plain arrays. */
      var pairs = Array.isArray(byCost)
        ? [[null, byCost]]
        : Object.keys(byCost).map(function (k) { return [k, byCost[k]]; });

      pairs.forEach(function (pair) {
        var cost = pair[0], names = pair[1] || [];
        names.forEach(function (raw) {
          var name = String(raw).split('|')[0].trim();
          var key = name.toLowerCase();
          if (seen[key]) return;
          seen[key] = 1;
          var rec = (FT.get('spell') || []).find(function (sp) {
            return String(sp.name).toLowerCase() === key;
          });
          if (!rec) return;

          var prof = VT.actor.prof(actor);
          var act = VT.convert.spell(rec, {
            dc: actor.spellDC || (8 + prof + 2),
            atk: actor.spellAttack || (prof + 2),
            mod: 0, prof: prof, level: actor.level || 1
          });
          if (!act) return;
          act = U.clone(act);
          act.fromItem = entry.name;
          act.name = act.name + '  (' + entry.name + ')';
          /* An item's spell is cast from the item, not from your own slots. */
          delete act.spellLevel;
          if (cost) {
            act.chargeCost = parseInt(cost, 10) || 1;
            act.desc = (act.desc ? act.desc + '  ' : '') +
                       act.chargeCost + ' charge' + (act.chargeCost === 1 ? '' : 's') + '.';
          }
          out.push(act);
        });
      });
    });
    return out;
  }

  /* Every action every live item grants. */
  function allActions(actor) {
    var out = [];
    (actor.inventory || []).forEach(function (e) {
      actionsFrom(actor, e).forEach(function (a) { out.push(a); });
    });
    return out;
  }

  /* Tag an inventory entry with its effects, if it has any. */
  function tag(entry, item) {
    var fx = effectsOf(item);
    if (fx) entry.fx = fx;
    return entry;
  }

  /* A plain-English summary, for the sheet to show under the item. */
  function describe(fx) {
    if (!fx) return '';
    var bits = [];
    if (fx.set) {
      Object.keys(fx.set).forEach(function (k) {
        bits.push((SRD.ABILITY_NAME[k] || k.toUpperCase()) + ' becomes ' + fx.set[k]);
      });
    }
    if (fx.ac && !fx.acInArmour) bits.push(U.sign(fx.ac) + ' AC');
    if (fx.save) bits.push(U.sign(fx.save) + ' to saves');
    if (fx.spellAttack) bits.push(U.sign(fx.spellAttack) + ' spell attack');
    if (fx.spellDc) bits.push(U.sign(fx.spellDc) + ' spell DC');
    if (fx.resist && fx.resist.length) bits.push('resist ' + fx.resist.join(', '));
    if (fx.conditionImmune && fx.conditionImmune.length) {
      bits.push('immune to ' + fx.conditionImmune.join(', '));
    }
    if (fx.speedMul && fx.speedMul.walk) bits.push('speed x' + fx.speedMul.walk);
    if (fx.speedAdd && fx.speedAdd.walk) bits.push(U.sign(fx.speedAdd.walk) + ' ft speed');
    if (fx.needsAttune) bits.push('needs attunement');
    return bits.join(' · ');
  }

  VT.itemfx = {
    effectsOf: effectsOf, tag: tag, live: live, active: active,
    actionsFrom: actionsFrom, allActions: allActions,
    applyAbilities: applyAbilities, applyRest: applyRest, describe: describe
  };
})();

/* ===== ../src/rules/resist.js ===== */
/* Virtual Tactics :: rules/resist.js
   Damage resistances, immunities and vulnerabilities, from every source.

   Three places grant them and they behave differently, which is why this is one
   file rather than three scattered checks:

     race       structured data - tiefling fire, aasimar necrotic and radiant.
                43 races and 8 subraces carry it, and a few say "choose one",
                which the character's ancestry pick answers.
     features   English in the feature text. 50 features mention resistance and
                only 21 are permanent - the rest are Rage, Bear Totem, and other
                things you turn on. Applying those passively would make a
                barbarian permanently resistant to everything.
     items      handled in itemfx.js, merged here.

   The honest line is drawn at qualified resistances. "Resistance to fire
   damage" is a fact about the character. "Resistance to bludgeoning, piercing
   and slashing from nonmagical attacks" is narrower than the sheet can show in
   one word, so it is listed as a note rather than claimed as blanket
   resistance - a sheet that overstates a defence gets someone killed. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util, SRD = VT.srd;

  var TYPES = SRD.DAMAGE_TYPES;

  /* Anything that narrows a resistance to less than "all of this type". */
  var QUALIFIER = /\bfrom\b|nonmagical|magical weapons|silvered|adamantine|while|unless/i;

  /* Turns on and off, so it is a reminder rather than a state. */
  var CONDITIONAL =
    /while (you are )?raging|while this|when you|as an action|bonus action|for 1 minute|until the (end|start)|while transformed|while in/i;

  function typesIn(text) {
    var found = [];
    TYPES.forEach(function (t) {
      if (new RegExp('\\b' + t + '\\b', 'i').test(text) && found.indexOf(t) < 0) found.push(t);
    });
    return found;
  }

  /* ---- race --------------------------------------------------------------- */

  /* "choose": the race offers a list and something else picks from it - a
     dragonborn's draconic ancestry, most often. Look for the answer among the
     character's own choices before giving up. */
  function resolveChoose(entry, build) {
    var from = entry && entry.choose && entry.choose.from;
    if (!Array.isArray(from)) return [];
    var picked = JSON.stringify((build && build.picks) || {}).toLowerCase();
    var hit = from.filter(function (t) {
      return picked.indexOf(String(t).toLowerCase()) >= 0;
    });
    return hit.length ? [hit[0]] : [];
  }

  function fromRace(build) {
    var out = { resist: [], immune: [], vulnerable: [], conditionImmune: [], pending: [] };
    if (!build) return out;
    [build.race, build.subrace].forEach(function (rec) {
      if (!rec) return;
      ['resist', 'immune', 'vulnerable', 'conditionImmune'].forEach(function (key) {
        [].concat(rec[key] || []).forEach(function (v) {
          if (typeof v === 'string') {
            if (out[key].indexOf(v) < 0) out[key].push(v);
          } else if (v && v.choose) {
            var got = resolveChoose(v, build);
            if (got.length) {
              got.forEach(function (t) { if (out[key].indexOf(t) < 0) out[key].push(t); });
            } else {
              out.pending.push('choose one: ' + (v.choose.from || []).join(', '));
            }
          }
        });
      });
    });
    return out;
  }

  /* ---- class and subclass features ---------------------------------------- */

  /* Reads a feature's own text. Applies only what is unambiguous; anything
     narrowed or switchable comes back as a note. */
  function fromFeature(feature) {
    if (!VT.featureText) return null;
    var text = VT.featureText.textOf(feature);
    if (!/resistance to/i.test(text)) return null;

    var m = text.match(/resistance to ([^.]{0,90})/i);
    if (!m) return null;
    var clause = m[1];
    var types = typesIn(clause);

    /* "resistance to all damage except psychic" names psychic as the one type
       it does NOT cover, so listing the types found would say the opposite of
       what the feature does. When the clause excludes rather than enumerates,
       quote it instead. */
    var inverted = /except|other than|all damage/i.test(clause);
    if (CONDITIONAL.test(text)) {
      return { note: feature.name + ': ' + (inverted
        ? 'resistance while active to ' + clause.trim().replace(/\s+/g, ' ')
        : 'resistance while active' + (types.length ? ' (' + types.join(', ') + ')' : '')) };
    }
    if (!types.length || inverted || QUALIFIER.test(clause)) {
      return { note: feature.name + ': ' + U.cap(clause.trim().replace(/\s+/g, ' ')) };
    }
    return { types: types, from: feature.name };
  }

  function fromFeatures(actor, records) {
    var out = { resist: [], notes: [] };
    (records || []).forEach(function (rec) {
      var got = fromFeature(rec);
      if (!got) return;
      if (got.note) { out.notes.push(got.note); return; }
      got.types.forEach(function (t) { if (out.resist.indexOf(t) < 0) out.resist.push(t); });
    });
    return out;
  }

  /* ---- putting it together ------------------------------------------------ */

  /* Merge every source onto the actor. Items are already on actor.itemResist,
     put there by itemfx, so this owns the final arrays. */
  function gather(actor) {
    if (!actor) return actor;
    var resist = [], immune = [], vuln = [], condImm = [], notes = [];

    function addAll(target, list) {
      (list || []).forEach(function (t) {
        var v = String(t).toLowerCase();
        if (target.indexOf(v) < 0) target.push(v);
      });
    }

    var race = actor.raceDefences || {};
    addAll(resist, race.resist); addAll(immune, race.immune);
    addAll(vuln, race.vulnerable); addAll(condImm, race.conditionImmune);
    (race.pending || []).forEach(function (p) { notes.push('From your race, ' + p); });

    addAll(resist, actor.featureResist);
    (actor.featureResistNotes || []).forEach(function (n) { notes.push(n); });

    addAll(resist, actor.itemResist);
    addAll(condImm, actor.itemConditionImmune);

    /* Immunity beats resistance - listing both is noise. */
    resist = resist.filter(function (t) { return immune.indexOf(t) < 0; });

    actor.resist = resist;
    actor.immune = immune;
    actor.vulnerable = vuln;
    actor.conditionImmune = condImm;
    actor.resistNotes = notes;
    return actor;
  }

  VT.resist = {
    fromRace: fromRace, fromFeature: fromFeature, fromFeatures: fromFeatures,
    gather: gather, typesIn: typesIn
  };
})();

/* ===== ../src/data/tags.js ===== */
/* Virtual Tactics :: data/tags.js
   Parser for 5etools' inline markup and nested `entries` trees.

   Every text field in that dataset is peppered with tags like
     {@atk mw} {@hit 4} to hit, reach 5 ft. {@h}5 ({@damage 1d6+2}) piercing
   and cross-references like {@spell fireball|phb|the fireball spell}, which are
   pipe-separated as {@tag name|source|displayText}.

   Two jobs here:
     render()  - tags to readable text or HTML, for the compendium
     mechanics() - tags to structured numbers, so an action becomes a real
                   {toHit, dmg, dmgType, save, dc} the combat engine can run. */
(function () {
  'use strict';
  var VT = window.VT, U = VT.util;

  /* ---- tag splitting ---------------------------------------------------- */
  /* Tags nest, so a regex alone won't do. Walk the string and match braces. */
  function splitTags(str) {
    var out = [], depth = 0, buf = '', tagBuf = '';
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      if (ch === '{' && str[i + 1] === '@') {
        if (depth === 0) { if (buf) { out.push({ text: buf }); buf = ''; } tagBuf = ''; }
        else tagBuf += ch;
        depth++;
        if (depth === 1) { i++; continue; }   // skip the '@'
      } else if (ch === '}' && depth > 0) {
        depth--;
        if (depth === 0) { out.push(parseTag(tagBuf)); tagBuf = ''; }
        else tagBuf += ch;
      } else if (depth > 0) {
        tagBuf += ch;
      } else {
        buf += ch;
      }
    }
    if (buf) out.push({ text: buf });
    if (depth > 0 && tagBuf) out.push({ text: tagBuf });
    return out;
  }

  function parseTag(body) {
    var sp = body.indexOf(' ');
    var name = (sp < 0 ? body : body.slice(0, sp)).toLowerCase();
    var rest = sp < 0 ? '' : body.slice(sp + 1);
    var parts = rest.split('|');
    return { tag: name, parts: parts, raw: rest };
  }

  /* ---- attack type codes ------------------------------------------------ */

        if (id) ft.seen[id] = 1;
        var nm = identityOf(kind, r, true);
        if (nm) ft.seenNames[nm] = 1;
      });
    });
    return ft.seen;
  }

  function ingestFile(kind, json, path, dedupe) {
    var keys = ARRAY_KEYS[kind] || [kind];
    var opts = dedupe ? { dedupe: true } : null;
    var n = 0;
    keys.forEach(function (k) {
      if (Array.isArray(json[k])) n += add(kindFor(kind, k), json[k], path, false, opts);
    });
    /* Some files nest everything under a single unexpected key; take arrays of
       objects-with-names as a last resort so odd sources still land. */
    if (!n) {
      Object.keys(json).forEach(function (k) {
        if (Array.isArray(json[k]) && json[k].length && json[k][0] && json[k][0].name) {
          n += add(kind, json[k], path, false, opts);
        }
      });
    }
    return n;
  }

  /* subclass / classFeature live in class files but deserve their own bucket */
  /* Which array a record came from matters for exactly one thing: magic
     variants apply to BASE items only. "+1 Armor" makes "+1 Plate Armor" from
     the plain plate in items-base.json - never from an Animated Shield, which
     is already magic. Losing that distinction generates nonsense like
     "+1 Armor of Invulnerability". */
  function kindFor(fileKind, arrayKey) {
    if (fileKind === 'class') {
      if (arrayKey === 'subclass') return 'subclass';
      if (arrayKey === 'classFeature') return 'classfeature';
      if (arrayKey === 'subclassFeature') return 'subclassfeature';
      return 'class';
    }
    if (fileKind === 'race' && arrayKey === 'subrace') return 'subrace';
    if (fileKind === 'item' && arrayKey === 'baseitem') return 'item';
    return fileKind;
  }

  function tryLoad(kind, path, onProgress) {
    return readJSON(path)
      .then(function (json) {
        ft.stats.files++;
        var n = ingestFile(kind, json, path);
        if (onProgress) onProgress(path, n);
        return n;
      })
      .catch(function (e) {
        if (String(e.message) !== 'missing' && !/HTTP 404/.test(String(e.message))) {
          ft.stats.failed.push(path + ': ' + e.message);
        }
        return 0;
      });
  }

  /* Resolve a folder index (bestiary/spells/class) or fall back to guessing. */
  function resolveIndexed(kind, folder, prefix, fallbackCodes, onProgress) {
    return readJSON('data/' + folder + '/index.json')
      .then(function (idx) {
        var files = Object.keys(idx).map(function (src) { return idx[src]; });
        return files;
      })
      .catch(function () {
        if (ft.mode === 'fs') {
          return fsList('data/' + folder).then(function (names) {
            return names.filter(function (n) { return n.indexOf(prefix) === 0; });
          });
        }
        if (ft.mode === 'folder') {
          /* We already have the whole listing - just take what's there. */
          return Object.keys(ft.files)
            .filter(function (p) { return p.indexOf('data/' + folder + '/' + prefix) === 0 && /\.json$/.test(p); })
            .map(function (p) { return p.split('/').pop(); });
        }
        return fallbackCodes.map(function (c) { return prefix + c + '.json'; });
      })
      .then(function (files) {
        return runLimited(files.filter(function (f) { return f.indexOf('fluff') < 0 && f !== 'index.json'; }), 6,
          function (f) { return tryLoad(kind, 'data/' + folder + '/' + f, onProgress); });
      });
  }

  /* Bounded concurrency - a full bestiary is 100+ files and unbounded fetch
     storms make some self-hosted servers drop connections. */
  function runLimited(items, limit, fn) {
    var i = 0, active = 0, done = 0, total = items.length;
    return new Promise(function (resolve) {
      if (!total) return resolve();
      function next() {
        while (active < limit && i < total) {
          active++;
          fn(items[i++]).then(function () {
            active--; done++;
            if (done === total) resolve(); else next();
          });
        }
      }
      next();
    });
  }

  function loadAll(onProgress) {
    if (ft.loading) return Promise.reject(new Error('Already loading.'));
    ft.loading = true;

    /* Loading is atomic: a probe that finds nothing (a wrong folder, a missing
       bundled data/) must not destroy the compendium already in memory. */
    var prev = {
      db: ft.db, index: ft.index, sources: ft.sources, stats: ft.stats,
      seen: ft.seen, seenNames: ft.seenNames,
      loaded: ft.loaded, mode: ft.mode, baseUrl: ft.baseUrl, dirName: ft.dirName,
      spellLists: ft.spellLists, loot: ft.loot
    };
    function rollback() {
      ft.db = prev.db; ft.index = prev.index; ft.sources = prev.sources;
      ft.stats = prev.stats; ft.loaded = prev.loaded;
      ft.seen = prev.seen || {}; ft.seenNames = prev.seenNames || {};
      ft.mode = prev.mode; ft.baseUrl = prev.baseUrl; ft.dirName = prev.dirName;
      ft.spellLists = prev.spellLists;
      ft.loot = prev.loot;
      /* hbBundled is deliberately untouched: it came from beside the app, not
         from the source being rolled back, and losing it here would make a
         failed data load silently drop a supplement that is still present. */
      mergeHomebrew();
    }

    ft.db = {}; ft.index = {}; ft.sources = {}; ft.seen = {}; ft.seenNames = {};
    ft.stats = { files: 0, records: 0, failed: [] };
    var report = function (label) { if (onProgress) onProgress({ phase: label, files: ft.stats.files, records: ft.stats.records }); };

    var flat = [];
    Object.keys(FLAT_FILES).forEach(function (kind) {
      FLAT_FILES[kind].forEach(function (f) { flat.push({ kind: kind, path: 'data/' + f }); });
    });

    return runLimited(flat, 6, function (job) {
      return tryLoad(job.kind, job.path, function () { report('core data'); });
    })
      .then(function () { report('bestiary'); return resolveIndexed('creature', 'bestiary', 'bestiary-', FALLBACK_BESTIARY, function () { report('bestiary'); }); })
      .then(function () { report('spells'); return resolveIndexed('spell', 'spells', 'spells-', FALLBACK_SPELLS, function () { report('spells'); }); })
      .then(function () { report('classes'); return loadClasses(function () { report('classes'); }); })
      .then(function () { report('spell lists'); return loadSpellLists(); })
      .then(function () { report('treasure'); return loadLoot(); })
      .then(function () {
        report('magic items');
        var n = buildVariants();
        if (n) ft.stats.variants = n;
      })
      .then(function () { report('homebrew'); return loadFolderHomebrew(); })
      /* The bundled SRD goes on LAST and only fills gaps. Someone whose own
         data set already contains the SRD keeps their copy; someone whose does
         not gets the free rules underneath it. Either way nothing appears
         twice. */
      .then(function () { report('SRD'); return layerBundledSrd(); })
      .then(function () {
        var stats = ft.stats;
        if (!stats.records) {
          /* nothing found - put back whatever we had */
          rollback();
          ft.loading = false;
          report('done');
          return stats;
        }
        buildIndex();
        applyHomebrew();
        ft.loaded = true;
        ft.loading = false;
        report('done');
        return stats;
      })
      .catch(function (e) { rollback(); ft.loading = false; throw e; });
  }

  /* ---- the bundled SRD ---------------------------------------------------
     The free rules, shipped beside the app in srd/, so the tools do something
     useful before anyone has pointed them at a data folder. It is the only
     game content that travels with a build, and it travels because the SRD is
     the one set that may be shared - see the note on source books in the
     README.

     Two rules make this safe to have:

       - It is a FLOOR, never a ceiling. It is layered after everything else
         with dedupe on, so a record the user's own data already provided wins
         and the SRD copy is skipped. Load your own PHB and you do not end up
         with two Fireballs.
       - Absent is fine. No srd/ folder is the normal state of a source
         checkout, and everything carries on exactly as before.

     Same shape as a data folder - srd/data/... - so it is read by the ordinary
     loader rather than a second parser that would drift from it. */
  function srdBases() {
    /* A symbiote has srd/ beside it; the Forge is served from builder/ and the
       single-file build from dist/, so for those it is one level up. */
    return [appBase() + 'srd/', appBase() + '../srd/'];
  }

  function layerBundledSrd() {
    reindexSeen();
    var prevMode = ft.mode, prevBase = ft.baseUrl, prevFiles = ft.files;

    function tryBase(i) {
      if (i >= srdBases().length) return Promise.resolve(0);
      var base = srdBases()[i];
      return fetch(base + 'index.json', { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error('missing'); return r.json(); })
        .then(function (idx) { return readSrdFrom(base, idx); })
        .catch(function () { return tryBase(i + 1); });
    }

    return tryBase(0)
      .then(function (n) {
        ft.mode = prevMode; ft.baseUrl = prevBase; ft.files = prevFiles;
        if (n) ft.stats.srd = n;
        return n;
      })
      .catch(function () {
        ft.mode = prevMode; ft.baseUrl = prevBase; ft.files = prevFiles;
        return 0;
      });
  }

  /* srd/index.json is {kind: [file, ...]} relative to the srd/ folder, so a
     partial SRD - items only, say - is a legitimate thing to ship. */
  function readSrdFrom(base, idx) {
    var jobs = [];
    Object.keys(idx || {}).forEach(function (kind) {
      (idx[kind] || []).forEach(function (file) { jobs.push({ kind: kind, file: file }); });
    });
    if (!jobs.length) return 0;

    var added = 0;
    return runLimited(jobs, 6, function (job) {
      return fetch(base + job.file, { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error('missing'); return r.json(); })
        .then(function (json) { added += ingestFile(job.kind, json, 'srd/' + job.file, 'name'); })
        .catch(function () {});
    }).then(function () { return added; });
  }

  /* Which classes may learn a given spell is not stored on the spell. It lives
     in data/spells/sources.json as SOURCE -> spell name -> {class, subclass,
     race}. Without it there is no way to offer a bard their own spell list, so
     it is worth the extra fetch. A missing file is not fatal: spell choices
     simply fall back to "every spell of that level". */
  /* Treasure tables. Not name-indexed like the rest: the file is a handful of
     arrays whose meaning comes from which key they sit under, so it is kept
     whole rather than flattened into the compendium. */
  function loadLoot() {
    return readJSON('data/loot.json')
      .then(function (json) { ft.loot = json || null; return json; })
      .catch(function () { ft.loot = null; return null; });
  }

  function loadSpellLists() {
    return readJSON('data/spells/sources.json')
      .then(function (json) {
        var map = {};                       // 'name|source' -> [{name, source}]
        Object.keys(json).forEach(function (src) {
          var bySpell = json[src] || {};
          Object.keys(bySpell).forEach(function (spellName) {
            var rec = bySpell[spellName] || {};
            var list = [];
            (rec.class || []).forEach(function (c) { list.push(c); });
            /* A subclass grant (a domain spell) still means the class can cast
               it, but only through that subclass - keep them apart. */
            var subs = [];
            (rec.subclass || []).forEach(function (c) {
              if (c.class) subs.push({ name: c.class.name, source: c.class.source, subclass: c.subclass });
            });
            map[low(spellName) + '|' + low(src)] = { cls: list, sub: subs };
          });
        });
        ft.spellLists = map;
        return map;
      })
      .catch(function () { ft.spellLists = null; return null; });
  }

  function low(v) { return String(v || '').toLowerCase(); }

  /* Every spell the given class can learn, at any level.

     Three sources have to agree: data/spells/sources.json for the books, a
     spell record's own classes.fromClassList (which is how a converted
     supplement says who may cast what), and any spelllistchange record, which
     is how a setting REMOVES a spell from a list - Athasian clerics lose
     Create Food and Water, because Athas has no water to spare. */
  function spellsForClass(className, classSource) {
    var all = get('spell');
    var cn = low(className);

    var gone = {};
    (get('spelllistchange') || []).forEach(function (c) {
      if (low(c.className) !== cn) return;
      (c.removed || []).forEach(function (r) { gone[low(r.name)] = c.source || 'homebrew'; });
    });

    var list = all.filter(function (sp) {
      if (gone[low(sp.name)]) return false;
      /* a record that names its own classes is self-describing */
      var own = sp.classes && sp.classes.fromClassList;
      if (own && own.some(function (c) { return low(c.name) === cn; })) return true;
      if (!ft.spellLists) return !own;
      var e = ft.spellLists[low(sp.name) + '|' + low(sp.source)];
      if (!e) return false;
      return e.cls.some(function (c) { return low(c.name) === cn; });
    });
    list.__removed = Object.keys(gone).length;
    return list;
  }

  /* What a setting changed about a class's spell list, for the UI to say so. */
  function spellListChanges(className) {
    var cn = low(className);
    return (get('spelllistchange') || []).filter(function (c) {
      return low(c.className) === cn;
    });
  }

  function loadClasses(onProgress) {
    return readJSON('data/class/index.json')
      .then(function (idx) { return Object.keys(idx).map(function (k) { return idx[k]; }); })
      .catch(function () {
        if (ft.mode === 'fs') {
          return fsList('data/class').then(function (names) {
            return names.filter(function (n) { return n.indexOf('class-') === 0; });
          });
        }
        if (ft.mode === 'folder') {
          return Object.keys(ft.files)
            .filter(function (p) { return /^data\/class\/class-.*\.json$/.test(p); })
            .map(function (p) { return p.split('/').pop(); });
        }
        return ['class-artificer.json', 'class-barbarian.json', 'class-bard.json', 'class-cleric.json',
          'class-druid.json', 'class-fighter.json', 'class-monk.json', 'class-paladin.json',
          'class-ranger.json', 'class-rogue.json', 'class-sorcerer.json', 'class-warlock.json',
          'class-wizard.json'];
      })
      .then(function (files) {
        return runLimited(files.filter(function (f) { return f.indexOf('fluff') < 0 && f !== 'index.json' && f !== 'foundry.json'; }),
          5, function (f) { return tryLoad('class', 'data/class/' + f, onProgress); });
      });
  }


  /* ---- magic variants ----------------------------------------------------
     "+1 Plate Armor" is not a record. 5etools stores 214 `magicvariant`
     templates - "+1 Armor", "+2 Weapon", "Adamantine Armor" - each with a
     `requires` that says which base items it applies to and an `inherits` of
     the fields it overlays. The concrete items are generated, which is why a
     search for "+1 breastplate" finds nothing until you do it.

     Generating them turns 25 base armours and 37 base weapons into the several
     hundred magic ones a table actually shops for. Kept behind a flag because
     it multiplies the item count and not every table wants it. */
  function matchesRequirement(base, req) {
    return Object.keys(req).every(function (k) {
      var want = req[k], have = base[k];
      if (k === 'type') return String(have || '').split('|')[0] === String(want).split('|')[0];
      if (typeof want === 'boolean') return !!have === want;
      if (Array.isArray(want)) return want.indexOf(have) >= 0;
      return have === want;
    });
  }

  function variantApplies(base, mv) {
    var reqs = mv.requires || [];
    if (!reqs.length) return false;
    if (!reqs.some(function (r) { return matchesRequirement(base, r); })) return false;
    if (mv.excludes && matchesRequirement(base, mv.excludes)) return false;
    return true;
  }

  function buildVariants() {
    var bases = (ft.db.item || []).filter(function (i) {
      if (i.__variant) return false;
      /* a base item: plain gear, not something already enchanted */
      if (i.__baseItem) return true;
      return !i.reqAttune && (!i.rarity || i.rarity === 'none');
    });
    var variants = ft.db.magicvariant || [];
    if (!variants.length) return 0;

    var made = [], seen = {};
    variants.forEach(function (mv) {
      var inh = mv.inherits || {};
      bases.forEach(function (base) {
        if (!variantApplies(base, mv)) return;
        var name = (inh.namePrefix || '') + base.name + (inh.nameSuffix || '');
        /* Two printings of the same base give the same variant name twice. */
        var key = low(name);
        if (seen[key]) return;
        seen[key] = 1;

        var out = JSON.parse(JSON.stringify(base));
        Object.keys(inh).forEach(function (k) {
          if (k === 'namePrefix' || k === 'nameSuffix') return;
          out[k] = JSON.parse(JSON.stringify(inh[k]));
        });
        out.name = name;
        out.__variant = true;
        out.__baseItem = base.name;
        /* A +N bonus is written as a string the item's own text substitutes.
           Fold it into the numbers so the sheet can use it without parsing. */
        if (inh.bonusAc) out.ac = (base.ac || 10) + (parseInt(inh.bonusAc, 10) || 0);
        if (inh.bonusWeapon) out.bonusWeapon = inh.bonusWeapon;
        made.push(out);
      });
    });
    if (made.length) add('item', made, 'magicvariant', true);
    return made.length;
  }

  /* ---- homebrew ----------------------------------------------------------- */
  /* User content is held separately from the loaded book data and re-merged
     after every load, so reloading or switching your source never wipes it.

     There are three ways in, kept apart so none can erase another:

       stored   what this browser saved (the Forge's Homebrew tab)
       folder   a homebrew/ directory inside the data source itself
       bundled  a homebrew/ directory beside the app's own files

     `folder` is the one that matters when a table shares a data folder: drop a
     converted supplement next to your 5etools data and every app pointed there
     gets it, with nothing to import per machine.

     `bundled` covers what folder cannot. It is read relative to the app rather
     than the data source, so a supplement travels with the download and is
     there before anyone has connected anything. It needs no directory picker
     and no filesystem API, which matters on Linux and in any browser without
     showDirectoryPicker - fetching a file sitting next to the page is the one
     thing that works everywhere. */
  var hbStored = {}, hbFolder = {}, hbBundled = {};

  function setHomebrew(map) {
    hbStored = map || {};
    mergeHomebrew();
  }

  function setFolderHomebrew(map) {
    hbFolder = map || {};
    mergeHomebrew();
  }

  function setBundledHomebrew(map) {
    hbBundled = map || {};
    mergeHomebrew();
  }

  /* The three places homebrew can come from, merged into one list.

     De-duplicated, because the same supplement genuinely arrives twice: a
     converted book ships beside the symbiote AND is often sitting in the data
     folder the user connected, which is two copies of every record it holds.
     Before this, Dark Sun gave every one of its items, races and subclasses
     twice over - two Longswords, two of each subclass - and the second was
     indistinguishable from the first.

     Order is the precedence: bundled first, then the data folder, then what was
     imported by hand, and the first to claim an identity keeps it. */
  function mergeHomebrew() {
    var out = {}, seen = {};
    [hbBundled, hbFolder, hbStored].forEach(function (src) {
      Object.keys(src || {}).forEach(function (kind) {
        out[kind] = out[kind] || [];
        (src[kind] || []).forEach(function (r) {
          var id = identityOf(kind, r);
          /* a record with no name cannot be told apart, so keep it */
          if (id) {
            if (seen[id]) return;
            seen[id] = 1;
          }
          out[kind].push(r);
        });
      });
    });
    ft.homebrew = out;
    applyHomebrew();
  }

  /* Read every .json in the data source's homebrew/ directory. A file may be
     our own export ({data:{...}}) or a raw 5etools-shaped one; both are just
     kind -> records once unwrapped. Absent directory is the normal case. */
  var HB_KEYS = {
    race: ['race'], subrace: ['subrace'], 'class': ['class'], subclass: ['subclass'],
    classfeature: ['classFeature', 'classfeature'],
    subclassfeature: ['subclassFeature', 'subclassfeature'],
    background: ['background'], spell: ['spell'], item: ['item', 'baseitem'],
    feat: ['feat'], optionalfeature: ['optionalfeature', 'optionalFeature'],
    creature: ['monster'], spelllistchange: ['spelllistchange', 'spellListChange']
  };

  /* Pull every record out of one homebrew file into `map`, returning how many.
     A file may be our own export ({data:{...}}) or a raw 5etools-shaped one. */
  function collectHomebrew(json, map) {
    var incoming = (json && json.data) ? json.data : json;
    if (!incoming || typeof incoming !== 'object') return 0;
    var records = 0;
    Object.keys(HB_KEYS).forEach(function (kind) {
      HB_KEYS[kind].forEach(function (key) {
        if (!Array.isArray(incoming[key])) return;
        incoming[key].forEach(function (r) {
          if (!r || (!r.name && !(kind === 'subrace' && r.raceName))) return;
          var c = JSON.parse(JSON.stringify(r));
          c.__hb = true;
          c.source = c.source || 'HB';
          (map[kind] = map[kind] || []).push(c);
          records++;
        });
      });
    });
    return records;
  }

  function loadFolderHomebrew() {
    return listHomebrewFiles()
      .then(function (names) {
        if (!names.length) { setFolderHomebrew({}); return { files: 0, records: 0 }; }
        var map = {}, records = 0;
        return runLimited(names, 4, function (name) {
          return readJSON('homebrew/' + name)
            .then(function (json) { records += collectHomebrew(json, map); })
            .catch(function () {});
        }).then(function () {
          setFolderHomebrew(map);
          return { files: names.length, records: records };
        });
      })
      .catch(function () { setFolderHomebrew({}); return { files: 0, records: 0 }; });
  }

  /* Where the app's own files live, whatever scheme served the page. */
  function appBase() {
    try { return new URL('.', window.location.href).href; } catch (e) { return './'; }
  }

  /* Read homebrew/ from beside the app rather than from the data source.

     There is no directory listing over http, so homebrew/index.json names the
     files - 5etools' own convention, and the same one the folder loader falls
     back to. A missing index is the normal case and stays silent: most installs
     ship no bundled homebrew at all. */
  var bundledOnce = null;

  /* Safe to call from every boot path - the work happens once and later calls
     get the same promise. Deliberately independent of loadAll: this content
     sits beside the app, not beside the data, so it must survive a data source
     that is missing, empty or still being chosen. */
  function loadBundledHomebrew(force) {
    if (bundledOnce && !force) return bundledOnce;
    bundledOnce = reallyLoadBundledHomebrew();
    return bundledOnce;
  }

  function reallyLoadBundledHomebrew() {
    /* A symbiote has homebrew/ right beside it. The Forge is served out of
       builder/, and the single-file build out of dist/, so for those it is one
       level up. Try the app's own directory first, then its parent, and use
       whichever has an index - checking two places costs one failed fetch and
       saves explaining which layout you have. */
    var bases = [appBase(), appBase() + '../'];

    function grab(base, rel) {
      return fetch(base + rel, { cache: 'no-cache' }).then(function (r) {
        if (!r.ok) throw new Error('missing');
        return r.json();
      });
    }

    function tryBase(i) {
      if (i >= bases.length) return Promise.resolve(null);
      return grab(bases[i], 'homebrew/index.json')
        .then(function (idx) { return { base: bases[i], idx: idx }; })
        .catch(function () { return tryBase(i + 1); });
    }

    return tryBase(0)
      .then(function (found) {
        if (!found) { setBundledHomebrew({}); return { files: 0, records: 0 }; }
        var idx = found.idx;
        var names = Array.isArray(idx) ? idx
          : (idx && Array.isArray(idx.toImport)) ? idx.toImport : [];
        if (!names.length) { setBundledHomebrew({}); return { files: 0, records: 0 }; }
        var map = {}, records = 0, read = 0;
        return runLimited(names, 4, function (name) {
          return grab(found.base, 'homebrew/' + name)
            .then(function (json) { records += collectHomebrew(json, map); read++; })
            .catch(function () {});
        }).then(function () {
          setBundledHomebrew(map);
          ft.bundledHomebrew = { files: read, records: records, from: found.base + 'homebrew/' };
          return ft.bundledHomebrew;
        });
      })
      .catch(function () {
        setBundledHomebrew({});
        ft.bundledHomebrew = { files: 0, records: 0 };
        return { files: 0, records: 0 };
      });
  }

  function listHomebrewFiles() {
    if (ft.mode === 'fs') {
      return fsList('homebrew').then(function (n) { return n; }).catch(function () { return []; });
    }

      return Promise.resolve(Object.keys(ft.files)
        .filter(function (p) { return /(^|\/)homebrew\/[^/]+\.json$/i.test(p); })
        .map(function (p) { return p.split('/').pop(); }));
    }
    /* Over http there is no directory listing, so an index names the files.
       5etools already has this convention - homebrew/index.json with a
       "toImport" array - so use theirs rather than inventing a second one. */
    return readJSON('homebrew/index.json')
      .then(function (idx) {
        if (Array.isArray(idx)) return idx;
        if (idx && Array.isArray(idx.toImport)) return idx.toImport;

  function applyHomebrew() {

    Object.keys(ft.db).forEach(function (kind) {
      ft.db[kind] = ft.db[kind].filter(function (r) { return !r.__hb; });
    });

    Object.keys(ft.homebrew || {}).forEach(function (kind) {
      var recs = (ft.homebrew[kind] || []).map(function (r) {

  /* ---- indexing / search -------------------------------------------------- */
  function buildIndex() {
    ft.index = {};
    Object.keys(ft.db).forEach(function (kind) {
      var map = new Map();
      ft.db[kind].forEach(function (r) {
        var k = String(r.name).toLowerCase();
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(r);
      });
      ft.index[kind] = map;
      ft.db[kind].sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
    });

  function byName(kind, name, source) {
    var map = ft.index[kind];
    if (!map) return null;
    var hits = map.get(String(name).toLowerCase());
    if (!hits) return null;
    if (source) {
      var exact = hits.find(function (r) { return String(r.source).toLowerCase() === String(source).toLowerCase(); });
      if (exact) return exact;

    var q = String(query || '').trim().toLowerCase();
    kinds = kinds && kinds.length ? kinds : Object.keys(ft.db);
    var out = [];
    kinds.forEach(function (kind) {
      (ft.db[kind] || []).forEach(function (r) {
        if (!q) { out.push(r); return; }
        var n = String(r.name).toLowerCase();
        var i = n.indexOf(q);
        if (i >= 0) { r.__score = (i === 0 ? 0 : 1) + n.length / 200; out.push(r); }
      });

    out.sort(function (a, b) {

  /* ---- persistence -------------------------------------------------------- */

        tx.oncomplete = function () { res(true); };
        tx.onerror = function () { rej(tx.error); };

    });

    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readonly');
        var r = tx.objectStore(STORE).get(key);
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      });
    });
  }

  function saveCache() {
    var clean = {};
    Object.keys(ft.db).forEach(function (k) {
      clean[k] = ft.db[k].filter(function (r) { return !r.__hb; });
    });
    return idbPut('db', { db: clean, sources: ft.sources, stats: ft.stats, at: Date.now(),
                          spellLists: ft.spellLists || null,
                          loot: ft.loot || null,
                          folderHomebrew: hbFolder,
                          bundledHomebrew: hbBundled,
                          mode: ft.mode, base: ft.baseUrl, dirName: ft.dirName || null })

      .catch(function () { return false; });
  }
  function loadCache() {
    return idbGet('db').then(function (rec) {
      if (!rec || !rec.db) return null;
      ft.db = rec.db; ft.sources = rec.sources || {}; ft.stats = rec.stats || ft.stats;
      ft.spellLists = rec.spellLists || null;
      ft.loot = rec.loot || null;
      hbFolder = rec.folderHomebrew || {};
      hbBundled = rec.bundledHomebrew || {};
      ft.mode = rec.mode; ft.baseUrl = rec.base || '';
      ft.dirName = rec.dirName || null;
      ft.cachedAt = rec.at || null;

      mergeHomebrew();

  }
  function clearCache() {
    return idbPut('db', null).then(function () { ft.db = {}; ft.index = {}; ft.loaded = false; return true; });
  }

  /* ---- remembered folder (File System Access) ----------------------------

     not open one from a string anyway - so "remember the path" is impossible
     in the literal sense. What IS possible: showDirectoryPicker() returns a
     directory HANDLE, handles are structured-cloneable, and storing one in
     IndexedDB lets us re-open the same folder on a later visit. If the
     permission is still granted we read it with no dialog at all; if the
     browser has downgraded it to "prompt", it costs one click - never
     navigating the folder tree again.

  var fsHasDataChild = null; // did the user pick the site root, or data/ itself?

  function supportsFS() {
    return typeof window.showDirectoryPicker === 'function' && window.isSecureContext;
  }

  function useDirectory(handle) {

    fsRoot = handle;
    fsHasDataChild = null;

    ft.baseUrl = '';
    ft.dirName = handle && handle.name;
  }

  function pickDirectory() {
    if (!supportsFS()) return Promise.reject(new Error('unsupported'));
    return window.showDirectoryPicker({ id: 'vtactics-5etools', mode: 'read' })
      .then(function (handle) {

          .then(function () { return handle; });

    if (!supportsFS()) return Promise.resolve({ ok: false, reason: 'unsupported' });

      if (!handle || !handle.queryPermission) return { ok: false, reason: 'none' };
      return handle.queryPermission({ mode: 'read' }).then(function (perm) {
        if (perm === 'granted') { useDirectory(handle); return { ok: true, name: handle.name }; }
        if (!opts || !opts.prompt) return { ok: false, reason: 'prompt', name: handle.name };
        return handle.requestPermission({ mode: 'read' }).then(function (p2) {
          if (p2 !== 'granted') return { ok: false, reason: 'denied', name: handle.name };

    fsRoot = null;
    ft.dirName = null;
    return idbPut('dirHandle', null).catch(function () {});
  }

  function rememberedName() { return ft.dirName || null; }

  /* Resolve "data/bestiary/x.json" inside the picked directory. */
  function fsResolve(relPath) {
    var parts = String(relPath).split('/').filter(Boolean);
    var probe = fsHasDataChild === null
      ? fsRoot.getDirectoryHandle('data').then(function () { fsHasDataChild = true; })
          .catch(function () { fsHasDataChild = false; })
      : Promise.resolve();

    return probe.then(function () {
      if (!fsHasDataChild && parts[0] === 'data') parts = parts.slice(1);
      var chain = Promise.resolve(fsRoot);
      for (var i = 0; i < parts.length - 1; i++) {
        (function (name) {
          chain = chain.then(function (dir) { return dir.getDirectoryHandle(name); });
        })(parts[i]);

      return chain.then(function (dir) { return dir.getFileHandle(parts[parts.length - 1]); })
        .then(function (fh) { return fh.getFile(); });
    });

  function fsList(relDir) {
    var parts = String(relDir).split('/').filter(Boolean);
    if (fsHasDataChild === false && parts[0] === 'data') parts = parts.slice(1);
    var chain = Promise.resolve(fsRoot);
    parts.forEach(function (name) {
      chain = chain.then(function (dir) { return dir.getDirectoryHandle(name); });
    });
    return chain.then(function (dir) {
      var names = [];
      if (!dir.values) return names;
      var it = dir.values();
      function step() {
        return it.next().then(function (r) {
          if (r.done) return names;
          var h = r.value;
          if (h.kind === 'file' && /\.json$/i.test(h.name)) names.push(h.name);
          return step();
        });
      }
      return step();
    }).catch(function () { return []; });
  }

  /* ---- setup -------------------------------------------------------------- */
  function useUrl(url) { ft.mode = 'url'; ft.baseUrl = normBase(url); ft.files = null; fsRoot = null; }
  /* Normalise whatever the directory picker hands us to "data/<rest>" keys.
     Three shapes have to work:
       site root picked     5etools/data/bestiary/x.json -> data/bestiary/x.json
       data folder picked   data/bestiary/x.json         -> data/bestiary/x.json
       renamed data folder  5e-json/bestiary/x.json      -> data/bestiary/x.json

     tail of a folder named "5etools-data", which silently mangles every key. */

    var p = String(rawPath).replace(/\\/g, '/').replace(/^\.\//, '');
    var m = p.match(/(?:^|\/)(data\/.+)$/);
    if (m) return m[1];
    /* No data/ segment: assume the picked folder IS the data dir, so drop its
       own name (always the first segment of webkitRelativePath) and re-prefix. */
    var parts = p.split('/');
    if (parts.length > 1) return 'data/' + parts.slice(1).join('/');
    return 'data/' + parts[0];
  }

  function useFolder(fileList) {
    ft.mode = 'folder';
    ft.files = {};
    Array.prototype.slice.call(fileList).forEach(function (f) {
      if (!/\.json$/i.test(f.name)) return;      // skip img/, js/, css/ entirely
      ft.files[folderKey(f.webkitRelativePath || f.name)] = f;
    });
    return Object.keys(ft.files).length;
  }

  function summary() {
    return Object.keys(ft.db).map(function (k) {
      return { kind: k, count: ft.db[k].length };
    }).sort(function (a, b) { return b.count - a.count; });
  }

  VT.fivetools = Object.assign(ft, {
    useUrl: useUrl, useFolder: useFolder, folderKey: folderKey, testUrl: testUrl, normBase: normBase,
    supportsFS: supportsFS, pickDirectory: pickDirectory, reconnectDirectory: reconnectDirectory,
    forgetDirectory: forgetDirectory, rememberedName: rememberedName, useDirectory: useDirectory,
    loadAll: loadAll, get: get, byName: byName, search: search, summary: summary,
    saveCache: saveCache, loadCache: loadCache, clearCache: clearCache,
    setHomebrew: setHomebrew, applyHomebrew: applyHomebrew,
    setFolderHomebrew: setFolderHomebrew, loadFolderHomebrew: loadFolderHomebrew,
    loadBundledHomebrew: loadBundledHomebrew,
    folderHomebrewCount: function () {
      return Object.keys(hbFolder).reduce(function (n, k) { return n + hbFolder[k].length; }, 0);
    },
    spellsForClass: spellsForClass, spellListChanges: spellListChanges,
    buildVariants: buildVariants,
    layerBundledSrd: layerBundledSrd, reindexSeen: reindexSeen, identityOf: identityOf,
    ARRAY_KEYS: ARRAY_KEYS
  });
})();
