<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Forge — Virtual Tactics</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../src/ui/choiceui.css">
<link rel="stylesheet" href="builder.css">
<link rel="stylesheet" href="../tale-sheet/sheet.css">
<link rel="stylesheet" href="sheet-embed.css">
</head>
<body class="builder">
<div id="app">

  <header id="topbar">
    <div class="brand"><span class="rune">&#9670;</span> THE FORGE</div>
    <nav id="modes">
      <button class="mode-btn" data-mode="character">Character</button>
      <button class="mode-btn" data-mode="forge">Creature</button>
      <button class="mode-btn" data-mode="roster">Roster</button>
      <button class="mode-btn" data-mode="sheet">Sheet</button>
      <button class="mode-btn" data-mode="compendium">Compendium</button>
      <button class="mode-btn" data-mode="homebrew">Homebrew</button>
    </nav>
    <div class="spacer"></div>
    <div id="srcBadge" class="src-badge">no source</div>
    <button class="tb" id="btnSource">Data Source</button>
    <a class="tb" href="../shopsmith/index.html" title="Build shops for Tale Shop">Shopsmith &#8594;</a>
    <a class="tb" href="../index.html" title="Back to the battle map">&#8592; Play</a>
  </header>

  <main id="bmain">
    <div id="bwork"></div>
    <aside id="bside"></aside>
  </main>

  <div id="tooltip" class="hidden"></div>
  <div id="modalRoot"></div>
</div>

<!-- The character sheet from tale-sheet/, hosted here. sheet.js looks up
     #view and #toast at boot time, so this skeleton is present from the start
     and simply parked out of the way until the Sheet tab is opened. -->
<div id="sheetHost" class="hidden">
  <header id="bar">
    <select id="charPick" title="Active character"></select>
    <div id="rollMode" title="Applies to d20 rolls">
      <button data-adv="-1" title="Disadvantage">Dis</button>
      <button data-adv="0" class="on" title="Normal">Norm</button>
      <button data-adv="1" title="Advantage">Adv</button>
    </div>
    <button id="critToggle" title="Double the damage dice on the next damage roll">Crit</button>
  </header>
  <nav id="tabs">
    <button class="tab on" data-tab="sheet">Sheet</button>
    <button class="tab" data-tab="edit">Edit</button>
    <button class="tab" data-tab="build">Build</button>
  </nav>
  <main id="view"></main>
  <div id="toast"></div>
</div>

<input type="file" id="dirPicker" class="hidden" webkitdirectory directory multiple>
<input type="file" id="jsonPicker" class="hidden" accept="application/json" multiple>

<script src="../src/core/util.js"></script>
<script src="../src/core/dice.js"></script>
<script src="../src/core/store.js"></script>
<script src="../src/render/spriteart.js"></script>
<script src="../src/rules/srd.js"></script>
<script src="../src/rules/actor.js"></script>
<script src="../src/rules/gear.js"></script>
<script src="../src/data/tags.js"></script>
<script src="../src/data/fivetools.js"></script>
<script src="../src/data/convert.js"></script>
<script src="../src/data/currency.js"></script>
<script src="../src/data/upcast.js"></script>
<script src="../src/data/features.js"></script>
<script src="../src/data/featuretext.js"></script>
<script src="../src/data/wildshape.js"></script>
<script src="../src/data/companion.js"></script>
<script src="../src/data/shops.js"></script>
<script src="../src/data/loot.js"></script>
<script src="../src/data/choices.js"></script>
<script src="../src/data/multiclass.js"></script>
<script src="../src/data/choicefx.js"></script>
<script src="../src/data/charbuild.js"></script>
<script src="../src/data/homebrew.js"></script>
<script src="../src/ui/choiceui.js"></script>
<script src="homebrew.js"></script>
<script src="roster.js"></script>
<script src="../src/dev/ts-shim.js"></script>
<script src="sheetview.js"></script>
<script src="../tale-sheet/sheet.js"></script>
<script src="builder.js"></script>
</body>
</html>
